name: EES delivery

on:
  pull_request:
    paths:
      - '.github/workflows/ees-delivery.yml'
      - 'branding/**'
      - 'agent-pack/**'
      - 'scripts/build_*.py'
      - 'scripts/render_ees_brand_assets.py'
      - 'scripts/check_docs.py'
      - 'scripts/ees_deploy_*.py'
      - 'scripts/manage_ees.py'
      - 'scripts/manage-ees.ps1'
      - 'scripts/ees_webui_customization.py'
      - 'tests/test_ees_deploy_*.py'
      - 'tests/test_ees_webui_customization.py'
      - 'tests/test_manage_ees.py'
      - 'tests/test_ees_branding_build.py'
      - 'tests/test_demo_bundle.py'
      - 'docs/**'
      - 'README.md'
      - 'versions.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/ees-delivery.yml'
      - 'branding/**'
      - 'agent-pack/**'
      - 'scripts/build_*.py'
      - 'scripts/render_ees_brand_assets.py'
      - 'scripts/check_docs.py'
      - 'scripts/ees_deploy_*.py'
      - 'scripts/manage_ees.py'
      - 'scripts/manage-ees.ps1'
      - 'scripts/ees_webui_customization.py'
      - 'tests/test_ees_deploy_*.py'
      - 'tests/test_ees_webui_customization.py'
      - 'tests/test_manage_ees.py'
      - 'tests/test_ees_branding_build.py'
      - 'tests/test_demo_bundle.py'
      - 'docs/**'
      - 'README.md'
      - 'versions.md'
  workflow_dispatch:
    inputs:
      include_branding:
        description: 'Include the pinned EES Open WebUI wheel (about 146 MB)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    name: Delivery checks (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p test_ees_branding_build.py -v
      - run: python -m unittest discover -s tests -p test_demo_bundle.py -v
      - name: Install fixed uv, TLS, and NLTK test dependencies
        run: python -m pip install uv==0.12.7 cryptography==46.0.0 nltk==3.9.2
      - name: Verify deployment boundaries, child lifecycle, and NLTK imports
        env:
          EES_RUN_REAL_UV_TEST: '1'
          EES_RUN_REAL_NLTK_TEST: '1'
        run: python -m unittest discover -s tests -p test_ees_deploy_*.py -v
      - run: python -m unittest discover -s tests -p test_manage_ees.py -v
      - name: Download the fixed upstream wheel for program validation
        if: runner.os == 'Linux'
        run: |
          python -m pip download --no-deps --only-binary=:all: --dest dist/upstream open-webui==0.11.3
      - name: Build the real program fixture without installing it
        if: runner.os == 'Linux'
        run: python scripts/build_ees_webui.py --wheel dist/upstream/open_webui-0.11.3-py3-none-any.whl --output-dir dist/branding
      - name: Verify program-only Apply and Restore
        env:
          EES_TEST_BRANDING_DIR: ${{ runner.os == 'Linux' && 'dist/branding' || '' }}
        run: python -m unittest discover -s tests -p test_ees_webui_customization.py -v
      - name: Parse the Windows PowerShell entry point
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $tokens = $null
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'scripts/manage-ees.ps1'), [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) { throw 'PowerShell entry point has syntax errors.' }
      - run: python scripts/check_docs.py
      - run: git diff --check

  package:
    name: Prepare delivery files
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Decide whether the program changed
        id: branding
        env:
          REQUESTED: ${{ inputs.include_branding }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          enabled=false
          if [ "$REQUESTED" = true ]; then
            enabled=true
          elif [ "$EVENT_NAME" = push ]; then
            if ! git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
              enabled=true
            else
              git diff --name-only "$BEFORE_SHA" HEAD > "$RUNNER_TEMP/ees-changed.txt"
              if grep -Eq '^(branding/|scripts/build_(ees_webui|demo_bundle)\.py$|scripts/render_ees_brand_assets\.py$|tests/test_(ees_branding_build|demo_bundle)\.py$|\.github/workflows/ees-delivery\.yml$)' "$RUNNER_TEMP/ees-changed.txt"; then
                enabled=true
              fi
            fi
          fi
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
      - name: Download the fixed upstream wheel
        if: steps.branding.outputs.enabled == 'true'
        run: |
          python -m pip download --no-deps --only-binary=:all: --dest dist/upstream open-webui==0.11.3
      - name: Build the EES wheel
        if: steps.branding.outputs.enabled == 'true'
        run: python scripts/build_ees_webui.py --wheel dist/upstream/open_webui-0.11.3-py3-none-any.whl --output-dir dist/branding
      - name: Verify the real wheel can be selected as a standalone program
        if: steps.branding.outputs.enabled == 'true'
        env:
          EES_TEST_BRANDING_DIR: dist/branding
        run: python -m unittest discover -s tests -p test_ees_webui_customization.py -v
      - name: Bundle with branding
        if: steps.branding.outputs.enabled == 'true'
        run: python scripts/build_demo_bundle.py --output-dir dist/delivery --branding-dir dist/branding
      - name: Bundle Agent Pack only
        if: steps.branding.outputs.enabled != 'true'
        run: python scripts/build_demo_bundle.py --output-dir dist/delivery
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ees-demo-${{ github.sha }}
          path: dist/delivery/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
