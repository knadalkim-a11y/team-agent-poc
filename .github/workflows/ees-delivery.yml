name: EES delivery

on:
  pull_request:
    paths:
      - '.gitattributes'
      - '.github/workflows/ees-delivery.yml'
      - 'branding/**'
      - 'frontend/**'
      - 'agent-pack/**'
      - 'scripts/build_*.py'
      - 'scripts/render_ees_brand_assets.py'
      - 'scripts/check_docs.py'
      - 'scripts/ees_deploy_*.py'
      - 'scripts/manage_ees.py'
      - 'scripts/manage-ees.ps1'
      - 'scripts/ees_webui_customization.py'
      - 'scripts/ees_upgrade.py'
      - 'scripts/ees_apply_demo.py'
      - 'scripts/ees_demo_assets.py'
      - 'scripts/ees_asset_guard.py'
      - 'scripts/ees_update_download.py'
      - 'tests/test_ees_deploy_*.py'
      - 'tests/test_ees_webui_customization.py'
      - 'tests/test_manage_ees.py'
      - 'tests/test_ees_upgrade.py'
      - 'tests/test_ees_apply_demo.py'
      - 'tests/test_ees_demo*.py'
      - 'tests/test_ees_asset_guard.py'
      - 'tests/test_ees_asset_native.py'
      - 'tests/ees_asset_native_fixture.py'
      - 'tests/test_ees_cooperation_panel.cjs'
      - 'tests/test_ees_specialists_tool.py'
      - 'tests/test_ees_update_download.py'
      - 'tests/test_confluence*.py'
      - 'tests/test_jira_read.py'
      - 'tests/test_jira_work_contract.py'
      - 'tests/test_github_tool.py'
      - 'tests/test_wo_demo*'
      - 'tests/test_ees_branding_build.py'
      - 'tests/test_ees_chat_theme.py'
      - 'tests/test_ees_work_demo.py'
      - 'tests/test_ees_work_c_phase1_native.py'
      - 'tests/test_ees_work_c_phase2_native.py'
      - 'tests/test_ees_work_c_phase3_native.py'
      - 'tests/test_ees_work_c_phase3_privacy.py'
      - 'tests/test_ees_work_routes.py'
      - 'tests/test_ees_workflow*.py'
      - 'tests/test_ees_integrated*.py'
      - 'tests/test_ees_work_workspace.py'
      - 'tests/test_ees_work_operations.py'
      - 'tests/test_ees_work_figma*'
      - 'tests/test_ees_source_shell_native.py'
      - 'tests/test_ees_helper_chat_native.py'
      - 'tests/ees_source_frame_monitor.py'
      - 'tests/test_ees_work_history_reference.py'
      - 'tests/ees_work_integrated*.py'
      - 'tests/ees_work_native_chat.py'
      - 'tests/ees_workspace_ui_fixture.cjs'
      - 'tests/test_ees_v4*.cjs'
      - 'evals/assets/restructure-step0b-20261001/venv-final-inventory.json'
      - 'tests/ees_delivery_*.py'
      - 'tests/ees_delivery_*.json'
      - 'tests/test_ees_delivery_suite.py'
      - 'tests/test_ees_delivery_artifacts.py'
      - 'tests/ees_delivery_artifacts_fixture.py'
      - 'tests/ees_workflow_native_fixture.py'
      - 'tests/test_ees_execution*'
      - 'tests/test_ees_work_authoring*.py'
      - 'tests/test_ees_work_authoring_ui.cjs'
      - 'tests/test_ees_work_designer.py'
      - 'tests/native_auth_fixture.py'
      - 'tests/workflow_fixture.py'
      - 'tests/native_ui_fixture.py'
      - 'tests/ees_frontend_native_baseline.py'
      - 'tests/test_ees_frontend*.py'
      - 'tests/test_demo_bundle.py'
      - 'docs/**'
      - 'README.md'
      - 'versions.md'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      include_branding:
        description: 'Include the pinned EES Open WebUI wheel (about 146 MB)'
        type: boolean
        default: false

permissions:
  contents: read

env:
  EES_FIXED_TEST_DEPENDENCIES: uv==0.12.7 cryptography==46.0.0 nltk==3.9.2 pydantic==2.13.4 fastapi==0.136.3 httpx==0.28.1 sqlalchemy==2.0.50 aiosqlite==0.22.1 loguru==0.7.3 orjson==3.11.9 aiohttp==3.13.5 bcrypt==5.0.0 PyJWT==2.15.0 pytz==2026.4 tzdata==2026.4 requests==2.34.2 ldap3==2.9.1 python-mimeparse==2.0.0

jobs:
  source-frontend:
    name: Pinned Native source baseline and EES frontend build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: open-webui/open-webui
          ref: 2a960a59fe1dbbd35282f0556b3666d81102e781
          path: dist/open-webui-source
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: dist/open-webui-source/package-lock.json
      - name: Install the exact upstream frontend dependencies
        working-directory: dist/open-webui-source
        env:
          CYPRESS_INSTALL_BINARY: '0'
          # The frontend uses onnxruntime-web. Only the optional development
          # Node CUDA binary download is disabled through its official option.
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
        run: |
          test "$(node --version)" = v22.16.0
          test "$(npm --version)" = 10.9.2
          npm ci --force --no-audit --no-fund
      - name: Download the fixed official wheel
        run: |
          python -m pip download --no-deps --only-binary=:all: --dest dist/upstream open-webui==0.11.3
      - name: Build the unchanged pinned Native frontend
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: python scripts/build_ees_frontend.py --source-dir dist/open-webui-source --wheel dist/upstream/open_webui-0.11.3-py3-none-any.whl --output-dir dist/frontend-baseline --baseline
      - name: Compare official and source-built Native behavior
        id: baseline
        run: python tests/ees_frontend_native_baseline.py --wheel dist/upstream/open_webui-0.11.3-py3-none-any.whl --frontend-dir dist/frontend-baseline --chrome "$(command -v google-chrome)" --output dist/ees-source-baseline
      - name: Build the reviewed EES source patches
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: python scripts/build_ees_frontend.py --source-dir dist/open-webui-source --wheel dist/upstream/open_webui-0.11.3-py3-none-any.whl --output-dir dist/frontend
      - name: Verify the actual patched Native source hooks
        env:
          EES_TEST_FRONTEND_SOURCE_DIR: dist/open-webui-source
        run: python -X warn_default_encoding -W error::EncodingWarning -m unittest tests.test_ees_frontend_build -v
      - name: Share the verified frontend bytes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ees-source-frontend-${{ github.sha }}
          path: dist/frontend
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 7
      - name: Keep the first Native baseline result and screenshots
        if: always() && steps.baseline.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ees-source-baseline-${{ github.sha }}
          path: |
            dist/ees-source-baseline
            dist/frontend-baseline/manifest.json
          if-no-files-found: error
          retention-days: 7

  fixtures:
    name: Prepare pinned program fixtures and test coverage
    needs: source-frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ees-source-frontend-${{ github.sha }}
          path: dist/frontend
      - name: Audit every retained or explicitly replaced test ID
        run: python tests/ees_delivery_suite.py --audit --output dist/ees-delivery-coverage
      - name: Verify source-only packaging checks
        run: |
          python -m unittest discover -s tests -p test_ees_branding_build.py -v
          python -m unittest discover -s tests -p test_demo_bundle.py -v
      - name: Download the fixed upstream wheel
        run: |
          python -m pip download --no-deps --only-binary=:all: --dest dist/upstream open-webui==0.11.3
      - name: Build current and unchanged historical program fixtures once
        run: |
          python scripts/build_ees_webui.py --wheel dist/upstream/open_webui-0.11.3-py3-none-any.whl --frontend-dir dist/frontend --output-dir dist/branding
          git -c core.autocrlf=false -c core.eol=lf archive --format=tar --output=dist/legacy-source.tar a443d30c6694df0e1cbe082a0b99aa5f2d566917
          python -c "import tarfile; tarfile.open('dist/legacy-source.tar').extractall('dist/legacy-source', filter='data')"
          python dist/legacy-source/scripts/build_ees_webui.py --wheel dist/upstream/open_webui-0.11.3-py3-none-any.whl --output-dir dist/legacy-branding
          git -c core.autocrlf=false -c core.eol=lf archive --format=tar --output=dist/previous-source.tar 991cdb1d80ae07471fb50594831d74fe602b1ef7
          python -c "import tarfile; tarfile.open('dist/previous-source.tar').extractall('dist/previous-source', filter='data')"
          python dist/previous-source/scripts/build_ees_webui.py --wheel dist/upstream/open_webui-0.11.3-py3-none-any.whl --output-dir dist/previous-branding
          git -c core.autocrlf=false -c core.eol=lf archive --format=tar --output=dist/previous12-source.tar 8027aaf2e654778f052a966e5a49feed0fc54f69
          python -c "import tarfile; tarfile.open('dist/previous12-source.tar').extractall('dist/previous12-source', filter='data')"
          python dist/previous12-source/scripts/build_ees_webui.py --wheel dist/upstream/open_webui-0.11.3-py3-none-any.whl --output-dir dist/previous12-branding
          git -c core.autocrlf=false -c core.eol=lf archive --format=tar --output=dist/previous-v4-source.tar 3a51f9d2bc604e768a59a522d6f34a34c2cb05d3
          python -c "import tarfile; tarfile.open('dist/previous-v4-source.tar').extractall('dist/previous-v4-source', filter='data')"
          python dist/previous-v4-source/scripts/build_ees_webui.py --wheel dist/upstream/open_webui-0.11.3-py3-none-any.whl --output-dir dist/previous-v4-branding
          git -c core.autocrlf=false -c core.eol=lf archive --format=tar --output=dist/previous13-source.tar 1c6ddaa04f05b2eea02bbf15155b8602f1e4a1a8
          python -c "import tarfile; tarfile.open('dist/previous13-source.tar').extractall('dist/previous13-source', filter='data')"
          python dist/previous13-source/scripts/build_ees_webui.py --wheel dist/upstream/open_webui-0.11.3-py3-none-any.whl --output-dir dist/previous13-branding
      - name: Share exact program bytes with all required suites
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ees-pinned-fixtures-${{ github.sha }}
          path: |
            dist/upstream
            dist/frontend
            dist/branding
            dist/legacy-branding
            dist/previous-branding
            dist/legacy-source
            dist/previous-source
            dist/previous12-source
            dist/previous12-branding
            dist/previous-v4-source
            dist/previous-v4-branding
            dist/previous13-source
            dist/previous13-branding
          if-no-files-found: error
          # Fixed Git archives include .github links; preserve those source bytes.
          include-hidden-files: true
          compression-level: 0
          retention-days: 7
      - name: Keep the test-ID coverage audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ees-delivery-coverage-${{ github.sha }}
          path: dist/ees-delivery-coverage
          if-no-files-found: error
          retention-days: 7

  service:
    name: ${{ matrix.suite }} (${{ matrix.os }})
    needs: fixtures
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        suite: [services, contracts, native-contracts, native-grounding, platform, program-install, program-wheel, restore-ees10, restore-ees11, restore-ees12, restore-ees13]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      EES_TEST_UPSTREAM_WHEEL: dist/upstream/open_webui-0.11.3-py3-none-any.whl
      EES_TEST_BRANDING_DIR: dist/branding
      EES_TEST_FRONTEND_DIR: dist/frontend
      EES_TEST_LEGACY_WORKFLOW_WHEEL: dist/legacy-branding/open_webui-0.11.3+ees.10-py3-none-any.whl
      EES_TEST_PREVIOUS_WORKFLOW_WHEEL: dist/previous-branding/open_webui-0.11.3+ees.11-py3-none-any.whl
      EES_REQUIRE_WORK_ROUTES: '1'
      EES_REQUIRE_ASSET_GUARD: '1'
      EES_REQUIRE_ASSET_NATIVE: '1'
      EES_REQUIRE_MODEL_NATIVE: '1'
      EES_REQUIRE_LEGACY_WORKFLOW: '1'
      EES_TEST_PREVIOUS_C_WHEEL: dist/previous12-branding/open_webui-0.11.3+ees.12-py3-none-any.whl
      EES_REQUIRE_PREVIOUS_C: '1'
      EES_TEST_PREVIOUS_V4_WHEEL: dist/previous-v4-branding/open_webui-0.11.3+ees.12-py3-none-any.whl
      EES_REQUIRE_PREVIOUS_V4: '1'
      EES_TEST_PREVIOUS13_WHEEL: dist/previous13-branding/open_webui-0.11.3+ees.13-py3-none-any.whl
      EES_REQUIRE_PREVIOUS13: '1'
      EES_REQUIRE_PREVIOUS_WORKFLOW: '1'
      EES_RUN_REAL_UV_TEST: '1'
      EES_RUN_REAL_NLTK_TEST: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install fixed test dependencies
        run: python -m pip install ${{ env.EES_FIXED_TEST_DEPENDENCIES }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ees-pinned-fixtures-${{ github.sha }}
          path: dist
      - name: Retain real Windows build and LF archive validation
        if: runner.os == 'Windows' && matrix.suite == 'platform'
        run: |
          python scripts/build_ees_webui.py --wheel dist/upstream/open_webui-0.11.3-py3-none-any.whl --frontend-dir dist/frontend --output-dir dist/windows-branding
          git -c core.autocrlf=false -c core.eol=lf archive --format=tar --output=dist/windows-legacy-source.tar a443d30c6694df0e1cbe082a0b99aa5f2d566917
          python -c "import tarfile; tarfile.open('dist/windows-legacy-source.tar').extractall('dist/windows-legacy-source', filter='data')"
          python dist/windows-legacy-source/scripts/build_ees_webui.py --wheel dist/upstream/open_webui-0.11.3-py3-none-any.whl --output-dir dist/windows-legacy-branding
          git -c core.autocrlf=false -c core.eol=lf archive --format=tar --output=dist/windows-previous-source.tar 991cdb1d80ae07471fb50594831d74fe602b1ef7
          python -c "import tarfile; tarfile.open('dist/windows-previous-source.tar').extractall('dist/windows-previous-source', filter='data')"
          python dist/windows-previous-source/scripts/build_ees_webui.py --wheel dist/upstream/open_webui-0.11.3-py3-none-any.whl --output-dir dist/windows-previous-branding
          git -c core.autocrlf=false -c core.eol=lf archive --format=tar --output=dist/windows-previous12-source.tar 8027aaf2e654778f052a966e5a49feed0fc54f69
          python -c "import tarfile; tarfile.open('dist/windows-previous12-source.tar').extractall('dist/windows-previous12-source', filter='data')"
          python dist/windows-previous12-source/scripts/build_ees_webui.py --wheel dist/upstream/open_webui-0.11.3-py3-none-any.whl --output-dir dist/windows-previous12-branding
          python -c "import os,pathlib; values={'EES_TEST_BRANDING_DIR':'dist/windows-branding','EES_TEST_LEGACY_WORKFLOW_WHEEL':'dist/windows-legacy-branding/open_webui-0.11.3+ees.10-py3-none-any.whl','EES_TEST_PREVIOUS_WORKFLOW_WHEEL':'dist/windows-previous-branding/open_webui-0.11.3+ees.11-py3-none-any.whl','EES_TEST_PREVIOUS_WORKFLOW_SOURCE':'dist/windows-previous-source','EES_TEST_PREVIOUS_C_WHEEL':'dist/windows-previous12-branding/open_webui-0.11.3+ees.12-py3-none-any.whl'}; pathlib.Path(os.environ['GITHUB_ENV']).open('a',encoding='utf-8').write(''.join(key+'='+value+'\n' for key,value in values.items()))"
      - name: Verify trial source preparation with Windows long paths disabled
        if: runner.os == 'Windows' && matrix.suite == 'platform'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem'
          $name = 'LongPathsEnabled'
          $before = (Get-ItemProperty -LiteralPath $path -Name $name -ErrorAction Stop).$name
          try {
            Set-ItemProperty -LiteralPath $path -Name $name -Value 0 -ErrorAction Stop
            if ((Get-ItemProperty -LiteralPath $path -Name $name).$name -ne 0) {
              throw 'LongPathsEnabled was not disabled.'
            }
            $env:EES_TEST_REQUIRE_WIN32_PATHS_DISABLED = '1'
            python -X warn_default_encoding -W error::EncodingWarning -m unittest tests.test_ees_trial_bundle.SourceTests.test_full_repository_prepares_with_long_paths_disabled -v
            if ($LASTEXITCODE -ne 0) { throw 'Trial long-path regression failed.' }
          } finally {
            Remove-Item Env:EES_TEST_REQUIRE_WIN32_PATHS_DISABLED -ErrorAction SilentlyContinue
            Set-ItemProperty -LiteralPath $path -Name $name -Value $before -ErrorAction Stop
            if ((Get-ItemProperty -LiteralPath $path -Name $name).$name -ne $before) {
              throw 'LongPathsEnabled was not restored.'
            }
          }
      - name: Run the complete assigned module set
        id: suite
        run: python -X warn_default_encoding -W error::EncodingWarning tests/ees_delivery_suite.py --suite ${{ matrix.suite }} --output dist/ees-results
      - name: Require real Windows IOCP accept and subprocess validation
        if: runner.os == 'Windows' && matrix.suite == 'platform'
        run: python -I -B tests/test_ees_deploy_accept.py --require-windows -v
      - name: Diagnose the two Windows fixture failures independently
        id: windows_residual
        if: runner.os == 'Windows' && matrix.suite == 'platform'
        run: python -X warn_default_encoding -W error::EncodingWarning tests/ees_workflow_windows_diagnostics.py --output dist/ees-windows-diagnostics --previous-wheel $env:EES_TEST_PREVIOUS_WORKFLOW_WHEEL --previous-source $env:EES_TEST_PREVIOUS_WORKFLOW_SOURCE
      - name: Parse the Windows PowerShell entry point
        if: runner.os == 'Windows' && matrix.suite == 'platform'
        shell: powershell
        run: |
          $tokens = $null
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'scripts/manage-ees.ps1'), [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) { throw 'PowerShell entry point has syntax errors.' }
          $guide = Get-Content -Raw -Encoding UTF8 docs/03-openwebui-native-agent.md
          foreach ($anchor in @('internal-pilot-20261012', 'internal-pilot-stop-recovery-20261012', 'source-frontend-apply-20261013', 'source-frontend-local-zip-20261013', 'source-frontend-stop-recovery-20261013', 'source-phase2-local-zip-20261014')) {
            $pattern = '(?s)<a id="' + [regex]::Escape($anchor) + '"></a>.*?```powershell\r?\n(.*?)```'
            $pilotBlock = [regex]::Match($guide, $pattern).Groups[1].Value
            if (-not $pilotBlock -or $pilotBlock.Length -gt 2500) { throw "Missing or oversized pilot block: $anchor" }
            [void][System.Management.Automation.Language.Parser]::ParseInput(
              $pilotBlock, [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count -gt 0) { throw "PowerShell syntax error in pilot block: $anchor" }
            Write-Host "Pilot block parsed: $anchor ($($pilotBlock.Length) characters)"
          }
      - name: Check documentation and patch whitespace
        if: matrix.suite == 'services'
        run: |
          python scripts/check_docs.py
          git diff --check
      - name: Keep all per-test results including failures and skips
        if: always() && steps.suite.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ees-results-${{ matrix.suite }}-${{ matrix.os }}
          path: dist/ees-results
          if-no-files-found: error
          retention-days: 7
      - name: Keep complete Windows fixture diagnostics
        if: always() && runner.os == 'Windows' && matrix.suite == 'platform' && steps.windows_residual.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ees-windows-fixture-diagnostics
          path: dist/ees-windows-diagnostics
          if-no-files-found: error
          retention-days: 7

  native:
    name: ${{ matrix.suite }} (ubuntu-24.04)
    needs: fixtures
    strategy:
      fail-fast: false
      matrix:
        suite: [native-account, native-work, native-compose, native-execution]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EES_TEST_CHROME: google-chrome
      EES_TEST_UPSTREAM_WHEEL: dist/upstream/open_webui-0.11.3-py3-none-any.whl
      EES_TEST_BRANDING_DIR: dist/branding
      EES_TEST_FRONTEND_DIR: dist/frontend
      EES_TEST_SCREENSHOT_DIR: dist/ees-work-screenshots
      EES_REQUIRE_AUTHORING_NATIVE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install fixed test dependencies
        run: python -m pip install ${{ env.EES_FIXED_TEST_DEPENDENCIES }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ees-pinned-fixtures-${{ github.sha }}
          path: dist
      - name: Run the assigned real Native browser integration
        id: native
        run: python -X warn_default_encoding -W error::EncodingWarning tests/ees_delivery_suite.py --suite ${{ matrix.suite }} --output dist/ees-results
      - name: Verify actual browser files before artifact upload
        if: always() && steps.native.outcome != 'skipped'
        run: python tests/ees_delivery_suite.py --browser-evidence dist/ees-work-screenshots --output dist/ees-results
      - name: Keep browser results and actual evidence files
        if: always() && steps.native.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ees-work-browser-evidence-${{ matrix.suite }}
          path: |
            dist/ees-results
            dist/ees-work-screenshots
          if-no-files-found: error
          retention-days: 7

  native-product:
    name: Complete Native product (ubuntu-24.04)
    needs: fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Restore the already verified fixed product dependency inventory
        run: |
          python -c "import json,pathlib; packages=json.loads(pathlib.Path('evals/assets/restructure-step0b-20261001/venv-final-inventory.json').read_text(encoding='utf-8'))['packages']; assert len(packages)==199; pathlib.Path('product-verification-requirements.txt').write_text(''.join(name+'=='+version+'\n' for name,version in sorted(packages.items())),encoding='utf-8')"
          python -m pip install --no-deps -r product-verification-requirements.txt
          python -c "import importlib.metadata,json,pathlib; packages=json.loads(pathlib.Path('evals/assets/restructure-step0b-20261001/venv-final-inventory.json').read_text(encoding='utf-8'))['packages']; assert all(importlib.metadata.version(name)==version for name,version in packages.items())"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ees-pinned-fixtures-${{ github.sha }}
          path: dist
      - name: Restore the exact upstream text-attachment dependency missing from the older inventory
        run: |
          python -c "import zipfile; z=zipfile.ZipFile('dist/upstream/open_webui-0.11.3-py3-none-any.whl'); metadata=z.read('open_webui-0.11.3.dist-info/METADATA').decode('utf-8'); assert 'Requires-Dist: ftfy==6.3.1' in metadata.splitlines()"
          python -m pip install --no-deps ftfy==6.3.1 wcwidth==0.2.13
          python -c "import ftfy,importlib.metadata; assert importlib.metadata.version('ftfy')=='6.3.1'; assert importlib.metadata.version('wcwidth')=='0.2.13'; assert 'wcwidth' in ' '.join(importlib.metadata.requires('ftfy')); assert ftfy.fix_text('한글')=='한글'"
      - name: Start the actual CLI and verify browser writes, reload and restart
        id: product
        run: python tests/ees_work_integrated_app.py --wheel dist/branding/open_webui-0.11.3+ees.14-py3-none-any.whl --chrome "$(command -v google-chrome)" --output dist/ees-native-product
      - name: Verify central Native chat and isolated helper with actual registered tools
        id: native_chat
        run: python tests/ees_work_native_chat.py --wheel dist/branding/open_webui-0.11.3+ees.14-py3-none-any.whl --chrome "$(command -v google-chrome)" --output dist/ees-native-product/central-chat
      - name: Record the successfully tested integration tree
        run: |
          echo "EES_TESTED_TREE=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_ENV"
          echo "EES_TESTED_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Select the review head only for candidate packaging
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          clean: false
      - name: Prepare the exact tested head as a review candidate
        env:
          REVIEW_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse 'HEAD^{tree}')" = "$EES_TESTED_TREE"
          python scripts/build_demo_bundle.py --output-dir dist/ees-review-candidate --branding-dir dist/branding
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          from zipfile import ZipFile
          output=Path('dist/ees-review-candidate')
          bundles=list(output.glob('*.zip'))
          assert len(bundles)==1, bundles
          with ZipFile(bundles[0]) as archive:
              raw=archive.read('manifest.json')
              manifest=json.loads(raw)
              assert manifest['source_commit']==os.environ['REVIEW_SOURCE_SHA']
              assert manifest['source_dirty'] is False
              for item in manifest['files']:
                  content=archive.read(item['path'])
                  assert len(content)==item['size'] and hashlib.sha256(content).hexdigest()==item['sha256'], item['path']
          (output/'candidate-manifest.json').write_bytes(raw)
          files=[{'path':path.name,'bytes':path.stat().st_size,'sha256':hashlib.sha256(path.read_bytes()).hexdigest()} for path in sorted(output.iterdir())]
          (output/'candidate-sha256.json').write_text(json.dumps({'source_commit':manifest['source_commit'],'source_dirty':False,'tested_commit':os.environ['EES_TESTED_COMMIT'],'tested_tree':os.environ['EES_TESTED_TREE'],'files':files},indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'source_commit':manifest['source_commit'],'files':files},indent=2))
          PY
      - name: Keep the hashed review candidate for this exact head
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ees-review-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist/ees-review-candidate
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Verify actual full-product evidence files
        if: always() && steps.product.outcome != 'skipped'
        run: python tests/ees_delivery_suite.py --browser-evidence dist/ees-native-product --output dist/ees-native-product-results
      - name: Keep actual full-product results and screen evidence
        if: always() && steps.product.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ees-native-complete-product-${{ github.sha }}
          path: |
            dist/ees-native-product
            dist/ees-native-product-results
          if-no-files-found: error
          retention-days: 7

  check:
    # Preserve the previous required check names. Neither a cancelled shard nor
    # an unexecuted dependency can make these release gates green.
    name: Delivery checks (${{ matrix.os }})
    needs: [source-frontend, fixtures, service, native, native-product]
    if: always()
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 2
    steps:
      - name: Require every fixture, service, platform and Native result
        env:
          FRONTEND_RESULT: ${{ needs.source-frontend.result }}
          FIXTURES_RESULT: ${{ needs.fixtures.result }}
          SERVICE_RESULT: ${{ needs.service.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
          PRODUCT_RESULT: ${{ needs.native-product.result }}
        run: python -c "import os; results={key:os.environ[key] for key in ('FRONTEND_RESULT','FIXTURES_RESULT','SERVICE_RESULT','NATIVE_RESULT','PRODUCT_RESULT')}; print(results); assert all(value=='success' for value in results.values()), results"

  package:
    name: Prepare delivery files
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Decide whether the program changed
        id: branding
        env:
          REQUESTED: ${{ inputs.include_branding }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          enabled=false
          if [ "$REQUESTED" = true ]; then
            enabled=true
          elif [ "$EVENT_NAME" = push ]; then
            if ! git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
              enabled=true
            else
              git diff --name-only "$BEFORE_SHA" HEAD > "$RUNNER_TEMP/ees-changed.txt"
              if grep -Eq '^(\.gitattributes$|frontend/|branding/|agent-pack/skills/ees-work-demo/|agent-pack/skills/cross-system-analysis/ui/work-panel\.js$|scripts/build_(ees_frontend|ees_webui|demo_bundle)\.py$|scripts/(render_ees_brand_assets|ees_asset_guard)\.py$|tests/test_(ees_branding_build|demo_bundle)\.py$|\.github/workflows/ees-delivery\.yml$)' "$RUNNER_TEMP/ees-changed.txt"; then
                enabled=true
              fi
            fi
          fi
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
      - name: Reuse the exact program bytes that passed all required suites
        if: steps.branding.outputs.enabled == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ees-pinned-fixtures-${{ github.sha }}
          path: dist
      - name: Verify the real wheel can be selected as a standalone program
        if: steps.branding.outputs.enabled == 'true'
        env:
          EES_TEST_BRANDING_DIR: dist/branding
          EES_TEST_FRONTEND_DIR: dist/frontend
        run: python -m unittest discover -s tests -p test_ees_webui_customization.py -v
      - name: Bundle with branding
        if: steps.branding.outputs.enabled == 'true'
        run: python scripts/build_demo_bundle.py --output-dir dist/delivery --branding-dir dist/branding
      - name: Bundle Agent Pack only
        if: steps.branding.outputs.enabled != 'true'
        run: python scripts/build_demo_bundle.py --output-dir dist/delivery
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ees-${{ steps.branding.outputs.enabled == 'true' && 'program' || 'demo' }}-${{ github.sha }}
          path: dist/delivery/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: ${{ steps.branding.outputs.enabled == 'true' && 90 || 14 }}
