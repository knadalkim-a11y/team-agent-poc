name: EES delivery

on:
  pull_request:
    paths:
      - '.github/workflows/ees-delivery.yml'
      - 'branding/**'
      - 'agent-pack/**'
      - 'scripts/build_*.py'
      - 'scripts/render_ees_brand_assets.py'
      - 'scripts/check_docs.py'
      - 'scripts/ees_deploy_*.py'
      - 'scripts/manage_ees.py'
      - 'scripts/manage-ees.ps1'
      - 'scripts/ees_webui_customization.py'
      - 'scripts/ees_upgrade.py'
      - 'scripts/ees_apply_demo.py'
      - 'scripts/ees_demo_assets.py'
      - 'scripts/ees_update_download.py'
      - 'tests/test_ees_deploy_*.py'
      - 'tests/test_ees_webui_customization.py'
      - 'tests/test_manage_ees.py'
      - 'tests/test_ees_upgrade.py'
      - 'tests/test_ees_apply_demo.py'
      - 'tests/test_ees_demo*.py'
      - 'tests/test_ees_cooperation_panel.cjs'
      - 'tests/test_ees_specialists_tool.py'
      - 'tests/test_ees_update_download.py'
      - 'tests/test_confluence*.py'
      - 'tests/test_jira_read.py'
      - 'tests/test_github_tool.py'
      - 'tests/test_wo_demo*'
      - 'tests/test_ees_branding_build.py'
      - 'tests/test_ees_chat_theme.py'
      - 'tests/test_ees_work_demo.py'
      - 'tests/test_ees_work_routes.py'
      - 'tests/test_demo_bundle.py'
      - 'docs/**'
      - 'README.md'
      - 'versions.md'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      include_branding:
        description: 'Include the pinned EES Open WebUI wheel (about 146 MB)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    name: Delivery checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p test_ees_branding_build.py -v
      - run: python -m unittest discover -s tests -p test_demo_bundle.py -v
      - name: Install fixed test dependencies
        run: python -m pip install uv==0.12.7 cryptography==46.0.0 nltk==3.9.2 pydantic==2.13.4 fastapi==0.136.3 httpx==0.28.1
      - name: Verify authenticated demo file routes without user data
        env:
          EES_REQUIRE_WORK_ROUTES: '1'
        run: python -m unittest discover -s tests -p test_ees_work_routes.py -v
      - name: Verify Confluence read and plain results
        run: python -m unittest discover -s tests -p "test_confluence*.py" -v
      - name: Verify Jira read and plain results
        run: python -m unittest discover -s tests -p test_jira_read.py -v
      - name: Verify GitHub read and plain results
        run: python -m unittest discover -s tests -p test_github_tool.py -v
      - name: Verify WO demo Tool
        run: python -m unittest discover -s tests -p test_wo_demo_tool.py -v
      - name: Verify WO demo local form state
        run: node tests/test_wo_demo_state.cjs
      - name: Verify cooperation panel state and isolation
        run: node tests/test_ees_cooperation_panel.cjs
      - name: Verify deployment boundaries, child lifecycle, and NLTK imports
        env:
          EES_RUN_REAL_UV_TEST: '1'
          EES_RUN_REAL_NLTK_TEST: '1'
        run: python -m unittest discover -s tests -p test_ees_deploy_*.py -v
      - name: Require real Windows IOCP accept and subprocess validation
        if: runner.os == 'Windows'
        run: python -I -B tests/test_ees_deploy_accept.py --require-windows -v
      - run: python -m unittest discover -s tests -p test_manage_ees.py -v
      - name: Verify one-command upgrade
        run: python -m unittest discover -s tests -p test_ees_upgrade.py -v
      - name: Verify download boundaries
        run: python -m unittest discover -s tests -p test_ees_update_download.py -v
      - name: Verify demo data and asset provisioning
        run: python -m unittest discover -s tests -p "test_ees_demo*.py" -v
      - name: Verify ApplyDemo operator entry
        run: python -m unittest discover -s tests -p test_ees_apply_demo.py -v
      - name: Download the fixed upstream wheel for program validation
        run: |
          python -m pip download --no-deps --only-binary=:all: --dest dist/upstream open-webui==0.11.3
      - name: Build the real program fixture without installing it
        run: python scripts/build_ees_webui.py --wheel dist/upstream/open_webui-0.11.3-py3-none-any.whl --output-dir dist/branding
      - name: Verify EES Work browser demonstration and isolation
        if: runner.os == 'Linux'
        env:
          EES_TEST_CHROME: google-chrome
          EES_TEST_BRANDING_DIR: dist/branding
          EES_TEST_SCREENSHOT_DIR: dist/ees-work-screenshots
        run: python -m unittest discover -s tests -p test_ees_work_demo.py -v
      - name: Keep EES Work browser evidence
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ees-work-browser-evidence
          path: dist/ees-work-screenshots
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify chat theme in the runner's Chrome
        if: runner.os == 'Linux'
        env:
          EES_TEST_CHROME: google-chrome
          EES_TEST_BRANDING_DIR: dist/branding
        run: python -m unittest discover -s tests -p test_ees_chat_theme.py -v
      - name: Verify specialist execution against the fixed WebUI source
        env:
          EES_TEST_UPSTREAM_WHEEL: dist/upstream/open_webui-0.11.3-py3-none-any.whl
        run: python -m unittest discover -s tests -p test_ees_specialists_tool.py -v
      - name: Verify program-only Apply and Restore
        env:
          EES_TEST_BRANDING_DIR: dist/branding
        run: python -m unittest discover -s tests -p test_ees_webui_customization.py -v
      - name: Parse the Windows PowerShell entry point
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $tokens = $null
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'scripts/manage-ees.ps1'), [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) { throw 'PowerShell entry point has syntax errors.' }
      - run: python scripts/check_docs.py
      - run: git diff --check

  package:
    name: Prepare delivery files
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Decide whether the program changed
        id: branding
        env:
          REQUESTED: ${{ inputs.include_branding }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          enabled=false
          if [ "$REQUESTED" = true ]; then
            enabled=true
          elif [ "$EVENT_NAME" = push ]; then
            if ! git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
              enabled=true
            else
              git diff --name-only "$BEFORE_SHA" HEAD > "$RUNNER_TEMP/ees-changed.txt"
              if grep -Eq '^(branding/|agent-pack/skills/ees-work-demo/|scripts/build_(ees_webui|demo_bundle)\.py$|scripts/render_ees_brand_assets\.py$|tests/test_(ees_branding_build|demo_bundle)\.py$|\.github/workflows/ees-delivery\.yml$)' "$RUNNER_TEMP/ees-changed.txt"; then
                enabled=true
              fi
            fi
          fi
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
      - name: Download the fixed upstream wheel
        if: steps.branding.outputs.enabled == 'true'
        run: |
          python -m pip download --no-deps --only-binary=:all: --dest dist/upstream open-webui==0.11.3
      - name: Build the EES wheel
        if: steps.branding.outputs.enabled == 'true'
        run: python scripts/build_ees_webui.py --wheel dist/upstream/open_webui-0.11.3-py3-none-any.whl --output-dir dist/branding
      - name: Verify the real wheel can be selected as a standalone program
        if: steps.branding.outputs.enabled == 'true'
        env:
          EES_TEST_BRANDING_DIR: dist/branding
        run: python -m unittest discover -s tests -p test_ees_webui_customization.py -v
      - name: Bundle with branding
        if: steps.branding.outputs.enabled == 'true'
        run: python scripts/build_demo_bundle.py --output-dir dist/delivery --branding-dir dist/branding
      - name: Bundle Agent Pack only
        if: steps.branding.outputs.enabled != 'true'
        run: python scripts/build_demo_bundle.py --output-dir dist/delivery
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ees-${{ steps.branding.outputs.enabled == 'true' && 'program' || 'demo' }}-${{ github.sha }}
          path: dist/delivery/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: ${{ steps.branding.outputs.enabled == 'true' && 90 || 14 }}
