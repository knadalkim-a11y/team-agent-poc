# TEMPORARY investigation workflow. Delete before any merge.
name: TEMP Windows stop probe
on:
  push:
    branches: [claude/brave-goodall-jaf2vt]
    paths: ['tests/tmp_stop_probe.py', '.github/workflows/tmp-stop-probe.yml', 'scripts/ees_deploy_process.py']
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts
            tests
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Probe the exiting server
        run: python -X utf8 tests/tmp_stop_probe.py --a 200 --b 80 --c 80
