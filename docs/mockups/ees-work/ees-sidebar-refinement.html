<div id="ees-sidebar-refinement">
  <style>
    #ees-sidebar-refinement{--ew-bg:light-dark(#fff,#171717);--ew-side:light-dark(#f7f7f8,#212121);--ew-hover:light-dark(#ececee,#303030);--ew-line:light-dark(#e5e5e7,#373737);--ew-ink:light-dark(#242426,#ededee);--ew-muted:light-dark(#717176,#aaaab0);--ew-blue:light-dark(#35649c,#a8c9f1);--ew-selected:light-dark(#e9eef5,#29394e);--ew-shadow:light-dark(#00000014,#00000055);--ew-font:"EES Inter",Inter,"EES Noto Sans KR","Noto Sans KR","Segoe UI","Malgun Gothic",sans-serif;font-family:var(--ew-font);font-size:14px;line-height:1.6;color:var(--ew-ink);color-scheme:inherit;width:100%}

    #ees-sidebar-refinement button svg,#ees-sidebar-refinement i[data-lucide]{width:18px;height:18px;flex:none}

    #ees-sidebar-refinement .ew-kind{font-size:11px;line-height:19px;width:19px;height:19px;text-align:center;border:1px solid var(--ew-line);border-radius:5px;background:var(--ew-bg);color:var(--ew-muted);flex:none;margin-top:2px}
    #ees-sidebar-refinement .ew-category .ew-node-select{font-weight:500;gap:10px;padding-top:9px;padding-bottom:9px}
    #ees-sidebar-refinement .ew-leaf-indent{width:12px;flex:none}
    #ees-sidebar-refinement .ew-divider{border:0;border-top:1px solid var(--ew-line);margin:21px 8px 16px}

    #ees-sidebar-refinement .ew-account{display:flex;align-items:center;gap:10px;margin-top:auto;padding:32px 10px 0}
    #ees-sidebar-refinement .ew-avatar{width:29px;height:29px;display:grid;place-items:center;border-radius:50%;background:var(--ew-hover);font-size:12px}
    #ees-sidebar-refinement .ew-main{display:flex;flex-direction:column;min-width:0}
    #ees-sidebar-refinement .ew-topbar{display:flex;align-items:center;gap:12px;min-height:70px;padding:13px 24px}
    #ees-sidebar-refinement .ew-model{font-size:16px;font-weight:500}
    #ees-sidebar-refinement .ew-preview-label{font-size:12px;color:var(--ew-muted);margin-left:auto}
    #ees-sidebar-refinement .ew-panel-toggle{display:flex;align-items:center;gap:7px;padding:7px 9px;border:0;background:transparent;border-radius:8px}
    #ees-sidebar-refinement .ew-panel-toggle:hover{background:var(--ew-hover)}
    #ees-sidebar-refinement .ew-workarea{display:grid;grid-template-columns:minmax(0,1fr);flex:1;min-width:0}
    #ees-sidebar-refinement .ew-workarea.ew-show-panel{grid-template-columns:minmax(0,1fr) 262px}
    #ees-sidebar-refinement .ew-conversation{min-width:0;display:flex;flex-direction:column;padding:0 25px 18px}
    #ees-sidebar-refinement .ew-scope-line{display:flex;gap:7px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--ew-muted);padding:0 3px 15px}
    #ees-sidebar-refinement .ew-scope-line svg{width:14px;height:14px}
    #ees-sidebar-refinement .ew-messages{max-width:750px;width:100%;margin:35px auto 30px;display:grid;align-content:start;gap:27px;flex:1}
    #ees-sidebar-refinement .ew-user-message{justify-self:end;max-width:92%;border-radius:19px 19px 4px 19px;background:var(--ew-side);padding:12px 17px}
    #ees-sidebar-refinement .ew-answer{display:grid;gap:15px;padding:0 3px}
    #ees-sidebar-refinement .ew-answer-head{font-weight:500;display:flex;align-items:center;gap:8px}
    #ees-sidebar-refinement .ew-answer p{line-height:1.85}
    #ees-sidebar-refinement .ew-steps{list-style:none;padding:0;margin:2px 0;display:grid;gap:12px}
    #ees-sidebar-refinement .ew-steps li{display:flex;gap:12px;align-items:center}
    #ees-sidebar-refinement .ew-step-number{width:23px;height:23px;display:grid;place-items:center;flex:none;border:1px solid var(--ew-line);border-radius:50%;font-size:12px;color:var(--ew-muted)}
    #ees-sidebar-refinement .ew-composer{max-width:780px;width:100%;margin:0 auto;border:1px solid var(--ew-line);border-radius:22px;padding:14px 15px 11px;box-shadow:0 3px 15px var(--ew-shadow);background:var(--ew-bg)}
    #ees-sidebar-refinement .ew-composer textarea{width:100%;border:0;resize:vertical;min-height:45px;background:transparent;padding:0 3px}
    #ees-sidebar-refinement .ew-composer textarea::placeholder{color:var(--ew-muted)}
    #ees-sidebar-refinement .ew-composer-bottom{display:flex;align-items:center;justify-content:space-between;padding-top:5px}
    #ees-sidebar-refinement .ew-composer-note{font-size:12px;color:var(--ew-muted);display:flex;align-items:center;gap:5px}
    #ees-sidebar-refinement .ew-send{border:0;border-radius:50%;width:33px;height:33px;background:var(--ew-ink);color:var(--ew-bg);display:grid;place-items:center}
    #ees-sidebar-refinement .ew-caption{font-size:12px;color:var(--ew-muted);text-align:center;margin-top:11px}
    #ees-sidebar-refinement .ew-panel{border-left:1px solid var(--ew-line);padding:0 18px 20px;min-width:0;background:var(--ew-bg);border-radius:0 0 14px 0}
    #ees-sidebar-refinement .ew-panel-head{display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--ew-line);padding:1px 0 14px;font-weight:500}
    #ees-sidebar-refinement .ew-panel-head button{margin-left:auto;border:0;border-radius:6px;background:transparent;padding:3px;display:flex}
    #ees-sidebar-refinement .ew-panel-kind{font-size:12px;color:var(--ew-muted);margin:22px 0 5px}
    #ees-sidebar-refinement .ew-panel h2{font-size:17px;line-height:1.6;margin-bottom:9px;overflow-wrap:anywhere}
    #ees-sidebar-refinement .ew-panel-description{color:var(--ew-muted);font-size:13px;line-height:1.8}
    #ees-sidebar-refinement .ew-panel-section{margin:24px 0 7px;font-size:12px;color:var(--ew-muted)}
    #ees-sidebar-refinement .ew-panel-row{display:flex;align-items:center;gap:8px;border:0;border-bottom:1px solid var(--ew-line);background:transparent;width:100%;padding:11px 0;text-align:left}
    #ees-sidebar-refinement .ew-panel-row span{flex:1}
    #ees-sidebar-refinement .ew-panel-row:hover{color:var(--ew-blue)}
    #ees-sidebar-refinement .ew-detail-note{margin-top:22px;padding:11px 12px;border-radius:10px;background:var(--ew-side);font-size:12px;color:var(--ew-muted)}
    #ees-sidebar-refinement .ew-welcome{padding-top:85px;text-align:center}
    #ees-sidebar-refinement .ew-welcome h1{font-size:26px;margin-bottom:14px;letter-spacing:-.7px}
    #ees-sidebar-refinement .ew-welcome p{color:var(--ew-muted)}
    #ees-sidebar-refinement .ew-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
    @media(min-width:1440px){#ees-sidebar-refinement .ew-app{grid-template-columns:302px minmax(0,1fr);min-height:875px}#ees-sidebar-refinement .ew-workarea.ew-show-panel{grid-template-columns:minmax(0,1fr) 330px}#ees-sidebar-refinement .ew-conversation{padding-left:46px;padding-right:46px}#ees-sidebar-refinement .ew-panel{padding-left:24px;padding-right:24px}#ees-sidebar-refinement .ew-messages{margin-top:58px}}
    @media(max-width:930px){#ees-sidebar-refinement .ew-workarea.ew-show-panel{grid-template-columns:minmax(0,1fr)}#ees-sidebar-refinement .ew-panel{border-left:0;border-top:1px solid var(--ew-line);padding-top:18px}#ees-sidebar-refinement .ew-preview-label{display:none}#ees-sidebar-refinement .ew-panel-toggle{margin-left:auto}}
    @media(max-width:650px){#ees-sidebar-refinement .ew-app{grid-template-columns:minmax(0,1fr)}#ees-sidebar-refinement .ew-sidebar{border-right:0;border-bottom:1px solid var(--ew-line);border-radius:14px 14px 0 0}#ees-sidebar-refinement .ew-account,#ees-sidebar-refinement .ew-recent{display:none}#ees-sidebar-refinement .ew-context{margin-top:13px;margin-bottom:20px}#ees-sidebar-refinement .ew-topbar{padding:15px 18px;flex-wrap:wrap}#ees-sidebar-refinement .ew-conversation{padding:0 18px 18px}#ees-sidebar-refinement .ew-messages{margin-top:18px}#ees-sidebar-refinement .ew-composer textarea{font-size:16px}#ees-sidebar-refinement .ew-main{min-height:590px}#ees-sidebar-refinement .ew-model{font-size:14px}}
    @media(pointer:coarse){#ees-sidebar-refinement .ew-expand{width:36px;min-height:44px}#ees-sidebar-refinement .ew-node-select,#ees-sidebar-refinement .ew-nav,#ees-sidebar-refinement .ew-option,#ees-sidebar-refinement .ew-panel-toggle,#ees-sidebar-refinement .ew-panel-row{min-height:44px}#ees-sidebar-refinement .ew-send{width:44px;height:44px}}
  </style>
  <div class="ew-app">
    <aside class="ew-sidebar" aria-label="업무 탐색">
      <div class="ew-brand"><span class="ew-brandmark" aria-hidden="true">E</span>EES Work</div>
      <button type="button" class="ew-nav" data-action="new-chat"><i data-lucide="square-pen" aria-hidden="true"></i>새 대화</button>
      <div class="ew-context">
        <div class="ew-context-card">
          <button type="button" class="ew-picker" data-picker="factory" aria-expanded="false" aria-controls="ew-factory-menu" aria-label="작업 공장 선택: 한국 천안">
            <span class="ew-picker-icon"><i data-lucide="factory" aria-hidden="true"></i></span>
            <span class="ew-picker-text"><span class="ew-eyebrow">작업 공장</span><span class="ew-picker-value"><span id="ew-factory-name">천안</span><span class="ew-eyebrow" id="ew-country-name">한국</span></span></span>
            <i class="ew-chevron" data-lucide="chevrons-up-down" aria-hidden="true"></i>
          </button>
          <div class="ew-context-divider"></div>
          <button type="button" class="ew-picker" data-picker="system" aria-expanded="false" aria-controls="ew-system-menu" aria-label="시스템 선택: EMS">
            <span class="ew-picker-icon"><i data-lucide="layers-2" aria-hidden="true"></i></span>
            <span class="ew-picker-text"><span class="ew-eyebrow">시스템</span><span class="ew-picker-value" id="ew-system-name">EMS</span></span>
            <i class="ew-chevron" data-lucide="chevrons-up-down" aria-hidden="true"></i>
          </button>
        </div>
        <div class="ew-popover" id="ew-factory-menu" role="dialog" aria-label="작업 공장 선택" hidden></div>
        <div class="ew-popover" id="ew-system-menu" role="dialog" aria-label="시스템 선택" hidden></div>
      </div>
      <nav aria-label="공장별 업무"><div class="ew-section-label">업무</div><div id="ew-tree"></div></nav>
      <div class="ew-recent"><hr class="ew-divider"><div class="ew-section-label">최근 대화</div><button type="button" class="ew-nav" data-action="sample-chat"><i data-lucide="message-square" aria-hidden="true"></i>EMS 셋업 사전 검토</button></div>
      <div class="ew-account"><span class="ew-avatar" aria-hidden="true">광재</span><span>김광재</span></div>
    </aside>
    <main class="ew-main" aria-label="AI 대화와 현재 작업">
      <header class="ew-topbar"><span class="ew-model">EES 통합 Assistant</span><span class="ew-preview-label">디자인 미리보기</span><button type="button" class="ew-panel-toggle" data-action="toggle-panel" aria-expanded="true" aria-controls="ew-panel"><i data-lucide="panel-right" aria-hidden="true"></i>작업 패널</button></header>
      <div class="ew-workarea ew-show-panel" id="ew-workarea">
        <section class="ew-conversation" aria-label="대화 예시">
          <div class="ew-scope-line"><i data-lucide="factory" aria-hidden="true"></i><span id="ew-scope">한국 · 천안</span><span aria-hidden="true">/</span><span id="ew-scope-system">EMS</span></div>
          <div class="ew-messages" id="ew-messages"></div>
          <div class="ew-composer"><textarea id="ew-draft" rows="2" aria-label="메시지 작성 예시" placeholder="메시지를 입력하세요"></textarea><div class="ew-composer-bottom"><span class="ew-composer-note"><i data-lucide="message-circle" aria-hidden="true"></i>선택한 업무에 대해 물어보세요</span><button type="button" class="ew-send" disabled aria-label="목업에서는 메시지를 전송하지 않습니다"><i data-lucide="arrow-up" aria-hidden="true"></i></button></div></div>
          <p class="ew-caption">대화 예시 · 실제 업무 실행 없음</p>
        </section>
        <aside class="ew-panel" id="ew-panel" aria-label="현재 작업"></aside>
      </div>
    </main>
  </div>
  <div class="ew-sr" id="ew-live" aria-live="polite"></div>
  <script>
  (() => {
    const root = document.getElementById('ees-sidebar-refinement');
    const q = s => root.querySelector(s);
    const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const icon = (name, cls='') => `<i class="${cls}" data-lucide="${name}" aria-hidden="true"></i>`;
    const refreshIcons = () => { if (typeof lucide !== 'undefined') lucide.createIcons({attrs:{width:18,height:18}}); };
    const factories = [{id:'cheonan',country:'한국',name:'천안'},{id:'ulsan',country:'한국',name:'울산'},{id:'hu',country:'헝가리',name:'A공장'},{id:'us',country:'미국',name:'A공장'}];
    const systems = ['EMS','APC','FDC','EGIS','EPT'];
    const nodes = {
      setup:{name:'셋업',icon:'layers',children:['rollout','new-line','upgrade']},
      rollout:{name:'신규 공장 횡전개',kind:'P',children:['prep','infra','install','interface'],desc:'현장 준비부터 시스템 설치와 연동 확인까지 순서대로 진행합니다.'},
      prep:{name:'사전준비',kind:'T',children:['scope','requirements'],desc:'셋업 범위와 현장 요구사항을 정리합니다.'},
      scope:{name:'셋업 범위 확인',kind:'J',desc:'적용할 라인과 시스템, 담당 범위를 확인합니다.'},
      requirements:{name:'현장 요구사항 확인',kind:'J',desc:'현장 조건과 사전 준비 항목을 확인합니다.'},
      infra:{name:'AP, DB 인프라 준비',kind:'T',children:['ap-env','db-env'],desc:'시스템 설치에 필요한 AP와 DB 환경을 준비합니다.'},
      'ap-env':{name:'AP 환경 확인',kind:'J',desc:'AP 설치 환경과 서비스 준비 상태를 확인합니다.'},
      'db-env':{name:'DB 환경 확인',kind:'J',desc:'승인된 점검 경로와 DB 준비 상태를 확인합니다.'},
      install:{name:'시스템 설치',kind:'T',children:['configuration','db','ap'],desc:'설치와 설정을 마친 뒤 DB 및 AP 연결을 확인합니다.'},
      configuration:{name:'설치·설정 확인',kind:'J',desc:'설치 버전과 현장 설정을 확인합니다.'},
      db:{name:'DB 연결 확인',kind:'J',desc:'승인된 점검 경로에서 대상 DB와 읽기 기능을 확인합니다.',steps:['진단 경로 확인','대상 DB 식별','읽기 기능 확인']},
      ap:{name:'AP 연결 확인',kind:'J',desc:'AP 응답과 서비스 상태, 기본 기능을 확인합니다.',steps:['AP 응답 확인','상태 API 확인','기본 기능 확인']},
      interface:{name:'시스템 간 인터페이스 확인',kind:'T',children:['integration','legacy'],desc:'연동 대상별 데이터 전달과 응답을 확인합니다.'},
      integration:{name:'시스템 연동 검증',kind:'J',desc:'연동 대상별 응답과 처리 결과를 확인합니다.'},
      legacy:{name:'기존 시스템 연동',kind:'J',desc:'기존 시스템과의 연동 항목을 확인합니다.'},
      'new-line':{name:'신규 라인 셋업',kind:'P',children:['line-ready'],desc:'신규 라인 적용 전 준비 항목을 확인합니다.'},
      'line-ready':{name:'라인 연결 준비',kind:'T',children:['equipment'],desc:'설비별 연결 준비 항목을 확인합니다.'},
      equipment:{name:'설비 연결 확인',kind:'J',desc:'대상 설비와 연결 조건을 확인합니다.'},
      upgrade:{name:'시스템 버전 업그레이드',kind:'P',children:['version'],desc:'변경 버전과 적용 조건을 검토합니다.'},
      version:{name:'적용 버전 검토',kind:'T',children:['version-check'],desc:'업그레이드 대상 버전을 검토합니다.'},
      'version-check':{name:'호환성 확인',kind:'J',desc:'대상 환경의 호환성을 확인합니다.'},
      operations:{name:'운영',icon:'activity',children:['daily']},
      daily:{name:'일일 시스템 점검',kind:'P',children:['health'],desc:'일상적인 시스템 점검을 진행합니다.'},
      health:{name:'서비스 상태 확인',kind:'T',children:['service'],desc:'서비스 응답 상태를 확인합니다.'},
      service:{name:'AP 상태 확인',kind:'J',desc:'AP 응답 상태를 확인합니다.'},
      incident:{name:'장애대응',icon:'circle-alert',children:['response']},
      response:{name:'AP 응답 장애 대응',kind:'P',children:['evidence'],desc:'장애 근거와 이전 조치 이력을 확인합니다.'},
      evidence:{name:'진단 근거 수집',kind:'T',children:['error-log'],desc:'관련 오류와 최근 변경을 확인합니다.'},
      'error-log':{name:'최근 오류 확인',kind:'J',desc:'보존된 오류 기록을 확인합니다.'}
    };
    const parents = {};
    Object.entries(nodes).forEach(([id,n]) => (n.children || []).forEach(child => parents[child]=id));
    let factory='cheonan', system='EMS', selected='rollout', panelOpen=true, menu=null;
    const expanded = new Set(['setup','rollout']);
    function clearDescendants(id) { (nodes[id].children || []).forEach(child => { expanded.delete(child); clearDescendants(child); }); }
    function treeNode(id) {
      const n=nodes[id], open=expanded.has(id), isParent=!!n.children;
      return `<li data-node="${id}"><div class="ew-node-row ${!n.kind?'ew-category':''} ${selected===id?'ew-current':''}">${isParent?`<button type="button" class="ew-expand" data-expand="${id}" aria-label="${esc(n.name)} ${open?'접기':'펼치기'}" aria-expanded="${open}" aria-controls="ew-children-${id}">${icon('chevron-right')}</button>`:'<span class="ew-leaf-indent"></span>'}<button type="button" class="ew-node-select" ${n.kind?`data-select="${id}"`:`data-expand="${id}" aria-expanded="${open}" aria-controls="ew-children-${id}"`} ${selected===id?'aria-current="true"':''}>${n.kind?`<span class="ew-kind" aria-hidden="true">${n.kind}</span>`:icon(n.icon)}<span class="ew-node-name">${esc(n.name)}</span></button></div>${isParent?`<ul class="ew-tree" id="ew-children-${id}" ${open?'':'hidden'}>${n.children.map(treeNode).join('')}</ul>`:''}</li>`;
    }
    function renderTree(focusId) {
      q('#ew-tree').innerHTML=`<ul class="ew-tree">${['setup','operations','incident'].map(treeNode).join('')}</ul>`;
      refreshIcons();
      if (focusId) q(`[data-expand="${focusId}"]`).focus({preventScroll:true});
    }
    function renderMenus() {
      q('#ew-factory-menu').innerHTML='<div class="ew-pop-title">작업 공장 선택</div>'+['한국','헝가리','미국'].map(country=>`<div class="ew-pop-group">${country}</div>${factories.filter(f=>f.country===country).map(f=>`<button type="button" class="ew-option" data-factory="${f.id}" aria-pressed="${f.id===factory}">${esc(f.name)}${f.id===factory?'<span class="ew-check">선택됨</span>':''}</button>`).join('')}`).join('');
      q('#ew-system-menu').innerHTML='<div class="ew-pop-title">시스템 선택</div>'+systems.map(s=>`<button type="button" class="ew-option" data-system="${s}" aria-pressed="${s===system}">${s}${s===system?'<span class="ew-check">선택됨</span>':''}</button>`).join('');
    }
    function closeMenus(restore=false) {
      const previous=menu; menu=null;
      root.querySelectorAll('.ew-popover').forEach(el=>el.hidden=true);
      root.querySelectorAll('[data-picker]').forEach(el=>el.setAttribute('aria-expanded','false'));
      if(restore&&previous)q(`[data-picker="${previous}"]`).focus({preventScroll:true});
    }
    function renderScope() {
      const f=factories.find(f=>f.id===factory);
      q('#ew-factory-name').textContent=f.name;
      q('#ew-country-name').textContent=f.country;
      q('#ew-system-name').textContent=system;
      q('#ew-scope').textContent=f.country+' · '+f.name;
      q('#ew-scope-system').textContent=system;
      q('[data-picker="factory"]').setAttribute('aria-label',`작업 공장 선택: ${f.country} ${f.name}`);
      q('[data-picker="system"]').setAttribute('aria-label',`시스템 선택: ${system}`);
      renderMenus();
    }
    function renderSample() {
      const f=factories.find(f=>f.id===factory);
      q('#ew-messages').innerHTML=`<div class="ew-user-message">${esc(f.country)} ${esc(f.name)} ${system} 셋업 절차를 확인해줘.</div><div class="ew-answer"><div class="ew-answer-head">EES 통합 Assistant</div><p><strong>신규 공장 횡전개</strong>는 다음 순서로 진행합니다.</p><ol class="ew-steps">${['사전준비','AP, DB 인프라 준비','시스템 설치','시스템 간 인터페이스 확인'].map((t,i)=>`<li><span class="ew-step-number">${i+1}</span><span>${t}</span></li>`).join('')}</ol><p>왼쪽에서 필요한 단계를 선택하면 작업 내용을 확인할 수 있습니다.</p></div>`;
    }
    function renderPanel() {
      const n=nodes[selected], label={P:'프로세스',T:'태스크',J:'잡'}[n.kind];
      q('#ew-panel').hidden=!panelOpen;
      q('#ew-workarea').classList.toggle('ew-show-panel',panelOpen);
      q('[data-action="toggle-panel"]').setAttribute('aria-expanded',String(panelOpen));
      q('#ew-panel').innerHTML=`<div class="ew-panel-head"><span>현재 작업</span><button type="button" data-action="toggle-panel" aria-label="작업 패널 닫기">${icon('x')}</button></div><div class="ew-panel-kind">${label}</div><h2>${esc(n.name)}</h2><p class="ew-panel-description">${esc(n.desc)}</p>${n.children?`<div class="ew-panel-section">${n.kind==='P'?'태스크':'잡'}</div>${n.children.map(id=>`<button type="button" class="ew-panel-row" data-detail="${id}"><span>${esc(nodes[id].name)}</span>${icon('chevron-right','ew-chevron')}</button>`).join('')}`:`<div class="ew-panel-section">확인 항목</div><ol class="ew-steps">${(n.steps||['대상과 선행 조건 확인','관련 근거 확인']).map((t,i)=>`<li><span class="ew-step-number">${i+1}</span><span>${esc(t)}</span></li>`).join('')}</ol><div class="ew-detail-note">아직 실행하지 않은 작업입니다.</div>`}`;
      refreshIcons();
    }
    function selectNode(id,reveal=false) {
      selected=id;panelOpen=true;
      if(reveal){let p=parents[id];while(p){expanded.add(p);p=parents[p];}}
      renderTree();renderPanel();q('#ew-live').textContent=nodes[id].name+' 선택됨';
    }
    root.addEventListener('click',e=>{
      const b=e.target.closest('button');if(!b||!root.contains(b)||b.disabled)return;
      if(b.dataset.picker){const next=b.dataset.picker,wasOpen=menu===next;closeMenus();if(!wasOpen){menu=next;q('#ew-'+next+'-menu').hidden=false;b.setAttribute('aria-expanded','true');q('#ew-'+next+'-menu button').focus({preventScroll:true});}return;}
      if(b.dataset.factory||b.dataset.system){if(b.dataset.factory)factory=b.dataset.factory;if(b.dataset.system)system=b.dataset.system;closeMenus(true);expanded.clear();expanded.add('setup');selected='rollout';renderScope();renderTree();renderPanel();renderSample();q('#ew-live').textContent=q('#ew-scope').textContent+' · '+system+' 선택됨';return;}
      if(b.dataset.expand){const id=b.dataset.expand;if(expanded.has(id)){expanded.delete(id);clearDescendants(id);}else{expanded.add(id);clearDescendants(id);}renderTree(id);return;}
      if(b.dataset.select){selectNode(b.dataset.select);return;}
      if(b.dataset.detail){selectNode(b.dataset.detail,true);return;}
      if(b.dataset.action==='toggle-panel'){panelOpen=!panelOpen;renderPanel();return;}
      if(b.dataset.action==='new-chat'){q('#ew-messages').innerHTML='<div class="ew-welcome"><h1>무엇을 도와드릴까요?</h1><p>선택한 공장과 시스템의 업무를 함께 확인하세요.</p></div>';q('#ew-draft').value='';panelOpen=false;renderPanel();return;}
      if(b.dataset.action==='sample-chat'){renderSample();return;}
    });
    root.addEventListener('keydown',e=>{if(e.key==='Escape'&&menu){e.preventDefault();closeMenus(true);}});
    document.addEventListener('click',e=>{if(menu&&!e.target.closest('#ees-sidebar-refinement .ew-context'))closeMenus();});
    renderScope();renderTree();renderSample();renderPanel();
  })();
  </script>
</div>
