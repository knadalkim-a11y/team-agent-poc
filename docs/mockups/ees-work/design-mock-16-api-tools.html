<style data-product-css="branding/ees/ui/chat-theme.css">
/* EES Portal conversation theme — Open WebUI 0.11.3 (ees.4).
 * Palette and typography: approved ees-chat-redesign mockup, 2026-09-10.
 * Same-origin font bytes are copied from the pinned wheel by the builder.
 * Native content, controls, scrolling, resizing and saved preferences stay native.
 */


:root {
  --ees-font: "EES Noto Sans KR", "EES Inter", "Segoe UI", sans-serif;
  --ees-paper: #ffffff;
  --ees-side: #f5f7fa;
  --ees-soft: #f0f4f8;
  --ees-ink: #1f2023;
  --ees-muted: #5c5e65;
  --ees-line: #d5d6da;
  --ees-blue: #2f5f98;
  --ees-tint: #eef5fa;
  --ees-warning: #7e673e;
}
html.dark {
  --ees-paper: #191d23;
  --ees-side: #14181e;
  --ees-soft: #242c36;
  --ees-ink: #e8edf5;
  --ees-muted: #a6b2c3;
  --ees-line: #343e4b;
  --ees-blue: #91bddf;
  --ees-tint: #223342;
  --ees-warning: #d1bc92;
}

/* Stable chat IDs exclude settings, notes, exports and the sign-in page. */
#chat-container {
  color-scheme: light;
  font-family: var(--ees-font);
  color: var(--ees-ink);
  background-color: var(--ees-paper);
}
html.dark #chat-container { color-scheme: dark; }
#chat-container #chat-pane,
#chat-container #messages-container {
  background-color: var(--ees-paper);
}
#chat-container :is(button, input, textarea, select) {
  font-family: var(--ees-font);
}

/* Use the same already-bundled family outside the chat column as well.
 * Workspace tabs keep their native sizing and weight. Code/math descendants
 * retain their own families; do not apply a wildcard font reset. */
:is(#sidebar, [role="navigation"]:has(> div > .sidebar), #workspace-container),
nav:has(a[href="/workspace/models"]),
:is(#sidebar, [role="navigation"]:has(> div > .sidebar), #workspace-container) :is(button, input, textarea, select) {
  font-family: var(--ees-font);
}

/* Keep the native toolbar's controls and its existing position/height. */
#chat-container nav:has(#navbar-bg-gradient-to-b) {
  color: var(--ees-ink);
  background-color: var(--ees-paper);
  border-bottom: 1px solid var(--ees-line);
}
#chat-container #navbar-bg-gradient-to-b {
  background-image: none;
  background-color: var(--ees-paper);
}
#chat-container nav:has(#navbar-bg-gradient-to-b) > div:first-child {
  padding-inline: 1.25rem;
}
#chat-container nav:has(#navbar-bg-gradient-to-b) button {
  font-weight: 500;
}

/* Standard-width conversations use the space on 1920px desktop displays.
 * Native w-full still shrinks with the sidebar or right panel. Explicit native
 * widescreen mode remains wide; no fixed panel, scroll or flex dimensions. */
#chat-container #messages-container .message-listitem:not(.max-w-full) {
  max-width: 64rem;
}
#chat-container #messages-container .message-listitem {
  padding-inline: 1.75rem;
  margin-bottom: 1.75rem;
}
#chat-container #messages-container .message-listitem:first-child {
  padding-top: 1.75rem;
}
#chat-container .chat-assistant,
#chat-container .chat-user {
  color: var(--ees-ink);
}
#chat-container .chat-assistant .markdown-prose,
#chat-container .chat-user .markdown-prose {
  --tw-prose-body: var(--ees-ink);
  --tw-prose-headings: var(--ees-ink);
  --tw-prose-lead: var(--ees-muted);
  --tw-prose-links: var(--ees-blue);
  --tw-prose-bold: var(--ees-ink);
  --tw-prose-counters: var(--ees-muted);

@keyframes ew-running{to{transform:rotate(360deg);}}
@media(prefers-reduced-motion:reduce){[data-ees-work] .ew-status>.ew-icon{animation:none!important;}[data-ees-work] *{scroll-behavior:auto!important;}}
.ew-visually-hidden{position:absolute!important;width:1px!important;height:1px!important;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;}
/* Source-rendered navigation; Native DOM is not hidden or repositioned. */
#ees-work-entry{padding:0 8px;background:var(--ees-surface-sidebar);min-width:0;}
#ees-work-entry .ew-mode{display:flex;gap:2px;background:var(--ees-surface-muted);padding:3px;border-radius:7px;margin:0 0 10px;}
#ees-work-entry .ew-mode button{flex:1;border:0;padding:2px 8px;min-height:32px;font-size:12px;font-weight:400;background:transparent;color:var(--ees-text-secondary);}

#ees-work-entry .ew-nav-caption{margin:12px 4px 6px;font-size:12px;line-height:18px;color:var(--ees-text-tertiary);}
#ees-work-entry .ew-scope{display:grid;gap:0;margin:0 0 12px;}
#ees-work-entry .ew-scope-field{position:relative;min-width:0;}
#ees-work-entry [data-scope-trigger]{display:flex;gap:8px;align-items:center;width:100%;border:1px solid var(--ees-line-control);border-radius:6px;padding:8px 10px;min-height:38px;text-align:left;font-size:12px;line-height:20px;font-weight:500;background:var(--ees-surface-default);}
#ees-work-entry .ew-scope-field:not(:only-child):first-child [data-scope-trigger]{border-radius:6px 6px 0 0;}
#ees-work-entry .ew-scope-field:not(:only-child):last-child [data-scope-trigger]{border-radius:0 0 6px 6px;margin-top:-1px;}
#ees-work-entry [data-scope-trigger]>span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
#ees-work-entry [data-scope-trigger]>small{font-size:11px;line-height:20px;color:var(--ees-text-tertiary);}
#ees-work-entry [data-scope-trigger][aria-expanded=true]{border-color:var(--ees-brand-solid);box-shadow:var(--ees-focus-ring);}
#ees-work-entry .ew-scope-dropdown{position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:40;display:flex;flex-direction:column;max-height:360px;overflow:hidden;background:var(--ees-surface-default);border:1px solid var(--ees-line-control);border-radius:6px;box-shadow:0 4px 12px #1f20231a;}
#ees-work-entry [data-scope-list]{min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:4px;}
#ees-work-entry [data-scope-list]>button{display:flex;align-items:center;gap:8px;width:100%;min-height:52px;padding:8px;border:0;border-radius:4px;text-align:left;font-size:12px;font-weight:400;background:transparent;}
#ees-work-entry [data-scope-list]>button>span{flex:1;min-width:0;overflow-wrap:anywhere;}
#ees-work-entry [data-scope-list]>button small{display:block;color:var(--ees-text-tertiary);font-size:11px;line-height:16px;}
#ees-work-entry [data-scope-list]>button[aria-selected=true]{color:var(--ees-brand-text);background:var(--ees-surface-selected);}
#ees-work-entry [data-scope-list]>button:hover:not(:disabled){background:var(--ees-surface-hover);}
#ees-work-entry [data-scope-list]>button:disabled{color:var(--ees-text-tertiary);opacity:.5;cursor:not-allowed;}
#ees-work-entry [data-scope-list]>button:focus-visible{outline-offset:-2px;box-shadow:none;}
#ees-work-entry .ew-scope-search{display:flex;flex:none;align-items:center;gap:6px;padding:8px;border-bottom:1px solid var(--ees-line-divider);}
#ees-work-entry .ew-scope-search input{min-width:0;width:100%;font-size:12px;padding:5px 7px;}
#ees-work-entry .ew-scope-no-results{padding:12px 8px;font-size:12px;color:var(--ees-text-secondary);}
#ees-work-entry .ew-nav-links{display:grid;border-bottom:1px solid var(--ees-line-divider);padding-bottom:10px;}
#ees-work-entry .ew-nav-links button{display:flex;align-items:center;gap:10px;background:transparent;border:0;text-align:left;padding:7px 8px;font-size:12px;font-weight:400;}
#ees-work-entry .ew-nav-links button>span{flex:1;}
#ees-work-entry button[aria-current=page]{background:var(--ees-surface-selected);color:var(--ees-brand-text);}
#ees-work-entry .ew-workflows details{margin:4px 0;}
#ees-work-entry summary{display:flex;align-items:center;gap:8px;padding:6px 8px;cursor:pointer;list-style:none;font-size:12px;line-height:20px;}
#ees-work-entry summary::before{content:'›';color:var(--ees-text-tertiary);}
#ees-work-entry details[open]>summary::before{transform:rotate(90deg);}
#ees-work-entry .ew-workflows button{display:flex;align-items:center;width:100%;gap:6px;padding:7px 8px 7px 28px;border:0;background:transparent;font-size:12px;font-weight:400;text-align:left;}
#ees-work-entry .ew-workflows button>span:first-child{flex:1;}
#ees-work-entry .ew-workflows button[aria-current=page]{background:var(--ees-surface-selected);}
#ees-work-entry .ew-workflows .ew-status>span{display:none;}
/* Native chat remains the central flexible column; work is the right 480px panel. */
#ees-work-panel{position:relative;display:flex;flex-direction:column;flex:0 0 480px;width:480px;min-width:0;min-height:0;height:100%;border-left:1px solid var(--ees-line-divider);background:var(--ees-surface-panel);}
#ees-work-panel>.ew-panel-header{flex:none;display:flex;align-items:center;gap:8px;min-height:48px;padding:0 16px 0 20px;border-bottom:1px solid var(--ees-line-divider);font-size:14px;line-height:20px;}
#ees-work-panel>.ew-panel-header>span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;color:var(--ees-text-tertiary);}
#ees-work-panel .ew-icon-button{border:0;padding:4px 8px;min-height:28px;font-size:12px;font-weight:400;}
#ees-work-content{padding:16px 20px 24px;}
#ees-work-context{display:flex;align-items:center;gap:16px;flex:none;min-height:48px;padding:0 20px;border-bottom:1px solid var(--ees-line-divider);font-size:12px;line-height:18px;}
#ees-work-context>span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
#ees-work-context>div{display:flex;align-items:center;gap:6px;}
#ees-work-context button{font-size:12px;border:0;min-height:26px;padding:2px 6px;}
#ees-work-panel .ew-work-heading{margin:8px 0 16px;}
#ees-work-panel .ew-work-heading h2{margin:7px 0;}
#ees-work-panel .ew-work-heading p{font-size:12px;color:var(--ees-text-secondary);margin:6px 0;}
/* Shared right-panel tabs: work, authoring and future panels use this one rule.
 * Keep panel surface/tab appearance here; per-view rules may position content,
 * not redefine these colors, type or tab geometry. Factory selectors are separate. */
:is(#ees-work-panel,#ees-work-designer) :is(.ew-tabs,.ew-author-tabs){display:flex;gap:20px;margin:16px 0 0;padding:0;overflow-x:auto;border-bottom:1px solid var(--ees-line-divider);}
:is(#ees-work-panel,#ees-work-designer) :is(.ew-tabs,.ew-author-tabs)>button{position:relative;flex:none;border:0;border-radius:0;background:transparent;padding:6px 0 10px;min-height:36px;font-size:12px;line-height:18px;font-weight:400;white-space:nowrap;color:var(--ees-text-secondary);}
:is(#ees-work-panel,#ees-work-designer) :is(.ew-tabs,.ew-author-tabs)>button:is([aria-pressed=true],[aria-selected=true]){color:var(--ees-text-primary);font-weight:500;}
:is(#ees-work-panel,#ees-work-designer) :is(.ew-tabs,.ew-author-tabs)>button:is([aria-pressed=true],[aria-selected=true])::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:var(--ees-brand-solid);}
:is(#ees-work-panel,#ees-work-designer) :is(.ew-tabs,.ew-author-tabs)>button:disabled{background:transparent;color:var(--ees-text-tertiary);}
:is(#ees-work-panel,#ees-work-designer) :is(.ew-tabs,.ew-author-tabs)>button:focus-visible{outline-offset:-2px;box-shadow:none;}
#ees-work-panel section+section{margin-top:24px;}
#ees-work-panel h3 small{font-size:11px;color:var(--ees-text-tertiary);font-weight:400;}
#ees-work-inputs{margin:8px 0 20px;border:1px solid var(--ees-line-control);border-radius:6px;overflow:hidden;}
.ew-input-row{display:flex;align-items:flex-start;gap:10px;padding:9px 12px;font-size:12px;line-height:20px;font-weight:400;}
.ew-input-row+.ew-input-row{border-top:1px solid var(--ees-line-divider);}
.ew-input-row>span:first-child{width:110px;flex:none;color:var(--ees-text-secondary);padding-top:5px;}
.ew-input-control{display:flex;align-items:center;gap:6px;flex:1;min-width:0;flex-wrap:wrap;}
.ew-input-control>:is(input,select,textarea){width:100%;flex:1;min-width:0;}
.ew-input-control small{flex-basis:100%;font-size:11px;}
#ees-work-inputs>button{float:right;margin:8px 10px;}
#ees-work-inputs::after{content:'';display:block;clear:both;}
.ew-result{padding-top:8px;}

.ew-result-items{border:1px solid var(--ees-line-control);border-radius:6px;overflow:hidden;}

.ew-result-items article+article{border-top:1px solid var(--ees-line-divider);}

.ew-job-actions{position:sticky;bottom:-24px;margin:24px -20px -24px;padding:12px 20px;border-top:1px solid var(--ees-line-divider);background:var(--ees-surface-panel);display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap;}

.ew-facts>div{display:flex;gap:10px;border-bottom:1px solid var(--ees-line-divider);padding:8px 0;}

.ew-run-steps{border:1px solid var(--ees-line-divider);border-radius:6px;overflow:hidden;}

.ew-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;}
.ew-history{padding:12px 0;border-bottom:1px solid var(--ees-line-divider);font-size:12px;}

.ew-record{display:flex;flex-wrap:wrap;align-items:center;gap:8px;text-align:left;width:100%;margin:8px 0;padding:12px!important;}

.ew-record>small{width:100%;}

.ew-request-track > .ew-request-timeline > .ew-request-step {
  display: flex;

}

/* C13: new procedure examples use the existing authoring panel and tokens. */

.ew-author-list > button,.ew-author-job {display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:11px 14px;background:var(--ew-bg,#fff);border-radius:0;}
.ew-author-list > button+button,.ew-author-job+.ew-author-job {border-top:1px solid var(--ew-line,#e9e9ed);}
.ew-author-list > button:hover,.ew-author-job:hover {background:var(--ees-surface-hover);}
.ew-author-list .ew-author-row-main {flex:1;min-width:0;}
.ew-author-row-main strong {font-size:14px;font-weight:500;display:block;}
.ew-author-row-main small {display:block;font-size:12px;color:var(--ew-muted,#7a7e89);margin-top:3px;}
.ew-author-tag {display:inline-flex;align-items:center;border-radius:4px;background:var(--ees-surface-muted);padding:1px 6px;font-size:12px;line-height:16px;font-weight:500;letter-spacing:0;color:var(--ees-text-secondary);flex:none;}
.ew-author-tag[data-state=published],.ew-author-tag[data-state=approved] {color:#34755c;background:#eef7f1;}
.ew-author-tag[data-state=draft],.ew-author-tag[data-state=review_requested] {color:#96590c;background:#faf1e4;}
.ew-author-factories {display:flex;gap:16px;border-bottom:1px solid var(--ew-line,#e9e9ed);margin:14px 0;overflow-x:auto;}
.ew-author-factories > button {padding:7px 0;background:transparent;border:0;border-radius:0;border-bottom:2px solid transparent;font-size:12px;white-space:nowrap;color:var(--ew-muted,#7a7e89);}
.ew-author-factories > button[aria-selected=true] {color:var(--ew-ink,#3f4147);border-bottom-color:var(--ew-blue,#2f5f98);}
.ew-author-stage {border:1px solid var(--ew-line,#e9e9ed);border-radius:6px;margin:12px 0;overflow:hidden;}
.ew-author-stage > header {display:flex;gap:9px;align-items:center;background:var(--ew-soft,#f8f8fa);padding:8px 12px;font-size:13px;}
.ew-author-stage > header button {flex:1;text-align:left;padding:0;background:transparent;}
.ew-author-stage-number {display:flex;align-items:center;justify-content:center;flex:none;width:19px;height:19px;border:1px solid var(--ew-line,#dfe0e5);border-radius:50%;font-size:11px;color:var(--ew-muted,#7a7e89);background:var(--ew-bg,#fff);}
.ew-author-job {padding:9px 12px;font-size:13px;}
.ew-author-job > span {flex:1;min-width:0;}
.ew-author-fields {display:grid;gap:10px;margin:14px 0;}
.ew-author-fields > label,.ew-author label {display:grid;grid-template-columns:minmax(0,1fr);gap:6px;font-size:12px;font-weight:400;margin:0;min-width:0;}
.ew-author input:not([type=checkbox]),.ew-author select,.ew-author textarea {display:block;box-sizing:border-box;width:100%;min-width:0;max-width:100%;border:1px solid var(--ew-line,#d5d6da);border-radius:5px;background:var(--ew-bg,#fff);padding:7px 9px;font-size:13px;}
.ew-author textarea {min-height:80px;resize:vertical;}
.ew-author .ew-author-inline {display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.ew-author label.ew-author-inline {grid-template-columns:none;line-height:20px;}
.ew-author input[type=checkbox] {width:14px;height:14px;flex:none;}
.ew-author .ew-author-inline label {display:flex;flex-direction:row;align-items:center;gap:6px;}
.ew-author fieldset {border:0;padding:14px 0;margin:8px 0;border-top:1px solid var(--ew-line,#e9e9ed);min-width:0;}
.ew-author legend {padding:0;font-size:13px;font-weight:600;}
.ew-author table {width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--ew-line,#e9e9ed);border-radius:6px;margin:10px 0;font-size:12px;overflow:hidden;}
.ew-author th {background:var(--ew-soft,#f8f8fa);color:var(--ew-muted,#7a7e89);font-weight:400;text-align:left;}
.ew-author th,.ew-author td {padding:7px 9px;border-bottom:1px solid var(--ew-line,#e9e9ed);vertical-align:top;overflow-wrap:anywhere;}
.ew-author tr:last-child td {border-bottom:0;}
.ew-author td button {padding:0;background:transparent;color:var(--ew-blue,#2f5f98);font-size:12px;}
.ew-author .ew-author-note {padding:10px 12px;background:#edf3fa;border-radius:5px;color:#376497;margin:12px 0;font-size:12px;}
.ew-author .ew-author-warning {padding:10px 12px;border:1px solid #ead5b9;background:#fff9f0;color:#895317;border-radius:5px;margin:12px 0;font-size:12px;}
.ew-author .ew-author-error {padding:10px 12px;background:#fff2f1;color:#a5352d;border-radius:5px;margin:12px 0;font-size:12px;}
.ew-author .ew-author-empty {padding:30px 10px;text-align:center;color:var(--ew-muted,#7a7e89);}
.ew-author footer {display:flex;align-items:center;justify-content:flex-end;gap:8px;flex:none;padding:12px 20px;border-top:1px solid var(--ew-line,#e9e9ed);background:var(--ees-surface-panel);}
.ew-author footer > small {margin-right:auto;color:var(--ew-muted,#7a7e89);font-size:11px;}
.ew-author footer button,.ew-author .ew-author-heading button {border:1px solid var(--ew-line,#d5d6da);border-radius:6px;padding:5px 12px;background:var(--ew-bg,#fff);font-size:13px;}
.ew-author footer .ew-primary {background:var(--ew-blue,#2f5f98);border-color:var(--ew-blue,#2f5f98);color:#fff;}
.ew-author .ew-author-link {padding:3px 0;background:transparent;color:var(--ew-blue,#2f5f98);font-size:12px;}
.ew-author pre {white-space:pre-wrap;font-size:11px;max-height:360px;overflow:auto;}
.ew-author details {font-size:12px;margin:10px 0;}
.ew-author summary {cursor:pointer;color:var(--ew-blue,#2f5f98);padding:5px 0;}
#ees-work-entry summary>span:first-of-type{flex:1;}
#ees-work-entry details[open] .ew-category-auto{display:none;}
.ew-auto-status{display:inline-flex;align-items:center;flex:none;}
.ew-auto-status[data-status=running]>.ew-icon{animation:ew-running 1s linear infinite;}
@media(prefers-reduced-motion:reduce){.ew-auto-status>.ew-icon{animation:none!important;}}
.ew-amend-row{border:1px solid var(--ees-line-divider);padding:12px;border-radius:6px;margin:10px 0;display:grid;gap:8px;}
.ew-amend-row>label,#ees-work-dialog:has(#ees-start-version) label{display:flex;align-items:center;gap:8px;margin:8px 0;}
.ew-amend-row input{flex:1;min-width:0;}

/* Native dialog reset omits browser centering; explicit geometry and cancel focus. */
#ees-work-dialog{inset:0;margin:auto;}
#ees-work-dialog [data-dialog-close]:focus{outline:2px solid var(--ees-brand-text);outline-offset:2px;box-shadow:var(--ees-focus-ring);}
.ew-option-source{display:block;overflow-wrap:anywhere;}
#ees-work-entry .ew-nav-links button,#ees-work-entry .ew-workflows button,#ees-work-entry summary{font-size:14px;}

.ew-stage{margin:16px 0;}
.ew-stage>header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:10px 0;}
.ew-stage>header button{font-size:12px;min-height:30px;padding:3px 8px;}
.ew-scope-execution{display:grid;justify-items:start;gap:8px;margin-top:18px;}

.ew-scope-status{background:var(--ees-surface-sidebar);border:1px solid var(--ees-line-divider);border-radius:6px;padding:12px;margin:12px 0;}
.ew-scope-status p{margin-top:8px!important;}

.ew-export-actions{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 16px;}
.ew-export-actions button{font-size:12px;}
.ew-legacy{border-top:1px solid var(--ees-line-divider);padding-top:20px;margin-top:20px;}


#ees-work-entry .ew-recent button{padding-left:8px;}
#ees-work-entry .ew-native-management{border-top:1px solid var(--ees-line-divider);margin-top:16px;padding-top:12px;display:grid;gap:4px;}
#ees-work-entry .ew-native-management button{border:0;background:transparent;text-align:left;font-size:12px;color:var(--ees-text-tertiary);font-weight:400;}
/* Workspace assets: approved menu mockup, 2026-11-06. */
#ees-work-entry .ew-nav-group{margin:0;padding:0;min-width:0;}
#ees-work-entry .ew-nav-group-title{margin:0;padding:4px 8px 6px;font-size:12px;line-height:16px;font-weight:500;color:var(--ees-text-tertiary);}
#ees-work-entry .ew-nav-group+.ew-nav-group .ew-nav-group-title{padding-top:14px;}
#ees-work-entry .ew-nav-group .ew-nav-links{gap:1px;border:0;padding:0;}
#ees-work-entry .ew-nav-group .ew-nav-button{width:100%;min-height:36px;gap:10px;border-radius:6px;padding:7px 8px;font-size:14px;line-height:22px;color:var(--ees-text-strong);}
#ees-work-entry .ew-nav-group .ew-nav-button>.ew-icon{flex:0 0 16px;width:16px;height:16px;}
#ees-work-entry .ew-nav-group .ew-nav-label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
#ees-work-entry .ew-nav-group .ew-nav-native-name{flex:none;font-size:12px;line-height:18px;font-weight:400;color:var(--ees-text-tertiary);white-space:nowrap;}
#ees-work-entry .ew-nav-group .ew-nav-button[aria-current=page]{background:var(--ees-surface-selected);color:var(--ees-brand-text);font-weight:500;}
#ees-work-entry .ew-procedure-link{border:0;padding:0;margin:8px 0 12px;}
#ees-work-entry .ew-procedure-link .ew-nav-button,#ees-work-entry .ew-assets-group .ew-nav-button{min-height:40px;padding:9px 12px;gap:12px;font-size:14px;line-height:22px;}
#ees-work-entry .ew-procedure-link .ew-icon{width:16px;height:16px;flex:none;}
#ees-work-entry .ew-assets-group{margin-bottom:20px;}
#ees-work-entry .ew-assets-toggle{display:flex;align-items:center;gap:8px;width:100%;height:36px;min-height:36px;padding:8px 12px;border:0;border-radius:7px;background:var(--ees-surface-muted);font-size:13px;line-height:20px;font-weight:500;text-align:left;}
#ees-work-entry .ew-assets-toggle>span{flex:1;min-width:0;overflow:hidden;white-space:nowrap;}
#ees-work-entry .ew-assets-toggle>.ew-icon{width:14px;height:14px;flex:none;transition:transform var(--ees-motion-open) var(--ees-motion-open-easing);}
#ees-work-entry .ew-assets-toggle[aria-expanded=false]>.ew-icon{transform:rotate(-90deg);}
#ees-work-entry .ew-assets-group .ew-nav-links{padding:0 0 0 16px;gap:2px;}
#ees-work-entry .ew-assets-group .ew-nav-button:first-child{margin-top:4px;}
#ees-work-entry .ew-assets-group+.ew-nav-caption{margin:0 -8px 6px;padding:12px 12px 0;border-top:1px solid var(--ees-line-divider);height:auto;}
[data-ees-source-sidebar][data-compact=true] #ees-work-entry .ew-assets-toggle{padding:8px;justify-content:center;gap:0;}
[data-ees-source-sidebar][data-compact=true] #ees-work-entry .ew-assets-toggle>span{display:none;}
.ees-settings-entry{flex:none;padding:8px 12px 16px;}
.ees-settings-trigger{display:flex;align-items:center;gap:12px;min-height:40px;width:100%;padding:10px 12px;border-radius:6px;font-size:13px;line-height:20px;text-align:left;}
.ees-settings-trigger:hover,.ees-settings-trigger[aria-expanded=true],.ees-settings-trigger[aria-current=page]{background:var(--ees-surface-selected);}
.ees-settings-trigger>.ew-icon{width:16px;height:16px;flex:none;}
[data-ees-source-sidebar][data-compact=true] .ees-settings-entry{padding:8px;}
[data-ees-source-sidebar][data-compact=true] .ees-settings-trigger{padding:10px;gap:0;justify-content:center;}
[data-ees-source-sidebar][data-compact=true] .ees-settings-trigger>span{display:none;}
.ees-assets-popover{z-index:1000;width:min(420px,calc(100vw - 24px));padding:8px;background:var(--ees-surface-default);border:1px solid var(--ees-line-control);border-radius:10px;box-shadow:0 4px 16px #1f202312;color:var(--ees-text-primary);font-family:var(--ees-font);font-size:14px;line-height:22px;}
.ees-assets-popover h2{margin:8px 12px;font-size:13px;line-height:20px;font-weight:600;}
.ees-settings-popover{width:min(300px,calc(100vw - 24px));}
.ees-asset-row{display:flex;align-items:center;gap:12px;min-height:58px;width:100%;padding:8px 12px;border-radius:6px;text-align:left;}
.ees-asset-row:hover,.ees-asset-row:focus-visible,.ees-asset-row[aria-current=page]{background:var(--ees-surface-selected);}
.ees-asset-row>.ew-icon{width:16px;height:16px;flex:none;}
.ees-asset-row>span{flex:1;min-width:0;}
.ees-asset-row strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;line-height:22px;font-weight:500;}
.ees-asset-row small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px;font-size:12px;line-height:18px;color:var(--ees-text-secondary);}
.ees-settings-popover .ees-asset-row+.ees-asset-row{border-top:1px solid var(--ees-line-divider);border-radius:0;}
.ees-prompts-trigger{display:flex;align-items:center;gap:6px;flex:none;height:28px;margin:0 6px;padding:5px 8px;border-radius:5px;font-size:12px;line-height:18px;white-space:nowrap;color:var(--ees-text-secondary);}
.ees-prompts-trigger:hover,.ees-prompts-trigger[aria-expanded=true]{background:var(--ees-surface-selected);color:var(--ees-brand-text);}
.ees-prompts-trigger>.ew-icon{width:14px;height:14px;flex:none;}
.ees-prompts-trigger>.ew-icon:last-child{width:12px;height:12px;}
.ees-prompts-search{display:block;width:100%;height:34px;min-height:34px;margin:0 0 8px;padding:8px 12px;border:1px solid var(--ees-line-divider);border-radius:6px;background:var(--ees-surface-sidebar);font-size:12px;line-height:18px;}
.ees-prompts-list{max-height:min(300px,45dvh);overflow-y:auto;overscroll-behavior:contain;}
.ees-prompts-list>p{padding:12px;font-size:13px;color:var(--ees-text-secondary);}
.ees-prompts-list>p>button{color:var(--ees-brand-text);text-decoration:underline;}
.ees-prompts-popover footer{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:4px;padding:8px 12px;border-top:1px solid var(--ees-line-divider);}
.ees-prompts-popover footer button{display:flex;align-items:center;gap:6px;min-height:26px;font-size:12px;line-height:18px;color:var(--ees-text-secondary);}
.ees-prompts-popover footer button:first-child{color:var(--ees-brand-text);}
.ees-prompts-popover footer button:disabled{opacity:.45;cursor:not-allowed;}
.ees-prompts-popover footer .ew-icon{width:14px;height:14px;}
.ees-settings-trigger:focus-visible,.ees-prompts-trigger:focus-visible,.ees-assets-popover :is(button,input):focus-visible{outline:2px solid var(--ees-brand-solid);outline-offset:-2px;}
@media(max-width:480px){.ees-prompts-trigger>span,.ees-prompts-trigger>.ew-icon:last-child{display:none}.ees-prompts-trigger{margin-inline:2px;padding:6px;}}

/* Exactly one 20px gutter around the 760px Native empty composer. */

.ew-admin-grants{border:1px solid var(--ees-line-divider);padding:14px;margin-top:16px;display:grid;gap:8px;}
.ew-admin-grants label{display:flex;align-items:center;gap:8px;font-size:12px;overflow-wrap:anywhere;}

.ew-input-proposal{display:grid;gap:8px;margin:12px 0;}
.ew-input-proposal button{justify-self:start;}
.ew-proposal-prompt{display:grid;gap:8px;}

.ees-work-message-reference{margin:10px 0;background:transparent!important;}
.ees-work-message-reference button{display:inline-flex;align-items:center;gap:6px;min-height:28px;font-size:12px;font-weight:400;color:var(--ees-brand-text);border-color:var(--ees-line-control);padding:3px 8px;}

/* Mutable Figma A5–A7, B2-1 and S1/S2 share the C1 status and layout tokens. */
[data-ees-work]{--ees-status-success:#2a744c;--ees-status-success-bg:#eaf4ee;--ees-status-attention:#96590c;--ees-status-attention-bg:#faf1e4;--ees-status-danger:#bf3a2b;--ees-status-danger-bg:#fbedeb;}
[data-ees-work] .ew-status[data-status=completed]{color:var(--ees-status-success);}
[data-ees-work] .ew-status[data-status=failed]{color:var(--ees-status-danger);}
[data-ees-work] .ew-status:is([data-status=unknown],[data-status=partial],[data-status=missed]){color:var(--ees-status-attention);}
[data-ees-work] .ew-tag,[data-ees-work] .ew-actor{display:inline-flex;align-items:center;flex:none;gap:4px;padding:1px 6px;border-radius:4px;background:var(--ees-surface-muted);color:var(--ees-text-strong);font-size:12px;line-height:16px;font-weight:500;}
[data-ees-work] .ew-tag[data-tone=brand],[data-ees-work] .ew-actor[data-actor='EES Work']{background:var(--ees-surface-selected);color:var(--ees-brand-text);}
[data-ees-work] .ew-tag[data-tone=success]{background:var(--ees-status-success-bg);color:var(--ees-status-success);}
[data-ees-work] .ew-tag[data-tone=attention],[data-ees-work] .ew-changed-value{background:var(--ees-status-attention-bg);color:var(--ees-status-attention);}
[data-ees-work] .ew-tag[data-tone=danger]{background:var(--ees-status-danger-bg);color:var(--ees-status-danger);}
[data-ees-work] .ew-changed-value{display:inline-block;flex:none;padding:1px 6px;border-radius:4px;font-size:12px;line-height:16px;font-weight:500;}
[data-ees-work] .ew-cycle-bar{display:flex;align-items:center;gap:8px;min-height:38px;padding:9px 12px 9px 20px;background:var(--ees-surface-sidebar);border-bottom:1px solid var(--ees-line-divider);font-size:12px;line-height:18px;}
#ees-work-content>.ew-cycle-bar:first-child{margin:-16px -20px 16px;}
.ew-cycle-bar>label,.ew-cycle-bar>span:first-child{flex:none;color:var(--ees-text-tertiary);font-weight:500;}
.ew-cycle-bar>strong{min-width:0;overflow-wrap:anywhere;font-size:14px;line-height:22px;font-weight:500;}
.ew-cycle-bar>small{min-width:0;color:var(--ees-text-secondary);}
[data-ees-work] .ew-cycle-bar>button{display:inline-flex;align-items:center;gap:4px;flex:none;margin-left:auto;border:0;min-height:22px;padding:0;background:transparent;color:var(--ees-brand-text);font-size:12px;font-weight:400;}
.ew-phase-overview{border:1px solid var(--ees-line-divider);border-radius:8px;overflow:hidden;margin:12px 0;}
#ees-work-panel .ew-phase-overview+section.ew-phase-overview{margin-top:12px;}
.ew-phase-heading{display:flex;align-items:center;gap:8px;min-height:38px;padding:8px 12px;background:var(--ees-surface-sidebar);border-bottom:1px solid var(--ees-line-divider);}
.ew-phase-heading>span:first-child{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;flex:none;border:1px solid var(--ees-line-control);border-radius:50%;font-size:11px;color:var(--ees-text-secondary);font-weight:400;}
.ew-phase-heading>h3{flex:1;min-width:0;font-size:14px;line-height:20px;}
.ew-phase-heading>.ew-status{margin-left:auto;}
.ew-phase-overview>.ew-run-steps{border:0;border-radius:0;}
.ew-phase-overview>button{margin:8px 12px;font-size:12px;}
[data-ees-work] .ew-phase-job{display:flex;align-items:center;gap:8px;width:100%;min-height:40px;border:0;border-radius:0;padding:9px 10px 9px 12px;text-align:left;background:var(--ees-surface-default);font-size:14px;line-height:22px;font-weight:400;}
.ew-phase-job+.ew-phase-job{border-top:1px solid var(--ees-line-divider);}
[data-ees-work] .ew-phase-job[aria-current=step],[data-ees-work] .ew-phase-job[aria-pressed=true]{background:var(--ees-surface-selected);}
.ew-phase-job>.ew-status{flex:0 1 auto;min-width:0;font-size:14px;line-height:22px;}
.ew-phase-job>.ew-status>span{min-width:0;overflow-wrap:anywhere;}
.ew-phase-job>.ew-job-actor{display:inline-flex;align-items:center;flex:none;}
.ew-phase-job>small{margin-left:auto;max-width:140px;font-size:12px;line-height:18px;color:var(--ees-text-secondary);overflow-wrap:anywhere;}
.ew-next-action{display:flex;align-items:center;justify-content:flex-end;gap:10px;flex-wrap:wrap;padding:12px 0;margin-top:16px;border-top:1px solid var(--ees-line-divider);}
.ew-next-action>small{flex:1;min-width:120px;}
.ew-list-confirm{display:grid;gap:8px;margin-top:14px;}
.ew-list-toolbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.ew-list-toolbar>h3{font-size:14px;line-height:20px;}
.ew-list-toolbar>small{color:var(--ees-text-tertiary);}
.ew-list-table{width:100%;border:1px solid var(--ees-line-divider);border-radius:6px;border-collapse:separate;border-spacing:0;overflow:hidden;font-size:12px;line-height:18px;}
.ew-list-table th{background:var(--ees-surface-sidebar);color:var(--ees-text-tertiary);text-align:left;font-weight:500;}
.ew-list-table th,.ew-list-table td{padding:8px 10px;vertical-align:middle;border-bottom:1px solid var(--ees-line-divider);overflow-wrap:anywhere;}
.ew-list-table tr:last-child td{border-bottom:0;}
.ew-list-table th:first-child,.ew-list-table td:first-child{width:34px;padding-right:0;}
.ew-list-table th:nth-child(2),.ew-list-table td:nth-child(2){width:72px;}
.ew-list-table td:nth-child(3){font-size:14px;line-height:22px;}
.ew-list-table th:last-child,.ew-list-table td:last-child{width:86px;color:var(--ees-text-secondary);}
.ew-list-table input[type=checkbox]{margin:0;vertical-align:middle;}
.ew-list-candidate td:nth-child(3)>small{display:block;color:var(--ees-status-attention);}
.ew-list-table td>small{display:block;}
.ew-list-table td>.ew-badge{margin-top:4px;}
.ew-list-confirm>h4{margin:4px 0 0;font-size:12px;line-height:16px;font-weight:500;color:var(--ees-text-strong);}
.ew-list-toolbar>button{margin-left:auto;}
.ew-list-confirm>button{justify-self:start;display:inline-flex;align-items:center;gap:6px;}
.ew-query-summary{display:grid;gap:3px;padding:9px 12px;border-radius:6px;background:var(--ees-surface-sidebar);}
.ew-query-summary>header{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.ew-query-summary h4{display:flex;align-items:center;gap:6px;margin:0;color:var(--ees-text-strong);font-size:12px;line-height:16px;font-weight:500;}
.ew-query-summary header>small{color:var(--ees-text-tertiary);}
.ew-query-summary header>button{margin-left:auto;}
.ew-query-summary>p{color:var(--ees-text-secondary);font-size:12px;line-height:18px;overflow-wrap:anywhere;}
#ees-work-panel .ew-query-summary+section{margin-top:14px;}
[data-ees-work] .ew-notice{display:grid;gap:4px;padding:12px;border-radius:6px;background:var(--ees-surface-sidebar);font-size:12px;line-height:18px;overflow-wrap:anywhere;}
[data-ees-work] .ew-notice[data-tone=attention]{background:var(--ees-status-attention-bg);}
[data-ees-work] .ew-notice[data-tone=danger]{background:var(--ees-status-danger-bg);}
.ew-notice>strong,.ew-notice>h3{font-size:14px;line-height:20px;color:var(--ees-text-primary);}
.ew-notice>p{color:var(--ees-text-secondary);font-size:12px;line-height:18px;}
.ew-notice>button{justify-self:end;}
.ew-dispatch-draft{display:grid;gap:14px;}
.ew-dispatch-draft>header,.ew-draft-summary{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.ew-dispatch-draft>header>h3{margin-right:auto;}
.ew-dispatch-draft>label{display:grid;gap:6px;font-size:12px;line-height:18px;}
.ew-dispatch-draft>label>textarea{min-height:200px;font-size:14px;line-height:22px;}
.ew-dispatch-draft .ew-review-text>textarea{padding:12px 14px 14px;border-radius:6px;}
.ew-draft-summary{font-size:12px;line-height:18px;}
.ew-draft-summary>h4{margin:0;font-size:14px;line-height:20px;font-weight:700;}
.ew-draft-summary>small{color:var(--ees-text-tertiary);}
.ew-draft-actions{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap;}
.ew-draft-actions>p{flex:1;min-width:120px;color:var(--ees-status-attention);font-size:12px;line-height:18px;}
.ew-history-values{border:1px solid var(--ees-line-divider);border-radius:6px;overflow:hidden;margin:0;font-size:14px;line-height:22px;}
.ew-history-values>div{display:flex;align-items:flex-start;gap:10px;padding:7px 10px;}
.ew-history-values>div+div{border-top:1px solid var(--ees-line-divider);}
.ew-history-values dt{flex:0 0 84px;padding-top:2px;color:var(--ees-text-secondary);font-size:12px;line-height:18px;overflow-wrap:anywhere;}
.ew-history-values dd{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin:0;min-width:0;flex:1;overflow-wrap:anywhere;}
.ew-history-values dd>.ew-changed-value{margin-left:auto;}
.ew-history-values dd>small{flex-basis:100%;color:var(--ees-text-tertiary);}
.ew-record-filter{display:flex;align-items:center;gap:0;margin:12px 0;font-size:12px;}
.ew-record-filter>strong{min-width:0;padding:2px 4px 2px 8px;border-radius:4px 0 0 4px;background:var(--ees-surface-selected);color:var(--ees-brand-text);font-size:12px;line-height:16px;font-weight:500;overflow-wrap:anywhere;}
[data-ees-work] .ew-record-filter>button{display:inline-flex;align-items:center;justify-content:center;min-height:20px;padding:2px 4px;border:0;border-radius:0 4px 4px 0;background:var(--ees-surface-selected);}
.ew-history>section{margin-top:12px;}
.ew-history>section>h4{margin:0 0 6px;font-size:14px;line-height:22px;font-weight:500;}
.ew-review-history{border-top:1px solid var(--ees-line-divider);padding-top:12px;}
.ew-review-history>p{color:var(--ees-text-secondary);font-size:12px;line-height:18px;}
/* Schedule fields keep native controls and focus; one border describes each row. */
.ew-author .ew-schedule-card{display:grid;gap:18px;padding:18px 20px 20px;border:1px solid var(--ees-line-control);border-radius:8px;background:var(--ees-surface-panel);}
.ew-author .ew-schedule-card h3{margin:0;font-size:14px;line-height:20px;}
.ew-author .ew-schedule-section{display:grid;gap:8px;min-width:0;}
.ew-author .ew-schedule-section+section{margin-top:0;}
.ew-author .ew-schedule-modes{display:inline-flex;align-items:center;justify-self:start;gap:2px;padding:2px;border-radius:6px;background:var(--ees-surface-muted);}
.ew-author .ew-schedule-modes>button{border:0;border-radius:4px;min-height:32px;padding:5px 16px;background:transparent;color:var(--ees-text-secondary);font-size:14px;line-height:22px;font-weight:400;}
.ew-author .ew-schedule-modes>button[aria-pressed=true]{background:var(--ees-surface-default);color:var(--ees-text-primary);font-weight:500;}
.ew-author .ew-schedule-row{display:flex;align-items:center;gap:12px;min-height:38px;padding:7px 10px 7px 12px;border:1px solid var(--ees-line-divider);border-radius:6px;font-size:14px;line-height:22px;}
.ew-author .ew-schedule-row>span:first-child{flex:0 0 132px;min-width:0;color:var(--ees-text-secondary);overflow-wrap:anywhere;}
.ew-author .ew-schedule-control{display:flex;align-items:center;gap:8px;min-width:0;flex:1;}
.ew-author .ew-schedule-control>:is(input,select){width:100%;min-width:0;border:0;border-radius:3px;padding:0;background:transparent;min-height:22px;font-size:14px;line-height:22px;font-weight:500;}
.ew-author .ew-schedule-control:has(>.ew-icon)>select{appearance:none;}
.ew-author .ew-schedule-control>.ew-icon{pointer-events:none;}
.ew-author .ew-schedule-repeat{display:flex;align-items:center;gap:6px;min-width:0;flex:1;}
.ew-author .ew-schedule-repeat>input{flex:0 1 54px;width:54px;min-width:36px;}
.ew-author .ew-schedule-repeat>select{flex:1;min-width:0;}
.ew-author .ew-schedule-offsets{display:flex;gap:8px;}
.ew-author .ew-schedule-offsets>input{flex:1;min-width:0;}
.ew-author .ew-schedule-preview{display:grid;gap:4px;padding:10px 12px;border-radius:6px;background:var(--ees-surface-sidebar);}
.ew-author .ew-schedule-preview>h4{display:flex;align-items:center;gap:6px;margin:0;color:var(--ees-text-strong);font-size:12px;line-height:16px;font-weight:500;}
.ew-author .ew-schedule-preview>p{font-size:14px;line-height:22px;overflow-wrap:anywhere;}
.ew-author .ew-schedule-note{font-size:12px;line-height:18px;color:var(--ees-text-secondary);}
.ew-author .ew-schedule-preview>.ew-schedule-note{font-size:12px;line-height:18px;}
@media(max-width:1199px){.ew-author .ew-schedule-card{padding-inline:12px;}.ew-author .ew-schedule-row>span:first-child{flex-basis:100px;}.ew-cycle-bar{flex-wrap:wrap;}.ew-cycle-bar>small{order:1;flex-basis:100%;}}
@media(max-width:600px){#ees-work-content>.ew-cycle-bar:first-child{margin:-12px -16px 12px;padding-inline:16px;}.ew-author .ew-schedule-row{align-items:flex-start;flex-wrap:wrap;}.ew-author .ew-schedule-row>span:first-child{flex-basis:100%;}.ew-author .ew-schedule-control{flex-basis:100%;}.ew-list-table th,.ew-list-table td{padding-inline:6px;}.ew-history-values dt{flex-basis:76px;}}

/* Q1 · fixed navigation, private panel sizing and readable Native conversation.
   Default-width viewport overlay; drag-induced <560 is a separate decision. */
#ees-work-entry .ew-mode .ew-icon{display:none;}
[data-ees-source-sidebar][data-compact=true] #ees-work-entry .ew-mode .ew-icon{display:inline-block;}
#ees-work-panel{flex-basis:var(--ees-panel-width,480px);width:var(--ees-panel-width,480px);}
#ees-work-panel>[data-ees-panel-resize]{position:absolute;left:-4px;top:0;bottom:0;width:8px;cursor:col-resize;touch-action:none;z-index:46;background:transparent;}
#ees-work-panel>[data-ees-panel-resize]:focus-visible{outline:2px solid var(--ees-brand-text);outline-offset:-2px;}
#ees-work-panel>[data-ees-panel-resize]:hover{background:#2f5f981a;}
body.ees-panel-resizing{cursor:col-resize;user-select:none;}
#ees-work-panel>:is(.ew-job-actions,.ew-next-action){position:static;flex:none;bottom:auto;margin:0;padding:12px 20px;max-height:40%;overflow:auto;background:var(--ees-surface-panel);}
#ees-work-panel>.ew-job-actions>p{margin:0;}
/* Tertiary text on the selected background needs the stronger secondary tone. */
[data-ees-work] :is(.ew-notice,.ew-tag[data-tone=brand],.ew-input-proposal) small{color:var(--ees-text-secondary);}
#ees-work-panel[data-ees-overlay=true]{position:absolute;z-index:45;inset:0 0 0 auto;width:min(var(--ees-panel-width,480px),100%);max-width:100%;box-shadow:-4px 0 12px #1118270d;}
/* C08-C12 author review and common runtime blocks. */
.ew-author .ew-author-rule-card{padding:14px;border:1px solid var(--ees-line-divider);border-radius:6px;margin:12px 0;display:grid;gap:10px;}
.ew-author .ew-author-rule-card>select{font-size:14px;}
.ew-author .ew-author-judgments{table-layout:fixed;margin:0;}
.ew-author .ew-author-judgments th,.ew-author .ew-author-judgments td{padding:9px 10px;vertical-align:top;overflow-wrap:anywhere;}
.ew-author .ew-author-judgments th:nth-child(1){width:27%;}.ew-author .ew-author-judgments th:nth-child(2){width:27%;}
.ew-author .ew-author-judgments .ew-status{display:inline-flex;gap:5px;font-size:12px;}
.ew-author .ew-author-rule-list{list-style:none;margin:0;padding:0;}
.ew-author .ew-author-rule-list>li{display:flex;align-items:flex-start;gap:8px;padding:10px 0;border-bottom:1px solid var(--ees-line-divider);font-size:12px;line-height:18px;}
.ew-author .ew-author-rule-list>li>span:first-child{color:var(--ees-text-secondary);flex:none;}
.ew-author .ew-author-rule-list>li>span:nth-child(2){flex:1;min-width:0;overflow-wrap:anywhere;}
.ew-author .ew-author-rule-list>li>button{flex:none;font-size:12px;padding:0 6px;}
.ew-author .ew-author-rule-policy{font-size:12px;line-height:20px;color:var(--ees-text-secondary);}
.ew-author .ew-author-validation>details{border:1px solid var(--ees-line-divider);border-radius:6px;margin:12px 0;overflow:hidden;}
.ew-author .ew-author-validation>details>summary{padding:10px 12px;background:var(--ees-surface-sidebar);font-size:14px;font-weight:500;cursor:pointer;}
.ew-author .ew-author-validation-row{display:flex;gap:10px;align-items:center;padding:12px;border-top:1px solid var(--ees-line-divider);font-size:12px;line-height:18px;}
.ew-author .ew-author-validation-row>span{display:flex;align-items:flex-start;gap:8px;flex:1;min-width:0;}
.ew-author .ew-author-validation-row>span>span{display:grid;gap:4px;min-width:0;overflow-wrap:anywhere;}
.ew-author .ew-author-validation-row>span small{color:var(--ees-text-secondary);}
.ew-author .ew-author-validation-row>button{flex:none;padding:2px 6px;font-size:12px;}
.ew-author .ew-author-validation-summary{display:grid;gap:6px;margin:16px 0;font-size:12px;line-height:18px;}
.ew-adhoc-start{border:1px solid var(--ees-line-control);border-radius:6px;overflow:hidden;margin:16px 0;}
.ew-adhoc-start>.ew-actions{padding:0 12px 12px;}
.ew-active-runs{display:grid;gap:8px;margin:12px 0 20px;}
.ew-active-runs .ew-record{margin:0;}
.ew-start-preview{font-size:12px;line-height:18px;background:var(--ees-surface-sidebar);padding:10px 12px;color:var(--ees-text-secondary);}
.ew-check-block{margin:12px 0;}

.ew-check-item>header{display:flex;align-items:center;gap:8px;justify-content:space-between;font-size:12px;}
.ew-check-evidence{padding:8px 10px;border-radius:4px;background:var(--ees-surface-sidebar);font-size:12px;line-height:18px;color:var(--ees-text-secondary);}
.ew-check-evidence summary{cursor:pointer;}
.ees-work-message-reference button>span{display:grid;gap:2px;text-align:left;}
.ees-work-message-reference button small{display:block;font-size:11px;line-height:16px;color:var(--ees-text-secondary);}

.ew-check-evidence>p{margin-top:6px;font-size:12px;line-height:18px;}
.ew-author footer{flex-wrap:wrap;}
.ew-author footer>button{flex-shrink:0;}

.ew-author .ew-author-validation>.ew-author-heading{align-items:flex-start;flex-wrap:wrap;gap:4px 12px;}
.ew-author .ew-author-validation>.ew-author-heading>small{font-size:12px;line-height:18px;align-self:center;}
.ew-author .ew-author-validation>details>ul{list-style:none;margin:0;padding:8px 12px;}
.ew-author .ew-author-validation>details>ul>li{padding:5px 0;font-size:12px;line-height:18px;}

/* Shared-help authoring: sections follow the C13 workshop tool forms. */
.ew-author .ew-tool-section{display:grid;gap:8px;border-top:1px solid var(--ees-line-divider);padding-top:14px;margin-top:18px;}
.ew-author .ew-tool-section h3{margin:0;font-size:14px;line-height:20px;font-weight:700;}
.ew-author .ew-tool-section .ew-author-heading{margin:0;align-items:center;gap:8px;}
.ew-author .ew-tool-choices{border:1px solid var(--ees-line-control);border-radius:6px;overflow:hidden;}
.ew-author .ew-tool-choices>button{display:flex;width:100%;height:auto;min-height:54px;align-items:center;gap:10px;padding:12px;text-align:left;border:0;border-radius:0;background:var(--ees-surface-default);}
.ew-author .ew-tool-choices>button+button{border-top:1px solid var(--ees-line-divider);}
.ew-author .ew-tool-choices>button:hover{background:var(--ees-surface-hover);}
.ew-author .ew-tool-choices>button>span:first-child{display:grid;flex:1;min-width:0;gap:4px;overflow-wrap:anywhere;}
.ew-author .ew-tool-choices strong{font-weight:500;font-size:14px;line-height:22px;}
.ew-author .ew-tool-choices small{font-size:12px;line-height:18px;color:var(--ees-text-secondary);}
.ew-author .ew-tool-choices>button>img{width:16px;height:16px;flex:none;}
.ew-author .ew-tool-connection{font-size:12px;line-height:18px;flex:none;color:var(--ees-text-secondary);}
.ew-author .ew-tool-connection[data-connected=true]{color:var(--ees-status-success);}
.ew-author .ew-tool-group{display:grid;gap:6px;margin-top:6px;}
.ew-author .ew-tool-group h4{font-size:12px;line-height:18px;font-weight:500;}
.ew-author .ew-tool-group h4>small{color:var(--ees-text-tertiary);margin-left:6px;}
.ew-author .ew-tool-search{display:grid;gap:6px;font-size:12px;line-height:18px;}
.ew-author .ew-tool-search input{width:100%;}
.ew-author .ew-tool-selected{display:flex;gap:10px;align-items:center;justify-content:space-between;}
.ew-author .ew-tool-selected>span{display:grid;gap:4px;min-width:0;overflow-wrap:anywhere;}
.ew-author .ew-tool-selected small{font-size:12px;line-height:18px;color:var(--ees-text-secondary);}
.ew-author .ew-tool-selected>button{flex:none;}
.ew-author .ew-tool-advanced{margin-top:18px;padding-top:14px;border-top:1px solid var(--ees-line-divider);}
.ew-author .ew-tool-advanced>summary{font-size:12px;line-height:20px;color:var(--ees-text-secondary);cursor:pointer;}
.ew-author .ew-tool-advanced[open]>summary{margin-bottom:12px;}
.ew-author .ew-tool-submit-reason{width:100%;font-size:12px;line-height:18px;color:var(--ees-text-secondary);margin:0;}
.ew-author .ew-tool-questions{padding:14px 12px 12px;background:var(--ees-surface-sidebar);border-radius:6px;}
.ew-author .ew-tool-questions .ew-tool-choices>button{font-size:12px;line-height:18px;}
.ew-confirmed-verdict{display:flex;flex-direction:column;gap:4px;align-items:flex-start;}
.ew-confirmed-verdict>small{display:block;}

/* C13 1031:409: shared canonical help, anchored to its invoking control. */
.ew-help-popover[data-ees-work]{position:fixed;z-index:10020;display:flex;flex-direction:column;gap:8px;overflow:auto;overscroll-behavior:contain;border:1px solid var(--ees-line-control);border-radius:8px;padding:14px 16px 12px;background:var(--ees-surface-default);box-shadow:0 4px 12px #1118270f,0 1px 2px #1118270d;overflow-wrap:anywhere;}
.ew-help-popover>header,.ew-help-popover>footer{display:flex;align-items:center;gap:8px;}
.ew-help-popover>header>div,.ew-help-related article>div{display:flex;align-items:baseline;flex-wrap:wrap;gap:6px;flex:1;min-width:0;}
.ew-help-popover strong{font-size:14px;line-height:20px;font-weight:700;}
.ew-help-popover small{font-size:12px;line-height:18px;color:var(--ees-text-tertiary);}
.ew-help-popover .ew-help-close{display:flex;align-items:center;justify-content:center;border:0;background:transparent;padding:2px;min-height:24px;min-width:24px;font-size:12px;line-height:18px;color:var(--ees-text-secondary);}
.ew-help-popover .ew-help-summary{font-size:14px;line-height:22px;white-space:pre-line;}
.ew-help-popover .ew-help-example,.ew-help-related p{font-size:12px;line-height:18px;color:var(--ees-text-secondary);white-space:pre-line;}
.ew-help-related{border-top:1px solid var(--ees-line-divider);padding-top:10px;display:flex;flex-direction:column;gap:8px;}
.ew-help-related h3{font-size:12px;line-height:16px;font-weight:500;color:var(--ees-text-secondary);}
.ew-help-related article strong{font-weight:500;line-height:22px;}
.ew-help-popover>footer{border-top:1px solid var(--ees-line-divider);padding-top:10px;justify-content:space-between;flex-wrap:wrap;}
.ew-help-popover .ew-help-ask{display:inline-flex;align-items:center;gap:6px;border:0;padding:0;min-height:24px;font-size:12px;line-height:16px;background:transparent;color:var(--ees-brand-text);}
.ew-help-popover .ew-help-error{font-size:12px;line-height:18px;color:#a13931;background:#fff0ee;border-radius:4px;padding:8px;}
.ew-help-popover :is(button,a):focus-visible{outline:2px solid var(--ees-brand-text);outline-offset:2px;box-shadow:var(--ees-focus-ring);}

.ew-author .ew-help-trigger{padding:2px 4px;min-height:28px;font-size:12px;line-height:18px;border:0;background:transparent;color:var(--ees-brand-text);flex:none;}
.ew-author .ew-help-trigger:focus-visible{outline:2px solid var(--ees-brand-text);outline-offset:2px;}


/* C18/C21: panel canvas is distinct from white cards and controls. The Native
 * conversation and the #FAFAFA cycle strip keep their own surface tokens. */
#ees-work-panel{--ees-text-tertiary:var(--ees-text-secondary);}
#ees-work-panel :is(#ees-work-inputs,.ew-result-items,.ew-result-list,.ew-run-steps,
  .ew-author-list,.ew-author-stage,.ew-author table,.ew-procedure-choices,
  .ew-phase-overview,.ew-list-table,.ew-history-values,.ew-author-rule-card,
  .ew-author-validation>details,.ew-adhoc-start,.ew-check-item,
  .ew-admin-grants,.ew-amend-row){background:var(--ees-surface-default);}
#ees-work-panel :is(.ew-query-summary,.ew-schedule-preview,.ew-start-preview,
  .ew-check-evidence,.ew-tool-questions,.ew-procedure-help,.ew-ai-proposal,
  .ew-scope-status),#ees-work-panel .ew-notice:not([data-tone]){background:var(--ees-surface-default);}
#ees-work-panel .ew-schedule-row{background:var(--ees-surface-default);}
#ees-work-panel .ew-icon-button{background:transparent;}
/* White-card actions use #F3F3F5; transparent controls on the gray canvas use
 * #ECECEF (C33/Q1). Selected, disabled and status colors remain distinct. */
#ees-work-panel :is(.ew-author-list>button,.ew-author-job,.ew-phase-job):hover:not(:disabled):not([aria-current]):not([aria-pressed=true]){background:var(--ees-surface-hover);}
#ees-work-panel>.ew-panel-header .ew-icon-button:hover:not(:disabled),
#ees-work-panel .ew-author>header .ew-icon-button:hover:not(:disabled),
#ees-work-panel :is(.ew-tabs,.ew-author-tabs,.ew-author-factories)>button:hover:not(:disabled),
#ees-work-panel .ew-author-back:hover:not(:disabled),
#ees-work-panel>footer .ew-text:hover:not(:disabled),
#ees-work-panel .ew-author>footer .ew-text:hover:not(:disabled){background:var(--ees-surface-panel-hover);}

/* Q1 reading widths inside the source-owned conversation region. Apply one
 * 24px gutter to Native's input wrapper; the empty-chat wrappers add none. */
[data-ees-source-shell] #chat-container #messages-container .message-listitem:not(.max-w-full){width:min(760px,calc(100% - 48px));max-width:760px;padding-inline:0;margin-inline:auto;}
[data-ees-source-shell] #chat-container [data-ees-source-empty-chat]{width:100%;max-width:none;padding-inline:0;}
[data-ees-source-shell] #chat-container [data-ees-native-empty-composer]{width:100%;max-width:none;}
[data-ees-source-shell] #chat-container #chat-pane [class~='max-w-[58rem]']:not([data-ees-source-empty-chat]):has(#message-input-container){width:min(760px,calc(100% - 48px));max-width:760px;padding-inline:0;margin-inline:auto;}
/* B10 shared actions reuse the authoring panel and its keyboard focus tokens. */
.ew-shared-card{background:#fff;border:1px solid #e6e6e9;border-radius:6px;padding:14px;margin:12px 0;font-size:14px;line-height:22px}.ew-shared-card h3,.ew-shared-groups h3{font-size:12px;line-height:18px;margin:0 0 8px}.ew-shared-card p{margin:6px 0}.ew-shared-card small,.ew-shared-groups small{font-size:12px;color:#6f717a}.ew-shared-card dl{display:grid;grid-template-columns:92px 1fr;gap:8px}.ew-shared-card dd{margin:0}.ew-shared-card button{min-height:34px;margin-right:8px}.ew-shared-groups{border:1px solid #e6e6e9;border-radius:6px;overflow:hidden;margin:14px 0}.ew-shared-groups h3{background:#ececef;padding:7px 14px;margin:0}.ew-shared-groups button,.ew-shared-card>button[data-author-action=open]{display:flex;align-items:center;justify-content:space-between;width:100%;padding:10px 14px;border-bottom:1px solid #e6e6e9;text-align:left;background:#fff}.ew-shared-groups button small{display:block}.ew-author-tag[data-state=available]{background:#eaf4ee;color:#2a744c}.ew-author-tag[data-state=review_required]{background:#faf1e4;color:#96590c}.ew-shared-picker{position:relative;border:1px solid #d5d6da;border-radius:6px;background:#fff}.ew-shared-picker summary{cursor:pointer;padding:8px 10px;font-size:14px}.ew-shared-picker-options{position:absolute;top:100%;left:0;right:0;z-index:20;max-height:350px;overflow:auto;background:#fff;border:1px solid #d5d6da;border-radius:6px;padding:8px;box-shadow:0 4px 12px #0002}.ew-shared-picker-options button{display:flex;flex-wrap:wrap;text-align:left;width:100%;padding:8px;min-height:34px}.ew-shared-picker-options button>small{width:100%;font-size:12px;color:#6f717a}.ew-shared-picker-options h4{font-size:12px;color:#6f717a;margin:8px}.ew-shared-picker summary:focus-visible,.ew-shared-picker-options button:focus-visible,.ew-shared-card button:focus-visible,.ew-shared-groups button:focus-visible{outline:2px solid #2f5f98;outline-offset:2px}

.ew-shared-groups button{border-radius:0;border:0;border-bottom:1px solid #e6e6e9}.ew-shared-groups button strong small{display:inline;margin-left:6px;font-size:11px;background:#ececef;padding:0 4px;border-radius:3px}

.ew-shared-picker-options button{position:relative;border:0;border-radius:0;padding-right:38px}.ew-shared-picker-options button>span{position:absolute;right:8px;top:8px;font-size:12px;color:#6f717a}
.ew-shared-comparison{width:100%;table-layout:fixed;border-collapse:collapse;margin:12px 0;font-size:13px;line-height:20px}.ew-shared-comparison caption{text-align:left;font-weight:600;padding-bottom:8px}.ew-shared-comparison th,.ew-shared-comparison td{text-align:left;vertical-align:top;padding:8px;border-bottom:1px solid var(--ees-line-divider);overflow-wrap:anywhere}.ew-shared-comparison th:first-child{width:24%}
.ew-shared-access{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;margin:12px 0}.ew-shared-access fieldset{margin:0;min-width:0}.ew-shared-access>label{display:grid;gap:6px}.ew-shared-changes{font-size:13px;line-height:20px}
[data-ees-work] .ew-author-link,[data-ees-work] .ew-author-back,[data-ees-work] .ew-author-stage>header button{border:0;background:transparent;box-shadow:none;padding:4px 0;font-weight:400;}
[data-ees-work] .ew-author-link{color:var(--ees-brand-text);}
[data-ees-work] .ew-author-link:hover,[data-ees-work] .ew-author-back:hover{text-decoration:underline;background:transparent;}
.ew-author .ew-summary-editor p{font-size:12px;line-height:18px;margin:8px 0;}
.ew-summary-editor{display:grid;gap:10px;padding:10px 0 2px;}
.ew-summary-fields{display:grid;gap:10px;}
.ew-author .ew-summary-fields>label{grid-template-columns:96px minmax(0,1fr);align-items:center;gap:10px;line-height:18px;}
.ew-summary-actions{display:flex;justify-content:flex-end;gap:8px;}
.ew-summary-actions>button{min-height:34px;padding:5px 14px;}
#ees-work-dialog .ew-author-fields input:not([type=checkbox]),#ees-work-dialog .ew-author-fields select,#ees-work-dialog .ew-author-fields textarea{box-sizing:border-box;width:100%;min-width:0;border:1px solid var(--ees-line-control);border-radius:6px;background:var(--ees-surface-default);padding:7px 10px;font:inherit;line-height:22px;}
#ees-work-dialog .ew-author-fields>label{font-size:14px;line-height:22px;}
#ees-work-dialog .ew-author-fields textarea{min-height:80px;resize:vertical;}
#ees-work-dialog .ew-author-fields>label.ew-author-inline{display:flex;align-items:center;gap:8px;}
#ees-work-dialog .ew-input-advanced{margin:12px 0;}
#ees-work-dialog .ew-input-advanced>summary{cursor:pointer;font-weight:500;}
@media(max-width:600px){.ew-author .ew-summary-fields>label{grid-template-columns:minmax(0,1fr);}.ew-summary-actions{flex-wrap:wrap;}}
.ew-builtin-list{margin-top:26px;}
.ew-procedure-menu{position:relative;margin-left:auto;}
.ew-procedure-menu>summary{cursor:pointer;list-style:none;display:flex;padding:6px;border-radius:4px;}
.ew-procedure-menu>summary::-webkit-details-marker{display:none;}
.ew-procedure-menu>div{position:absolute;right:0;top:100%;min-width:180px;padding:8px 12px;background:var(--ees-surface-default);border:1px solid var(--ees-line-divider);border-radius:6px;box-shadow:0 8px 24px #1118271a;z-index:20;display:grid;gap:4px;}
.ew-job-advanced{grid-column:1/-1;background:var(--ees-surface-default);border:1px solid var(--ees-line-divider);border-radius:6px;margin:10px 0;}
.ew-job-advanced>summary{cursor:pointer;padding:12px 14px;font-size:12px;font-weight:500;}
.ew-job-advanced>.ew-author-fields,.ew-advanced-content{padding:4px 14px 14px;}
.ew-example-job{padding:12px;border-top:1px solid var(--ees-line-divider);}
.ew-example-job summary{cursor:pointer;font-size:14px;font-weight:500;}
.ew-example-job p{font-size:12px;line-height:20px;color:var(--ees-text-secondary);white-space:pre-wrap;}
#ees-work-dialog:has(.ew-new-procedure){width:484px;max-width:calc(100vw - 32px);box-sizing:border-box;padding:24px;}
.ew-new-procedure{width:100%;}
.ew-new-procedure>label{display:grid;gap:8px;font-size:12px;}
.ew-new-procedure input{width:100%;box-sizing:border-box;}
.ew-new-procedure .ew-author-note{padding:10px 12px;border-radius:6px;background:var(--ees-surface-muted);font-size:12px;line-height:18px;}

.ew-author>header{gap:6px;padding-right:10px;flex:none;line-height:20px;}
.ew-author>header .ew-icon-button{margin-left:auto;display:flex;align-items:center;justify-content:center;width:30px;min-height:30px;padding:0;border:0;}
.ew-author .ew-author-back{min-height:22px;padding:0;gap:6px;margin:0 0 12px;font-size:14px;line-height:22px;}
.ew-author .ew-author-back .ew-icon{width:14px;height:14px;}
.ew-author-definition-head{margin-bottom:12px;}
.ew-author .ew-author-definition-head>.ew-author-heading{min-height:30px;margin:0 0 4px;justify-content:flex-start;}
.ew-author .ew-author-definition-head>.ew-author-muted{margin:0;font-size:12px;line-height:18px;}
.ew-author .ew-procedure-menu{margin:0 0 0 auto;flex:none;}
.ew-procedure-menu>summary{padding:7px;border-radius:6px;width:30px;height:30px;box-sizing:border-box;}
.ew-author .ew-author-factories{gap:2px;align-items:center;border:0;margin:12px 0;background:var(--ees-surface-muted);padding:3px;border-radius:8px;width:fit-content;max-width:100%;}
.ew-author .ew-author-factories>span{font-size:12px;color:var(--ees-text-secondary);padding:0 8px;}
.ew-author .ew-author-factories>button{border:0;padding:4px 14px;font-size:14px;line-height:22px;min-height:30px;border-radius:6px;}
.ew-author .ew-author-factories>button[aria-selected=true]{background:var(--ees-surface-default);box-shadow:0 1px 2px #1118270d;}
.ew-author .ew-author-list>button,.ew-author .ew-author-job{border:0;border-radius:0;padding:11px 14px;font-size:14px;line-height:22px;font-weight:400;}
.ew-author .ew-author-list>button+button,.ew-author .ew-author-job+.ew-author-job{border-top:1px solid var(--ees-line-divider);}
.ew-author .ew-author-stage>header{padding:8px 14px;font-size:14px;min-height:42px;}
.ew-author .ew-author-stage>header button{min-height:22px;padding:0;font-weight:500;font-size:14px;line-height:22px;}
.ew-author-stage-number{width:20px;height:20px;font-size:12px;line-height:18px;}
.ew-author .ew-author-stage>.ew-author-link{padding:9px 14px;}
.ew-author>footer{gap:8px;}
.ew-author>footer>small{font-size:12px;line-height:18px;color:var(--ees-text-secondary);}
.ew-author>footer>button{font-size:14px;line-height:22px;padding:5px 14px;min-height:34px;}
.ew-author input:not([type=checkbox]),.ew-author select,.ew-author textarea{font-size:14px;line-height:22px;border-color:var(--ees-line-control);border-radius:6px;padding:6px 10px;}
.ew-new-procedure .ew-author-note{display:flex;gap:8px;align-items:flex-start;background:var(--ees-surface-sidebar);margin:16px 0 0;}
.ew-new-procedure .ew-author-note>.ew-icon{margin-top:1px;flex:none;}
.ew-new-procedure input{height:42px;}
#ees-work-dialog:has(.ew-new-procedure)>footer{margin-top:20px;}

/* E1 · 업무 내용: stage order is a view order, with one expanded stage. */

const unclassifiedName='미분류';

function serviceNameKey(value){
  return String(value||'').trim().normalize('NFC').toLocaleLowerCase('ko');
}
function listServices(){
  return [...state.services].sort((a,b)=>a.name.localeCompare(b.name,'ko'));
}
function getService(id){
  return state.services.find(service=>service.id===id)||null;
}
function serviceWithName(name){
  const key=serviceNameKey(name);
  return state.services.find(service=>serviceNameKey(service.name)===key)||null;
}
function checkedServiceName(value,exceptId=''){
  const name=String(value??'').trim().normalize('NFC');
  if(!name)throw Error('서비스 이름을 입력하세요.');
  if(name.length>80)throw Error('서비스 이름을 80자 이내로 입력하세요.');
  if(serviceNameKey(name)===serviceNameKey(unclassifiedName))throw Error('미분류는 서비스를 지정하지 않은 API에 사용합니다. 다른 이름을 입력하세요.');
  const duplicate=serviceWithName(name);
  if(duplicate&&duplicate.id!==exceptId)throw Error('같은 이름의 서비스가 있습니다.');
  return name;
}
function createService(name){
  const checked=checkedServiceName(name);
  let id;
  do{id='service-'+(++state.nextService);}while(getService(id));
  const service={id,name:checked};
  state.services.push(service);
  return service;
}
function serviceMembers(id){
  return Object.values(state.tools).filter(t=>t.serviceId===(id||''));
}
function assignService(tool,id){
  const service=id?getService(id):null;
  if(id&&!service)throw Error('선택한 서비스를 찾을 수 없습니다. 서비스를 다시 선택하세요.');
  tool.serviceId=service?.id||'';
  tool.source=service?.name||unclassifiedName;
  return tool;
}
function renameService(id,name){
  const service=getService(id);
  if(!service)throw Error('변경할 서비스를 찾을 수 없습니다.');
  service.name=checkedServiceName(name,id);
  for(const tool of serviceMembers(id))tool.source=service.name;
  return service;
}
function removeService(id){
  const service=getService(id);
  if(!service)throw Error('삭제할 서비스를 찾을 수 없습니다.');
  if(serviceMembers(id).length)throw Error('등록된 API를 다른 서비스로 옮긴 뒤 삭제하세요.');
  state.services.splice(state.services.indexOf(service),1);
}
function serviceOptions(currentId){
  return option('',unclassifiedName,currentId||'')+listServices().map(s=>option(s.id,s.name,currentId)).join('');
}
function serviceGroups(query=''){
  const sorted=listServices();
  const groups=new Map([...sorted,{id:'',name:unclassifiedName}].map(s=>[s.id,{id:s.id,name:s.name,tools:[]}]));
  for(const tool of orderedTools()){
    if(!query||specMatches(tool,query))groups.get(tool.serviceId).tools.push(tool);
  }
  return [...groups.values()].filter(group=>group.tools.length||group.id&&(!query||matches(query,group.name)));
}

function restoreServiceGroups(){
  state.services??=[];
  state.nextService??=0;
  for(const tool of Object.values(state.tools)){
    if(Object.hasOwn(tool,'serviceId')){
      assignService(tool,getService(tool.serviceId)?.id);
      continue;
    }
    // Old catalogs kept only a display string. Preserve their visible groups once.
    const name=String(tool.source||'').trim();
    let service=serviceWithName(name);
    if(!service&&name&&serviceNameKey(name)!==serviceNameKey(unclassifiedName)){
      // Labels inferred from an endpoint's host in old versions can exceed the new edit limit.
      let id;
      do{id='service-'+(++state.nextService);}while(getService(id));
      service={id,name};
      state.services.push(service);
    }
    assignService(tool,service?.id);
    const provider=providers[tool.id];
    if(service&&provider&&serviceNameKey(provider.service)===serviceNameKey(name))service.providerId=provider.id;
  }
}
function importGroupId(origin){
  const uses=Object.values(state.tools).filter(t=>lifecycleSameOrigin(t.openapi,origin));
  if(uses.length){
    const ids=new Set(uses.map(t=>t.serviceId));
    return ids.size===1?uses[0].serviceId||'':'';
  }
  return serviceWithName(origin.servicesource)?.id||'';
}
function providerTool(id){
  const registered=getTool(id);
  if(registered)return registered;
  const tool=toolShape(id,state.official);
  const service=state.services.find(s=>s.providerId===id)||serviceWithName(providers[id].service);
  return assignService(tool,service?.id);
}

  return `<div class="picker-grid"><div class="collection pick-list" aria-label="서비스별 API">${groups}</div><div class="picker-detail">${detail}</div></div>`;

function toolInputLabels(api){
  const fields=businessFields(api),labels=[];
  if(fields.period)labels.push('조회 기간');
  if(fields.space)labels.push('문서 공간');
  if(fields.query)labels.push('검색어');
  for(const field of businessInputLeaves(api))labels.push(field.label);
  return labels;
}
function toolOutputText(tool){
  const api=tool.api;
  if(api.noContent)return '응답 본문 없음'+(api.responseStatus?' ('+api.responseStatus+')':'');
  const fields=api.columns.length?api.columns:handoffOutputFields(tool);
  const labels=[...new Set(fields.map(f=>{
    // Catalogs saved before the Korean starter labels changed still use the generic result heading.
    if(tool.id==='backup'&&api.url===starterApi.backup.url&&api.method===starterApi.backup.method&&f.key==='status'&&f.format==='status'&&f.label==='결과')return '성공 여부';
    return f.label||f.key;
  }).filter(Boolean))];
  if(labels.length>4)return labels.slice(0,4).join(', ')+` 외 ${labels.length-4}개`;
  if(labels.length)return labels.join(', ');
  const response=tool.openapi?.responses?.[api.responseStatus];
  const schema=response?.content?.[api.responseMediaType]?.schema;
  return schema?.title||response?.description||(api.responseMediaType||'결과 항목 미등록');

function compareSpecChange(oldTool,newApi){
  const oldApi=oldTool.api;
  const task=state.saved?.mode==='tool'&&state.saved.id===oldTool.id?state.saved:null;
  const entries=[];

  function record(field,before,after,reason,impact=false){
    entries.push({field,before,after,reason,impact});
  }
  if(oldApi.method!==newApi.method){
    record('요청 방식',oldApi.method,newApi.method,'같은 작업이 보내는 요청 방식이 달라집니다.',true);
  }
  if(oldApi.url.trim()!==newApi.url.trim()){
    record('호출 주소',oldApi.url,newApi.url,'이 기능이 호출할 서버 또는 경로가 바뀝니다.',true);
  }
  const paramName=p=>p.wireName||p.key;
  function paramId(api,p){
    const loc=parameterLocation(api,p),name=paramName(p);
    return JSON.stringify([loc,loc==='header'?name.toLowerCase():name]);
  }
  function inputTag(api,p){
    const type=p.type||p.schema?.type;
    return [parameterLocation(api,p),Array.isArray(type)?type.join(' | '):type].filter(Boolean).join(' · ');
  }
  function required(p){return p.in==='path'||(p.required??(p.source==='input'));}
  function hasSavedValue(api,p){
    if(p.source==='input'){
      if(!task)return false;
      const key=inputValueKey(api,p);
      const v=Object.hasOwn(task.extra||{},key)?task.extra[key]:undefined;
      return v!==undefined&&v!==null&&String(v).trim()!=='';
    }
    if(p.source==='fixed')return String(p.value??'').trim()!=='';
    return ['system','plant','period','query','space','wikiSearch'].includes(p.source);
  }
  function mapping(p){
    if(p.source==='fixed')return '고정값 '+p.value;
    return Object.hasOwn(valueSources,p.source)?valueSources[p.source]:String(p.source||'');
  }
  const oldInputs=new Map(oldApi.inputs.map(p=>[paramId(oldApi,p),p]));
  const newInputs=new Map(newApi.inputs.map(p=>[paramId(newApi,p),p]));
  for(const [id,prev] of oldInputs){
    const curr=newInputs.get(id);
    const title='입력 '+paramName(prev);
    if(!curr){
      record(title,inputTag(oldApi,prev),'전송하지 않음','기존 요청에서 사용한 값이 빠집니다.',true);
      continue;
    }
    if(inputTag(oldApi,prev)!==inputTag(newApi,curr)){
      record(title+' 자료형',inputTag(oldApi,prev),inputTag(newApi,curr),'저장된 값이 새 자료형에 맞는지 확인하세요.',true);
    }
    if(required(prev)!==required(curr)){
      const missing=required(curr)&&!hasSavedValue(newApi,curr);
      record(title+' 필수 여부',required(prev)?'필수':'선택',required(curr)?'필수':'선택',
        missing?'실행할 때 새 필수값을 입력해야 합니다.':'현재 입력 방식으로 값을 전달할 수 있습니다.',missing);
    }
    if(mapping(prev)!==mapping(curr)){
      record(title+' 값',mapping(prev),mapping(curr),'작업이 보낼 값 또는 그 값을 가져오는 곳이 달라집니다.',true);
    }
    const oldEnum=prev.schema?.enum,newEnum=curr.schema?.enum;
    if(Array.isArray(newEnum)&&(!Array.isArray(oldEnum)||oldEnum.some(v=>!newEnum.includes(v)))){
      record(title+' 허용값',Array.isArray(oldEnum)?oldEnum.join(', '):'제한 없음',newEnum.join(', '),
        '기존 입력 가운데 사용할 수 없는 값이 생길 수 있습니다.',true);
    }
  }
  for(const [id,p] of newInputs)if(!oldInputs.has(id)){
    const missing=required(p)&&!hasSavedValue(newApi,p);
    record('입력 '+paramName(p),'없음',inputTag(newApi,p)+(required(p)?' · 필수':' · 선택'),
      missing?'실행할 때 새 필수값을 입력해야 합니다.':'새 입력 항목이 추가됩니다.',missing);
  }
  if((oldApi.root||'')!==(newApi.root||'')){
    record('결과 위치',oldApi.root||'전체 응답',newApi.root||'전체 응답','결과 목록을 읽는 위치가 바뀝니다.',true);
  }
  const oldColumns=new Map(oldApi.columns.map(c=>[c.key,c]));
  const newColumns=new Map(newApi.columns.map(c=>[c.key,c]));
  for(const [key,prev] of oldColumns){
    const curr=newColumns.get(key);
    if(!curr){
      record('결과 '+key,prev.label,'표시 항목에서 제외','작업 결과에 표시할 항목이 달라집니다.',true);
    }else if((prev.format==='status')!==(curr.format==='status')){
      record('결과 '+key,outputFormats[prev.format]||prev.format,outputFormats[curr.format]||curr.format,
        '이 필드의 상태 표시가 달라집니다. 결과 확인 기준을 검토하세요.',true);
    }
  }
  for(const [key,c] of newColumns)if(!oldColumns.has(key)){
    const check=c.format==='status'&&task?.review==='auto';
    record('결과 '+key,'없음',c.label,check?'자동 확인에 이용할 상태 필드가 추가됩니다.':'작업 결과에 새 항목이 표시됩니다.',check);
  }
  const relevant=lifecycleUsages(oldTool.id);
  const affectedTask=[...new Set(relevant.map(u=>u.path))].join(' / ');
  const diff={entries,affectedTask,needsReview:!!affectedTask&&entries.some(e=>e.impact)};
  diff.html=specChangeReviewHtml(diff);
  return diff;
}

function specChangeReviewHtml(diff){
  if(!diff.entries.length)return '';
  const rows=diff.entries.map(e=>`<tr><th scope="row">${esc(e.field)}</th><td>${esc(e.before)}</td><td>${esc(e.after)}</td></tr>`).join('');
  const notes=[...new Set(diff.entries.filter(e=>e.impact).map(e=>e.reason))];
  const task=diff.needsReview?`<p class="desc"><strong>연결된 작업</strong> · ${esc(diff.affectedTask)}</p>`:'';
  return `<section class="api-preview" aria-label="명세 변경 내용"><h3>${diff.needsReview?'연결된 작업에 적용할 변경':'명세 변경 내용'}</h3>${task}<div class="table-wrap"><table><thead><tr><th>항목</th><th>현재</th><th>변경 후</th></tr></thead><tbody>${rows}</tbody></table></div>${diff.needsReview?notes.map(reason=>`<p class="helper">${esc(reason)}</p>`).join(''):''}</section>`;
}

function rememberFocus(){

  return null;
}
function restoreFocus(memory){
  const rootNode=overlay.open?dialogContent:document;

  if(memory?.id)el=rootNode.querySelector('#'+CSS.escape(memory.id));
  else if(memory?.action)el=[...rootNode.querySelectorAll('[data-do]')].find(e=>e.dataset.do===memory.action&&(!memory.item||e.dataset.id===memory.item)&&!e.hidden);
  if(el&&!el.disabled)el.focus({preventScroll:true});
  else if(overlay.open)$('#modal-title')?.focus({preventScroll:true});else firstFocus();

function koreanObject(word){

function editorReply(q,m){

    const input=toolInputLabels(m.api);
    const inputText=input.join(' · ');
    const subject=inputText?inputText+koreanObject(inputText)+' 기준으로 ':'';
    let next;
    if(m.api.noContent)return {a:'이 API는 응답 본문을 반환하지 않습니다. 용도에는 호출하면 어떤 작업이 처리되는지 적어 주세요.'};
    if(outputs==='결과 항목 미등록'){
      if(!d.use)return {a:'용도나 결과 항목을 입력하면 그 내용을 바탕으로 제안할 수 있습니다.'};
      return {a:'현재 용도는 “'+d.use+'”입니다. 더 구체적인 문장을 제안하려면 결과 항목을 지정해 주세요.'};
    }
    if(d.method==='GET'&&m.api.inputs.some(p=>p.source==='wikiSearch')&&m.api.columns.some(c=>c.format==='document'))
      next='선택한 문서 공간에서 검색어와 일치하는 문서를 찾아 '+outputs+koreanObject(outputs)+' 보여줍니다.';
    else if(d.method==='GET')next=subject+outputs+koreanObject(outputs)+' 조회합니다.';
    else next=(d.use?d.use.replace(/[.!?。]+$/,'')+'. ':'')+'처리 결과로 '+outputs+koreanObject(outputs)+' 받습니다.';
    if(next===d.use||(!['GET','HEAD'].includes(d.method)&&d.use.includes('처리 결과로 '+outputs)))return {a:'현재 용도에 이 명세의 결과 항목이 이미 반영되어 있습니다.'};
    if(next.length>240)return {a:'현재 용도와 결과 항목을 함께 쓰면 용도 입력 한도인 240자를 넘습니다. 업무에서 확인할 핵심 결과를 중심으로 줄여 주세요.'};
    return {a:'편집 중인 입력과 결과 항목으로 작성한 문장입니다.',suggestion:{
      session:editorSession(m),toolId:m.toolId,original:m.use,next,fingerprint:JSON.stringify(d),applied:false
    }};
  }
  if(/등록.*확인|필수.*항목/.test(q)&&state.route==='specRegister'){
    const missing=[[d.url,'API 주소'],[m.name.trim(),'API 이름'],[m.use.trim(),'용도'],[!m.inlineService||m.newServiceName.trim(),'새 서비스 이름']].filter(([v])=>!v).map(([,label])=>label);
    if(missing.length)return {a:'등록하려면 '+missing.join(', ')+' 항목을 입력하세요.'};
    const check=inspectEditor(m,true);
    return {a:check.message||('‘'+d.name+'’의 기본 등록 항목이 채워졌습니다. 요청은 '+d.method+' '+d.url+'입니다.')};
  }
  if(/현재 요청·응답 요약|요약|요청.*응답|명세.*설명/.test(q))return {a:[d.name,'요청  '+d.method+' '+(d.url||'주소 미입력'),'입력  '+d.inputs,'받는 결과  '+d.outputs].join('\n')};
  if(/주소|URL|엔드포인트|메서드/i.test(q))return {a:'현재 편집값은 '+d.method+' '+(d.url||'(주소 미입력)')+'입니다.'};
  if(/응답|결과/.test(q))return {a:'현재 명세에서 받는 결과는 '+d.outputs+'입니다.'};
  if(/입력|파라미터|매개변수/.test(q))return {a:'현재 명세의 업무 입력은 '+d.inputs+'입니다.'};
  if(/용도|설명/.test(q))return {a:d.use?'현재 용도는 “'+d.use+'”입니다.':'현재 용도가 비어 있습니다.'};
  return {a:'이 예시 도우미는 현재 편집 중인 API의 주소·입력·결과를 확인하거나 용도 문구를 제안할 수 있습니다.'};

function cleanEditor(api){
  return {...api,url:api.url.trim(),method:api.method,inputs:api.inputs.map(p=>({...p,key:p.key.trim(),source:p.source,value:['fixed','input'].includes(p.source)?p.value.trim():''})),root:api.root.trim(),columns:api.columns.map(c=>({...c,key:c.key.trim(),label:c.label.trim(),format:c.format})),sample:api.sample.trim()};

function inspectEditor(m,needName){
  const c=cleanEditor(m.api);
  function invalid(message,field,advanced=false){return {message,field,advanced};}
  if(needName){
    if(!m.name.trim())return invalid('API 이름을 입력하세요.','#direct-name');
    if(!m.use.trim())return invalid('API의 용도를 입력하세요.','#direct-use');
    if(m.inlineService){
      try{checkedServiceName(m.newServiceName,serviceWithName(m.newServiceName)?.id);}catch(error){return invalid(error.message,'#new-service-name');}
    }else if(m.serviceId&&!getService(m.serviceId))return invalid('선택한 서비스를 찾을 수 없습니다. 서비스를 다시 선택하세요.','#spec-service');
  }
  let url;
  const relative=!!getTool(m.toolId)?.openapi&&/^\/(?!\/)/.test(c.url);
  try{url=relative?new URL(c.url,'https://mock.invalid'):new URL(c.url);}catch{return invalid('http:// 또는 https://로 시작하는 API 주소를 입력하세요.','#api-url');}
  if(!['http:','https:'].includes(url.protocol)||!url.hostname||url.hash||url.username||url.password)return invalid('사용자 정보나 # 표시가 없는 HTTP(S) 엔드포인트를 입력하세요.','#api-url');
  if(m.type==='direct'||(!getTool(m.toolId)?.openapi&&(m.toolId?.startsWith('direct-')||c.inputs.some(p=>p.fromAddress)))){
    c.inputs=directEndpointInputs(c);
  }
  const dupe=Object.values(state.tools).find(t=>t.id!==m.toolId&&t.api.method===c.method&&endpointAlias(t.api.url)===endpointAlias(c.url));
  if(dupe)return invalid(`같은 주소와 요청 방식이 ‘${dupe.name}’에 등록되어 있습니다.`,'#api-url');
  for(const [list,rows] of Object.entries({inputs:c.inputs,columns:c.columns})){
    const seen=new Set();
    for(const [i,row] of rows.entries()){
      const field=`[data-map="${list}"][data-index="${i}"]`;
      if(!row.key)return invalid(list==='inputs'?'파라미터 이름을 입력하세요.':'응답 필드 이름을 입력하세요.',field+'[data-key="key"]',true);
      const refKey=list==='inputs'?parameterLocation(c,row)+' '+(parameterLocation(c,row)==='header'?row.key.toLowerCase():row.key):row.key;
      if(list==='inputs'&&seen.has(refKey))return invalid('같은 위치에 같은 이름의 요청 파라미터가 있습니다.',field+'[data-key="key"]',true);
      seen.add(refKey);
      if(list==='columns'&&!row.label)return invalid('결과에 표시할 이름을 입력하세요.',field+'[data-key="label"]',true);
      if(row.source==='input'&&!row.value)return invalid('사용자가 보게 될 입력 이름을 적어주세요.',field+'[data-key="value"]',true);
    }
  }
  if(c.sample){
    try{JSON.parse(c.sample);}catch{return invalid('예시 응답을 JSON 형식으로 입력하세요.','#api-sample',true);}
  }
  return {api:c};
}

function handoffSavedConfig(h) {
  if (!h?.binding || !h.readId || !h.writeId) return null;
  const {source, field, target, targetKey, targetPath} = h.binding;
  return {readId: h.readId, writeId: h.writeId, binding: {source, field, target, targetKey, targetPath: [...(targetPath || [])]}};
}

const handoffTaskPaths = ['설비 알람 처리 › 알람 처리 › 설비 알람 조회', '설비 알람 처리 › 알람 처리 › 알람 확인 등록'];

function handoffUsages(toolId) {
  const h = state.handoff;
  if (!h?.binding) return [];

    taskName: i ? '알람 확인 등록' : '설비 알람 조회', path: handoffTaskPaths[i], direction, field, bound: true

  if (h.readId === toolId) {
    add(0, 'call');
    if (h.binding.source === 'previous') add(1, 'output', h.binding.field);
  }
  if (h.writeId === toolId) add(1, 'input', h.binding.target);
  return usages;
}

function handoffRemapField(toolId, oldPath, newPath) {
  const h = state.handoff;
  if (!h?.binding || h.readId !== toolId || h.binding.source !== 'previous' || h.binding.field !== oldPath) return;
  h.binding.field = newPath || '';
  if (newPath === null) h.binding.source = 'input';
  delete h.draft;
  delete h.run;
}

function handoffToolList(mode, keep) {

function handoffExampleOperations() {

function handoffNewDraft(h) {

function handoffEnter(mode) {
