function handoffAddExamples() {
  const h = state.handoff;
  const prepared = handoffExampleOperations().map(op => {
    const match = existingImport(op);
    if (match.mode === 'blocked') throw Error(match.note);
    if (match.existing?.lifecycleStatus === 'withdrawn') throw Error('예시 API가 제공 종료 상태입니다. 등록한 다른 API를 선택하세요.');
    return {op, tool: match.existing};
  });
  const selected = prepared.map(({op, tool}) => {
    if (tool) return tool.id;
    const id = 'openapi-' + (++state.nextTool);
    state.tools[id] = assignService({...copy(op.spec), id, official: false, version: 1, sourceApi: copy(op.spec.api)},importGroupId(op.spec.openapi));
    return id;
  });
  [h.draft.readId, h.draft.writeId] = selected;
  h.draft.binding = {source:'previous',field:'',target:'',targetKey:'',targetPath:[]};
  handoffDefaultMapping(h.draft);

function handoffOutputFields(tool) {
  if (!tool) return [];
  const api = tool.api;
  const response = tool.openapi?.responses?.[api.responseStatus];
  let schema = response?.content?.[api.responseMediaType]?.schema;
  for (const key of (api.root || '').split('.').filter(Boolean)) schema = schema?.properties?.[key];
  const recordSchema = schema?.items || schema;
  let sample;
  try {
    const raw = sampleFor(api, defaultApiInput(api));
    if (raw.origin) sample = atPath(raw.value, api.root || '');
  } catch {}
  const rows = Array.isArray(sample) ? sample : sample == null ? [] : [sample];
  const fields = [];
  const add = (key, label, type) => {
    if (key && !fields.some(x => x.key === key)) fields.push({key, label, type});
  };
  function walk(shape, example, prefix, depth) {
    if (depth > 7) return;
    const object = example && !Array.isArray(example) && typeof example === 'object' ? example : {};
    const names = new Set([...Object.keys(shape?.properties || {}), ...Object.keys(object)]);
    for (const name of names) {
      const child = shape?.properties?.[name];
      const val = object[name], key = prefix ? prefix + '.' + name : name;
      if (child?.properties || val && typeof val === 'object' && !Array.isArray(val)) {
        walk(child, val, key, depth + 1);
      } else {
        const col = api.columns.find(c => c.key === key);
        add(key, col?.label || child?.title || key, child?.type || (val == null ? '' : Array.isArray(val) ? 'array' : typeof val));
      }
    }
  }
  if (rows.length) for (const row of rows) walk(recordSchema, row, '', 0);
  else walk(recordSchema, null, '', 0);
  return fields;
}

function handoffTargetName(leaf) {
  return leaf.path.length ? leaf.path.join('.') : leaf.param.wireName || leaf.param.key;
}
function handoffTargetLeaf(tool, binding) {
  if (!tool || !binding) return undefined;
  return businessInputLeaves(tool.api).find(leaf => leaf.key === binding.targetKey && JSON.stringify(leaf.path) === JSON.stringify(binding.targetPath || []));
}
function handoffSaveTarget(binding, leaf) {
  binding.target = leaf ? handoffTargetName(leaf) : '';
  binding.targetKey = leaf?.key || '';
  binding.targetPath = leaf ? [...leaf.path] : [];
}
function handoffCompatible(sourceType, targetSchema) {
  if (!sourceType || !targetSchema?.type) return true;
  const n = v => v === 'integer' ? 'number' : v;
  return [].concat(sourceType).some(t => [].concat(targetSchema.type).map(n).includes(n(t)));
}
function handoffDefaultMapping(d) {
  const write = getTool(d.writeId);
  if (!write) return;
  const leaves = businessInputLeaves(write.api), fields = handoffOutputFields(getTool(d.readId));
  if(!leaves.length){
    d.binding.source='input';d.binding.field='';handoffSaveTarget(d.binding,null);return;
  }
  let target = handoffTargetLeaf(write, d.binding);
  if (!target && !d.binding.targetKey) {
    target = leaves.find(l => fields.some(f => f.key === handoffTargetName(l))) ||
      leaves.find(l => parameterLocation(write.api, l.param) === 'body') || leaves[0];
    handoffSaveTarget(d.binding, target);
  }
  if (!d.binding.field && target) {
    const compatible = fields.filter(f => handoffCompatible(f.type, target.schema));
    const match=compatible.find(f=>f.key===handoffTargetName(target));
    d.binding.field=match?.key||'';
  }
}

function handoffMapError(d) {
  const read = getTool(d.readId), write = getTool(d.writeId);
  if (!read || !write) return '두 작업에 사용할 도구를 선택하세요.';
  if ([read, write].some(t => t.lifecycleStatus === 'withdrawn')) return '제공 종료된 API를 다른 도구로 변경하세요.';
  const target = handoffTargetLeaf(write, d.binding);
  if (d.binding.source === 'previous') {
    if (!target) return '앞 작업의 결과를 받을 입력 항목을 선택하세요.';
    const src = handoffOutputFields(read).find(f => f.key === d.binding.field);
    if (!src) return '조회 결과에서 연결할 항목을 선택하세요.';
    if (!handoffCompatible(src.type, target.schema)) return '입력 항목과 자료형이 맞는 결과를 선택하세요.';
  }
  return '';
}

function handoffMapView(h) {

  const targetOptions = targets.map((l,i) => ({value:String(i),label:l.label}));

    ${d.binding.source === 'previous' ? handoffPicker('조회 결과 항목','handoff-output', fields.map(f => ({value:f.key,label:f.label})), d.binding.field,'결과 항목 선택') : ''}</div>`;
  const toggle=incomplete?'':btn(expanded?'설정 접기':'입력 연결 변경','handoff-toggle-mapping','link-btn',`aria-expanded="${expanded}" aria-controls="handoff-map-fields"`);
  const inputs=write&&read&&targets.length?`<div class="handoff-mapping"><div class="handoff-mapping-line"><span>${esc(summary)}</span>${toggle}</div>${expanded?controls:'<div id="handoff-map-fields" hidden></div>'}</div>`:'';
  return `<div class="section-title"><h2>알람 처리</h2>${examplesMissing ? btn('예시 API 등록','handoff-examples','link-btn') : ''}</div>

function handleHandoffAction(action,target) {
  if (!action.startsWith('handoff-')) return false;
  if (action === 'handoff-open' || action === 'handoff-map') {
    handoffEnter(action === 'handoff-map' ? 'map' : 'run');
    return true;
  }
  const h = state.handoff;
  if (!h || state.route !== 'handoff') return true;
  if(action==='handoff-toggle-mapping'){
    h.showMapping=!h.showMapping;render();
    page.querySelector('[data-do="handoff-toggle-mapping"]')?.focus();return true;
  }
  if(action==='handoff-pick'){
    const slot=target.dataset.slot;
    if(!h.draft||!['read','write'].includes(slot))return true;
    const idKey=slot==='read'?'readId':'writeId';
    pushModal({type:'handoffPick',slot,keep:h[idKey],selected:h.draft[idKey],q:''});return true;
  }
  if(action==='handoff-candidate'||action==='handoff-confirm'){
    const m=modalTop();if(m?.type!=='handoffPick')return true;
    const id=action==='handoff-confirm'?m.selected:target.dataset.id;
    if(!handoffPickChoices(m).some(t=>t.id===id))return true;
    if(action==='handoff-candidate'){
      m.selected=id;refreshHandoffChoices(m);
      dialogContent.querySelector('[data-do="handoff-candidate"][aria-pressed="true"]')?.focus({preventScroll:true});
      return true;
    }
    const key=m.slot==='read'?'readId':'writeId',d=h.draft;
    if(d[key]!==id){
      d[key]=id;d.binding.field='';
      if(m.slot==='write')handoffSaveTarget(d.binding,null);
      handoffDefaultMapping(d);
    }
    h.error='';clearModals();render();
    document.getElementById('handoff-'+m.slot+'-choice')?.focus();
    return true;
  }
  h.error = '';
  try {
    if (action === 'handoff-examples') handoffAddExamples();
    if (action === 'handoff-save') {
      const error = handoffMapError(h.draft);
      if (error) throw Error(error);
      const cfg = handoffSavedConfig(h.draft);
      Object.assign(h,cfg); delete h.draft;
      h.view = 'run'; handoffStartRun(h,true);
      notice('두 작업의 도구 연결을 저장했습니다.');
    }
    if (action === 'handoff-query') handoffFetch(h);
    if (action === 'handoff-ack') handoffAcknowledge(h);
  } catch (error) { h.error = error.message; }
  render(); return true;
}

function handoffChange(e) {
  const el=e.target, h=state?.handoff;
  if (state?.route !== 'handoff' || !h) return;
  if(el.id==='handoff-catalog-search'&&e.type==='input'&&modalTop()?.type==='handoffPick'){
    const m=modalTop();m.q=el.value;refreshHandoffChoices(m);return;
  }
  if (el.dataset.handoffInput) {
    const mode = el.dataset.handoffInput;
    const tool=getTool(mode==='read'?h.readId:h.writeId);
    const leaf=businessInputLeaves(tool.api)[Number(el.dataset.index)];
    const input=mode==='read'?h.run.readInput:h.run.writeInput;
    setBusinessValue(tool.api,input,leaf,el.value);
    if (mode==='read' && h.run.first) {
      h.run.first=null; h.run.selected=null; h.run.last=null;
      render(); const next=document.getElementById(el.id); next?.focus(); if(next?.setSelectionRange)try{next.setSelectionRange(next.value.length,next.value.length);}catch{}
    } else if (mode==='write' && h.run.last) { h.run.last=null;render();document.getElementById(el.id)?.focus(); }
    return;
  }
  if (e.type !== 'change') return;
  if (el.dataset.handoffRow !== undefined) {
    h.run.selected=Number(el.dataset.handoffRow); h.run.last=null; h.error=''; render();
    page.querySelector(`[data-handoff-row="${h.run.selected}"]`)?.focus(); return;
  }
  const d=h.draft;
  if (!d) return;
  switch(el.id) {
    case 'handoff-source': d.binding.source=el.value; break;
    case 'handoff-target': {
      const targets=businessInputLeaves(getTool(d.writeId).api);
      handoffSaveTarget(d.binding,el.value===''?null:targets[Number(el.value)]);

    }

const catalogStorageKey='ees-workflow.api-catalog.v5';
let lastCatalogSnapshot='';

function restoreCatalog(){
  if(state.scenario!=='catalog')return;
  try{
    const json=window.localStorage.getItem(catalogStorageKey);
    if(!json)return;
    const record=JSON.parse(json);
    if(![1,2].includes(record.format)||!record.tools||typeof record.tools!=='object'||Array.isArray(record.tools))return;
    for(const [id,t] of Object.entries(record.tools)){
      if(t?.id!==id||typeof t.api?.url!=='string'||!Array.isArray(t.api.inputs)||!Array.isArray(t.api.columns))return;
    }
    if(record.format===2&&(!Array.isArray(record.services)||record.services.some(s=>!s?.id||typeof s.name!=='string')))return;
    state.services=record.format===2?record.services:[];
    state.nextService=Number.isSafeInteger(record.nextService)?record.nextService:0;
    state.tools=record.tools;
    state.nextTool=Number.isSafeInteger(record.nextTool)?record.nextTool:0;
    if(record.task?.name&&(!record.task.id||getTool(record.task.id))){
      state.saved={...newTask(),...record.task};state.draft=copy(state.saved);
      state.runtime={...exampleInput,extra:copy(state.saved.extra||{})};
    }
    if(record.handoff)state.handoff=record.handoff;
    lastCatalogSnapshot=json;
  }catch{
    // Local files and private browsing can restrict storage.
  }
}

function saveCatalog(){
  if(state.scenario!=='catalog')return;
  const record={format:2,services:state.services,nextService:state.nextService,tools:state.tools,nextTool:state.nextTool,task:state.saved,handoff:handoffSavedConfig(state.handoff)};
  try{
    const json=JSON.stringify(record);
    if(json===lastCatalogSnapshot)return;
    window.localStorage.setItem(catalogStorageKey,json);
    lastCatalogSnapshot=json;
  }catch{
    const footer=document.querySelector('.no-live');
    if(footer)footer.textContent='현재 탭에서만 저장';
  }
}

}
function handleOpenapiAction(action){
  if(action==='provider-catalog'){
    const registration=state.route==='specRegister'?state.specRegistration:null;
    pushModal({type:'api',q:registration?.q||registration?.name||''});return true;
  }
  if(action==='registration-direct'||action==='openapi-start'){
    if(state.route!=='specRegister')return false;
    const r=state.specRegistration,method=action==='registration-direct'?'direct':'url';
    if(r.methodTab===method)return true;
    if(r.methodTab==='url')cancelImportRead(r.importDraft);
    r.methodTab=method;
    if(method==='url')r.importDraft??=newServiceImport();
    render();page.querySelector(`[data-do="${action}"]`)?.focus({preventScroll:true});
    return true;
  }
  if(action==='openapi-refresh'){
    const tool=getTool(state.detail);
    if(tool?.openapi?.sourceUrl)pushModal(newServiceImport(tool));
    return true;
  }
  const m=activeImport();
  if(m?.type!=='openapi'||!action.startsWith('openapi-'))return false;
  if(action==='openapi-fetch'&&!(m.sampleSource&&m.sourceUrl===exampleServiceUrl)){
    if(!m.loading)loadServiceAddress(m);return true;
  }
  if(action==='openapi-read'||action==='openapi-example'||action==='openapi-fetch'){
    const demo=action!=='openapi-read';
    try{
      if(demo){
        const doc=m.refreshTarget?refreshedImportExample():importExample;
        m.sourceUrl=exampleServiceUrl;m.sampleSource=true;
        parseServiceImport(m,JSON.stringify(doc),{sourceUrl:exampleServiceUrl,sourceExample:true});
      }else{
        const original=m.refreshTarget?getTool(m.refreshTarget)?.openapi:null;
        const options=original?.sourceUrl?{sourceUrl:original.sourceUrl,sourceExample:original.sourceExample}:{};
        parseServiceImport(m,m.source,options);
      }
    }catch(e){m.parsed=null;m.error=e.message;}
    paintImport(m,true);return true;
  }
  if(action==='openapi-back'){m.parsed=null;m.error='';m.selected=[];paintImport(m,true);return true;}
  if(action==='openapi-commit'){
    const selected=m.selected.map(i=>m.parsed.operations[i]),task=isTaskImport();
    if(!selected.length||task&&selected.length!==1)return true;
    const updates=[];let next=state.nextTool,repairs=[];
    try{
      for(const op of selected){
        const found=existingImport(op);
        if(found.mode==='blocked')throw Error(found.note);
        if(!task&&['same','existing'].includes(found.mode))continue;
        if(task&&(found.mode==='removed'||op.spec?.openapi?.deprecated))throw Error('새 작업에 연결할 수 있는 기능을 선택하세요.');
        if(found.mode==='removed')updates.push(lifecycleWithdraw(found.existing));
        else if(found.mode==='changed')updates.push(updatedImport(found.existing,op.spec));
        else if(found.existing)updates.push(found.existing);
        else updates.push(assignService({...copy(op.spec),id:'openapi-'+(++next),official:false,version:1,sourceApi:copy(op.spec.api)},m.serviceId));
      }
      repairs=lifecycleStage(m,selected,updates);
    }catch(e){m.error=e.message;paintImport(m);return true;}
    if(!updates.length)return true;
    state.nextTool=next;for(const tool of updates)state.tools[tool.id]=tool;
    lifecycleApply(repairs);
    if(task)finishAdding(updates[0]);
    else{
      if(m===activeRegistrationImport())finishRegistration();
      else{clearModals();state.search='';go('catalog');}
      notice(`${updates.length}개 기능의 명세를 반영했습니다.`);
    }
    return true;
  }
  return false;
}
function handleOpenapiField(event){
  const m=activeImport();if(!m)return false;
  if(handleLifecycleField(event,m))return true;
  const el=event.target;
  if(el.id==='import-service'){m.serviceId=el.value;m.error='';return true;}
  if(el.id==='openapi-url'&&event.type==='input'){m.sourceUrl=el.value;m.error='';m.sampleSource=false;return true;}
  if(el.id==='openapi-source'&&event.type==='input'){m.source=el.value;m.error='';m.fileName='';m.attachments=true;m.readToken=(m.readToken||0)+1;return true;}
  if(el.id==='openapi-file'&&event.type==='change'){
    const file=el.files?.[0];if(!file)return true;m.attachments=true;
    const token=(m.readToken||0)+1;m.readToken=token;
    if(file.size>2000000){m.error='2 MB 이내의 파일을 선택하세요.';paintImport(m);return true;}
    file.text().then(text=>{
      if(!isCurrentImport(m)||token!==m.readToken||m.parsed)return;
      m.source=text;m.fileName=file.name;m.error='';paintImport(m);
      if(!document.activeElement?.closest?.('#chat-panel'))importHost(m).querySelector('[data-do="openapi-read"]')?.focus({preventScroll:true});
    }).catch(()=>{if(isCurrentImport(m)&&token===m.readToken){m.error='파일을 읽을 수 없습니다. 파일을 다시 선택하거나 명세를 붙여넣으세요.';paintImport(m);}});
    return true;
  }
  if(el.dataset.openapiIndex!==undefined&&event.type==='change'){
    const idx=Number(el.dataset.openapiIndex);
    if(isTaskImport())m.selected=[idx];
    else if(el.checked){if(!m.selected.includes(idx))m.selected.push(idx);}
    else m.selected=m.selected.filter(i=>i!==idx);
    m.error='';paintImport(m);importHost(m).querySelector(`[data-openapi-index="${idx}"]`)?.focus({preventScroll:true});return true;
  }
  return false;
}

function endpointAlias(url){
  try{
    const target=new URL(url);
    target.searchParams.sort();
    return target.href;
  }catch{return url;}
}
function directEndpointInputs(api){
  let url;
  try{url=new URL(api.url);}catch{return api.inputs.filter(p=>!p.fromAddress);}
  const definitions=[];
  const add=(location,key,label)=>{
    if(definitions.some(p=>p.in===location&&p.key===key))return;
    definitions.push({key,wireName:key,in:location,source:'input',value:label,required:true,type:'string',fromAddress:true});
  };
  for(const match of url.pathname.matchAll(/(?:%7B|\{)([\w.-]+)(?:%7D|\})/gi))add('path',match[1],match[1]);
  for(const [name,value] of url.searchParams){
    const variable=value.match(/^\{([\w.-]+)\}$/);
    if(variable)add('query',name,variable[1]);
  }
  const match=(a,b)=>a.key===b.key&&parameterLocation(api,a)===b.in;
  const inputs=api.inputs.filter(p=>!p.fromAddress||definitions.some(d=>match(p,d)));
  return [...inputs,...definitions.filter(d=>!inputs.some(p=>match(p,d)))];
}

function readServiceAddress(value){
  let parsed;
  try{parsed=new URL(value.trim());}catch{throw Error('http:// 또는 https://로 시작하는 OpenAPI 명세 URL을 입력하세요.');}
  if(!['http:','https:'].includes(parsed.protocol)||parsed.username||parsed.password||parsed.hash)throw Error('계정 정보와 # 표시가 없는 HTTP(S) 명세 URL을 입력하세요.');
  return parsed.href;
}
async function readServiceText(response){
  const limit=2000000;
  if(Number(response.headers?.get('content-length'))>limit)throw Error('2 MB 이내의 서비스 명세를 사용하세요.');
  if(!response.body?.getReader){
    const text=await response.text();
    if(new Blob([text]).size>limit)throw Error('2 MB 이내의 서비스 명세를 사용하세요.');
    return text;
  }
  const reader=response.body.getReader(),decoder=new TextDecoder();
  let bytes=0,body='';
  try{
    for(;;){
      const part=await reader.read();
      if(part.done)return body+decoder.decode();
      bytes+=part.value.byteLength;
      if(bytes>limit){await reader.cancel();throw Error('2 MB 이내의 서비스 명세를 사용하세요.');}
      body+=decoder.decode(part.value,{stream:true});
    }
  }finally{reader.releaseLock();}
}
function parseServiceImport(m,source,options={}){
  m.parsed=getImportOperations(source,options);
  if(typeof lifecyclePrepareImport==='function')lifecyclePrepareImport(m.parsed,m);
  if(!m.parsed.operations.length)throw Error('paths에 가져올 HTTP 기능이 없습니다.');
  const sourceId=importGroupId({servicesource:m.parsed.service,sourceUrl:m.parsed.sourceUrl});
  const registration=state.route==='specRegister'?state.specRegistration:null;
  m.serviceId=registration?.serviceChosen?registration.serviceId:sourceId;
  m.error='';m.selected=[];
  const task=isTaskImport();
  const enabled=m.parsed.operations.map((op,index)=>({op,index,mode:existingImport(op).mode})).filter(({op,mode})=>{
    if(task&&op.spec?.openapi?.deprecated)return false;
    return mode==='new'||task&&['same','existing'].includes(mode);
  });
  if(enabled.length===1)m.selected=[enabled[0].index];
}
async function loadServiceAddress(m){
  let url;
  try{url=readServiceAddress(m.sourceUrl);}catch(e){m.error=e.message;paintImport(m);$('#openapi-url')?.focus();return;}
  m.sourceUrl=url;
  const request=new AbortController();m.fetching=request;m.loading=true;m.error='';
  const timer=setTimeout(()=>request.abort(),10000);
  paintImport(m);
  try{
    const response=await fetch(url,{method:'GET',credentials:'omit',referrerPolicy:'no-referrer',signal:request.signal,headers:{Accept:'application/json, application/yaml, text/yaml, */*'}});
    if(!response.ok)throw Error(`서비스가 HTTP ${response.status} 응답을 반환했습니다. 명세 URL을 확인하세요.`);
    const source=await readServiceText(response);
    if(!isCurrentImport(m)||m.fetching!==request)return;
    if(/^\s*(?:<!doctype\s+html|<html\b)/i.test(source))throw Error('HTML 문서가 열렸습니다. Swagger 화면 주소 대신 서비스의 OpenAPI JSON 또는 YAML 주소를 입력하세요.');
    parseServiceImport(m,source,{sourceUrl:url,resolvedUrl:response.url||url});
  }catch(e){
    if(!isCurrentImport(m)||m.fetching!==request)return;
    m.parsed=null;
    m.error=e.name==='AbortError'?'서비스 응답 시간이 초과됐습니다. 다시 시도하세요.':e instanceof TypeError?'서비스 명세를 읽을 수 없습니다. 사내망 연결과 서비스의 브라우저 접근 허용(CORS)을 확인하거나 명세 파일을 사용하세요.':e.message;
  }finally{
    clearTimeout(timer);
    if(m.fetching===request){m.fetching=null;m.loading=false;if(isCurrentImport(m))paintImport(m,true);}
  }
}

function trialWire(req){
  const lines=[req.method+' '+req.url,...Object.entries(req.headers||{}).map(([k,v])=>k+': '+v)];
  if(req.cookies&&Object.keys(req.cookies).length)lines.push('Cookie: '+Object.entries(req.cookies).map(([k,v])=>k+'='+v).join('; '));
  if(req.body!==null||Object.keys(req.headers||{}).some(key=>key.toLowerCase()==='content-type'))lines.push('',JSON.stringify(req.body,null,2));
  return lines.join('\n');
}
function trialResult(m){

function trialFetchOptions(req,signal){
  if(!/^https?:\/\//i.test(req.url))throw Error('실제 호출에는 서버 주소가 필요합니다. API 명세 편집에서 전체 주소를 지정하세요.');
  const url=new URL(req.url);
  if(url.username||url.password)throw Error('계정 정보가 포함되지 않은 서비스 주소를 사용하세요.');
  if(/(?:^|\.)(?:example|invalid)$/.test(url.hostname))throw Error('예시 전용 서버 주소입니다. 실제 서비스 주소를 등록한 뒤 호출하세요.');
  if(['TRACE','TRACK','CONNECT'].includes(req.method))throw Error('브라우저에서 전송할 수 없는 요청 방식입니다.');
  const forbidden=/^(?:accept-charset|accept-encoding|access-control-request-headers|access-control-request-method|connection|content-length|cookie2?|date|dnt|expect|host|keep-alive|origin|permissions-policy|referer|te|trailer|transfer-encoding|upgrade|via|proxy-.*|sec-.*)$/i;
  if(Object.keys(req.cookies||{}).length||Object.keys(req.headers||{}).some(k=>forbidden.test(k)))throw Error('쿠키나 브라우저가 관리하는 헤더를 요구하는 API는 이 화면에서 그대로 전송할 수 없습니다.');
  const hasBody=req.body!==null||Object.keys(req.headers||{}).some(key=>key.toLowerCase()==='content-type');
  if(hasBody&&['GET','HEAD'].includes(req.method))throw Error('브라우저는 GET·HEAD 요청에 본문을 보낼 수 없습니다.');
  return {method:req.method,headers:req.headers||{},credentials:'omit',referrerPolicy:'no-referrer',redirect:'error',cache:'no-store',signal,
    ...(hasBody?{body:JSON.stringify(req.body)}:{})};
}
async function trialResponseBody(response){
  const limit=192*1024;
  if(!response.body)return {body:'',truncated:false};
  const reader=response.body.getReader(),decoder=new TextDecoder();
  let size=0,body='',truncated=false;
  try{
    while(true){
      const part=await reader.read();if(part.done)break;
      const bytes=part.value.subarray(0,limit-size);
      body+=decoder.decode(bytes,{stream:true});size+=bytes.length;
      if(bytes.length<part.value.length){truncated=true;await reader.cancel();break;}
    }
    body+=decoder.decode();
  }finally{reader.releaseLock();}
  if(!truncated&&/json/i.test(response.headers.get('content-type')||'')){
    try{body=JSON.stringify(JSON.parse(body),null,2);}catch{}
  }
  return {body,truncated};
}
async function sendLiveTrial(m){
  if(m.pending)return;
  const tool=getTool(m.toolId),controller=new AbortController();
  let request,options;
  try{
    request=requestFor(tool.id,m.input,workLocation,tool.api);
    options=trialFetchOptions(request,controller.signal);
  }catch(error){m.response=null;m.error=error.message;refreshTrialOutput(m);return;}
  m.pending=controller;m.error='';m.response=null;paintDialog();
  const started=performance.now(),timeout=setTimeout(()=>controller.abort(),15000);
  try{
    const response=await fetch(request.url,options);
    const content=await trialResponseBody(response);
    if(m.pending!==controller)return;
    m.response={request,status:response.status,statusText:response.statusText,ok:response.ok,elapsed:Math.round(performance.now()-started),...content};
  }catch{
    if(m.pending===controller)m.error=controller.signal.aborted?'15초 안에 응답이 도착하지 않았습니다.':'응답을 읽지 못했습니다. 서비스 주소, 사내망 접속, 브라우저의 교차 출처(CORS) 허용 설정을 확인하세요.';
  }finally{
    clearTimeout(timeout);
    if(m.pending===controller){
      m.pending=null;
      if(modalTop()===m){paintDialog();refreshTrialOutput(m);}
    }
  }
}

  if(el.dataset.business){
    const input=el.dataset.business==='pick'?m.perTool[m.selected]:state.runtime;
    input.extra={...input.extra,[el.dataset.param]:v};return;
  }
  switch(el.id){
    case 'catalog-search':state.search=v;$('#catalog-list').innerHTML=catalogRows();break;
    case 'pick-search':m.q=v;refreshPick();break;
    case 'api-search':m.q=v;$('#api-results').innerHTML=apiResults(m);break;
    case 'pick-query':m.perTool[m.selected].query=v;break;
    case 'add-name':m.name=v;break;
    case 'add-use':m.use=v;break;
    case 'task-name':state.draft.name=v;updateDirty();break;
    case 'task-criteria':state.draft.criteria=v;updateDirty();break;
    case 'run-query':state.runtime.query=v;break;
    case 'decision-reason':state.reason=v;break;
  }
}
function selectChanged(e){
  if(handleOpenapiField(e)||handleTrialInput(e.target)||handleBusinessField(e.target))return;
  const el=e.target,v=el.value,m=modalTop();
  if(el.tagName==='SELECT'&&changeEditorField(el))return;
  switch(el.id){
    case 'scenario':seed(v);break;
    case 'pick-period':m.perTool[m.selected].period=v;break;
    case 'pick-space':m.perTool[m.selected].space=v;break;
    case 'run-period':state.runtime.period=v;break;
    case 'run-space':state.runtime.space=v;break;
    case 'decision-choice':state.decision=v;el.setCustomValidity('');break;
  }
}
document.addEventListener('click',event=>{
  if(event.target===overlay){
    const b=overlay.getBoundingClientRect();if(event.clientX<b.left||event.clientX>b.right||event.clientY<b.top||event.clientY>b.bottom)popModal();return;
  }
  const target=event.target.closest('[data-do]');if(!target||target.disabled)return;
  handleAction(target.dataset.do,target);
});
document.addEventListener('input',inputChanged);
document.addEventListener('change',selectChanged);
document.addEventListener('submit',e=>{
  e.preventDefault();if(e.target.id==='add-form')addTool();
  if(e.target.id==='service-manager-form')saveServiceManagerName();
  if(e.target.id==='edit-api-form')performEditor(true);
  if(e.target.id==='chat-form')sendChat($('#chat-draft').value);
});
overlay.addEventListener('cancel',e=>{e.preventDefault();popModal();});
document.addEventListener('keydown',e=>{
  if(e.isComposing||e.keyCode===229)return;
  if(e.target.id==='chat-draft'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendChat(e.target.value);}
  if(e.key==='Escape'&&!overlay.open&&ui.chat&&root.dataset.overlay==='true'){ui.chat=false;applyLayout();$('#panel-toggle').focus();}
});
window.addEventListener('beforeunload',e=>{
  if(editorDirty()){e.preventDefault();e.returnValue='';}
});
let previousWidth=innerWidth;
window.addEventListener('resize',()=>{
  if(!ui.customNav)ui.compact=innerWidth<900;
  if(innerWidth<1150&&previousWidth>=1150)ui.chat=false;
  previousWidth=innerWidth;applyLayout();
});
document.querySelectorAll('[data-icon]').forEach(el=>el.innerHTML=icon(el.dataset.icon));
$('#scenario').innerHTML=Object.entries(config).map(([key,label])=>option(key,label,'catalog')).join('');
const initial=new URLSearchParams(location.hash.slice(1)).get('scenario');
seed(Object.hasOwn(config,initial)?initial:'catalog');

})();
</script>
