<div id="ees-factory-workspace">
  <style>
    #ees-factory-workspace{--ef-paper:light-dark(#ffffff,#191d23);--ef-side:light-dark(#f5f7fa,#14181e);--ef-soft:light-dark(#f0f4f8,#242e3a);--ef-ink:light-dark(#203249,#e7eef7);--ef-muted:light-dark(#637287,#a8b8cb);--ef-line:light-dark(#dce3ec,#384556);--ef-blue:light-dark(#315f87,#a6cbea);--ef-active:light-dark(#e5eef8,#263c52);--ef-button:light-dark(#315f87,#a6cbea);--ef-button-ink:light-dark(#fff,#172838);--ef-green:light-dark(#216b53,#8ad1b5);--ef-red:light-dark(#b0443b,#f2a098);--ef-red-bg:light-dark(#fdf1ee,#382825);font-family:Inter,'Noto Sans KR','Malgun Gothic',sans-serif;font-size:13px;line-height:1.6;color:var(--ef-ink);width:100%;color-scheme:light dark}
    #ees-factory-workspace *{box-sizing:border-box}

    #ees-factory-workspace .ef-app{display:grid;grid-template-columns:280px minmax(220px,1fr) 300px;min-height:850px;background:var(--ef-paper);border:1px solid var(--ef-line);border-radius:12px;isolation:isolate}
    #ees-factory-workspace .ef-side{background:var(--ef-side);border-right:1px solid var(--ef-line);border-radius:12px 0 0 12px;padding:18px 12px 12px;display:flex;flex-direction:column;gap:15px;min-width:0}
    #ees-factory-workspace .ef-brand{display:flex;align-items:center;gap:9px;padding:0 8px;font-size:15px;font-weight:500}#ees-factory-workspace .ef-logo{display:grid;place-items:center;width:25px;height:25px;border-radius:7px;color:var(--ef-button-ink);background:var(--ef-button)}
    #ees-factory-workspace .ef-icon{width:15px;height:15px;flex:none}#ees-factory-workspace .ef-small{font-size:11px;color:var(--ef-muted)}
    #ees-factory-workspace .ef-quiet{background:none;border:0;border-radius:7px;padding:7px 8px;display:flex;align-items:center;gap:8px;text-align:left}#ees-factory-workspace .ef-quiet:hover,#ees-factory-workspace .ef-node:hover,#ees-factory-workspace .ef-row:hover{background:var(--ef-soft)}
    #ees-factory-workspace .ef-context-pickers{padding:0 6px 13px;border-bottom:1px solid var(--ef-line);display:grid;gap:8px}#ees-factory-workspace .ef-context-pickers label{display:grid;gap:4px;font-size:11px;color:var(--ef-muted)}
    #ees-factory-workspace .ef-context-pickers select{width:100%;min-width:0;padding:8px 9px;border:1px solid var(--ef-line);border-radius:7px;background:var(--ef-paper);color:var(--ef-ink);font-size:13px}
    #ees-factory-workspace .ef-system-line{display:flex;align-items:center;gap:10px}#ees-factory-workspace .ef-system-line label{flex:1;display:flex;align-items:center;gap:12px}#ees-factory-workspace .ef-system-line select{flex:1}
    #ees-factory-workspace .ef-menu-title{padding:0 8px 5px;color:var(--ef-muted);font-size:11px}
    #ees-factory-workspace .ef-category{width:100%;border:0;border-radius:7px;background:none;display:flex;align-items:center;gap:8px;padding:8px;text-align:left;font-weight:500}#ees-factory-workspace .ef-category[aria-expanded=true]{color:var(--ef-blue);background:var(--ef-active)}#ees-factory-workspace .ef-category .ef-chevron{margin-left:auto}
    #ees-factory-workspace .ef-chevron{width:16px;display:inline-block;font-size:17px;text-align:center;flex:none}#ees-factory-workspace .ef-chevron.ef-open{transform:rotate(90deg)}
    #ees-factory-workspace .ef-level{margin:0;padding:0;list-style:none}#ees-factory-workspace .ef-tree{padding:4px 0 8px}#ees-factory-workspace .ef-level .ef-level{margin-left:15px;padding-left:3px;border-left:1px solid var(--ef-line)}
    #ees-factory-workspace .ef-node{display:flex;align-items:flex-start;border-radius:6px;margin:2px 0;min-width:0}#ees-factory-workspace .ef-node.ef-current{background:var(--ef-active);color:var(--ef-blue)}
    #ees-factory-workspace .ef-expand{width:22px;min-height:31px;flex:none;border:0;background:none;padding:4px 0;border-radius:5px}#ees-factory-workspace .ef-leaf-space{width:11px;flex:none}
    #ees-factory-workspace .ef-select{display:flex;gap:6px;align-items:flex-start;min-width:0;flex:1;text-align:left;border:0;background:none;padding:6px 5px 6px 0;border-radius:5px;font-size:12px;line-height:1.5}
    #ees-factory-workspace .ef-kind{flex:none;min-width:16px;height:17px;display:grid;place-items:center;color:var(--ef-muted);border:1px solid var(--ef-line);border-radius:4px;background:var(--ef-paper);font-size:11px}
    #ees-factory-workspace .ef-node-label{flex:1;min-width:0;overflow-wrap:anywhere}#ees-factory-workspace .ef-node-meta{display:flex;gap:5px;flex-wrap:wrap;font-size:11px;color:var(--ef-muted);margin-top:2px}
    #ees-factory-workspace .ef-status{font-size:11px;white-space:nowrap;color:var(--ef-muted)}#ees-factory-workspace .ef-status.done{color:var(--ef-green)}#ees-factory-workspace .ef-status.failed{color:var(--ef-red)}#ees-factory-workspace .ef-status.active{color:var(--ef-blue)}#ees-factory-workspace .ef-excluded{color:var(--ef-muted)}
    #ees-factory-workspace .ef-legend{padding:6px 8px 0;display:flex;gap:12px;color:var(--ef-muted);font-size:11px}#ees-factory-workspace .ef-side-bottom{margin-top:auto;border-top:1px solid var(--ef-line);padding:12px 7px 0;display:flex;align-items:center;gap:8px;color:var(--ef-muted)}
    #ees-factory-workspace .ef-tag{display:inline-flex;align-items:center;border:1px solid var(--ef-line);border-radius:5px;padding:2px 6px;font-size:11px;color:var(--ef-muted);white-space:nowrap}

    #ees-factory-workspace .ef-messages{padding:26px 22px;display:flex;flex-direction:column;gap:25px;flex:1;min-height:330px}#ees-factory-workspace .ef-question{align-self:flex-end;max-width:95%;border-radius:12px;padding:11px 13px;background:var(--ef-soft);overflow-wrap:anywhere}#ees-factory-workspace .ef-answer{overflow-wrap:anywhere}#ees-factory-workspace .ef-answer-name{display:flex;align-items:center;gap:7px;color:var(--ef-muted);font-size:11px;margin-bottom:10px}#ees-factory-workspace .ef-answer p{white-space:pre-line}
    #ees-factory-workspace .ef-welcome{padding:25px 0}#ees-factory-workspace .ef-welcome p{margin-top:12px;color:var(--ef-muted)}
    #ees-factory-workspace .ef-chat-link{border:1px solid var(--ef-line);border-radius:8px;padding:10px 12px;background:var(--ef-paper);color:var(--ef-blue);display:flex;gap:8px;align-items:center;margin-top:14px;text-align:left;width:100%}
    #ees-factory-workspace .ef-composer{margin:0 15px 14px;border:1px solid var(--ef-line);border-radius:13px;padding:12px;background:var(--ef-paper)}#ees-factory-workspace .ef-composer textarea{display:block;width:100%;border:0;background:none;resize:vertical;min-height:62px;padding:0;outline-offset:4px}#ees-factory-workspace .ef-composer textarea::placeholder{color:var(--ef-muted)}
    #ees-factory-workspace .ef-composer-bottom{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px}#ees-factory-workspace .ef-model{max-width:85%;border:0;background:var(--ef-paper);color:var(--ef-muted);font-size:11px;min-width:0;padding:5px 0}#ees-factory-workspace .ef-send{width:30px;height:30px;border:0;border-radius:50%;display:grid;place-items:center;background:var(--ef-button);color:var(--ef-button-ink);flex:none}
    #ees-factory-workspace .ef-chat-note{text-align:center;font-size:11px;color:var(--ef-muted);margin:0 12px 12px}
    #ees-factory-workspace .ef-panel{border-left:1px solid var(--ef-line);border-radius:0 12px 12px 0;display:flex;flex-direction:column;min-width:0;background:var(--ef-paper)}#ees-factory-workspace .ef-panel-head{min-height:62px;padding:14px 17px;display:flex;align-items:center;justify-content:space-between;gap:7px;border-bottom:1px solid var(--ef-line)}
    #ees-factory-workspace .ef-tabs{display:flex;padding:0 16px;border-bottom:1px solid var(--ef-line);gap:17px}#ees-factory-workspace .ef-tabs button{border:0;border-bottom:2px solid transparent;padding:11px 0;background:none;color:var(--ef-muted);font-size:12px}#ees-factory-workspace .ef-tabs button[aria-selected=true]{border-bottom-color:var(--ef-blue);color:var(--ef-blue)}
    #ees-factory-workspace .ef-panel-main{padding:20px 18px;display:flex;flex-direction:column;gap:18px;flex:1}#ees-factory-workspace .ef-overline{font-size:11px;color:var(--ef-muted);margin-bottom:6px}#ees-factory-workspace .ef-description{font-size:12px;color:var(--ef-muted);margin-top:9px;overflow-wrap:anywhere}#ees-factory-workspace .ef-path{font-size:11px;color:var(--ef-muted);overflow-wrap:anywhere}
    #ees-factory-workspace .ef-section{border-top:1px solid var(--ef-line);padding-top:14px}#ees-factory-workspace .ef-section h3{font-size:12px;margin-bottom:10px}#ees-factory-workspace .ef-line{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12px}
    #ees-factory-workspace .ef-progress{height:4px;background:var(--ef-soft);border-radius:2px;margin-top:10px}#ees-factory-workspace .ef-progress div{height:100%;background:var(--ef-blue);border-radius:2px}
    #ees-factory-workspace .ef-row{display:flex;align-items:flex-start;gap:8px;width:100%;padding:10px 0;text-align:left;border:0;border-bottom:1px solid var(--ef-line);background:none;font-size:12px}#ees-factory-workspace .ef-row:last-child{border-bottom:0}#ees-factory-workspace .ef-row-label{flex:1;min-width:0;overflow-wrap:anywhere}#ees-factory-workspace .ef-row small{display:block;font-size:11px;color:var(--ef-muted);margin-top:3px}
    #ees-factory-workspace .ef-tools{list-style:none;padding:0;margin:0;display:grid;gap:13px}#ees-factory-workspace .ef-tools li{display:flex;gap:8px;align-items:flex-start;font-size:12px}#ees-factory-workspace .ef-tools .ef-tool-label{flex:1;min-width:0}#ees-factory-workspace .ef-tools small{display:block;margin-top:3px;font-size:11px;color:var(--ef-muted)}#ees-factory-workspace .ef-step{width:17px;flex:none;color:var(--ef-muted);font-size:11px}
    #ees-factory-workspace .ef-notice{padding:11px 12px;border-radius:7px;background:var(--ef-soft);font-size:12px;color:var(--ef-muted)}#ees-factory-workspace .ef-notice.failed{background:var(--ef-red-bg);color:var(--ef-red)}#ees-factory-workspace .ef-notice strong{display:block;margin-bottom:4px}
    #ees-factory-workspace .ef-facts{margin:0;display:grid;gap:7px;font-size:11px}#ees-factory-workspace .ef-facts div{display:flex;justify-content:space-between;gap:12px}#ees-factory-workspace .ef-facts dt{color:var(--ef-muted)}#ees-factory-workspace .ef-facts dd{margin:0;text-align:right;overflow-wrap:anywhere}
    #ees-factory-workspace .ef-panel-foot{padding:15px 18px;border-top:1px solid var(--ef-line);margin-top:auto;display:grid;gap:8px}#ees-factory-workspace .ef-primary{border:1px solid var(--ef-button);border-radius:7px;background:var(--ef-button);color:var(--ef-button-ink);padding:9px 12px;font-weight:500;text-align:center}#ees-factory-workspace .ef-secondary{border:1px solid var(--ef-line);border-radius:7px;background:var(--ef-paper);padding:8px 12px;text-align:center}#ees-factory-workspace .ef-foot-note{font-size:11px;color:var(--ef-muted);text-align:center}
    #ees-factory-workspace .ef-back{border:0;background:none;color:var(--ef-blue);padding:0;text-align:left;align-self:flex-start;font-size:12px}#ees-factory-workspace .ef-review{display:grid;gap:5px;font-size:12px}#ees-factory-workspace .ef-review textarea{width:100%;min-width:0;border:1px solid var(--ef-line);border-radius:7px;background:var(--ef-paper);padding:8px;resize:vertical}
    #ees-factory-workspace .ef-live{font-size:11px;color:var(--ef-muted);padding:7px 12px;min-height:31px}#ees-factory-workspace .ef-live:empty{display:none}
    @media(max-width:880px){#ees-factory-workspace .ef-app{grid-template-columns:268px minmax(0,1fr)}#ees-factory-workspace .ef-side{grid-row:1/3}#ees-factory-workspace .ef-panel{grid-column:2;border-left:0;border-top:1px solid var(--ef-line)}#ees-factory-workspace .ef-messages{min-height:230px}#ees-factory-workspace .ef-chat{min-height:540px}}
    @media(max-width:580px){#ees-factory-workspace .ef-app{display:flex;flex-direction:column}#ees-factory-workspace .ef-side{border-right:0;border-bottom:1px solid var(--ef-line);border-radius:12px 12px 0 0}#ees-factory-workspace .ef-side-bottom{display:none}#ees-factory-workspace .ef-chat{min-height:470px}#ees-factory-workspace .ef-panel{border-radius:0 0 12px 12px}#ees-factory-workspace .ef-context-pickers select,#ees-factory-workspace .ef-model,#ees-factory-workspace textarea{font-size:16px}}
    @media(pointer:coarse){#ees-factory-workspace .ef-expand,#ees-factory-workspace .ef-select,#ees-factory-workspace .ef-category,#ees-factory-workspace .ef-quiet,#ees-factory-workspace .ef-back,#ees-factory-workspace .ef-tabs button{min-height:44px}#ees-factory-workspace .ef-expand{width:32px}#ees-factory-workspace .ef-send{width:44px;height:44px}}
  </style>
  <div class="ef-app">
    <aside class="ef-side" aria-label="공장별 업무 탐색">
      <div class="ef-brand"><span class="ef-logo">E</span>EES Portal</div>
      <button type="button" class="ef-quiet" data-action="new-chat"><i class="ef-icon" data-lucide="message-circle" aria-hidden="true"></i>일반 대화</button>
      <div class="ef-context-pickers">
        <label>작업 공장<select id="ef-factory" aria-label="작업 공장"><option value="us">미국 · A공장</option><option value="hu">헝가리 · A공장</option><option value="kr">한국 · 천안 공장</option></select></label>
        <div class="ef-system-line"><label>시스템<select id="ef-system" aria-label="작업 시스템"><option>EMS</option><option>APC</option><option>FDC</option><option>EGIS</option><option>EPT</option></select></label></div>
      </div>
      <section><div class="ef-menu-title">업무 · 선택한 공장의 현재 진행</div><nav id="ef-categories" aria-label="업무 절차"></nav><div class="ef-legend"><span>P 프로세스</span><span>T 태스크</span><span>J 잡</span></div></section>
      <section><div class="ef-menu-title">워크스페이스</div><button type="button" class="ef-quiet" data-action="workspace"><i class="ef-icon" data-lucide="workflow" aria-hidden="true"></i>업무 절차</button></section>
      <div class="ef-side-bottom"><i class="ef-icon" data-lucide="circle-user-round" aria-hidden="true"></i><span>김광재</span><span class="ef-tag" style="margin-left:auto">UX 시안</span></div>
    </aside>
    <main class="ef-chat" aria-label="메인 AI 대화">
      <div class="ef-chat-head"><strong>AI 대화</strong><span class="ef-small" id="ef-chat-mode">업무 대화</span></div>
      <div class="ef-chat-scope" id="ef-chat-scope"></div>
      <div class="ef-chat-focus" id="ef-chat-focus"></div>
      <div class="ef-messages" id="ef-messages"></div>
      <div class="ef-composer"><textarea id="ef-message" rows="2" aria-label="AI에게 메시지" placeholder="이 작업에 대해 AI에게 물어보세요"></textarea><div class="ef-composer-bottom"><select id="ef-model" class="ef-model" aria-label="대화 모델"><option>EES 통합 Assistant</option><option>EES 시스템 전문가</option></select><button type="button" class="ef-send" data-action="send" aria-label="메시지 보내기">↑</button></div></div>
      <div class="ef-chat-note">시연용 대화 · 실제 시스템 호출 없음</div>
    </main>
    <aside class="ef-panel" id="ef-panel" aria-label="선택한 업무의 작업 패널"></aside>
  </div>
  <div class="ef-live" id="ef-live" aria-live="polite"></div>
  <script>
    (()=>{
      const root=document.getElementById('ees-factory-workspace'),q=s=>root.querySelector(s);
      const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      const icon=n=>`<i class="ef-icon" data-lucide="${n}" aria-hidden="true"></i>`;
      const button=(label,action,kind='ef-primary',attrs='')=>`<button type="button" class="${kind}" data-action="${action}" ${attrs}>${label}</button>`;
      const labels={p:'프로세스',t:'태스크',j:'잡'},factories={us:'미국 · A공장',hu:'헝가리 · A공장',kr:'한국 · 천안 공장'};
      const categories=[{id:'setup',name:'셋업',icon:'layers',roots:['rollout','line','upgrade']},{id:'ops',name:'운영',icon:'activity',roots:['daily','wo']},{id:'incident',name:'장애대응',icon:'circle-alert',roots:['ap-incident','interface-incident']}];
      const nodes={
        rollout:{name:'신규 공장 횡전개',type:'p',children:['prep','infra','install','interface'],description:'공장 조건에 맞춰 시스템을 설치하고 연결을 검증합니다.'},
        prep:{name:'사전준비',type:'t',parent:'rollout',children:['scope','checklist'],description:'셋업 범위와 현장 요구사항을 확인합니다.'},
        scope:{name:'셋업 범위 확인',type:'j',parent:'prep',manual:true},
        checklist:{name:'현장 요구사항 확인',type:'j',parent:'prep',manual:true},
        infra:{name:'AP, DB 인프라 준비',type:'t',parent:'rollout',children:['ap-ready','db-ready'],description:'설치에 필요한 AP와 DB 환경을 준비합니다.'},
        'ap-ready':{name:'AP 환경 확인',type:'j',parent:'infra'},'db-ready':{name:'DB 환경 확인',type:'j',parent:'infra'},
        install:{name:'시스템 설치',type:'t',parent:'rollout',children:['install-check','db','ap'],description:'설치 상태와 DB·AP 연결을 확인합니다.'},
        'install-check':{name:'설치·설정 확인',type:'j',parent:'install'},
        db:{name:'DB 연결 확인',type:'j',parent:'install',description:'대상 DB의 연결과 읽기 기능을 점검합니다.',tools:[['진단 경로 확인','등록된 경로의 접근 상태'],['대상 DB 식별','공장·시스템과 DB 일치 여부'],['읽기 기능 점검','읽기 요청의 정상 응답']]},
        ap:{name:'AP 연결 확인',type:'j',parent:'install',description:'등록된 도구를 순서대로 실행하고 AP의 정상 응답을 확인합니다.',tools:[['AP 응답 확인','서버 접근 및 응답 여부'],['상태 API 점검','서비스 상태 응답 · HTTP 200'],['기본 기능 점검','주요 기능의 정상 응답']]},
        interface:{name:'시스템 간 인터페이스 확인',type:'t',parent:'rollout',children:['interface-check','legacy-check'],description:'연동 대상별 데이터 전달과 응답을 확인합니다.'},
        'interface-check':{name:'시스템 연동 검증',type:'j',parent:'interface'},'legacy-check':{name:'기존 시스템 연동',type:'j',parent:'interface'},

      function announce(text){q('#ef-live').textContent=text;}
      function next(){const r=run(),ids=leaves(process(selected()));const id=ids.find(k=>r?.statuses[k]==='failed')||ids.find(k=>!['done','excluded'].includes(r?.statuses[k]));if(id)select(id);}
      function start(){const ss=session(),p=process(selected()),old=ss.current;if(old&&summary(p,old).state!=='done'){next();return;}if(old)ss.history.unshift(old);const states=Object.fromEntries(leaves(p).map(k=>[k,k==='legacy-check'?'excluded':'waiting']));const todayCount=ss.history.filter(h=>h.date==='2026.09.14').length;const r=makeRun(p,'2026.09.14',states,nodes[p].repeat?'9월 14일 일일 점검 · '+(todayCount+1)+'회':nodes[p].name+' · '+(ss.history.length+1)+'차');r.messages=ss.preview.messages.slice();r.draft=ss.preview.draft;r.model=ss.preview.model;ss.preview=newChat();r.messages.push({role:'assistant',text:factories[factory]+' · '+system+'에서 ‘'+nodes[p].name+'’를 시작했어요. 공장 조건과 절차 '+r.version+'을 적용했습니다.'});ss.current=r;general=false;next();announce(factories[factory]+' · '+system+'의 새 실행을 시작했습니다.');}
      function execute(){const r=run(),id=selected();if(!r||nodes[id].children||['done','excluded'].includes(r.statuses[id])||blocker(id,r))return;if(nodes[id].manual&&!r.notes[id]?.trim()){announce('확인 내용을 입력한 뒤 완료해 주세요.');q('#ef-review-note')?.focus();return;}r.statuses[id]='done';(r.attempts[id]||(r.attempts[id]=[])).push({label:'09.14 11:00 · '+((r.attempts[id]?.length||0)+1)+'차',status:'done'});if(summary(process(id),r).state==='done')r.completedAt='2026.09.14 11:00';r.messages.push({role:'assistant',text:nodes[id].name+'의 '+(nodes[id].manual?'담당자 확인을 기록했어요.':'필수 점검이 모두 통과했어요. 목업 결과를 작업 패널과 트리에 반영했습니다.')});render();announce(nodes[id].name+' 완료 · 상위 작업의 진행 상태도 갱신했습니다.');}
      function send(){const c=chat(),text=q('#ef-message').value.trim();if(!text)return;c.messages.push({role:'user',text});c.draft='';let answer;if(general)answer='일반 대화로 질문을 받았어요. 공장 업무를 함께 확인하려면 왼쪽에서 프로세스나 작업을 선택해 주세요.';else{const n=nodes[selected()],r=run(),v=summary(process(selected()),r);if(/실행|점검해|재시도/.test(text))answer='‘'+n.name+'’의 대상과 점검 항목을 오른쪽에 표시했어요. 확인한 뒤 실행 버튼을 누르면 목업 점검 결과가 반영됩니다.';else if(/실패|원인|왜/.test(text)&&r?.statuses.ap==='failed')answer='AP 접근은 성공했지만 상태 API 응답 시간이 초과됐어요. 이 때문에 기본 기능 점검이 대기 중입니다. AP 서비스 상태와 상태 API 경로를 확인한 뒤 다시 점검할 수 있어요.';else answer=factories[factory]+' · '+system+'의 ‘'+nodes[process(selected())].name+'’'+(r?'는 '+v.total+'개 적용 대상 잡 중 '+v.done+'개가 완료됐어요.':'는 아직 시작 전이에요.')+'\n\n현재 선택한 작업은 ‘'+n.name+'’입니다. '+(n.description||'오른쪽에서 점검 기준과 적용 조건을 확인할 수 있어요.');}c.messages.push({role:'assistant',text:answer,model:c.model});renderChat();icons();}
      root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||!root.contains(b))return;if(b.dataset.select){select(b.dataset.select);return;}if(b.dataset.expand){const s=scope().expanded;s.has(b.dataset.expand)?s.delete(b.dataset.expand):s.add(b.dataset.expand);renderNav();icons();return;}if(b.dataset.category){const s=scope(),c=categories.find(c=>c.id===b.dataset.category);if(s.category===c.id){s.category=null;renderNav();icons();}else{select(c.roots.includes(process(selected()))?selected():c.roots[0]);if(c.id==='ops'){s.expanded.add('daily');s.expanded.add('daily-health');renderNav();icons();}}return;}if(b.dataset.history){historyId=b.dataset.history;renderPanel();icons();return;}const a=b.dataset.action;if(a==='current'){workspace=false;tab='current';historyId=null;renderPanel();icons();}else if(a==='history'){workspace=false;tab='history';historyId=null;renderPanel();icons();}else if(a==='start')start();else if(a==='next')next();else if(a==='process')select(process(selected()));else if(a==='run')execute();else if(a==='send')send();else if(a==='new-chat'){general=true;workspace=false;render();}else if(a==='workspace'){workspace=true;renderPanel();icons();}});
      root.addEventListener('change',e=>{if(e.target.id==='ef-factory'||e.target.id==='ef-system'){factory=q('#ef-factory').value;system=q('#ef-system').value;general=false;workspace=false;tab='current';historyId=null;render();announce(factories[factory]+' · '+system+'로 전환했습니다. 이 실행의 대화와 작성 중인 메시지를 이어갑니다.');}else if(e.target.id==='ef-model')chat().model=e.target.value;});
      root.addEventListener('input',e=>{if(e.target.id==='ef-message')chat().draft=e.target.value;if(e.target.id==='ef-review-note'&&run())run().notes[selected()]=e.target.value;});
      root.addEventListener('keydown',e=>{if(e.target.id==='ef-message'&&e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send();}});
      render();
    })();
  </script>
</div>
