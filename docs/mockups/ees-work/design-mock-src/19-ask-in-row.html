<!-- Mock only: the guide strip above the frame. Not product UI; excluded from comparison. -->
<style data-mock-frame>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}
body{display:flex;flex-direction:column}
.mk-guide{flex:none;position:relative;z-index:90;font:400 13px/20px var(--ees-font-sans);color:var(--ees-text-primary);background:#fff;border-bottom:1px dashed var(--ees-text-tertiary);padding:8px 16px 10px}
.mk-guide *{box-sizing:border-box}
.mk-row{display:flex;align-items:center;gap:8px 16px;flex-wrap:wrap;min-width:0}
.mk-tag{font-size:12px;line-height:18px;font-weight:500;padding:4px 8px;border:1px dashed var(--ees-text-secondary);border-radius:2px;white-space:nowrap}
.mk-group{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0}
.mk-guide button{font:inherit;font-size:13px;line-height:20px;font-weight:500;color:var(--ees-text-primary);background:#fff;border:1px solid var(--ees-line-control);border-radius:2px;min-height:28px;padding:0 10px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.mk-guide button small{font-size:12px;font-weight:400;color:var(--ees-text-secondary)}
.mk-guide button:hover{background:var(--ees-surface-hover)}
.mk-guide button[aria-pressed="true"]{background:var(--ees-surface-selected);border-color:var(--ees-text-primary)}
.mk-guide button:focus-visible{outline:2px solid var(--ees-text-primary);outline-offset:2px}
.mk-guide [hidden]{display:none!important}
.mk-guide .mk-fold{margin-left:auto;border-color:transparent}
.mk-text{margin:6px 0 0;display:flex;flex-wrap:wrap;gap:2px 20px;min-width:0}
.mk-text b{font-weight:400;font-size:12px;color:var(--ees-text-secondary);margin-right:6px}
.mk-words{margin:8px 0 0;border-collapse:collapse;font-size:12px;line-height:18px}
.mk-words th,.mk-words td{text-align:left;font-weight:400;padding:2px 20px 2px 0;vertical-align:top}
.mk-words th{color:var(--ees-text-secondary)}
.mk-guide[data-collapsed="true"] :is(.mk-hide,.mk-text){display:none}
.mk-stage{flex:1;min-height:0;display:flex;position:relative}
</style>
<!-- Context only: the frame around the work panel (left menu shell, top bar, chat). The product draws these in its
     Svelte shell; the mock copies their measured sizes and colours. The left menu content and the work panel use the
     product's own markup and style sheet. -->
<style data-mock-context="frame">
.fu-shell{flex:1;min-width:0;display:grid;grid-template-columns:256px minmax(0,1fr) 560px;color:var(--ees-text-primary);font:400 14px/20px var(--ees-font-sans);letter-spacing:0}
.fu-shell *{box-sizing:border-box}
.fu-side{background:var(--ees-surface-sidebar);border-right:1px solid var(--ees-line-divider);display:flex;flex-direction:column;min-height:0}
.fu-brand{height:48px;flex:none;display:flex;align-items:center;gap:8px;padding:0 10px;font-weight:700;font-size:15px}
.fu-logo{width:22px;height:22px;border-radius:6px;background:var(--ees-brand-solid);color:#fff;font-size:12px;display:grid;place-items:center}
.fu-side #ees-work-entry{flex:1;min-height:0;overflow:auto;padding:0 8px}
.fu-user{flex:none;height:52px;display:flex;align-items:center;gap:10px;padding:0 14px;border-top:1px solid var(--ees-line-divider);font-size:14px}
.fu-user i{width:22px;height:22px;border-radius:50%;background:var(--ees-line-control)}
.fu-main{display:flex;flex-direction:column;min-width:0;min-height:0;background:#fff}
.fu-top{height:48px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid var(--ees-line-divider)}
.fu-top strong{font-size:15px;font-weight:700}
.fu-top span{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;border:1px solid var(--ees-line-control);border-radius:6px;font-size:13px}
.fu-main #ees-work-panel{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;background:#fff}
.fu-main #ees-work-panel>div{flex:1;min-height:0}
.fu-chat{border-left:1px solid var(--ees-line-divider);display:flex;flex-direction:column;min-height:0;background:#fff}
.fu-chat header{height:48px;flex:none;display:flex;align-items:center;padding:0 12px;font-size:14px}
.fu-chat-empty{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 80px;font-size:30px;line-height:36px;color:var(--ees-text-disabled,#8c93a0)}
.fu-chat-empty b{color:var(--ees-text-primary);font-weight:400}
.fu-chat-input{margin:0 24px 16px;height:86px;border:1px solid var(--ees-text-primary);border-radius:8px;padding:16px;font-size:14px;color:var(--ees-text-secondary)}
.fu-toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);max-width:min(560px,calc(100% - 32px));padding:10px 16px;border-radius:4px;background:#fff;color:var(--ees-text-primary);border:1px solid var(--ees-line-control);font:400 13px/20px var(--ees-font-sans);z-index:80;box-shadow:0 4px 16px #1d21281f}
@media (max-width:1500px){.fu-shell{grid-template-columns:256px minmax(0,1fr) 420px}}
@media (max-width:1180px){.fu-shell{grid-template-columns:56px minmax(0,1fr)}.fu-chat,.fu-side #ees-work-entry,.fu-brand strong,.fu-user span{display:none}}
</style>
<!-- New screen CSS for this proposal. Written with product tokens; to be reused when a version of this mock is
     chosen for the product. -->
<style data-new-screen="ask-in-row">
/* 2판 · a job opens under its row. What the job asks, its run control, what came back and the answer are all
   in that one place. A closed row keeps its name, its state and one shortcut. */
[data-ees-work-surface] #ees-work-panel.ew-vd .ew-vd-toggle{display:inline-grid;place-items:center;flex:none;width:28px;height:28px;padding:0;border:0;border-radius:6px;background:transparent;cursor:pointer}
[data-ees-work-surface] #ees-work-panel.ew-vd .ew-vd-toggle:hover{background:var(--ees-surface-hover)}
[data-ees-work-surface] #ees-work-panel.ew-vd .ew-vd-toggle:focus-visible{outline:2px solid var(--ees-brand-text);outline-offset:2px}
[data-ees-work-surface] #ees-work-panel.ew-vd .ew-vd-toggle[aria-expanded=true] .ew-icon{transform:rotate(180deg)}
[data-ees-work-surface] #ees-work-panel.ew-vd button.ew-vd-name{cursor:pointer}
[data-ees-work-surface] #ees-work-panel.ew-vd .ew-vd-detail{display:grid;gap:14px;padding:4px 16px 18px 50px}
[data-ees-work-surface] #ees-work-panel.ew-vd .ew-vd-detail>p{margin:0;max-width:720px;font-size:13px;line-height:20px;color:var(--ees-text-secondary)}
/* the fields and the control that uses them sit on one line; a field keeps the size of what it holds */
[data-ees-work-surface] #ees-work-panel.ew-vd .ew-vd-ask-row{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 16px}
[data-ees-work-surface] #ees-work-panel.ew-vd .ew-vd-ask{display:grid;gap:4px;min-width:0;font-size:12px;line-height:18px;color:var(--ees-text-secondary)}
[data-ees-work-surface] #ees-work-panel.ew-vd .ew-vd-ask>span:last-child{display:inline-flex;align-items:center;gap:6px}
[data-ees-work-surface] #ees-work-panel.ew-vd .ew-vd-ask input{box-sizing:border-box;width:148px;min-height:32px;height:32px;margin:0;padding:0 10px;border:1px solid var(--ees-line-control);border-radius:6px;background:var(--ees-surface-default);font:inherit;font-size:13px;line-height:20px;color:var(--ees-text-primary)}
[data-ees-work-surface] #ees-work-panel.ew-vd .ew-vd-ask input::placeholder{color:var(--ees-text-tertiary)}
[data-ees-work-surface] #ees-work-panel.ew-vd .ew-vd-ask input:focus-visible{outline:2px solid var(--ees-brand-text);outline-offset:1px}
[data-ees-work-surface] #ees-work-panel.ew-vd .ew-vd-ask input:disabled{background:var(--ees-surface-muted);color:var(--ees-text-tertiary)}
[data-ees-work-surface] #ees-work-panel.ew-vd .ew-vd-ask input[aria-invalid=true]{border-color:var(--ees-status-danger)}
[data-ees-work-surface] #ees-work-panel.ew-vd .ew-vd-ask[data-kind=number] input{width:76px;text-align:right}
/* what is wrong with the value is said at the field, not in a window or a banner */
[data-ees-work-surface] #ees-work-panel.ew-vd .ew-vd-ask-error{align-self:center;font-size:12px;line-height:18px;color:var(--ees-status-danger);white-space:nowrap}
/* a value that an earlier job hands over is shown, not asked */
[data-ees-work-surface] #ees-work-panel.ew-vd .ew-vd-given{display:inline-flex;align-items:center;gap:6px;min-height:32px;font-size:12px;line-height:18px;color:var(--ees-text-secondary);white-space:nowrap}
[data-ees-work-surface] #ees-work-panel.ew-vd .ew-vd-given b{font-size:13px;font-weight:500;color:var(--ees-text-primary)}
/* what came back, right where the answer is given */
[data-ees-work-surface] #ees-work-panel.ew-vd .ew-vd-result{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:4px 16px;max-width:560px;margin:0;padding:10px 12px;border:1px solid var(--ees-line-divider);border-radius:6px;background:var(--ees-surface-default);font-size:13px;line-height:20px}
[data-ees-work-surface] #ees-work-panel.ew-vd .ew-vd-result dt{color:var(--ees-text-secondary)}
[data-ees-work-surface] #ees-work-panel.ew-vd .ew-vd-result dd{margin:0;color:var(--ees-text-primary);overflow-wrap:anywhere}
[data-ees-work-surface] #ees-work-panel.ew-vd ol.ew-vd-result{grid-template-columns:minmax(0,1fr) max-content;list-style:none}
[data-ees-work-surface] #ees-work-panel.ew-vd ol.ew-vd-result li{display:contents}
[data-ees-work-surface] #ees-work-panel.ew-vd ol.ew-vd-result small{font-size:12px;color:var(--ees-text-secondary)}
[data-ees-work-surface] #ees-work-panel.ew-vd .ew-vd-answer{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
[data-ees-work-surface] #ees-work-panel.ew-vd .ew-vd-answer>small{font-size:12px;color:var(--ees-text-secondary)}
[data-ees-work-surface] #ees-work-panel.ew-vd .ew-vd-detail .ew-secondary{min-height:32px;padding:0 14px}
</style>
</head>
<body>
<div class="mk-guide" id="mock-guide" data-collapsed="false" role="region" aria-label="시안 안내 · 제품 화면 아님">
 <div class="mk-row">
  <strong class="mk-tag" id="mock-badge">시안 2 · 저장·실행 안 됨 · SQ1</strong>
  <div class="mk-group mk-hide" role="group" aria-label="화면 바로 보기">
   <button data-step="SQ1" aria-pressed="true">절차 첫 화면 <small>SQ1</small></button>
   <button data-step="SQ2" aria-pressed="false">값 넣기 전 <small>SQ2</small></button>
   <button data-step="SQ3" aria-pressed="false">값이 틀렸을 때 <small>SQ3</small></button>
   <button data-step="SQ4" aria-pressed="false">실행한 뒤 <small>SQ4</small></button>
   <button data-step="SQ5" aria-pressed="false">다음 작업 <small>SQ5</small></button>
   <button data-step="SQ6" aria-pressed="false">사람이 확인하는 작업 <small>SQ6</small></button>
  </div>
  <button class="mk-fold" id="mock-fold" aria-expanded="true">안내 접기</button>
 </div>
 <p class="mk-text" id="mock-step-text"></p>
</div>
<div class="mk-stage" id="mock-stage">
<div class="fu-shell" id="fu-shell">
 <aside class="fu-side" aria-label="탐색" data-ees-source-sidebar data-compact="false">
  <div class="fu-brand"><span class="fu-logo">E</span><strong>EES Workflow</strong></div>
  <section id="ees-work-entry" data-ees-work data-work-mode="work" aria-label="업무 탐색"></section>
  <div class="fu-user"><i></i><span>공용 계정 담당자</span></div>
 </aside>
 <main class="fu-main" data-ees-work-surface>
  <header class="fu-top"><strong>업무</strong><span><img class="ew-icon" src="v4/093d6.svg" alt="">대화</span></header>
  <section id="ees-work-panel" class="ew-vd" tabindex="-1" data-ees-work data-ees-source-slot aria-label="업무 패널" data-ees-mode="work"></section>
 </main>
 <aside class="fu-chat" aria-label="업무 도우미 대화(맥락)">
  <header>업무 도우미</header>
  <div class="fu-chat-empty"><b>업무 도우미</b>무엇을 도와드릴까요?</div>
  <div class="fu-chat-input">업무를 물어보거나, 필요한 작업을 요청하세요</div>
 </aside>
</div>
</div>
<div class="fu-toast" id="mock-toast" role="status" hidden></div>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s),panel=$('#ees-work-panel'),entry=$('#ees-work-entry'),guide=$('#mock-guide');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// Icon files are written out in full so the mock builder can embed each one.
const ICON={
 '093d6':'v4/093d6.svg',
 '126c7':'v4/126c7.svg',
 '40095':'v4/40095.svg',
 '4df0d':'v4/4df0d.svg',
 '4fb09':'v4/4fb09.svg',
 '69549':'v4/69549.svg',
 'a953c':'v4/a953c.svg',
 'c325d':'v4/c325d.svg',
 'cece5':'v4/cece5.svg',
 'ead50':'v4/ead50.svg',
 'f17e6':'v4/f17e6.svg',
 'f34f3':'v4/f34f3.svg',
 'f6bbc':'v4/f6bbc.svg'
};
const I=n=>`<img class="ew-icon" src="${ICON[n]}" alt="" aria-hidden="true">`;
const PLAY='<svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M4.5 2.75L11 7L4.5 11.25V2.75Z" stroke="currentColor" stroke-width="1.25" stroke-linejoin="round"/></svg>';
const RETRY='<svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M13 8a5 5 0 1 1-1.5-3.6M13 2.5V5h-2.5" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/></svg>';
// What each mock screen shows and what differs from the product today. Guide text only.
const SCREENS={
 SQ1:{when:'업무 › 운영에서 값을 묻는 절차를 열었을 때',change:'‘시작’을 눌러도 ‘실행 준비’ 창이 뜨지 않음. 값은 그 값을 쓰는 작업 안에서 물음'},
 SQ2:{when:'단계 화면 · 값을 넣기 전(시작 전에 들어와도 같음)',change:'값을 물어야 하는 작업이 펼쳐진 채로 나옴. 그 안에 페이지 ID 칸과 ‘실행’이 있고, 누르면 시작과 실행이 한 번에 됨. 작업 이름을 누르면 접고 펼침'},
 SQ3:{when:'값이 비었거나 숫자가 아닌데 ‘실행’을 눌렀을 때',change:'창이나 화면 위 오류 줄 대신 그 칸에 표시'},
 SQ4:{when:'실행한 뒤',change:'조회한 내용이 바로 아래에 보이고 그 자리에서 ‘적합’을 누름. 넣은 값은 그대로 남음'},
 SQ5:{when:'기준 문서를 적합으로 확인한 뒤',change:'확인한 작업은 접히고 다음 작업이 펼쳐짐. 넘어온 값이 보이고 ‘실행’ 한 번'},
 SQ6:{when:'사람이 확인하는 작업이 값을 물을 때',change:'펼친 곳에 값 칸과 ‘적합’이 있음. 값을 묻지 않는 작업은 접힌 줄에서 바로 ‘적합’'}
};
const PAGE='123456789';
const fresh=()=>({screen:'SQ1',proc:'guide',view:'overview',started:false,open:'',id:'',idError:'',page:'idle',verdict:'',child:'idle',childDone:false,menu:'',
 pressure:'',temp:'',valueError:false,pump:'',note:'',last:''});
let S=fresh();
// Jumping from the guide prepares the state a person would have reached by then.
const PRESET={
 SQ1:s=>s,
 SQ2:s=>Object.assign(s,{view:'stage',open:'page'}),
 SQ3:s=>Object.assign(s,{view:'stage',started:true,open:'page',id:'기준 문서',idError:'숫자만 넣어 주세요'}),
 SQ4:s=>Object.assign(s,{view:'stage',started:true,open:'page',id:PAGE,page:'done',ranId:PAGE,ranAt:now()}),
 SQ5:s=>Object.assign(s,{view:'stage',started:true,open:'child',id:PAGE,page:'done',verdict:'적합',ranId:PAGE,ranAt:now()}),
 SQ6:s=>Object.assign(s,{proc:'check',view:'stage',started:true,open:'pump'})
};
function toast(text){const t=$('#mock-toast');t.textContent=text;t.hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>{t.hidden=true;},2600);}
const NOT_HERE='시안입니다. 이 단추는 이번 시안에서 다루지 않습니다.';
const PROCS={guide:{name:'Confluence 문서 확인 가이드',stage:'문서 구조 확인',jobs:2},check:{name:'주간 설비 점검',stage:'점검',jobs:2}};
const now=()=>{const d=new Date();return `${d.getFullYear()}. ${d.getMonth()+1}. ${d.getDate()}. ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;};

function entryHTML(){
 const modes=`<nav class="ew-mode" aria-label="작업 모드"><button data-mode="work" aria-pressed="true" data-none>${I('4df0d')}<span>업무</span></button> <button data-mode="author" aria-pressed="false" data-none>${I('cece5')}<span>워크스페이스</span></button></nav>`;
 const scope=`<div class="ew-scope-wrap" data-collapsed="false"><div class="ew-scope-inner"><p class="ew-nav-caption">작업 위치</p><div class="ew-scope"><div class="ew-scope-field"><button type="button" data-scope-trigger="factory" data-none>${I('40095')}<small>공장</small><span>전체 공장</span>${I('ead50')}</button></div><div class="ew-scope-field"><button type="button" data-scope-trigger="system" data-none>${I('f34f3')}<small>시스템</small><span>EMS</span>${I('ead50')}</button></div></div></div></div>`;
 const category=(key,icon,label,body)=>`<div class="ew-category" data-category="${key}"><button class="ew-category-toggle" aria-expanded="true" data-none>${I(icon)}<span>${label}</span>${I('ead50')}</button><div class="ew-category-body" aria-hidden="false"><div class="ew-category-items">${body}</div></div></div>`;
 const item=key=>`<button data-open="${key}"${S.proc===key?' aria-current="page"':''}><span>${esc(PROCS[key].name)}</span></button>`;
 return modes+scope+`<nav class="ew-nav-links"><button data-none>${I('c325d')}<span>실행 기록</span></button><button data-none>${I('093d6')}<span>대화 기록</span></button></nav><p class="ew-nav-caption">업무</p><nav class="ew-workflows">${category('ops','126c7','운영',item('guide')+item('check'))}${category('setup','f6bbc','셋업','')}${category('incident','4fb09','장애대응','')}</nav>`;
}

function overviewHTML(){
 const proc=PROCS[S.proc];
 const go=S.started?'':`<button type="button" class="ew-secondary ew-stage-run-button" data-run="start" aria-label="${esc(proc.name)} 시작">${PLAY}<span>시작</span></button>`;
 return `<div id="ees-work-content" class="ew-scroll ew-center-content ew-centered-overview"><section class="ew-operation-overview"><div class="ew-overview-head"><div><h2>${esc(proc.name)}</h2>${S.last?`<p class="ew-last-run">지난 회차 · ${esc(S.last)} 끝남</p>`:''}</div>${go}</div><dl class="ew-operation-context"><dt>적용 대상</dt><dd>전체 공장 · EMS</dd></dl><section class="ew-operation-stages"><h3>업무 단계</h3><button type="button" class="ew-operation-stage" data-go="stage"><span><strong>${esc(proc.stage)}</strong><small>작업 ${proc.jobs}개</small></span>${I('69549')}</button></section></section></div>`;
}

// A job row. Closed: name, one line of guidance, state and one shortcut. Open: the detail under it.
function row(key,n,name,desc,meta,detail){
 const open=S.open===key,id='sq-detail-'+key;
 return `<section class="ew-vd-entry ew-center-task-row" data-job="${key}" data-handler="human" data-expanded="${open}"><div class="ew-vd-item"><span class="ew-center-task-number" aria-hidden="true">${n}</span><div class="ew-vd-item-top"><button type="button" class="ew-vd-name" data-toggle="${key}" aria-expanded="${open}" aria-controls="${id}">${esc(name)}</button>${open?'':`<small class="ew-center-task-description"><b data-decision-actor>직접 판정</b> · ${esc(desc)}</small>`}</div><div class="ew-vd-item-meta">${meta}<button type="button" class="ew-vd-toggle" data-toggle="${key}" aria-expanded="${open}" aria-controls="${id}" aria-label="${esc(name)} ${open?'접기':'펼치기'}">${I('f17e6')}</button></div></div>${open?`<div class="ew-vd-detail" id="${id}"><p>${esc(desc)}</p>${detail}</div>`:''}</section>`;
}
const state=text=>`<div class="ew-vd-decision"><span class="ew-vd-state" data-decision-status><span>${text}</span></span></div>`;
const final=(word)=>`<div class="ew-vd-decision"><span class="ew-vd-final" data-decision-status><i class="ew-vd-dot" data-verdict="${word==='적합'||word==='완료'?'ok':word==='미흡'?'bad':'none'}"></i><span>${esc(word)}</span></span></div>`;
const count=(tone,text)=>`<span><i class="ew-vd-dot" data-verdict="${tone}"></i>${text}</span>`;
const runButton=(what,label,icon,off='')=>`<button type="button" class="ew-vd-run" data-run="${what}"${off}>${icon}<span>${label}</span></button>`;
// One click for the usual answer, the other answers behind the arrow (the control the product has for a person's job).
const answer=key=>`<span class="ew-vd-confirm"><button type="button" class="ew-vd-confirm-main" data-confirm="${key}">적합</button><button type="button" class="ew-vd-confirm-more" data-answer-menu="${key}" aria-haspopup="menu" aria-expanded="${S.menu===key}" aria-label="다른 판정">${I('f17e6')}</button></span>`;
function shell(head,counts,done,rows,tail=''){
 const proc=PROCS[S.proc];
 return `<div id="ees-work-content" class="ew-scroll ew-center-content ew-centered-stage"><nav class="ew-center-breadcrumb" aria-label="업무 경로"><button type="button" class="ew-run-back" data-go="overview">${esc(proc.name)}</button><span aria-hidden="true">›</span><span aria-current="page">${esc(proc.stage)}</span></nav><header class="ew-vd-head"><div class="ew-stage-heading"><div class="ew-vd-title"><h2>${esc(proc.stage)}</h2><p class="ew-center-scope">전체 공장 · EMS</p></div><div class="ew-center-heading-actions"><button type="button" class="ew-icon-button" aria-label="단계 더 보기" data-none>${I('a953c')}</button></div></div></header><nav class="ew-tabs ew-center-tabs" aria-label="업무 진행 보기"><button type="button" aria-pressed="true" data-none>업무 내용</button><button type="button" aria-pressed="false" data-none>실행 기록</button><button type="button" aria-pressed="false" data-none>판정 기준</button></nav><div class="ew-center-task-heading ew-stage-summary"><h3>작업 ${proc.jobs}개</h3><span class="ew-stage-completed">${done} / ${proc.jobs} 완료</span><div class="ew-center-counts">${counts}</div>${head}</div><div class="ew-vd-body ew-center-task-list" id="ees-stage-tasks">${rows}</div>${tail}</div>`;
}
const menuHTML=()=>S.menu?`<div class="ew-vd-menu" id="sq-menu" role="menu" aria-label="다른 판정 고르기">${[['미흡','bad'],['판단 불가','none']].map(([word,tone])=>`<button type="button" role="menuitemradio" class="ew-vd-option" data-verdict="${S.menu}:${word}" aria-checked="false"><i class="ew-vd-dot" data-verdict="${tone}"></i><span><b>${word}</b></span></button>`).join('')}</div>`:'';

// SQ2–SQ5 · the shipped guide: the job that needs a value is open, the value is handed on to the next job.
function guideStageHTML(){
 const running=S.page==='running',ran=S.page==='done',confirmed=ran&&S.verdict==='적합';
 const childRunning=S.child==='running',childRan=S.child==='done';
 // job 1 · detail
 const ask=`<div class="ew-vd-ask-row"><label class="ew-vd-ask" for="sq-page-id"><span>페이지 ID</span><span><input id="sq-page-id" type="text" inputmode="numeric" autocomplete="off" placeholder="예: 123456789" value="${esc(S.id)}" aria-required="true"${S.idError?' aria-invalid="true" aria-describedby="sq-page-id-error"':''}${running?' disabled':''}></span></label>${runButton('page',running?'실행 중':ran?'다시 실행':'실행',ran?RETRY:PLAY,running?' disabled':'')}${S.idError?`<small class="ew-vd-ask-error" id="sq-page-id-error" role="alert">${esc(S.idError)}</small>`:''}</div>`;
 const result=ran?`<dl class="ew-vd-result" aria-label="조회한 문서"><dt>문서 제목</dt><dd>설비 점검 안내 (예시)</dd><dt>페이지 ID</dt><dd>${esc(S.ranId||S.id)}</dd><dt>문서 유형</dt><dd>page</dd></dl><div class="ew-vd-answer">${S.verdict?`<span class="ew-vd-final" data-decision-status><i class="ew-vd-dot" data-verdict="${S.verdict==='적합'?'ok':S.verdict==='미흡'?'bad':'none'}"></i><span>${esc(S.verdict)}</span></span>`:answer('page')}<small>${esc(S.ranAt||'')} 조회</small></div>`:'';
 // job 1 · closed row: state and one shortcut
 const meta1=ran?(S.verdict?final(S.verdict):state('확인 필요')):(S.open==='page'?state(running?'실행 중':'실행 필요'):runButton('open-page','실행',PLAY)+state('실행 필요'));
 // job 2
 const given=confirmed?`<span class="ew-vd-given">페이지 ID <b>${esc(S.ranId||S.id)}</b> · 기준 문서 확인에서</span>`:`<span class="ew-vd-given">페이지 ID · 기준 문서 확인에서</span>`;
 const list=childRan?`<ol class="ew-vd-result" aria-label="하위 문서"><li><span>주간 점검표 (예시)</span><small>123456801</small></li><li><span>월간 점검표 (예시)</span><small>123456802</small></li></ol><div class="ew-vd-answer">${S.childDone?`<span class="ew-vd-final" data-decision-status><i class="ew-vd-dot" data-verdict="ok"></i><span>완료</span></span>`:`<button type="button" class="ew-secondary" data-confirm="child">목록 확정</button>`}<small>2건</small></div>`:'';
 const detail2=`<div class="ew-vd-ask-row">${given}${runButton('child',childRunning?'실행 중':childRan?'다시 실행':'실행',childRan?RETRY:PLAY,confirmed&&!childRunning?'':' disabled data-run-blocked')}</div>${list}`;
 const meta2=S.childDone?final('완료'):childRan?state('확인 필요'):!confirmed?state('대기'):S.open==='child'?state(childRunning?'실행 중':'실행 필요'):runButton('child','실행',PLAY)+state('실행 필요');
 const done=(confirmed?1:0)+(S.childDone?1:0);
 const counts=[
  !ran?count('none',running?'실행 중 1':'실행 필요 1'):S.verdict?count(S.verdict==='적합'?'ok':S.verdict==='미흡'?'bad':'none',S.verdict+' 1'):count('none','확인 필요 1'),
  S.childDone?count('ok','완료 1'):childRan?count('none','확인 필요 1'):confirmed?count('none',childRunning?'실행 중 1':'실행 필요 1'):count('none','대기 1')
 ].join('');
 const head=!S.started?`<button type="button" class="ew-secondary ew-stage-run-button" data-run="start" aria-label="문서 구조 확인 단계 시작">${PLAY}<span>시작</span></button>`:done===2?`<button type="button" class="ew-secondary ew-stage-run-button" data-run="finish"><span>끝내기</span></button>`:'';
 const rows=row('page',1,'기준 문서 확인','Confluence 페이지 정보의 페이지 ID를 입력하세요. 실행 결과의 제목과 ID가 기준 문서와 일치하면 확정하세요.',meta1,ask+result)
  +row('child',2,'하위 문서 목록 조회','확정한 기준 문서 바로 아래의 페이지를 최대 5건 조회합니다. 제목을 확인하고 목록을 확정하세요.',meta2,detail2);
 return shell(head,counts,done,rows,menuHTML());
}

// SQ6 · a person's job that asks for values opens the same way; a job that asks nothing is answered on its row.
function checkStageHTML(){
 const done=S.pump==='적합',stale=S.pump==='다시',noteDone=S.note==='적합';
 const field=(id,label,unit,value,example)=>`<label class="ew-vd-ask" data-kind="number" for="sq-${id}"><span>${label}</span><span><input id="sq-${id}" type="text" inputmode="decimal" autocomplete="off" placeholder="예: ${example}" value="${esc(value)}" aria-required="true"${S.valueError&&!value.trim()?' aria-invalid="true"':''}${S.started?'':' disabled'}>${unit}</span></label>`;
 const pumpAnswer=!S.started?'':done?`<span class="ew-vd-final" data-decision-status><i class="ew-vd-dot" data-verdict="ok"></i><span>적합</span></span>`:answer('pump');
 const detail1=`<div class="ew-vd-ask-row">${field('pressure','압력','bar',S.pressure,'3.2')}${field('temp','온도','℃',S.temp,'45')}${pumpAnswer}${S.valueError?`<small class="ew-vd-ask-error" role="alert">값을 넣어 주세요</small>`:''}</div>`;
 const meta1=done?final('적합'):state(!S.started?'확인 필요':stale?'다시 검토 필요':'확인 필요');
 // Open: answered in the detail. Closed: the row keeps the one-click answer the product has today.
 const noteOpen=S.open==='note';
 const noteControl=!S.started?state('확인 필요'):noteDone?final('적합'):noteOpen?state('확인 필요'):`<div class="ew-vd-decision">${answer('note')}</div>`;
 const detail2=S.started&&!noteDone?`<div class="ew-vd-answer">${answer('note')}</div>`:'';
 const completed=(done?1:0)+(noteDone?1:0),left=2-completed;
 const counts=[left?count('none',`확인 필요 ${left}`):'',completed?count('ok',`적합 ${completed}`):''].join('');
 const head=!S.started?`<button type="button" class="ew-secondary ew-stage-run-button" data-run="start" aria-label="점검 단계 시작">${PLAY}<span>시작</span></button>`:completed===2?`<button type="button" class="ew-secondary ew-stage-run-button" data-run="finish"><span>끝내기</span></button>`:'';
 const rows=row('pump',1,'펌프 상태 기록','압력계와 온도계의 값을 적고, 기준 범위 안이면 적합으로 확인합니다.',meta1,detail1)
  +row('note',2,'이상 내용 기록','이상이 있으면 내용을 적습니다.',noteControl,detail2);
 return shell(head,counts,completed,rows,menuHTML());
}

function render(){
 entry.innerHTML=entryHTML();
 panel.innerHTML=S.view==='overview'?overviewHTML():S.proc==='guide'?guideStageHTML():checkStageHTML();
 const id=S.proc==='check'?'SQ6':S.view==='overview'?'SQ1':S.idError?'SQ3':S.page==='done'&&S.verdict==='적합'?'SQ5':S.page==='done'?'SQ4':'SQ2';
 S.screen=id;
 $('#mock-badge').textContent='시안 2 · 저장·실행 안 됨 · '+id;
 for(const button of guide.querySelectorAll('[data-step]'))button.setAttribute('aria-pressed',String(button.dataset.step===id));
 const info=SCREENS[id];$('#mock-step-text').innerHTML=`<span><b>언제</b>${esc(info.when)}</span><span><b>바뀐 점</b>${esc(info.change)}</span>`;
 const menu=$('#sq-menu'),opener=panel.querySelector('[data-answer-menu][aria-expanded=true]');
 // The menu opens under its control, or above it when there is no room left below.
 if(menu&&opener){const box=opener.getBoundingClientRect(),host=panel.getBoundingClientRect(),height=menu.getBoundingClientRect().height,below=box.bottom+4+height<=host.bottom;menu.style.left=Math.max(8,Math.min(box.left-host.left,host.width-188))+'px';menu.style.top=((below?box.bottom+4:box.top-4-height)-host.top+panel.scrollTop)+'px';}
}
function focusField(selector){const field=panel.querySelector(selector);if(field&&!field.disabled){field.focus();const end=field.value.length;try{field.setSelectionRange(end,end);}catch(_){} }}
// The job to do next that needs a value or has something to look at is opened; a job that is answered on its row is not.
function nextOpen(){
 if(S.proc==='guide')return !(S.page==='done'&&S.verdict==='적합')?'page':!S.childDone?'child':'';
 return S.pump!=='적합'?'pump':'';
}
// One press of 실행: check the value where it is typed, start the round if it has not started, then run.
function runPage(){
 S.open='page';
 const value=(panel.querySelector('#sq-page-id')?.value ?? S.id).trim();S.id=value;
 if(!value){S.idError='페이지 ID를 넣어 주세요';render();focusField('#sq-page-id');return;}
 if(!/^[0-9]+$/.test(value)){S.idError='숫자만 넣어 주세요';render();focusField('#sq-page-id');return;}
 S.idError='';S.started=true;S.page='running';S.verdict='';S.child='idle';S.childDone=false;S.menu='';render();
 setTimeout(()=>{if(S.page!=='running')return;S.page='done';S.ranId=S.id;S.ranAt=now();render();},700);
}
function runChild(){
 if(!(S.page==='done'&&S.verdict==='적합'))return;
 S.open='child';S.child='running';S.childDone=false;render();
 setTimeout(()=>{if(S.child!=='running')return;S.child='done';render();},700);
}
function confirmJob(key,word='적합'){
 S.menu='';
 if(key==='page'){S.verdict=word;if(word==='적합')S.open=nextOpen();render();return;}
 if(key==='child'){S.childDone=true;S.open='';render();toast('시안입니다. 지금 제품은 여기서 사유를 적는 창이 뜹니다. 그 창은 이 시안에서 바꾸지 않았습니다.');return;}
 if(key==='pump'){S.pressure=panel.querySelector('#sq-pressure')?.value ?? S.pressure;S.temp=panel.querySelector('#sq-temp')?.value ?? S.temp;
  if(!S.pressure.trim()||!S.temp.trim()){S.valueError=true;S.open='pump';render();focusField(!S.pressure.trim()?'#sq-pressure':'#sq-temp');return;}
  S.valueError=false;S.pump=word==='적합'?'적합':word;if(word==='적합')S.open='';render();return;}
 S.note=word;render();
}

guide.addEventListener('click',event=>{
 const step=event.target.closest('[data-step]');
 if(step){S=PRESET[step.dataset.step](fresh());render();if(step.dataset.step==='SQ2')focusField('#sq-page-id');return;}
 if(event.target.closest('#mock-fold')){const collapsed=guide.dataset.collapsed!=='true';guide.dataset.collapsed=String(collapsed);const button=event.target.closest('#mock-fold');button.textContent=collapsed?'안내 펴기':'안내 접기';button.setAttribute('aria-expanded',String(!collapsed));}
});
document.addEventListener('click',event=>{
 const target=event.target;
 if(target.closest('#mock-guide'))return;
 if(S.menu&&!target.closest('#sq-menu')&&!target.closest('[data-answer-menu]')){S.menu='';render();}
 const open=target.closest('[data-open]');
 if(open){const last=S.last;S=fresh();S.last=last;S.proc=open.dataset.open;render();return;}
 const dest=target.closest('[data-go]');
 if(dest){S.view=dest.dataset.go;S.menu='';if(S.view==='stage'&&!S.open)S.open=nextOpen();render();if(S.view==='stage'&&S.open==='page'&&S.page==='idle')focusField('#sq-page-id');return;}
 const run=target.closest('[data-run]');
 if(run){const what=run.dataset.run;
  if(what==='start'){S.started=true;S.view='stage';S.open=nextOpen();render();focusField(S.proc==='guide'?'#sq-page-id':'#sq-pressure');}
  else if(what==='page')runPage();
  // The shortcut on a closed row: a job that still needs its value opens with the field ready.
  else if(what==='open-page'){if(/^[0-9]+$/.test(S.id.trim()))runPage();else{S.open='page';render();focusField('#sq-page-id');}}
  else if(what==='child')runChild();
  else if(what==='finish'){const proc=S.proc,last=now();S=fresh();S.proc=proc;S.last=last;render();}
  return;}
 const toggle=target.closest('[data-toggle]');
 if(toggle){const key=toggle.dataset.toggle;S.open=S.open===key?'':key;S.menu='';render();return;}
 const opener=target.closest('[data-answer-menu]');
 if(opener){S.menu=S.menu===opener.dataset.answerMenu?'':opener.dataset.answerMenu;render();return;}
 const verdict=target.closest('[data-verdict]');
 if(verdict){const [key,word]=verdict.dataset.verdict.split(':');confirmJob(key,word);return;}
 const confirm=target.closest('[data-confirm]');
 if(confirm){confirmJob(confirm.dataset.confirm);return;}
 if(target.closest('[data-none]')){event.preventDefault();toast(NOT_HERE);}
});
document.addEventListener('input',event=>{
 const target=event.target;
 if(target.id==='sq-page-id'){S.id=target.value;if(S.idError){S.idError='';render();focusField('#sq-page-id');}return;}
 if(target.id==='sq-pressure'||target.id==='sq-temp'){const key=target.id==='sq-pressure'?'pressure':'temp';S[key]=target.value;
  // A value changed after the answer asks for the answer again, as a changed input does in the product.
  if(S.pump==='적합'||S.valueError){if(S.pump==='적합')S.pump='다시';S.valueError=false;render();focusField('#'+target.id);}}
});
document.addEventListener('keydown',event=>{
 if(event.key==='Escape'&&S.menu){S.menu='';render();return;}
 if(event.key!=='Enter'||event.isComposing)return;const target=event.target;
 if(target.id==='sq-page-id'){event.preventDefault();runPage();}
 else if(target.id==='sq-pressure'){event.preventDefault();focusField('#sq-temp');}
 else if(target.id==='sq-temp'){event.preventDefault();confirmJob('pump');}
});
render();
})();
</script>

</body>
