<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EES Workflow 업무 절차 편집 시안</title>
<style data-new-screen>
  :root {
    color-scheme: light;
    font: 14px/1.5 "Malgun Gothic", "Noto Sans CJK KR", system-ui, sans-serif;
    color: #20242b;
    --muted: #586272;
    --line: #e1e4e8;
    --control: #c4cbd3;
    --side: #f4f5f6;
    --ink: #20242b;
  }
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; background: white; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button, summary { cursor: pointer; }
  button:focus-visible, input:focus-visible, select:focus-visible,
  textarea:focus-visible, summary:focus-visible { outline: 2px solid #4b6380; outline-offset: 3px; }
  button { border: 0; background: transparent; }
  h1, h2, h3, p { margin: 0; }
  .app { display: grid; grid-template-columns: 256px minmax(0, 1fr) clamp(320px, 29vw, 560px); min-height: 100dvh; }
  .sidebar { background: var(--side); border-right: 1px solid var(--line); padding: 12px 8px; }
  .brand { display: flex; gap: 8px; align-items: center; padding: 0 4px; font-weight: 700; }
  .mark { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 6px; background: var(--ink); color: white; font-size: 13px; }
  .modes { display: grid; grid-template-columns: 1fr 1fr; margin: 16px 0 22px; padding: 3px; border-radius: 6px; background: #e8eaed; text-align: center; font-size: 13px; }
  .modes span { padding: 6px; }
  .modes .selected { background: white; border-radius: 5px; box-shadow: 0 1px 2px #20242b14; font-weight: 600; }
  .sidebar h2 { margin: 0 5px 6px; color: var(--muted); font-size: 12px; font-weight: 400; }
  .scope { display: flex; gap: 10px; align-items: center; justify-content: space-between; padding: 8px 10px; border: 1px solid var(--line); border-radius: 5px; background: white; font-size: 13px; }
  .scope + .scope { margin-top: 4px; }
  .scope span { color: var(--muted); }
  .scope strong { font-weight: 500; }
  .nav { display: grid; gap: 4px; margin-top: 18px; }
  .nav div { padding: 10px 12px; }
  .nav .selected { background: #e7e9ec; border-radius: 6px; font-weight: 600; }
  .recent { margin-top: 24px; border-top: 1px solid var(--line); padding: 14px 4px; }
  .recent p { padding: 5px 6px; font-size: 13px; color: var(--muted); }
  main { display: flex; flex-direction: column; height: 100dvh; min-width: 0; }
  .bar { display: flex; align-items: center; justify-content: space-between; min-height: 48px; gap: 10px; padding: 8px 20px; border-bottom: 1px solid var(--line); font-weight: 600; }
  .preview { font-size: 12px; color: var(--muted); font-weight: 400; }
  .scroll { flex: 1 1 auto; overflow: auto; min-height: 0; }
  .page { max-width: 1104px; margin-inline: auto; padding: 17px clamp(20px, 4vw, 72px) 30px; }
  .crumb { color: var(--muted); font-size: 13px; }
  .title { margin-top: 12px; display: flex; align-items: center; flex-wrap: wrap; gap: 12px; }
  h1 { font-size: 21px; line-height: 1.4; letter-spacing: -.025em; }
  .publication { display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: 12px; }
  input, select, textarea { border: 1px solid var(--control); border-radius: 6px; background: white; padding: 8px 10px; }
  .publication select { padding: 5px 8px; }
  .more { position: relative; margin-left: auto; }
  .more summary { list-style: none; padding: 2px 9px; border-radius: 6px; background: var(--side); font-size: 17px; }
  .more summary::-webkit-details-marker { display: none; }
  .more-menu { position: absolute; z-index: 1; top: calc(100% + 6px); right: 0; min-width: max-content; margin: 0; padding: 6px; list-style: none; border: 1px solid var(--line); border-radius: 6px; background: white; box-shadow: 0 4px 12px #20242b18; }
  .more-menu li { padding: 7px 10px; font-size: 13px; }
  .system { margin-top: 6px; font-size: 12px; color: var(--muted); }
  .tabbar { display: flex; gap: 20px; margin: 12px 0; border-bottom: 1px solid var(--line); font-size: 13px; color: var(--muted); }
  .tabbar span { padding: 8px 0; }
  .tabbar [aria-current] { border-bottom: 2px solid var(--ink); font-weight: 600; color: var(--ink); }
  .overview { padding: 14px 16px; border: 1px solid var(--line); border-radius: 8px; background: #fcfcfd; }
  .label { font-size: 12px; font-weight: 600; }
  .overview p + p { margin-top: 4px; color: var(--muted); }
  .section-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 20px 0 8px; }
  .section-label { display: flex; align-items: baseline; flex-wrap: wrap; gap: 8px; }
  h2 { font-size: 15px; font-weight: 700; }
  .count { color: var(--muted); font-size: 12px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    border: 1px solid var(--control); border-radius: 6px; background: white; min-height: 34px;
    padding: 5px 10px; font-size: 13px; font-weight: 600; white-space: nowrap;
  }
  .btn:hover { background: #f0f2f4; border-color: #a8b1bc; }
  .btn.primary { background: var(--ink); color: white; border-color: var(--ink); }
  .btn.primary:hover { background: #363c46; }
  .btn:disabled { opacity: .45; cursor: default; }
  .add-action {
    display: inline-flex; align-items: center; justify-content: center; gap: 5px; flex: none;
    min-height: 34px; padding: 5px 9px; border-radius: 6px;
    background: var(--side); color: #1d2128; font-size: 13px; font-weight: 500; line-height: 20px;
    white-space: nowrap;
  }
  .add-action:hover { background: #e7e8eb; }
  .add-action:focus-visible { outline-color: currentColor; outline-offset: 2px; box-shadow: 0 0 0 2px #1d212826; }
  .plus { display: grid; place-items: center; width: 14px; height: 14px; flex: none; }
  .plus::before, .plus::after { content: ""; grid-area: 1 / 1; border-radius: 1px; background: currentColor; }
  .plus::before { width: 10px; height: 1.5px; }
  .plus::after { width: 1.5px; height: 10px; }
  .stage { border: 1px solid var(--line); border-radius: 8px; margin-bottom: 8px; overflow: clip; }
  .stage-head { display: flex; align-items: center; gap: 6px; background: #fafbfc; padding-right: 12px; }
  .stage-toggle { display: flex; align-items: center; gap: 8px; flex: 1 1 auto; min-width: 0; min-height: 51px; padding: 8px 12px; text-align: left; }
  .stage-toggle:hover { background: #eff1f4; }
  .stage-toggle:focus-visible { outline-offset: -3px; }
  .stage-toggle .count { margin-left: auto; white-space: nowrap; }
  .number { display: grid; place-items: center; width: 22px; height: 22px; border: 1px solid var(--control); background: white; border-radius: 50%; font-size: 12px; flex: none; color: var(--muted); }
  .stage-name { font-weight: 600; overflow-wrap: anywhere; }
  .chevron { width: 7px; height: 7px; border: solid var(--muted); border-width: 0 1.5px 1.5px 0; transform: rotate(-45deg); margin: 0 3px 0 2px; flex: none; }
  [aria-expanded="true"] .chevron { transform: rotate(45deg) translate(-1px, -1px); }
  .stage-body { padding: 0 14px 0 38px; border-top: 1px solid var(--line); }
  .job { display: flex; justify-content: space-between; gap: 14px; align-items: flex-start; padding: 12px 0; }
  .job + .job { border-top: 1px solid var(--line); }
  .job-open { padding: 0; font-weight: 600; text-align: left; }
  .job-open:hover, .text-btn:hover { text-decoration: underline; }
  .job-info { margin-top: 3px; display: grid; gap: 1px; color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
  .job-actions { display: grid; justify-items: end; gap: 3px; flex: none; }
  .text-btn { padding: 0; color: #34475f; font-size: 12px; min-height: 22px; text-align: left; }
  code { font-size: 11px; }
  .add-row { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 8px; padding: 10px 0; }
  .add-row label, .job-form label { display: grid; gap: 4px; }
  .add-row label { flex: 0 1 340px; min-width: min(100%, 160px); }
  .add-row input { height: 36px; }
  .add-row .btn { min-height: 36px; }
  .job-form { display: grid; gap: 14px; max-width: 540px; margin-top: 14px; }
  .job-form textarea { resize: vertical; }
  .settings { display: flex; align-items: baseline; gap: 8px; padding-top: 12px; margin-top: 16px; border-top: 1px solid var(--line); }
  .foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; border-top: 1px solid var(--line); padding: 10px clamp(20px, 4vw, 72px); }
  .foot p { color: var(--muted); font-size: 12px; }
  .chat { display: flex; flex-direction: column; border-left: 1px solid var(--line); color: var(--muted); }
  .chat .bar { color: var(--ink); font-weight: 500; }
  .chat-body { display: grid; flex: 1; place-content: center; text-align: center; }
  .chat-body p:first-child { color: var(--ink); font-size: 22px; }
  .chat-body p + p { margin-top: 3px; }
  .chat-input { border: 1px solid var(--line); border-radius: 12px; margin: 12px; padding: 12px; font-size: 13px; }
  dialog { color: var(--ink); background: white; border: 1px solid var(--line); border-radius: 9px; width: min(calc(100% - 28px), 520px); padding: 20px; }
  dialog::backdrop { background: #151a264d; }
  dialog h2 { margin-bottom: 12px; }
  dialog p { color: var(--muted); }
  dialog pre { padding: 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--side); white-space: pre-wrap; overflow-wrap: anywhere; }
  dialog form { margin-top: 16px; text-align: right; }
  @media (max-width: 1150px) {
    .app { grid-template-columns: 210px minmax(0, 1fr); }
    .chat { display: none; }
  }
  @media (max-width: 650px) {
    .app { display: block; }
    .sidebar { display: none; }
    .bar { padding-inline: 14px; }
    .page { padding-inline: 14px; }
    .stage-body { padding-inline: 12px; }
    .stage-head { padding-right: 6px; gap: 2px; }
    .stage-toggle { padding-inline: 6px; }
    .stage-toggle .count { display: none; }
    .job { gap: 8px; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" aria-label="워크스페이스 화면 예시">
    <div class="brand"><span class="mark" aria-hidden="true">E</span>EES Workflow</div>
    <div class="modes"><span>업무</span><span class="selected">워크스페이스</span></div>
    <h2>작업 위치</h2>
    <div class="scope"><span>공장</span><strong>전체 공장</strong></div>
    <div class="scope"><span>시스템</span><strong>EMS</strong></div>
    <div class="nav"><div class="selected">업무 절차</div><div>도구 · 자료</div></div>
    <div class="recent"><h2>최근 편집</h2><p>Confluence 문서 확인</p></div>
  </aside>
  <main>
    <div class="bar"><span>업무 절차</span><span class="preview">시안 2 · 저장·실행 안 됨</span></div>
    <div class="scroll">
      <article class="page">
        <p class="crumb">업무 절차 목록</p>
        <div class="title">
          <h1>Confluence 문서 확인</h1>
          <label class="publication">게시 상태 <select id="publication"><option>미게시</option><option selected>게시</option></select></label>
          <details class="more">
            <summary aria-label="업무 절차 메뉴">⋯</summary>
            <ul class="more-menu"><li>업무 절차 정보·분류 수정</li><li>다른 이름으로 저장</li><li>내용 확인</li></ul>
          </details>
        </div>
        <p class="system">EMS · 게시 v1</p>
        <div class="tabbar" aria-label="업무 절차 메뉴 예시"><span aria-current="page">업무 내용</span><span>판정 단어</span><span>게시 기록</span></div>
        <div id="content"></div>
      </article>
    </div>
    <footer class="foot"><p id="status" role="status">저장됨</p><button class="btn primary" id="save" disabled>저장</button></footer>
  </main>
  <aside class="chat" aria-label="업무 도우미 화면 예시">
    <div class="bar">업무 도우미</div>
    <div class="chat-body"><p>업무 도우미</p><p>무엇을 도와드릴까요?</p></div>
    <div class="chat-input">업무를 물어보거나, 필요한 작업을 요청하세요</div>
  </aside>
</div>
<dialog id="tool-dialog" aria-labelledby="dialog-title">
  <h2 id="dialog-title"></h2>
  <div id="dialog-content"></div>
  <form method="dialog"><button class="btn" autofocus>닫기</button></form>
</dialog>
<script>
  const content = document.getElementById('content');
  const status = document.getElementById('status');
  const save = document.getElementById('save');
  const stages = [{
    id: 1, name: '문서 확인', jobs: [
      { id: 1, name: '기준 문서 확인', mode: 'tool', path: '/{id}',
        inputs: '페이지 ID', outputs: '제목, 문서 유형',
        example: { title: '설비 점검 안내 (예시)', id: '12345', type: 'page' } },
      { id: 2, name: '하위 문서 목록 조회', mode: 'tool', path: '/{id}/child/page',
        inputs: '기준 문서의 페이지 ID, 표시할 문서 수', outputs: '하위 문서 목록' }
    ]
  }];
  let nextStage = 2;
  let nextJob = 3;
  let expanded = 1;
  let editingJob = null;
  let adding = null;
  let dirty = false;

  function escapeText(value) {
    return String(value ?? '').replace(/[&<>"']/g, char => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[char]);
  }

  function plusButton(label, action, id = '') {
    return '<button class="add-action" type="button" data-action="' + action + '" data-id="' + id +
      '"><span class="plus" aria-hidden="true"></span>' + label + '</button>';
  }

  function addForm(type, id = '', showCancel = true) {
    const label = type === 'stage' ? '단계' : '작업';
    return '<form class="add-row" data-add="' + type + '" data-id="' + id + '">' +
      '<label><span class="label">' + label + ' 이름</span><input name="name" required maxlength="160" ' +
      'placeholder="' + (type === 'stage' ? '예: 점검 결과 정리' : '예: 문서 제목 확인') + '"></label>' +
      '<button class="btn primary">' + label + ' 추가</button>' +
      (showCancel ? '<button class="btn" type="button" data-action="cancel">취소</button>' : '') + '</form>';
  }

  function jobRow(job) {
    const api = job.mode === 'tool';
    const bound = api && Boolean(job.path);
    const info = bound
      ? '<span>사내 Confluence · <code>GET ' + escapeText(job.path) + '</code></span>' +
        '<span>보내는 값 · ' + escapeText(job.inputs) + '</span><span>받는 값 · ' + escapeText(job.outputs) + '</span>'
      : '<span>' + (api ? '도구 연결 전' : '사람이 확인') + '</span>';
    const toolActions = api
      ? '<button class="text-btn" data-action="tool" data-id="' + job.id + '">' + (bound ? '도구 변경' : '도구 연결') + '</button>' +
        (job.example ? '<button class="text-btn" data-action="example" data-id="' + job.id + '">조회 결과 예시 보기</button>' : '') +
        (job.path === '/{id}/child/page' ? '<button class="text-btn" data-action="inputs" data-id="' + job.id + '">입력 연결 변경</button>' : '')
      : '';
    return '<div class="job"><div><button class="job-open" data-action="job" data-id="' + job.id + '">' +
      escapeText(job.name) + '</button><div class="job-info">' + info + '</div></div>' +
      '<div class="job-actions">' + toolActions + '</div></div>';
  }

  function stageCard(stage, index) {
    const open = expanded === stage.id;
    const manualAdd = adding?.type === 'job' && adding.id === stage.id;
    const automaticAdd = !adding && !stage.jobs.length;
    const showAddForm = open && (manualAdd || automaticAdd);
    return '<section class="stage"><header class="stage-head">' +
      '<button class="stage-toggle" data-action="stage" data-id="' + stage.id + '" aria-expanded="' + open +
      '" aria-controls="stage-' + stage.id + '"><span class="number">' + (index + 1) + '</span>' +
      '<span class="stage-name">' + escapeText(stage.name) + '</span><span class="count">' + stage.jobs.length +
      '개 작업</span><span class="chevron" aria-hidden="true"></span></button>' +
      (open && !showAddForm
        ? plusButton('작업 추가', 'add-job', stage.id) : '') + '</header>' +
      '<div class="stage-body" id="stage-' + stage.id + '"' + (open ? '' : ' hidden') + '>' +
      (open ? stage.jobs.map(jobRow).join('') : '') +
      (showAddForm ? addForm('job', stage.id, manualAdd) : '') +
      '</div></section>';
  }

  function showJob() {
    const { stage, job } = editingJob;
    return '<button class="text-btn" data-action="back">← 단계와 작업</button> <span class="count">/ ' +
      escapeText(stage.name) + '</span><div class="job-form">' +
      '<label><span class="label">작업 이름</span><input id="job-name" maxlength="160" value="' + escapeText(job.name) + '"></label>' +
      '<label><span class="label">수행 방법</span><select id="job-mode"><option value="human"' +
      (job.mode === 'human' ? ' selected' : '') + '>사람이 확인</option><option value="tool"' +
      (job.mode === 'tool' ? ' selected' : '') + '>도구로 처리</option></select></label>' +
      '<label><span class="label">수행 내용</span><textarea id="job-description" rows="3">' + escapeText(job.description) +
      '</textarea></label></div>';
  }

  function render() {
    content.innerHTML = editingJob ? showJob() :
      '<div class="overview"><p class="label">업무 목적</p><p>기준 문서와 그 하위 문서를 확인합니다.</p></div>' +
      '<div class="section-head"><div class="section-label"><h2>단계와 작업</h2><span class="count">' + stages.length +
      '개 단계</span></div>' + (adding?.type === 'stage' ? '' : plusButton('단계 추가', 'add-stage')) + '</div>' +
      stages.map(stageCard).join('') + (adding?.type === 'stage' ? addForm('stage') : '') +
      '<section class="settings"><h2>시작할 때 물어볼 것</h2><span class="count">2개</span></section>';
  }

  function changed() {
    dirty = true;
    save.disabled = false;
    status.textContent = '저장하지 않은 변경 있음';
  }

  function focusControl(selector) {
    const target = content.querySelector(selector);
    if (!target) return;
    target.scrollIntoView({ block: 'nearest' });
    target.focus({ preventScroll: true });
  }

  function showTool(job, action) {
    const dialog = document.getElementById('tool-dialog');
    const title = document.getElementById('dialog-title');
    const body = document.getElementById('dialog-content');
    title.textContent = action === 'example' ? '조회 결과 예시' :
      action === 'inputs' ? '입력 연결' : '연결된 도구';
    body.replaceChildren();
    const info = document.createElement(action === 'example' ? 'pre' : 'p');
    info.textContent = action === 'example' ? JSON.stringify(job.example, null, 2) :
      action === 'inputs' ? '페이지 ID ← 기준 문서 확인 작업의 페이지 ID' :
      job.path ? '사내 Confluence · GET ' + job.path : '이 작업에 연결된 도구가 없습니다.';
    body.append(info);
    dialog.showModal();
  }

  content.addEventListener('click', event => {
    const button = event.target.closest('[data-action]');
    if (!button) return;
    const { action } = button.dataset;
    const id = Number(button.dataset.id);
    if (['tool', 'example', 'inputs', 'job'].includes(action)) {
      const stage = stages.find(item => item.jobs.some(job => job.id === id));
      const job = stage.jobs.find(item => item.id === id);
      if (action !== 'job') { showTool(job, action); return; }
      editingJob = { stage, job };
      adding = null;
      render();
      focusControl('#job-name');
      return;
    }
    if (action === 'back') {
      const jobId = editingJob.job.id;
      editingJob = null;
      render();
      focusControl('[data-action="job"][data-id="' + jobId + '"]');
      return;
    }
    if (action === 'stage') {
      adding = null;
      expanded = expanded === id ? null : id;
      render();
      focusControl('[data-action="stage"][data-id="' + id + '"]');
      return;
    }
    if (action === 'cancel') {
      const last = adding;
      adding = null;
      render();
      focusControl(last.type === 'stage' ? '[data-action="add-stage"]' : '[data-action="add-job"][data-id="' + last.id + '"]');
      return;
    }
    adding = action === 'add-stage' ? { type: 'stage' } : { type: 'job', id };
    render();
    focusControl('.add-row input');
  });

  content.addEventListener('submit', event => {
    event.preventDefault();
    const form = event.target;
    const input = form.elements.name;
    const name = input.value.trim();
    if (!name) {
      input.setCustomValidity('이름을 입력해 주세요.');
      input.reportValidity();
      return;
    }
    if (form.dataset.add === 'stage') {
      const stage = { id: nextStage++, name, jobs: [] };
      stages.push(stage);
      expanded = stage.id;
      adding = null;
      render();
      focusControl('.add-row input');
    } else {
      const stage = stages.find(item => item.id === Number(form.dataset.id));
      const job = { id: nextJob++, name, mode: 'human' };
      stage.jobs.push(job);
      editingJob = { stage, job };
      adding = null;
      render();
      focusControl('#job-name');
    }
    changed();
  });

  content.addEventListener('input', event => {
    if (event.target.closest('.add-row')) event.target.setCustomValidity('');
    if (editingJob && event.target.id === 'job-name') {
      editingJob.job.name = event.target.value;
      changed();
    }
    if (editingJob && event.target.id === 'job-description') {
      editingJob.job.description = event.target.value;
      changed();
    }
  });

  content.addEventListener('change', event => {
    if (editingJob && event.target.id === 'job-mode') {
      editingJob.job.mode = event.target.value;
      changed();
    }
  });

  document.getElementById('publication').addEventListener('change', changed);
  save.addEventListener('click', () => {
    if (!dirty) return;
    dirty = false;
    save.disabled = true;
    status.textContent = '시안에서 변경을 확인했습니다.';
  });
  render();
</script>
</body>
</html>
