<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EES Workflow 업무 절차 편집 시안</title>
<style data-new-screen>
  :root {
    color-scheme: light;
    font: 14px/1.5 "Malgun Gothic", "Noto Sans CJK KR", system-ui, sans-serif;
    color: #20242b;
    --muted: #586272;
    --line: #e1e4e8;
    --control: #c4cbd3;
    --side: #f4f5f6;
    --ink: #20242b;
  }
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; background: white; }
  [hidden] { display: none !important; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button, summary { cursor: pointer; }
  button:focus-visible, input:focus-visible, select:focus-visible,
  textarea:focus-visible, summary:focus-visible { outline: 2px solid #4b6380; outline-offset: 3px; }
  button { border: 0; background: transparent; }
  h1, h2, h3, p { margin: 0; }
  .app { display: grid; grid-template-columns: 256px minmax(0, 1fr) clamp(320px, 29vw, 560px); min-height: 100dvh; }
  .sidebar { background: var(--side); border-right: 1px solid var(--line); padding: 12px 8px; }
  .brand { display: flex; gap: 8px; align-items: center; padding: 0 4px; font-weight: 700; }
  .mark { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 6px; background: var(--ink); color: white; font-size: 13px; }
  .modes { display: grid; grid-template-columns: 1fr 1fr; margin: 16px 0 22px; padding: 3px; border-radius: 6px; background: #e8eaed; text-align: center; font-size: 13px; }
  .modes span { padding: 6px; }
  .modes .selected { background: white; border-radius: 5px; box-shadow: 0 1px 2px #20242b14; font-weight: 600; }
  .sidebar h2 { margin: 0 5px 6px; color: var(--muted); font-size: 12px; font-weight: 400; }
  .scope { display: flex; gap: 10px; align-items: center; justify-content: space-between; padding: 8px 10px; border: 1px solid var(--line); border-radius: 5px; background: white; font-size: 13px; }
  .scope + .scope { margin-top: 4px; }
  .scope span { color: var(--muted); }
  .scope strong { font-weight: 500; }
  .nav { display: grid; gap: 4px; margin-top: 18px; }
  .nav div { padding: 10px 12px; }
  .nav .selected { background: #e7e9ec; border-radius: 6px; font-weight: 600; }
  .recent { margin-top: 24px; border-top: 1px solid var(--line); padding: 14px 4px; }
  .recent p { padding: 5px 6px; font-size: 13px; color: var(--muted); }
  main { display: flex; flex-direction: column; height: 100dvh; min-width: 0; }
  .bar { display: flex; align-items: center; justify-content: space-between; min-height: 48px; gap: 10px; padding: 8px 20px; border-bottom: 1px solid var(--line); font-weight: 600; }
  .preview { font-size: 12px; color: var(--muted); font-weight: 400; white-space: nowrap; }
  .preview-tools { display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: center; gap: 7px 12px; }
  .preview-tools select { padding: 4px 8px; font-size: 12px; background: var(--side); }
  .preview-tools .label { color: var(--muted); }
  .scroll { flex: 1 1 auto; overflow: auto; min-height: 0; }
  .page { max-width: 1104px; margin-inline: auto; padding: 17px clamp(20px, 4vw, 72px) 30px; }
  .crumb { color: var(--muted); font-size: 13px; }
  .title { margin-top: 12px; display: flex; align-items: center; flex-wrap: wrap; gap: 12px; }
  h1 { font-size: 21px; line-height: 1.4; letter-spacing: -.025em; }
  .publication { display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: 12px; }
  input, select, textarea { border: 1px solid var(--control); border-radius: 6px; background: white; padding: 8px 10px; }
  .publication select { padding: 5px 8px; }
  .more { position: relative; margin-left: auto; }
  .more summary { list-style: none; padding: 2px 9px; border-radius: 6px; background: var(--side); font-size: 17px; }
  .more summary::-webkit-details-marker { display: none; }
  .more-menu { position: absolute; z-index: 1; top: calc(100% + 6px); right: 0; min-width: max-content; margin: 0; padding: 6px; list-style: none; border: 1px solid var(--line); border-radius: 6px; background: white; box-shadow: 0 4px 12px #20242b18; }
  .more-menu li { padding: 7px 10px; font-size: 13px; }
  .more-menu li:has(button) { padding: 0; }
  .more-menu button { width: 100%; padding: 7px 10px; border-radius: 4px; text-align: left; }
  .more-menu button:hover { background: var(--side); }
  .system { margin-top: 6px; font-size: 12px; color: var(--muted); }
  .tabbar { display: flex; gap: 20px; margin: 12px 0; border-bottom: 1px solid var(--line); font-size: 13px; color: var(--muted); }
  .tabbar span { padding: 8px 0; }
  .tabbar [aria-current] { border-bottom: 2px solid var(--ink); font-weight: 600; color: var(--ink); }
  .overview { padding: 14px 16px; border: 1px solid var(--line); border-radius: 8px; background: #fcfcfd; }
  .label { font-size: 12px; font-weight: 600; }
  .overview p + p { margin-top: 4px; color: var(--muted); }
  .section-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 20px 0 8px; }
  .section-label { display: flex; align-items: baseline; flex-wrap: wrap; gap: 8px; }
  h2 { font-size: 15px; font-weight: 700; }
  .count { color: var(--muted); font-size: 12px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    border: 1px solid var(--control); border-radius: 6px; background: white; min-height: 34px;
    padding: 5px 10px; font-size: 13px; font-weight: 600; white-space: nowrap;
  }
  .btn:hover { background: #f0f2f4; border-color: #a8b1bc; }
  .btn.primary { background: var(--ink); color: white; border-color: var(--ink); }
  .btn.primary:hover { background: #363c46; }
  .btn:disabled { opacity: .45; cursor: default; }
  .add-action {
    display: inline-flex; align-items: center; justify-content: center; gap: 5px; flex: none;
    min-height: 34px; padding: 5px 9px; border-radius: 6px;
    background: var(--side); color: #1d2128; font-size: 13px; font-weight: 500; line-height: 20px;
    white-space: nowrap;
  }
  .add-action:hover { background: #e7e8eb; }
  .add-action:focus-visible { outline-color: currentColor; outline-offset: 2px; box-shadow: 0 0 0 2px #1d212826; }
  .plus { display: grid; place-items: center; width: 14px; height: 14px; flex: none; }
  .plus::before, .plus::after { content: ""; grid-area: 1 / 1; border-radius: 1px; background: currentColor; }
  .plus::before { width: 10px; height: 1.5px; }
  .plus::after { width: 1.5px; height: 10px; }
  .stage { border: 1px solid var(--line); border-radius: 8px; margin-bottom: 8px; overflow: clip; }
  .stage-head { display: flex; align-items: center; gap: 6px; background: #fafbfc; padding-right: 12px; }
  .stage-toggle { display: flex; align-items: center; gap: 8px; flex: 1 1 auto; min-width: 0; min-height: 51px; padding: 8px 12px; text-align: left; }
  .stage-toggle:hover { background: #eff1f4; }
  .stage-toggle:focus-visible { outline-offset: -3px; }
  .stage-toggle .count { margin-left: auto; white-space: nowrap; }
  .number { display: grid; place-items: center; width: 22px; height: 22px; border: 1px solid var(--control); background: white; border-radius: 50%; font-size: 12px; flex: none; color: var(--muted); }
  .stage-name { font-weight: 600; overflow-wrap: anywhere; }
  .chevron { width: 7px; height: 7px; border: solid var(--muted); border-width: 0 1.5px 1.5px 0; transform: rotate(-45deg); margin: 0 3px 0 2px; flex: none; }
  [aria-expanded="true"] .chevron { transform: rotate(45deg) translate(-1px, -1px); }
  .stage-body { padding: 0 14px 0 38px; border-top: 1px solid var(--line); }
  .job { display: flex; justify-content: space-between; gap: 14px; align-items: flex-start; padding: 12px 0; }
  .job + .job { border-top: 1px solid var(--line); }
  .job-open { padding: 0; font-weight: 600; text-align: left; }
  .job-open:hover, .text-btn:hover { text-decoration: underline; }
  .job-info { margin-top: 3px; display: grid; gap: 1px; color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
  .job-actions { display: grid; justify-items: end; gap: 3px; flex: none; }
  .text-btn { padding: 0; color: #34475f; font-size: 12px; min-height: 22px; text-align: left; }
  code { font-size: 11px; }
  .add-row { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 8px; padding: 10px 0; }
  .add-row label, .job-form label { display: grid; gap: 4px; }
  .add-row label { flex: 0 1 340px; min-width: min(100%, 160px); }
  .add-row input { height: 36px; }
  .add-row .btn { min-height: 36px; }
  .job-form { display: grid; gap: 14px; max-width: 540px; margin-top: 14px; }
  .job-form textarea { resize: vertical; }
  .foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; border-top: 1px solid var(--line); padding: 10px clamp(20px, 4vw, 72px); }
  .foot p { color: var(--muted); font-size: 12px; }
  .chat { display: flex; flex-direction: column; border-left: 1px solid var(--line); color: var(--muted); }
  .chat .bar { color: var(--ink); font-weight: 500; }
  .chat-body { display: grid; flex: 1; place-content: center; text-align: center; }
  .chat-body p:first-child { color: var(--ink); font-size: 22px; }
  .chat-body p + p { margin-top: 3px; }
  .chat-input { border: 1px solid var(--line); border-radius: 12px; margin: 12px; padding: 12px; font-size: 13px; }
  dialog { color: var(--ink); background: white; border: 1px solid var(--line); border-radius: 9px; width: min(calc(100% - 28px), 520px); padding: 20px; }
  dialog::backdrop { background: #151a264d; }
  dialog h2 { margin-bottom: 12px; }
  dialog p { color: var(--muted); }
  dialog pre { padding: 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--side); white-space: pre-wrap; overflow-wrap: anywhere; }
  dialog form { margin-top: 16px; text-align: right; }
  .binding-form { display: grid; gap: 10px; text-align: left; }
  .binding-form label { display: grid; gap: 4px; }
  .binding-form input, .binding-form select { width: 100%; }
  .binding-form .btn { justify-self: end; }
  .binding-list { display: grid; grid-template-columns: minmax(75px, 1fr) minmax(0, 2fr); gap: 8px 12px; margin: 12px 0; font-size: 13px; }
  .binding-list dt { font-weight: 600; }
  .binding-list dd { margin: 0; color: var(--muted); }
  @media (max-width: 1150px) {
    .app { grid-template-columns: 210px minmax(0, 1fr); }
    .chat { display: none; }
  }
  @media (max-width: 650px) {
    .app { display: block; }
    .sidebar { display: none; }
    .bar { padding-inline: 14px; }
    .bar:has(.preview-tools) { align-items: flex-start; flex-direction: column; }
    .preview-tools { justify-content: flex-start; }
    .page { padding-inline: 14px; }
    .stage-body { padding-inline: 12px; }
    .stage-head { padding-right: 6px; gap: 2px; }
    .stage-toggle { padding-inline: 6px; }
    .stage-toggle .count { display: none; }
    .job { gap: 8px; }
  }
  .run-overview, .run-controls, .run-job-title { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .run-overview > div, .run-job-title h3 { flex: 1 1 auto; }
  .run-setup { margin-top: 8px; padding: 12px 16px; border: 1px solid var(--line); border-radius: 6px; }
  .run-inline-form { display: flex; flex-wrap: wrap; align-items: end; gap: 8px; }
  .run-inline-form label { display: grid; gap: 4px; }
  .run-inline-form input { min-width: 0; width: min(200px, 58vw); height: 34px; }
  .run-stage-head { padding: 8px 12px; min-height: 46px; }
  .run-stage-body { padding-inline: 14px; }
  .run-job { display: grid; gap: 6px; justify-content: stretch; }
  .run-job h3 { font-size: 14px; }
  .run-job > .btn { justify-self: start; }
  .run-value { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 8px; color: var(--muted); font-size: 12px; }
  .run-value strong { color: var(--ink); overflow-wrap: anywhere; }
  .run-value small { font-size: inherit; }
  .run-preview > .run-value { margin-top: 10px; }
  .run-results { display: grid; gap: 4px; padding: 8px 10px; margin: 0; background: var(--side); border-radius: 6px; }
  .run-results > div { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 13px; }
  .run-results dt { color: var(--muted); }
  .run-results dd { margin: 0; overflow-wrap: anywhere; }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" aria-label="워크스페이스 화면 예시">
    <div class="brand"><span class="mark" aria-hidden="true">E</span>EES Workflow</div>
    <div class="modes"><span id="side-work">업무</span><span id="side-editor" class="selected">워크스페이스</span></div>
    <h2>작업 위치</h2>
    <div class="scope"><span>공장</span><strong id="scope-factory">전체 공장</strong></div>
    <div class="scope"><span>시스템</span><strong>EMS</strong></div>
    <div class="nav"><div class="selected">업무 절차</div><div>도구 · 자료</div></div>
    <div class="recent"><h2>최근 편집</h2><p id="recent-procedure">Confluence 문서 확인</p></div>
  </aside>
  <main>
    <div class="bar">
      <span id="view-name">업무 절차</span>
      <div class="preview-tools">
        <span class="preview">시안 4 · 저장·실행 안 됨</span>
        <label><span class="label">예시</span>
          <select id="example-procedure">
            <option value="confluence">Confluence 문서 확인</option>
            <option value="equipment">설비 이력 점검</option>
          </select>
        </label>
        <button class="btn" type="button" id="view-toggle">실행 미리보기</button>
      </div>
    </div>
    <div class="scroll">
      <article class="page">
        <p class="crumb" id="procedure-crumb">업무 절차 목록</p>
        <div class="title">
          <h1 id="procedure-title">Confluence 문서 확인</h1>
          <label class="publication" id="publication-field">게시 상태 <select id="publication"><option>미게시</option><option selected>게시</option></select></label>
          <details class="more" id="procedure-menu">
            <summary aria-label="업무 절차 메뉴">⋯</summary>
            <ul class="more-menu"><li>업무 절차 정보·분류 수정</li><li><button type="button" id="parameter-settings">실행 파라미터</button></li><li>다른 이름으로 저장</li><li>내용 확인</li></ul>
          </details>
        </div>
        <p class="system">EMS · 게시 v1</p>
        <div class="tabbar" id="editor-tabs" aria-label="업무 절차 메뉴 예시"><span aria-current="page">업무 내용</span><span>게시 기록</span></div>
        <div id="content"></div>
      </article>
    </div>
    <footer class="foot" id="editor-footer"><p id="status" role="status">저장됨</p><button class="btn primary" id="save" disabled>저장</button></footer>
  </main>
  <aside class="chat" aria-label="업무 도우미 화면 예시">
    <div class="bar">업무 도우미</div>
    <div class="chat-body"><p>업무 도우미</p><p>무엇을 도와드릴까요?</p></div>
    <div class="chat-input">업무를 물어보거나, 필요한 작업을 요청하세요</div>
  </aside>
</div>
<dialog id="tool-dialog" aria-labelledby="dialog-title">
  <h2 id="dialog-title"></h2>
  <div id="dialog-content"></div>
  <form method="dialog"><button class="btn" autofocus>닫기</button></form>
</dialog>
<script>
function createRunPreview({ escapeText, getScenario, render, focusControl }) {
  const examples = {
    equipment: {
      description: '온도와 진동 이력을 조회해 설비 상태를 확인합니다.',
      stage: '설비 이력 확인',
      jobs: [
        { key: 'temperature', name: '온도 이력 조회' },
        { key: 'vibration', name: '진동 이력 조회' },
        { key: 'summary', name: '점검 결과 확인' }
      ]
    },
    confluence: {
      description: '기준 문서와 하위 문서를 확인합니다.',
      stage: '문서 확인',
      jobs: [
        { key: 'page', name: '기준 문서 확인' },
        { key: 'children', name: '하위 문서 목록 조회' }
      ]
    }
  };
  let run;

  function reset() {
    run = { phase: 'idle', setup: null, target: '', results: [], pending: null };
  }

  function open() {
    if (run.setup && run.setup.key !== getScenario().key) reset();
  }

  function setup() {
    const scenario = getScenario();
    const key = scenario.key === 'equipment' ? 'equipment' : 'confluence';
    const defaultSource = scenario.shared === false ? 'job' : 'run';
    const temperatureSource = scenario.targetSources?.temperature || defaultSource;
    const vibrationSource = scenario.targetSources?.vibration || defaultSource;
    return {
      ...examples[key],
      key,
      factory: scenario.factory || '',
      system: scenario.system || '',
      parameterLabel: scenario.parameterLabel || '설비 번호',
      targetSources: {
        temperature: temperatureSource === 'result' ? 'job' : temperatureSource,
        vibration: vibrationSource
      },
      needsTarget: key === 'equipment' && [temperatureSource, vibrationSource].includes('run')
    };
  }

  function draw(focus) {
    render();
    if (focus) focusControl(focus);
  }

  function firstJobControl() {
    return '[data-run-form] input, [data-run-form] button[type="submit"], [data-action="run-execute"]';
  }

  function targetInfo(job, config) {
    switch (config.targetSources[job.key]) {
      case 'run': return { value: run.target, source: '실행 입력' };
      case 'factory': return { value: config.factory, source: '현재 업무의 공장' };
      case 'system': return { value: config.system, source: '현재 업무의 시스템' };
      case 'result': return { value: run.results[0]?.target, source: '온도 이력 조회 결과' };
      default: return { value: '', source: '', prompt: true };
    }
  }

  function field(name, label, attributes = '') {
    return `<label><span class="label">${escapeText(label)}</span><input name="${name}" ${attributes} required></label>`;
  }

  function sourceValue(label, value, source) {
    return `<div class="run-value"><span>${escapeText(label)}</span><strong>${escapeText(value || '선택 필요')}</strong><small>${escapeText(source)}</small></div>`;
  }

  function startForm(config) {
    return `<form class="run-inline-form run-setup" data-run-form="start">
      ${field('target', config.parameterLabel, 'maxlength="40" placeholder="예: EQ-123" autocomplete="off"')}
      <div class="run-controls"><button class="btn primary" type="submit">시작</button>
      <button class="btn" type="button" data-action="run-cancel">취소</button></div>
    </form>`;
  }

  function jobForm(job, config) {
    const execute = '<button class="btn primary" type="submit">실행</button>';
    if (job.key === 'page') {
      return `<form class="run-inline-form" data-run-form="job">
        ${field('page', '페이지 ID', 'inputmode="numeric" pattern="[0-9]+" maxlength="24" placeholder="예: 123456789" autocomplete="off"')}
        ${execute}</form>`;
    }
    if (job.key === 'children') {
      return `${sourceValue('페이지 ID', run.results[0]?.target, '기준 문서 확인 결과')}
        <button class="btn primary" type="button" data-action="run-execute">실행</button>`;
    }
    if (job.key === 'summary') {
      return `${sourceValue('평균 온도', run.results[0].reading, '온도 이력 조회 결과')}
        ${sourceValue('진동 RMS', run.results[1].reading, '진동 이력 조회 결과')}
        <button class="btn primary" type="button" data-action="run-execute">실행</button>`;
    }
    const target = targetInfo(job, config);
    const value = sourceValue('공장', config.factory, '현재 업무의 공장') +
      (target.prompt ? '' : sourceValue(config.parameterLabel, target.value, target.source));
    if (!target.prompt && !target.value) return value;
    const jobTarget = target.prompt ? field('target', config.parameterLabel, 'maxlength="40" placeholder="예: EQ-123" autocomplete="off"') : '';
    const period = job.key === 'temperature'
      ? field('period', '조회 기간(시간)', 'type="number" min="1" max="168" step="1" placeholder="예: 24"')
      : '';
    return value + (jobTarget || period
      ? `<form class="run-inline-form" data-run-form="job">${jobTarget}${period}${execute}</form>`
      : '<button class="btn primary" type="button" data-action="run-execute">실행</button>');
  }

  function jobResult(result) {
    return `<dl class="run-results">${result.values.map(([label, value]) =>
      `<div><dt>${escapeText(label)}</dt><dd>${escapeText(value)}</dd></div>`).join('')}</dl>`;
  }

  function jobRow(job, index, config) {
    const result = run.results[index];
    const current = run.phase === 'active' && index === run.results.length;
    const awaiting = current && run.pending;
    const status = result ? '완료' : awaiting ? '확인 필요' : current ? '실행 가능' : '실행 전';
    return `<section class="job run-job">
      <div class="run-job-title"><h3>${job.name}</h3><span class="count">${status}</span></div>
      ${result ? jobResult(result) : ''}
      ${awaiting ? `${jobResult(run.pending)}<button class="btn primary" type="button" data-action="run-confirm">확인</button>` : ''}
      ${current && !awaiting ? jobForm(job, config) : ''}
    </section>`;
  }

  function html() {
    const config = run.setup || setup();
    const progress = run.phase === 'finished' ? '완료' : run.phase === 'active' ? '진행 중' : '시작 전';
    return `<div class="run-preview">
      <div class="overview run-overview">
        <div><p class="label">업무 목적</p><p>${config.description}</p></div>
        ${run.phase === 'idle' ? '<button class="btn primary" type="button" data-action="run-start">시작</button>' : ''}
        ${run.phase === 'finished' ? '<button class="btn" type="button" data-action="run-reset">다시 시작</button>' : ''}
      </div>
      ${run.phase === 'collecting' ? startForm(config) : ''}
      ${run.target ? sourceValue(config.parameterLabel, run.target, '이번 실행') : ''}
      <div class="section-head"><div class="section-label"><h2>단계와 작업</h2><span class="count">${progress}</span></div>
        <span class="count">${run.results.length} / ${config.jobs.length} 완료</span></div>
      <div class="stage"><div class="stage-head run-stage-head"><span class="number">1</span><strong>${config.stage}</strong></div>
        <div class="stage-body run-stage-body">${config.jobs.map((job, i) => jobRow(job, i, config)).join('')}</div></div>
    </div>`;
  }

  function makeResult(job, config, values) {
    if (job.key === 'page') {
      const target = values.page;
      if (!/^[0-9]{1,24}$/.test(target || '')) return null;
      return { target, values: [['페이지 ID', target], ['제목', '설비 점검 안내 (예시)']] };
    }
    if (job.key === 'children') {
      const target = run.results[0]?.target;
      return { target, values: [['기준 문서 ID', target], ['하위 문서', '일일 설비 점검표, 월간 이력 조회']] };
    }
    if (job.key === 'summary') {
      const [temperature, vibration] = run.results;
      return {
        values: [
          ['온도', temperature.target + ' · ' + temperature.reading],
          ['진동', vibration.target + ' · ' + vibration.reading]
        ]
      };
    }
    const binding = targetInfo(job, config);
    const target = binding.prompt ? values.target : binding.value;
    if (!target) return null;
    const rows = [[config.parameterLabel, target]];
    const reading = job.key === 'temperature' ? '63.2 °C' : '2.4 mm/s';
    if (job.key === 'temperature') {
      const hours = Number(values.period);
      if (!Number.isInteger(hours) || hours < 1 || hours > 168) return null;
      rows.push(['조회 기간', hours + '시간'], ['평균 온도', reading]);
    } else rows.push(['진동 RMS', reading]);
    return { target, reading, values: rows };
  }

  function execute(values = {}) {
    if (run.phase !== 'active' || run.pending) return;
    const job = run.setup.jobs[run.results.length];
    run.pending = makeResult(job, run.setup, values);
    if (run.pending) draw('[data-action="run-confirm"]');
  }

  function handleClick(action) {
    switch (action) {
      case 'run-start':
        if (run.phase !== 'idle') return true;
        run.setup = setup();
        run.phase = run.setup.needsTarget ? 'collecting' : 'active';
        draw(firstJobControl());
        return true;
      case 'run-cancel':
      case 'run-reset':
        reset();
        draw('[data-action="run-start"]');
        return true;
      case 'run-execute':
        execute();
        return true;
      case 'run-confirm':
        if (!run.pending) return true;
        run.results.push(run.pending);
        run.pending = null;
        if (run.results.length === run.setup.jobs.length) {
          run.phase = 'finished';
          draw('[data-action="run-reset"]');
        } else draw(firstJobControl());
        return true;
      default:
        return false;
    }
  }

  function handleSubmit(event) {
    const form = event.target;
    const kind = form.dataset.runForm;
    if (kind !== 'start' && kind !== 'job') return false;
    event.preventDefault();
    const value = name => form.elements.namedItem(name)?.value.trim() || '';
    if (kind === 'start') {
      if (run.phase === 'collecting' && value('target')) {
        run.target = value('target');
        run.phase = 'active';
        draw(firstJobControl());
      }
    } else execute({ target: value('target'), period: value('period'), page: value('page') });
    return true;
  }

  reset();
  return { open, reset, html, handleClick, handleSubmit };
}
  const content = document.getElementById('content');
  const status = document.getElementById('status');
  const save = document.getElementById('save');
  const dialog = document.getElementById('tool-dialog');
  const dialogTitle = document.getElementById('dialog-title');
  const dialogContent = document.getElementById('dialog-content');
  const confluenceStages = [{
    id: 1, name: '문서 확인', jobs: [
      { id: 1, name: '기준 문서 확인', mode: 'tool', service: '사내 Confluence', path: '/{id}',
        inputs: '페이지 ID ← 이 작업에서 입력', outputs: '제목, 페이지 ID, 문서 유형',
        example: { title: '설비 점검 안내 (예시)', id: '12345', type: 'page' } },
      { id: 2, name: '하위 문서 목록 조회', mode: 'tool', service: '사내 Confluence', path: '/{id}/child/page',
        inputs: '페이지 ID ← 기준 문서 확인 · 표시할 문서 수 ← 고정값 5', outputs: '하위 문서 목록' }
    ]
  }];
  const equipmentStages = [{
    id: 2, name: '설비 이력 확인', jobs: [
      { id: 11, key: 'temperature', name: '온도 이력 조회', mode: 'tool', service: 'EMS 설비 이력', path: '/equipment/{id}/temperature',
        outputs: '온도 이력, 설비 번호' },
      { id: 12, key: 'vibration', name: '진동 이력 조회', mode: 'tool', service: 'EMS 설비 이력', path: '/equipment/{id}/vibration',
        outputs: '진동 이력' },
      { id: 13, name: '점검 결과 확인', mode: 'human', inputs: '온도 이력과 진동 이력 ← 앞 작업 결과' }
    ]
  }];
  const demos = {
    confluence: {name: 'Confluence 문서 확인', purpose: '기준 문서와 그 하위 문서를 확인합니다.', factory: '전체 공장', stages: confluenceStages},
    equipment: {
      name: '설비 이력 점검', purpose: '같은 설비의 온도·진동 이력을 조회하고 결과를 점검합니다.',
      factory: '울산', stages: equipmentStages, parameterLabel: '대상 설비 번호',
      targetSources: {temperature: 'run', vibration: 'run'}
    }
  };
  let scenarioKey = 'confluence';
  let stages = confluenceStages;
  let view = 'editor';
  let nextStage = 3;
  let nextJob = 20;
  let expanded = 1;
  let editingJob = null;
  let adding = null;
  const scenario = () => demos[scenarioKey];
  const getScenario = () => ({...scenario(), key:scenarioKey, system:'EMS',
    shared:Object.values(scenario().targetSources || {}).includes('run')});

  function escapeText(value) {
    return String(value ?? '').replace(/[&<>"']/g, char => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[char]);
  }

  function plusButton(label, action, id = '') {
    return '<button class="add-action" type="button" data-action="' + action + '" data-id="' + id +
      '"><span class="plus" aria-hidden="true"></span>' + label + '</button>';
  }

  function addForm(type, id = '', showCancel = true) {
    const label = type === 'stage' ? '단계' : '작업';
    return '<form class="add-row" data-add="' + type + '" data-id="' + id + '">' +
      '<label><span class="label">' + label + ' 이름</span><input name="name" required maxlength="160" ' +
      'placeholder="' + (type === 'stage' ? '예: 점검 결과 정리' : '예: 문서 제목 확인') + '"></label>' +
      '<button class="btn primary">' + label + ' 추가</button>' +
      (showCancel ? '<button class="btn" type="button" data-action="cancel">취소</button>' : '') + '</form>';
  }

  function targetSourceLabel(source) {
    if (source === 'run') return '시작할 때 입력 · ' + scenario().parameterLabel;
    if (source === 'result') return '온도 이력 조회 · 설비 번호';
    return '이 작업에서 입력';
  }

  function inputSummary(job) {
    if (!job.key) return job.inputs;
    const target = targetSourceLabel(scenario().targetSources[job.key]);
    return '설비 번호 ← ' + target + ' · 공장 ← 현재 업무의 공장' +
      (job.key === 'temperature' ? ' · 조회 기간 ← 이 작업에서 입력' : '');
  }

  function jobRow(job) {
    const api = job.mode === 'tool';
    const bound = api && Boolean(job.path);
    const info = bound
      ? '<span>' + escapeText(job.service) + ' · <code>GET ' + escapeText(job.path) + '</code></span>' +
        '<span>보내는 값 · ' + escapeText(inputSummary(job)) + '</span><span>받는 값 · ' + escapeText(job.outputs) + '</span>'
      : '<span>' + (api ? '도구 연결 전' : '사람이 확인') + '</span>' +
        (job.inputs ? '<span>참고값 · ' + escapeText(job.inputs) + '</span>' : '');
    const toolActions = api
      ? '<button class="text-btn" data-action="tool" data-id="' + job.id + '">' + (bound ? '도구 변경' : '도구 연결') + '</button>' +
        (job.example ? '<button class="text-btn" data-action="example" data-id="' + job.id + '">조회 결과 예시 보기</button>' : '') +
        (bound ? '<button class="text-btn" data-action="inputs" data-id="' + job.id + '">입력 연결 변경</button>' : '')
      : '';
    return '<div class="job"><div><button class="job-open" data-action="job" data-id="' + job.id + '">' +
      escapeText(job.name) + '</button><div class="job-info">' + info + '</div></div>' +
      '<div class="job-actions">' + toolActions + '</div></div>';
  }

  function stageCard(stage, index) {
    const open = expanded === stage.id;
    const manualAdd = adding?.type === 'job' && adding.id === stage.id;
    const automaticAdd = !adding && !stage.jobs.length;
    const showAddForm = open && (manualAdd || automaticAdd);
    return '<section class="stage"><header class="stage-head">' +
      '<button class="stage-toggle" data-action="stage" data-id="' + stage.id + '" aria-expanded="' + open +
      '" aria-controls="stage-' + stage.id + '"><span class="number">' + (index + 1) + '</span>' +
      '<span class="stage-name">' + escapeText(stage.name) + '</span><span class="count">' + stage.jobs.length +
      '개 작업</span><span class="chevron" aria-hidden="true"></span></button>' +
      (open && !showAddForm
        ? plusButton('작업 추가', 'add-job', stage.id) : '') + '</header>' +
      '<div class="stage-body" id="stage-' + stage.id + '"' + (open ? '' : ' hidden') + '>' +
      (open ? stage.jobs.map(jobRow).join('') : '') +
      (showAddForm ? addForm('job', stage.id, manualAdd) : '') +
      '</div></section>';
  }

  function showJob() {
    const { stage, job } = editingJob;
    return '<button class="text-btn" data-action="back">← 단계와 작업</button> <span class="count">/ ' +
      escapeText(stage.name) + '</span><div class="job-form">' +
      '<label><span class="label">작업 이름</span><input id="job-name" maxlength="160" value="' + escapeText(job.name) + '"></label>' +
      '<label><span class="label">수행 방법</span><select id="job-mode"><option value="human"' +
      (job.mode === 'human' ? ' selected' : '') + '>사람이 확인</option><option value="tool"' +
      (job.mode === 'tool' ? ' selected' : '') + '>도구로 처리</option></select></label>' +
      '<label><span class="label">수행 내용</span><textarea id="job-description" rows="3">' + escapeText(job.description) +
      '</textarea></label></div>';
  }

  function render() {
    if (view === 'run') { content.innerHTML = runPreview.html(); return; }
    content.innerHTML = editingJob ? showJob() :
      '<div class="overview"><p class="label">업무 목적</p><p>' + escapeText(scenario().purpose) + '</p></div>' +
      '<div class="section-head"><div class="section-label"><h2>단계와 작업</h2><span class="count">' + stages.length +
      '개 단계</span></div>' + (adding?.type === 'stage' ? '' : plusButton('단계 추가', 'add-stage')) + '</div>' +
      stages.map(stageCard).join('') + (adding?.type === 'stage' ? addForm('stage') : '');
  }

  function changed() {
    scenario().dirty = true;
    save.disabled = false;
    status.textContent = '저장하지 않은 변경 있음';
  }

  function focusControl(selector) {
    const target = content.querySelector(selector);
    if (!target) return;
    target.scrollIntoView({ block: 'nearest' });
    target.focus({ preventScroll: true });
  }

  function openSetup(title, markup) {
    dialogTitle.textContent = title;
    dialogContent.innerHTML = markup;
    dialog.showModal();
    dialogContent.querySelector('input, select')?.focus();
  }

  function showParameters() {
    document.getElementById('procedure-menu').open = false;
    if (!scenario().parameterLabel) {
      openSetup('실행 파라미터', '<p>등록된 실행 파라미터가 없습니다.</p>');
      return;
    }
    const consumers = stages.flatMap(stage => stage.jobs)
      .filter(job => scenario().targetSources[job.key] === 'run').map(job => job.name);
    openSetup('실행 파라미터',
      '<form class="binding-form" data-parameter-form>' +
      '<label><span class="label">파라미터 이름</span><input name="parameter-name" value="' +
      escapeText(scenario().parameterLabel) + '" required maxlength="80"></label>' +
      '<dl class="binding-list"><dt>형식</dt><dd>텍스트 · 필수</dd><dt>사용하는 작업</dt><dd>' +
      escapeText(consumers.join(', ') || '연결된 작업 없음') + '</dd></dl>' +
      '<button class="btn primary" type="submit">적용</button></form>');
  }

  function bindingForm(job) {
    const source = scenario().targetSources[job.key];
    const choices = [['run', targetSourceLabel('run')], ['job', targetSourceLabel('job')]];
    if (job.key === 'vibration') choices.push(['result', targetSourceLabel('result')]);
    const options = choices.map(([key, label]) =>
      '<option value="' + key + '"' + (key === source ? ' selected' : '') + '>' + escapeText(label) + '</option>').join('');
    return '<p>' + escapeText(job.name) + '</p>' +
      '<form class="binding-form" data-binding-job="' + job.key + '">' +
      '<label><span class="label">설비 번호의 값 가져오는 곳</span><select name="target-source">' + options + '</select></label>' +
      '<dl class="binding-list"><dt>공장</dt><dd>현재 업무의 공장</dd>' +
      (job.key === 'temperature' ? '<dt>조회 기간</dt><dd>이 작업에서 입력</dd>' : '') +
      '</dl><button class="btn primary" type="submit">연결 적용</button></form>';
  }

  function showTool(job, action) {
    if (action === 'inputs' && job.key) {
      openSetup('입력 연결', bindingForm(job));
      return;
    }
    dialogTitle.textContent = action === 'example' ? '조회 결과 예시' :
      action === 'inputs' ? '입력 연결' : '연결된 도구';
    dialogContent.replaceChildren();
    const info = document.createElement(action === 'example' ? 'pre' : 'p');
    info.textContent = action === 'example' ? JSON.stringify(job.example, null, 2) :
      action === 'inputs' ? inputSummary(job) :
      job.path ? job.service + ' · GET ' + job.path : '이 작업에 연결된 도구가 없습니다.';
    dialogContent.append(info);
    dialog.showModal();
  }

  dialogContent.addEventListener('submit', event => {
    const form = event.target;
    if (form.hasAttribute('data-parameter-form')) {
      event.preventDefault();
      const input = form.elements['parameter-name'];
      const value = input.value.trim();
      if (!value) {
        input.setCustomValidity('파라미터 이름을 입력해 주세요.');
        input.reportValidity();
        return;
      }
      scenario().parameterLabel = value;
    } else if (form.dataset.bindingJob) {
      event.preventDefault();
      scenario().targetSources[form.dataset.bindingJob] = form.elements['target-source'].value;
    } else return;
    dialog.close();
    changed();
    render();
  });

  dialogContent.addEventListener('input', event => {
    if (event.target.name === 'parameter-name') event.target.setCustomValidity('');
  });

  const runPreview = createRunPreview({escapeText, getScenario, render, focusControl});

  function showView() {
    const isRun = view === 'run';
    document.getElementById('procedure-title').textContent = scenario().name;
    document.getElementById('recent-procedure').textContent = scenario().name;
    document.getElementById('scope-factory').textContent = scenario().factory;
    document.getElementById('view-name').textContent = isRun ? '업무' : '업무 절차';
    document.getElementById('procedure-crumb').textContent = isRun ? '업무 목록' : '업무 절차 목록';
    document.getElementById('side-work').classList.toggle('selected', isRun);
    document.getElementById('side-editor').classList.toggle('selected', !isRun);
    document.getElementById('view-toggle').textContent = isRun ? '작성 화면 보기' : '실행 미리보기';
    for (const id of ['publication-field', 'procedure-menu', 'editor-tabs', 'editor-footer']) {
      document.getElementById(id).hidden = isRun;
    }
    render();
  }

  document.getElementById('parameter-settings').addEventListener('click', showParameters);
  document.getElementById('view-toggle').addEventListener('click', () => {
    view = view === 'run' ? 'editor' : 'run';
    if (view === 'run') runPreview.open();
    showView();
  });
  document.getElementById('example-procedure').addEventListener('change', event => {
    scenarioKey = event.target.value;
    stages = scenario().stages;
    expanded = stages[0].id;
    editingJob = null;
    adding = null;
    save.disabled = !scenario().dirty;
    status.textContent = scenario().dirty ? '저장하지 않은 변경 있음' : '저장됨';
    runPreview.reset();
    if (view === 'run') runPreview.open();
    showView();
  });

  content.addEventListener('click', event => {
    const button = event.target.closest('[data-action]');
    if (!button) return;
    const { action } = button.dataset;
    if (runPreview.handleClick(action, button)) return;
    const id = Number(button.dataset.id);
    if (['tool', 'example', 'inputs', 'job'].includes(action)) {
      const stage = stages.find(item => item.jobs.some(job => job.id === id));
      const job = stage.jobs.find(item => item.id === id);
      if (action !== 'job') { showTool(job, action); return; }
      editingJob = { stage, job };
      adding = null;
      render();
      focusControl('#job-name');
      return;
    }
    if (action === 'back') {
      const jobId = editingJob.job.id;
      editingJob = null;
      render();
      focusControl('[data-action="job"][data-id="' + jobId + '"]');
      return;
    }
    if (action === 'stage') {
      adding = null;
      expanded = expanded === id ? null : id;
      render();
      focusControl('[data-action="stage"][data-id="' + id + '"]');
      return;
    }
    if (action === 'cancel') {
      const last = adding;
      adding = null;
      render();
      focusControl(last.type === 'stage' ? '[data-action="add-stage"]' : '[data-action="add-job"][data-id="' + last.id + '"]');
      return;
    }
    adding = action === 'add-stage' ? { type: 'stage' } : { type: 'job', id };
    render();
    focusControl('.add-row input');
  });

  content.addEventListener('submit', event => {
    if (runPreview.handleSubmit(event)) return;
    event.preventDefault();
    const form = event.target;
    const input = form.elements.name;
    const name = input.value.trim();
    if (!name) {
      input.setCustomValidity('이름을 입력해 주세요.');
      input.reportValidity();
      return;
    }
    if (form.dataset.add === 'stage') {
      const stage = { id: nextStage++, name, jobs: [] };
      stages.push(stage);
      expanded = stage.id;
      adding = null;
      render();
      focusControl('.add-row input');
    } else {
      const stage = stages.find(item => item.id === Number(form.dataset.id));
      const job = { id: nextJob++, name, mode: 'human' };
      stage.jobs.push(job);
      editingJob = { stage, job };
      adding = null;
      render();
      focusControl('#job-name');
    }
    changed();
  });

  content.addEventListener('input', event => {
    if (event.target.closest('.add-row')) event.target.setCustomValidity('');
    if (editingJob && event.target.id === 'job-name') {
      editingJob.job.name = event.target.value;
      changed();
    }
    if (editingJob && event.target.id === 'job-description') {
      editingJob.job.description = event.target.value;
      changed();
    }
  });

  content.addEventListener('change', event => {
    if (editingJob && event.target.id === 'job-mode') {
      editingJob.job.mode = event.target.value;
      changed();
    }
  });

  document.getElementById('publication').addEventListener('change', changed);
  save.addEventListener('click', () => {
    if (!scenario().dirty) return;
    scenario().dirty = false;
    save.disabled = true;
    status.textContent = '시안에서 변경을 확인했습니다.';
  });
  showView();
</script>
