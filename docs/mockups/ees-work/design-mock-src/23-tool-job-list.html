<!-- Mock only: the guide strip above the frame, the two-version layout, the note that says what a press would do,
     and the two switches for things still to decide. Not product UI; excluded from comparison. -->
<style data-mock-frame>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}
body{display:flex;flex-direction:column}
.mk-guide{flex:none;position:relative;z-index:90;font:400 13px/20px var(--ees-font-sans);color:#1d2128;background:#fff;border-bottom:1px dashed #5e6573;padding:8px 16px 10px}
.mk-guide *{box-sizing:border-box}
.mk-row{display:flex;align-items:center;gap:8px 16px;flex-wrap:wrap;min-width:0}
.mk-tag{font-size:12px;line-height:18px;font-weight:500;padding:4px 8px;border:1px dashed #5e6573;border-radius:2px;white-space:nowrap}
.mk-group{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0}
.mk-group>b{font-weight:400;font-size:12px;color:#5e6573;margin-right:2px}
.mk-guide button{font:inherit;font-size:13px;line-height:20px;font-weight:500;color:#1d2128;background:#fff;border:1px solid #c9ccd2;border-radius:2px;min-height:28px;padding:0 10px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.mk-guide button small{font-size:12px;font-weight:400;color:#5e6573}
.mk-guide button:hover{background:#f8f9fa}
.mk-guide button[aria-pressed="true"]{background:#e7e8eb;border-color:#1d2128}
.mk-guide button:focus-visible{outline:2px solid #1d2128;outline-offset:2px}
.mk-guide .mk-fold{margin-left:auto;border-color:transparent}
.mk-text{margin:6px 0 0;display:flex;flex-wrap:wrap;gap:2px 20px;min-width:0}
.mk-text b{font-weight:400;font-size:12px;color:#5e6573;margin-right:6px}
.mk-guide[data-collapsed="true"] :is(.mk-hide,.mk-text){display:none}
/* what a press in the mock would do in the product: said for a moment at the bottom, clear of both sides' headings */
.mk-note{position:fixed;z-index:96;left:50%;bottom:76px;transform:translateX(-50%);max-width:calc(100% - 32px);padding:6px 12px;border:1px dashed #5e6573;border-radius:2px;background:#fff;box-shadow:0 8px 24px #1018281f;font-size:12px;line-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mk-note:empty{display:none}
.mk-stage{flex:1;min-height:0;display:grid;position:relative}
/* the two versions of one screen: side by side (work panel only) or one at a time (whole window) */
.mk-stage[data-view="side"]{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.mk-stage[data-view="now"],.mk-stage[data-view="after"]{grid-template-columns:minmax(0,1fr)}
.mk-stage[data-view="now"]>.mk-pane[data-side="after"],.mk-stage[data-view="after"]>.mk-pane[data-side="now"]{display:none}
.mk-pane{min-width:0;min-height:0;display:flex;flex-direction:column;position:relative}
.mk-stage[data-view="side"]>.mk-pane+.mk-pane{border-left:1px dashed #5e6573}
/* which version a side is: said in a strip above it, only when both are shown */
.mk-pane-label{flex:none;display:none;padding:3px 16px;border-bottom:1px dashed #5e6573;background:#fff;font:500 12px/18px var(--ees-font-sans);color:#1d2128}
.mk-pane-label small{font-size:12px;font-weight:400;color:#5e6573;margin-left:8px}
.mk-stage[data-view="side"] .mk-pane-label{display:block}
.mk-stage[data-view="side"] .fu-shell{grid-template-columns:minmax(0,1fr)}
.mk-stage[data-view="side"] :is(.fu-side,.fu-chat){display:none}
/* two things still to decide, each with a switch above. They are options of the proposal, drawn only on the 'after' side:
   naming the earlier job a job takes its result from (on in this mock), and folding the name, category and purpose
   fields away (shown, as the product does today, unless picked). */
.mk-pane:not([data-mark="on"]) [data-prev-mark]{display:none}
.mk-pane[data-side="after"][data-form="off"] .ew-content-overview{display:none}
.mk-guide button[aria-disabled="true"]{color:#8c94a3}
</style>
<!-- Context only: the frame around the work panel (left menu shell, top bar, chat). The product draws these in its
     Svelte shell; the mock copies their measured sizes and colours. The left menu content and the work panel on the
     'now' side are the product's own markup (captured from the running program, main 598440d, synthetic data). -->
<style data-mock-context="frame">
.fu-shell{flex:1;min-width:0;min-height:0;display:grid;grid-template-columns:256px minmax(0,1fr) 560px;color:var(--ees-text-primary);font:400 14px/20px var(--ees-font-sans);letter-spacing:0}
.fu-shell *{box-sizing:border-box}
.fu-side{background:var(--ees-surface-sidebar);border-right:1px solid var(--ees-line-divider);display:flex;flex-direction:column;min-height:0}
.fu-brand{height:48px;flex:none;display:flex;align-items:center;gap:8px;padding:0 10px;font-weight:700;font-size:15px}
.fu-brand svg{margin-left:auto;margin-right:6px;color:var(--ees-text-secondary)}
.fu-logo{width:22px;height:22px;border-radius:6px;background:var(--ees-brand-solid);color:#fff;font-size:12px;display:grid;place-items:center}
.fu-side-scroll{flex:1;min-height:0;overflow:auto;padding:0 8px}
.fu-native{display:grid;gap:2px;margin:10px 0 0}
.fu-native span{display:flex;align-items:center;gap:8px;min-height:36px;padding:0 10px;border-radius:6px;font-size:14px}
.fu-native svg{flex:none;color:var(--ees-text-primary)}
.fu-user{flex:none;height:52px;display:flex;align-items:center;gap:10px;padding:0 14px;border-top:1px solid var(--ees-line-divider);font-size:14px}
.fu-user i{position:relative;width:22px;height:22px;border-radius:50%;background:var(--ees-line-control)}
.fu-user i::after{content:"";position:absolute;right:-1px;bottom:-1px;width:7px;height:7px;border-radius:50%;background:#22a559;border:1.5px solid var(--ees-surface-sidebar)}
.fu-main{display:flex;flex-direction:column;min-width:0;min-height:0;background:#fff}
.fu-top{height:48px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid var(--ees-line-divider)}
.fu-top strong{font-size:15px;font-weight:700}
.fu-top span{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;border:1px solid var(--ees-line-control);border-radius:6px;font-size:13px}
.fu-panel-slot,.fu-chat-slot{flex:1;min-height:0;display:flex;flex-direction:column}
.fu-main #ees-work-panel{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;background:#fff}
.fu-main #ees-work-panel>div,.fu-main #ees-work-panel>section{flex:1;min-height:0}
/* the program's base style sheet (not one of the two product files) takes the native arrow off a select */
.fu-main select{-webkit-appearance:none;appearance:none}
/* the same sheet draws a check box itself (1px, grey 300, 4px corner) and makes every scroll bar .45rem */
.fu-main input[type=checkbox]{-webkit-appearance:none;appearance:none;border:1px solid #cecece;border-radius:4px;background:#fff;cursor:pointer}
.fu-main ::-webkit-scrollbar{width:.45rem;height:.45rem}
.fu-main ::-webkit-scrollbar-thumb{border:1px solid #fff;border-radius:9999px;background-color:#d7d7d799}
.fu-chat{border-left:1px solid var(--ees-line-divider);display:flex;flex-direction:column;min-height:0;background:#fff}
.fu-chat header{height:48px;flex:none;display:flex;align-items:center;gap:14px;padding:0 12px;font-size:14px}
.fu-chat header b{font-weight:500;margin-right:auto}
.fu-chat header svg{color:var(--ees-text-primary)}
.fu-chat header small{font-size:12px}
.fu-welcome{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 80px}
.fu-welcome-mark{width:36px;height:36px;border-radius:50%;background:#f5f7fa;display:grid;place-items:center;margin:0 0 14px}
.fu-welcome h3{margin:0;font-size:30px;line-height:36px;font-weight:400;color:var(--ees-text-primary)}
.fu-welcome h3 span{display:block;color:#a4a9b3}
.fu-welcome h4{display:flex;align-items:center;gap:4px;margin:22px 0 10px;font-size:12px;line-height:18px;font-weight:400;color:var(--ees-text-secondary)}
.fu-prompts{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px 20px;padding:0 10px}
.fu-prompts>div{min-width:0}
.fu-prompts p{margin:0;font-size:14.5px;line-height:20px;font-weight:500;color:var(--ees-text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fu-prompts small{display:block;font-size:12.5px;line-height:18px;font-weight:400;color:var(--ees-text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fu-composer{margin:0 24px 16px;border:1px solid var(--ees-text-primary);border-radius:8px;padding:16px 8px 8px 16px;font-size:14px;color:var(--ees-text-secondary)}
.fu-composer p{margin:0 0 14px}
.fu-composer div{display:flex;align-items:center;gap:14px;font-size:13px;color:var(--ees-text-primary)}
.fu-composer div span{display:inline-flex;align-items:center;gap:6px}
.fu-composer div i{margin-left:auto}
.fu-composer div u{text-decoration:none;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#e2e3e7;color:#fff}
@media (max-width:1439px){.fu-shell{grid-template-columns:56px minmax(0,1fr) 480px}.fu-brand{justify-content:center;padding:0}.fu-brand strong,.fu-brand svg,.fu-user span,.fu-native{display:none}.fu-user{justify-content:center;padding:0}.fu-welcome{padding:0 40px}}
.fu-side[data-compact=true] :is(.ew-recent,.ew-empty){display:none}
@media (max-width:1199px){.fu-shell{grid-template-columns:56px minmax(0,1fr)}.fu-chat{display:none}}
</style>
<!-- New screen CSS for this proposal: the tool job's row in the stage list and the tool card on the job page.
     Written with product tokens and product selectors, to be reused when a version of this mock is chosen.
     Each rule starts with [data-side="after"] only because this page shows both versions; the product drops it. -->
<style data-new-screen="tool-job-list">
/* A tool job in the stage list is its name and the line the product already writes ('도구 사용 · 담당자 확인').

   a job that needs a hand says so with a mark, and a job that takes an earlier job's result names that job. */
[data-side="after"] [data-ees-work-surface] #ees-work-panel #ees-work-designer[data-author-tab=content][data-author-detail=false][data-api-overview=false] .ew-job-row-label>span>.ew-author-tag[data-tool-state]{margin:0 0 0 8px;vertical-align:1px;color:var(--ees-status-attention);background:#faf1e4}

[data-side="after"] [data-ees-work-surface] #ees-work-panel #ees-work-designer[data-author-tab=content][data-author-detail=false][data-api-overview=false] .ew-job-row:has(>.ew-api-row-action) .ew-job-row-label{padding-right:104px}

[data-side="after"] [data-ees-work-surface] #ees-work-panel #ees-work-designer[data-author-tab=content][data-author-detail=true] .ew-job-tool-summary>.ew-tool-card{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 16px;align-items:start;box-sizing:border-box;width:100%;max-width:640px;padding:12px;border:1px solid var(--ees-line-divider);border-radius:var(--ees-radius-control);background:var(--ees-surface-default)}
[data-side="after"] [data-ees-work-surface] #ees-work-panel #ees-work-designer[data-author-tab=content][data-author-detail=true] .ew-tool-card-name{grid-column:1;display:flex;flex-wrap:wrap;align-items:baseline;gap:0 8px;min-width:0;min-height:22px;margin:0;font:var(--ees-type-body);font-weight:600;color:var(--ees-text-primary)}
[data-side="after"] [data-ees-work-surface] #ees-work-panel #ees-work-designer[data-author-tab=content][data-author-detail=true] .ew-tool-card-name>small:not(.ew-author-tag){font:var(--ees-type-label);color:var(--ees-text-tertiary)}
[data-side="after"] [data-ees-work-surface] #ees-work-panel #ees-work-designer[data-author-tab=content][data-author-detail=true] .ew-tool-card-name>.ew-author-tag[data-tool-state]{align-self:center;color:var(--ees-status-attention);background:#faf1e4}
[data-side="after"] [data-ees-work-surface] #ees-work-panel #ees-work-designer[data-author-tab=content][data-author-detail=true] .ew-tool-card:not([data-tool-state])>.ew-tool-card-name{grid-row:1}
[data-side="after"] [data-ees-work-surface] #ees-work-panel #ees-work-designer[data-author-tab=content][data-author-detail=true] .ew-tool-card[data-tool-state]>.ew-tool-card-name{min-height:32px;align-items:center}
[data-side="after"] [data-ees-work-surface] #ees-work-panel #ees-work-designer[data-author-tab=content][data-author-detail=true] .ew-tool-card-purpose{grid-column:1;margin:0;font:var(--ees-type-label);color:var(--ees-text-secondary)}
[data-side="after"] [data-ees-work-surface] #ees-work-panel #ees-work-designer[data-author-tab=content][data-author-detail=true] .ew-tool-card-link{grid-column:1;margin:0;font:var(--ees-type-label);color:var(--ees-text-tertiary)}
[data-side="after"] [data-ees-work-surface] #ees-work-panel #ees-work-designer[data-author-tab=content][data-author-detail=true] .ew-tool-card>[data-author-action=job_api_setup]{grid-column:2;grid-row:1/span 2;justify-self:end;display:inline-flex;align-items:center;height:32px;min-height:32px;padding:0 12px;border:1px solid var(--ees-line-control);border-radius:var(--ees-radius-control);background:var(--ees-surface-default);font:var(--ees-type-label);font-weight:600;color:var(--ees-text-primary);text-decoration:none;white-space:nowrap}
[data-side="after"] [data-ees-work-surface] #ees-work-panel #ees-work-designer[data-author-tab=content][data-author-detail=true] .ew-tool-card>[data-author-action=job_api_setup]:hover{border-color:var(--ees-line-control-hover);background:var(--ees-surface-hover)}

[data-side="after"] [data-ees-work-surface] #ees-work-panel #ees-work-designer[data-author-tab=content][data-author-detail=true] .ew-tool-card>details>summary{display:inline-flex;align-items:center;gap:6px;min-height:28px;margin:0 0 0 -6px;padding:0 8px 0 6px;border-radius:6px;list-style:none;cursor:pointer;font:var(--ees-type-label);font-weight:500;color:var(--ees-accent)}
[data-side="after"] [data-ees-work-surface] #ees-work-panel #ees-work-designer[data-author-tab=content][data-author-detail=true] .ew-tool-card>details>summary::-webkit-details-marker{display:none}
[data-side="after"] [data-ees-work-surface] #ees-work-panel #ees-work-designer[data-author-tab=content][data-author-detail=true] .ew-tool-card>details>summary::before{content:"";flex:none;width:6px;height:6px;margin:0 2px 2px 2px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(-45deg);transition:transform .12s ease}

[data-side="after"] [data-ees-work-surface] #ees-work-panel #ees-work-designer[data-author-tab=content][data-author-detail=true] .ew-tool-card>details>summary:hover{background:var(--ees-accent-tint)}

[data-side="after"] [data-ees-work-surface] #ees-work-panel #ees-work-designer[data-author-tab=content][data-author-detail=true] .ew-tool-card dl{display:grid;grid-template-columns:64px minmax(0,1fr);gap:6px 12px;align-items:baseline;margin:8px 0 0;padding:10px 0 0;border-top:1px solid var(--ees-line-divider);font:var(--ees-type-label)}

<body>
<div class="mk-guide" id="mock-guide" data-collapsed="false" role="region" aria-label="시안 안내 · 제품 화면 아님">
 <div class="mk-row">
  <strong class="mk-tag" id="mock-badge">시안 1 · 저장·실행 안 됨 · T1</strong>
  <div class="mk-group mk-hide" role="group" aria-label="화면 바로 보기(숫자 키 1~5)">
   <button data-step="T1" aria-pressed="true">절차를 열었을 때 <small>T1</small></button>
   <button data-step="T2" aria-pressed="false">단계를 펼쳤을 때 <small>T2</small></button>
   <button data-step="T3" aria-pressed="false">작업 화면 <small>T3</small></button>
   <button data-step="T4" aria-pressed="false">손볼 작업이 있을 때 <small>T4</small></button>
   <button data-step="T5" aria-pressed="false">사람 작업이 섞인 절차 <small>T5</small></button>
  </div>
  <div class="mk-group mk-hide" role="group" aria-label="보는 방법">
   <b>보기</b>
   <button data-view-pick="side" aria-pressed="true">나란히</button>
   <button data-view-pick="now" aria-pressed="false">지금만</button>
   <button data-view-pick="after" aria-pressed="false">바꾼 뒤만</button>
  </div>
  <div class="mk-group mk-hide" role="group" aria-label="정할 것 · 앞 작업의 결과를 받는 작업의 표시">
   <b>앞 작업 결과를 받는 작업</b>
   <button data-mark-pick="on" aria-pressed="true">표시 있음</button>
   <button data-mark-pick="off" aria-pressed="false">표시 없음</button>
  </div>
  <div class="mk-group mk-hide" role="group" aria-label="정할 것 · 이름, 분류, 목적 칸">
   <b>이름·분류·목적 칸</b>
   <button data-form-pick="on" aria-pressed="true">지금처럼</button>
   <button data-form-pick="off" aria-pressed="false">접기</button>
  </div>
  <button class="mk-hide" id="mock-ref-toggle" aria-expanded="false">참고</button>
  <button class="mk-fold" id="mock-fold" aria-expanded="true">안내 접기</button>
 </div>
 <p class="mk-text" id="mock-step-text"></p>
 <span class="mk-note" id="mock-note" role="status"></span>
</div>
<div class="mk-stage" id="mock-stage" data-view="side">
<div class="mk-pane" data-side="now" data-mark="on" data-form="on">
 <span class="mk-pane-label">지금<small></small></span>
 <div class="fu-shell">
  <aside class="fu-side" aria-label="탐색(맥락)" data-ees-source-sidebar data-compact="false">
   <div class="fu-brand"><span class="fu-logo">E</span><strong>EES Workflow</strong><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><path d="M9.5 4.5v15"/></svg></div>
   <div class="fu-side-scroll"><div data-slot="entry"></div>
    <div class="fu-native"><span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M4 20l1-4L16.5 4.5a2.1 2.1 0 0 1 3 3L8 19z"/></svg>새 대화</span><span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>대화 검색</span></div></div>
   <div class="fu-user"><i></i><span>EMS 공용 계정</span></div>

<script>
(function(){
  'use strict';
  var $=function(s,r){return (r||document).querySelector(s);},all=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));};
  var SCENES={
    T0:{name:'업무 절차 목록',when:'워크스페이스 › 업무 절차',changed:'이 화면은 바뀌지 않음 · 절차를 누르면 열림'},
    T1:{name:'절차를 열었을 때',set:{screen:'proc',open:false,board:false,mixed:false,nowEdit:false},
      when:'작업이 모두 도구를 쓰는 절차를 열 때',
      changed:'요약 화면을 거치지 않고 편집 화면이 바로 열림 · ‘단계 추가’와 ‘시작할 때 물어볼 것’이 처음부터 보임 · ⋯ 메뉴의 ‘절차 편집 / 도구 연결 보기’가 없어짐 · 대신 이름·분류·목적 칸도 처음부터 보여 열자마자 보이는 것은 지금의 요약 화면보다 많음(위 ‘이름·분류·목적 칸 → 접기’로 견주어 볼 수 있음)'},
    T2:{name:'단계를 펼쳤을 때',set:{screen:'proc',open:true,board:false,mixed:false,nowEdit:false},
      when:'단계를 펼쳐 작업을 볼 때',
      changed:'작업 한 줄은 이름과 지금 쓰는 한 줄(도구 사용 · 담당자 확인) · 입력·받는 결과·주소와 ‘도구 변경’은 작업을 누르면 열리는 작업 화면으로 · 앞 작업의 결과를 받는 작업은 그 작업 이름을 줄에 남김 · 맨 아래 ‘조회 결과 예시 보기’, ‘입력 연결 변경’도 작업 화면으로 · 지금 쪽의 ⋯ → 절차 편집을 누르면 지금의 편집 화면도 볼 수 있음'},
    T3:{name:'작업 화면',set:{screen:'job',job:'children',open:true,board:false,mixed:false,nowEdit:false},
      when:'작업 줄을 눌렀을 때',
      changed:'‘연결된 도구’는 카드 하나: 도구 이름·서비스와 하는 일 한 줄, 오른쪽 ‘도구 변경’ · 입력·받는 결과·주소·결과 예시는 ‘상세 보기’를 눌러야 보임 · 작업 이름과 도구 이름이 다른 예는 T5의 도구 작업'},
    T4:{name:'손볼 작업이 있을 때',set:{screen:'proc',open:true,board:true,mixed:false,nowEdit:false},
      when:'도구를 아직 연결하지 않았거나 연결을 확인해야 하는 작업이 있을 때(상태 모음)',
      changed:'손볼 작업은 이름 옆 주황 표시로 보임(지금 요약 화면에는 표시가 없음) · ‘도구 연결’ 단추는 그 작업 줄에 · 줄을 누르면 그 상태의 작업 화면 · 닫힌 단계에는 지금도 바꾼 뒤도 표시가 없음'},
    T5:{name:'사람 작업이 섞인 절차',set:{screen:'proc',open:true,board:false,mixed:true,nowEdit:true},
      when:'사람이 하는 작업과 도구 작업이 함께 있는 절차를 볼 때',
      changed:'이런 절차는 지금도 편집 화면이 바로 열림 · 도구 작업의 줄에서 아래 상자만 빠짐 · 사람이 하는 작업의 줄과 화면은 그대로'}
  };
  var NOTE='가운데 화면과 왼쪽 메뉴 안쪽은 제품 화면 그대로(main 598440d)이고 바꾼 쪽만 새로 그림 · 바깥 틀, 윗줄, 오른쪽 대화는 모양을 그린 것(대화의 영어 문구는 개발 환경의 기본값) · 한쪽에서 누르면 다른 쪽도 같은 자리로 따라감 · T4의 ‘담당자 정보 조회’(도구 확인 필요)는 지금 쪽도 제품 코드에서 옮겨 적은 것 · 숫자 키 1~5로 화면, 한쪽만 볼 때 ← →';
  var VIEWS={side:'나란히',now:'지금만',after:'바꾼 뒤만'};
  var JOBS={page:1,children:1,history:1,owner:1,doc:1};
  var SUB={history:'T4-1',owner:'T4-2',doc:'T5-1'};
  var SAME='지금 제품과 같은 동작입니다 · 시안에서는 동작하지 않습니다';
  var state={view:'side',mark:'on',form:'on',screen:'proc',open:false,board:false,mixed:false,nowEdit:false,job:'children',ref:false};
  var noteTimer=0,align=false;
  function compact(){return window.innerWidth<1440;}
  function note(text){var box=$('#mock-note');box.textContent=text;clearTimeout(noteTimer);noteTimer=setTimeout(function(){box.textContent='';},3200);}
  // which numbered screen the two sides are on now: the badge and the text follow where one has walked to
  function where(){
    if(state.screen==='list')return 'T0';
    if(state.screen==='job')return SUB[state.job]||'T3';
    if(state.mixed)return 'T5';
    if(state.board)return 'T4';
    return state.open?'T2':'T1';
  }
  function key(side){
    if(state.screen==='list')return state.board?'list-board':'list';
    if(state.screen==='job')return side+(state.board?'-bjob-':'-job-')+state.job;
    var open=state.open?'open':'closed';
    if(state.mixed)return side+'-mixed-'+open;
    if(side==='after')return state.board?'after-board-'+open:'after-edit-'+open;
    return 'now-'+(state.board?'board-':'')+(state.nowEdit?'edit-':'sum-')+open;
  }
  function caption(side){
    if(side==='after'||state.screen!=='proc'||state.mixed)return '';
    return state.nowEdit?'⋯ → 절차 편집을 누른 뒤':'열자마자 보이는 화면';
  }
  function scroller(pane){return $('.ew-author-scroll',pane);}
  function fill(pane){
    var side=pane.getAttribute('data-side'),id=key(side),before=scroller(pane);
    var kept={id:pane.getAttribute('data-key'),screen:pane.getAttribute('data-screen'),top:before?before.scrollTop:0,open:all('.ew-tool-card details',pane).map(function(d){return d.open;})};
    var put=function(slot,name){var host=$('[data-slot="'+slot+'"]',pane),tpl=document.getElementById('tpl-'+name);host.innerHTML='';host.appendChild(tpl.content.cloneNode(true));};
    put('entry','entry');put('panel',id);put('chat','chat');
    pane.setAttribute('data-key',id);pane.setAttribute('data-screen',state.screen);
    pane.setAttribute('data-mark',state.mark);pane.setAttribute('data-form',state.form);
    $('.mk-pane-label small',pane).textContent=caption(side);
    // the same place after a redraw: what was open stays open, and one stays where one had scrolled to
    var now=scroller(pane);
    if(kept.id===id)all('.ew-tool-card details',pane).forEach(function(d,i){if(kept.open[i])d.open=true;});
    if(now){
      var heading=$('.ew-content-heading',pane);
      var list=$('.ew-stage-list',pane),box=now.getBoundingClientRect();
      // only when the jobs would not all be in view: on a tall window nothing moves
      if(align&&heading&&list){if(list.getBoundingClientRect().bottom>box.bottom-8)now.scrollTop+=heading.getBoundingClientRect().top-box.top-12;}
      else if(kept.screen===state.screen)now.scrollTop=kept.top;
    }
    // under 1440 the product folds the left menu to a rail: the same markup, marked compact, its groups closed
    var rail=$('.fu-side',pane);rail.setAttribute('data-compact',String(compact()));
    if(compact()){
      all('.ew-category-toggle,.ew-assets-toggle',rail).forEach(function(button){button.setAttribute('aria-expanded','false');});
      all('.ew-category-body',rail).forEach(function(body){body.setAttribute('aria-hidden','true');body.setAttribute('inert','');});
    }
    // a mock shows; it does not save or run
    all('form',pane).forEach(function(form){form.addEventListener('submit',function(event){event.preventDefault();});});
  }
  function render(){
    var id=where(),base=id.slice(0,2),data=SCENES[base];
    $('#mock-stage').setAttribute('data-view',state.view);
    all('.mk-pane').forEach(fill);align=false;
    $('#mock-badge').textContent='시안 1 · 저장·실행 안 됨 · '+id;
    document.title='도구 작업 줄 단순화 시안 1 · '+data.name+' · EES Workflow';
    all('[data-step]').forEach(function(button){button.setAttribute('aria-pressed',String(button.getAttribute('data-step')===base));});
    all('[data-view-pick]').forEach(function(button){button.setAttribute('aria-pressed',String(button.getAttribute('data-view-pick')===state.view));});
    all('[data-mark-pick]').forEach(function(button){button.setAttribute('aria-pressed',String(button.getAttribute('data-mark-pick')===state.mark));});
    all('[data-form-pick]').forEach(function(button){button.setAttribute('aria-pressed',String(button.getAttribute('data-form-pick')===state.form));});
    var text=$('#mock-step-text');text.innerHTML='';
    [['언제',data.when],['바뀐 것',data.changed]].concat(state.ref?[['참고',NOTE]]:[]).forEach(function(pair){var span=document.createElement('span'),b=document.createElement('b');b.textContent=pair[0];span.appendChild(b);span.appendChild(document.createTextNode(pair[1]));text.appendChild(span);});
  }
  // a numbered screen from the strip: the stage list is brought to the same height on both sides, so what is compared is in view
  function scene(name){var set=SCENES[name].set;Object.keys(set).forEach(function(k){state[k]=set[k];});align=set.screen==='proc'&&set.open;}
  // what a press inside a side does: the two sides share one place (which screen, which stage, which job).
  // returns what to put the keyboard focus on afterwards, or false when nothing moved
  function act(target){
    var action=target.getAttribute('data-author-action'),id=target.getAttribute('data-id');
    if(action==='list'){state.screen='list';return '[data-author-action=open]';}
    if(action==='open'){
      state.mixed=target.textContent.indexOf('Confluence')<0;if(state.mixed)state.board=false;
      state.screen='proc';state.open=false;state.nowEdit=state.mixed;return '[data-author-action=stage_toggle]';
    }
    if(action==='stage_toggle'){
      if(state.mixed&&id!=='stage'){note('이 시안은 첫 단계만 펼칩니다');return false;}
      state.open=!state.open;return '[data-author-action=stage_toggle]';
    }
    if(action==='api_structure_edit'){
      // on a job page the product only leaves the edit mode; on the procedure it flips between the two views
      if(state.screen==='job'){state.nowEdit=false;return '.ew-procedure-menu>summary';}
      state.nowEdit=!state.nowEdit;return '.ew-procedure-menu>summary';
    }
    if(action==='node'){
      // back from a job: the product returns to the view one came from (the summary, unless 절차 편집 was pressed)
      if(!id){state.screen='proc';state.open=true;return '[data-author-action=node][data-id="'+state.job+'"]';}
      if(JOBS[id]){state.screen='job';state.job=id;return '.ew-job-detail-header [data-author-action=node]';}
      note('사람이 하는 작업의 화면은 바뀌지 않습니다 · 시안에서는 열지 않습니다');return false;
    }
    if(action==='job_api_setup'){note('도구를 고르는 창이 열립니다 · 지금 제품과 같은 창이고 시안에서는 열리지 않습니다');return false;}
    if(action==='job_api_example'){note('조회 결과 예시 창이 열립니다 · 지금 제품과 같은 창이고 시안에서는 열리지 않습니다');return false;}
    note(SAME);return false;
  }
  function option(kind,value){
    state[kind]=value;render();
    var seen=kind==='mark'?all('.mk-pane[data-side="after"] [data-prev-mark]').length:all('.mk-pane[data-side="after"] .ew-content-overview').length;
    if(!seen)note(kind==='mark'?'이 화면에는 앞 작업의 결과를 받는 작업이 없습니다 · T2, T3, T4에서 보입니다':'이 화면에는 이름·분류·목적 칸이 없습니다 · T1, T2, T4, T5에서 보입니다');
    else if(state.view==='now')note('‘지금만’에서는 달라지는 것이 없습니다 · 바꾼 쪽에만 해당합니다');
  }
  document.addEventListener('click',function(event){
    var target=event.target.closest?event.target.closest('button,a,summary'):null;if(!target)return;
    if(target.hasAttribute('data-step')){scene(target.getAttribute('data-step'));render();return;}
    if(target.hasAttribute('data-view-pick')){state.view=target.getAttribute('data-view-pick');render();return;}
    if(target.hasAttribute('data-mark-pick')){option('mark',target.getAttribute('data-mark-pick'));return;}
    if(target.hasAttribute('data-form-pick')){option('form',target.getAttribute('data-form-pick'));return;}
    if(target.id==='mock-ref-toggle'){state.ref=!state.ref;target.setAttribute('aria-expanded',String(state.ref));target.setAttribute('aria-pressed',String(state.ref));render();return;}
    if(target.id==='mock-fold'){fold($('#mock-guide').getAttribute('data-collapsed')!=='true');return;}
    var pane=target.closest('.mk-pane');if(!pane)return;
    if(target.tagName==='SUMMARY')return;                       // a menu and '상세 보기' open as they do in the product
    event.preventDefault();
    if(target.hasAttribute('data-author-action')){
      var focus=act(target);
      if(focus){render();var next=$(focus,pane);if(next)next.focus({preventScroll:true});}
      return;
    }
    note(SAME);
  });
  function fold(folded){var guide=$('#mock-guide'),button=$('#mock-fold');guide.setAttribute('data-collapsed',String(folded));button.setAttribute('aria-expanded',String(!folded));button.textContent=folded?'안내 펴기':'안내 접기';}
  // a mock shows: a radio does not change what is saved
  document.addEventListener('click',function(event){
    var held=event.target.closest?event.target.closest('.mk-pane :is(input[type=radio],input[type=checkbox],label:has(input[type=radio]))'):null;if(held){event.preventDefault();note(SAME);}
  },true);
  // 1 2 3 4 5: screens. ← →: flip between now and after when one is shown. Keys pressed inside a side belong to that side.
  document.addEventListener('keydown',function(event){
    if(event.target.closest&&event.target.closest('input,textarea,select'))return;
    if(['1','2','3','4','5'].indexOf(event.key)>=0){scene('T'+event.key);render();}
    else if(event.key==='ArrowLeft'||event.key==='ArrowRight'){
      if(state.view==='side'||(event.target.closest&&event.target.closest('.mk-pane')))return;
      state.view=event.key==='ArrowLeft'?'now':'after';render();
    }
  });
  var whereTo=location.search+location.hash,query=/[?&#]screen=(T[12345])/.exec(whereTo),view=/[?&#]view=(side|now|after)/.exec(whereTo),mark=/[?&#]mark=(on|off)/.exec(whereTo),form=/[?&#]form=(on|off)/.exec(whereTo);
  if(query)scene(query[1]);if(view)state.view=view[1];if(mark)state.mark=mark[1];if(form)state.form=form[1];
  // on a short window the strip would push what is compared out of view: it starts folded there
  if(window.innerHeight<900)fold(true);
  var wasCompact=compact();window.addEventListener('resize',function(){if(compact()!==wasCompact){wasCompact=compact();render();}});
  window.mockShow=function(name,viewName,markName,formName){if(SCENES[name]&&SCENES[name].set)scene(name);if(VIEWS[viewName])state.view=viewName;if(markName)state.mark=markName;if(formName)state.form=formName;render();};
  window.mockState=function(){var copy=JSON.parse(JSON.stringify(state));copy.where=where();return copy;};
  render();
})();
</script>
</body>
</html>
