"radiogroup" aria-describedby="ew-job-result-hint"><legend>결과 확인</legend><div><label><input type="radio" name="result_confirmation" value="manual" checked=""><span>담당자가 확인</span></label><label><input type="radio" name="result_confirmation" value="automatic" disabled="" data-preserve="true"><span>자동으로 완료</span></label></div><p class="ew-author-muted" id="ew-job-result-hint">문서 목록은 담당자가 확인해야 완료됩니다.</p></fieldset><label>담당자 확인 기준<textarea name="completion_rule"></textarea></label><label>작업 안내 · 선택<textarea name="job_guidance"></textarea></label><details class="ew-job-assignment"><summary>담당자 설정</summary><label>담당자 · 선택<select name="assignee"><option value="" selected="">담당자 미지정</option><option value="user:6a819fc8-0334-4460-9396-76240edaae87">EMS 공용 계정</option></select></label></details></section></form></section></div><footer><small data-author-status="" data-author-revision="2" data-dirty="true" data-status="dirty" tabindex="-1">저장하지 않은 변경 있음</small><button type="button" data-author-action="save" data-mutation="" class="ew-primary">저장</button><button type="button" data-author-action="publish" data-mutation="">게시</button></footer></section></div></section></template>

<script>
(function(){
  'use strict';
  var $=function(s,r){return (r||document).querySelector(s);},all=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));};
  // each screen: when it shows, and what changes there. `fold`/`asNow` say the part that depends on the switch above
  var SCENES={
    T0:{name:'업무 절차 목록',when:'워크스페이스 › 업무 절차',change:'이 화면은 바뀌지 않음 · 절차를 누르면 열림'},
    T1:{name:'절차를 열었을 때',set:{screen:'proc',open:false,board:false,mixed:false,nowEdit:false,info:false},
      when:'작업이 모두 도구를 쓰는 절차를 열 때',
      change:'요약 화면을 거치지 않고 편집 화면이 바로 열림 · ‘단계 추가’와 ‘시작할 때 물어볼 것’이 처음부터 보임 · ⋯ 메뉴의 ‘절차 편집 / 도구 연결 보기’가 없어짐',
      fold:'이름·분류·목적 칸은 한 줄로 접혀 있고 그 줄의 ‘절차 정보 수정’을 누르면 칸이 펼쳐짐',asNow:'이름·분류·목적 칸이 늘 펼쳐져 있음(PR #156의 자리 그대로)'},
    T2:{name:'단계를 펼쳤을 때',set:{screen:'proc',open:true,board:false,mixed:false,nowEdit:false,info:false},
      when:'단계를 펼쳐 작업을 볼 때',
      change:'작업 한 줄은 이름과 지금 쓰는 한 줄(도구 사용 · 담당자 확인) · 입력·받는 결과·주소와 ‘도구 변경’은 작업을 누르면 열리는 작업 화면으로 · 다른 작업의 결과를 받는 작업은 둘째 줄에 따로 떼어 ‘앞 작업 ‘…’ 결과 사용’이라고 적음 · 맨 아래 ‘조회 결과 예시 보기’는 작업 화면의 ‘상세 보기’로 가고, ‘입력 연결 변경’은 없어짐(작업 화면의 ‘도구 변경’이 같은 창을 엶)'},
    T3:{name:'작업 화면',set:{screen:'job',job:'children',open:true,board:false,mixed:false,nowEdit:false,info:false},
      when:'작업 줄을 눌렀을 때',
      change:'‘연결된 도구’는 카드 하나: 도구 이름·서비스, 하는 일, 오른쪽 ‘도구 변경’ · 작업 이름과 도구 이름이 다른 예는 T5의 도구 작업',
      open:'입력(값이 어디서 오는지)과 받는 결과는 바로 보임 · 주소와 결과 예시만 ‘상세 보기’를 눌러야 보임',folded:'입력·받는 결과·주소·결과 예시가 모두 ‘상세 보기’ 안에 있음(2판의 모습)'},
    T4:{name:'손볼 작업이 있을 때',set:{screen:'proc',open:false,board:true,mixed:false,nowEdit:false,info:false},
      when:'손봐야 하는 작업이 있는 절차(상태 모음 · 저장하지 않은 편집 중 · 단계를 누르면 펼쳐짐)',
      change:'닫힌 단계 줄에 ‘손볼 작업 3개’ 표시(지금은 닫힌 단계에 아무 표시도 없음) · 펼치면 손볼 작업은 이름 옆 주황 표시: 도구 연결 전, 도구 확인 필요, 입력 확인 필요(결과를 받던 작업이 지워진 경우 · 지금은 줄에서 구별되지 않고 저장할 때 오류로만 알게 됨) · ‘도구 연결’ 단추는 그 작업 줄에 · 결과를 주는 작업이 목록에서 뒤에 있으면 ‘뒤 작업’이라고 적음 · ‘도구 연결 전’ 줄은 ‘도구 사용’까지만 적음'},
    T5:{name:'사람 작업이 섞인 절차',set:{screen:'proc',open:true,board:false,mixed:true,nowEdit:true,info:false},
      when:'사람이 하는 작업과 도구 작업이 함께 있는 절차를 볼 때',
      change:'이런 절차는 지금도 편집 화면이 바로 열림 · 도구 작업의 줄에서 아래 상자가 빠짐 · 사람이 하는 작업의 줄과 화면은 그대로',
      fold:'이름·분류·목적 칸이 한 줄로 접힘',asNow:'이름·분류·목적 칸은 지금처럼 펼쳐져 있음'}
  };
  var NOTE='가운데 화면과 왼쪽 메뉴 안쪽은 제품 화면 그대로(main 598440d)이고 바꾼 쪽만 새로 그림 · 바깥 틀, 윗줄, 오른쪽 대화는 모양을 그린 것(대화의 영어 문구는 개발 환경의 기본값) · 한쪽에서 누르면 다른 쪽도 같은 자리로 따라감(‘⋯ → 절차 편집’과 ‘절차 정보 수정’은 그 쪽만) · T4의 ‘문서 요약 확인’, ‘담당자 정보 조회’, ‘변경 알림 대상 조회’ 세 줄과 그 작업 화면, 저장하지 않은 편집 중이라는 바닥 줄은 지금 쪽도 제품 코드에서 옮겨 적은 것 · ‘보기 먼저’ 안은 2판에 있음 · 숫자 키 1~5로 화면, 하나만 볼 때 ← →';
  var SIDES=['now','after'];
  var VIEWS={side:['now','after'],now:['now'],after:['after']};
  var JOBS={page:1,children:1,history:1,owner:1,doc:1,digest:1,notify:1};
  var SUB={history:'T4-1',owner:'T4-2',notify:'T4-3',digest:'T4-4',doc:'T5-1'};
  var SAME='지금 제품과 같은 동작입니다 · 시안에서는 동작하지 않습니다';
  var state={panes:{now:true,after:true},form:'fold',card:'open',info:false,screen:'proc',open:false,board:false,mixed:false,nowEdit:false,job:'children',ref:false};
  var noteTimer=0,align=false,fresh=false,left={};   // left: where each side's stage list was scrolled to when a job was opened
  function compact(){return window.innerWidth<1440;}
  // too narrow to hold two sides (a preview panel, a phone): one side at a time
  function narrow(){return window.innerWidth<1000;}
  // bring what the keyboard is on into view inside its own side; the page around the mock is never scrolled
  function reveal(el,pane){var box=scroller(pane);if(!box||!box.contains(el))return;var a=el.getBoundingClientRect(),b=box.getBoundingClientRect();if(a.top<b.top-1)box.scrollTop-=b.top+8-a.top;else if(a.bottom>b.bottom+1)box.scrollTop+=a.bottom-(b.bottom-8);}
  function shown(){return SIDES.filter(function(side){return state.panes[side];});}
  function note(text){var box=$('#mock-note');box.textContent=text;clearTimeout(noteTimer);noteTimer=setTimeout(function(){box.textContent='';},3200);}
  // which numbered screen the sides are on now: the badge and the text follow where one has walked to
  function where(){
    if(state.screen==='list')return 'T0';
    if(state.screen==='job')return SUB[state.job]||'T3';
    if(state.mixed)return 'T5';
    if(state.board)return 'T4';
    return state.open?'T2':'T1';
  }
  function key(side){
    if(state.screen==='list')return state.board?'list-board':'list';
    if(state.screen==='job')return (side==='now'?'now':'after')+(state.board?'-bjob-':'-job-')+state.job;
    var open=state.open?'open':'closed',kind=state.mixed?'mixed-':state.board?'board-':'';
    if(side==='after')return 'after-'+(kind||'edit-')+open;
    if(state.mixed)return 'now-mixed-'+open;
    return 'now-'+kind+(state.nowEdit?'edit-':'sum-')+open;
  }
  function caption(side){
    if(side==='after')return narrow()?'위쪽 ‘볼 것’에서 ‘지금’을 누르면 지금 화면':'';
    if(state.screen!=='proc')return '';
    if(state.mixed)return '';
    return state.nowEdit?'⋯ → 절차 편집을 누른 뒤':state.board?'요약 화면':'열자마자 보이는 화면';
  }
  function scroller(pane){return $('.ew-author-scroll',pane);}
  function fill(pane){
    var side=pane.getAttribute('data-side'),id=key(side),before=scroller(pane);
    pane.setAttribute('data-shown',String(state.panes[side]));
    var kept={id:pane.getAttribute('data-key'),screen:pane.getAttribute('data-screen'),top:before?before.scrollTop:0,open:all('.ew-tool-card details',pane).map(function(d){return d.open;})};
    if(kept.screen==='proc'&&state.screen==='job')left[side]=kept.top;
    var put=function(slot,name){var host=$('[data-slot="'+slot+'"]',pane),tpl=document.getElementById('tpl-'+name);host.innerHTML='';host.appendChild(tpl.content.cloneNode(true));};
    put('entry','entry');put('panel',id);put('chat','chat');
    pane.setAttribute('data-key',id);pane.setAttribute('data-screen',state.screen);
pane.setAttribute('data-form',state.form);
    // the fields of the procedure: folded into one line, open after '절차 정보 수정', or always open ('지금처럼')
    var info=$('.ew-content-overview[data-info-open]',pane);
    if(info){info.setAttribute('data-info-open',String(state.form==='now'||state.info));all('[data-author-action=info_toggle]',info).forEach(function(button){button.hidden=state.form==='now';});}
    $('.mk-pane-label small',pane).textContent=caption(side);
    // the same place after a redraw: what was open stays open, and one stays where one had scrolled to
    var now=scroller(pane);
    // the other way to show a tool's inputs and results: the same list, inside 상세 보기 (revision 2 had it so)
    if(side==='after'&&state.card==='fold')all('.ew-tool-card',pane).forEach(function(card){var io=$('.ew-tool-card-io',card),more=$('details',card);if(io&&more)more.insertBefore(io,$('summary',more).nextSibling);});
    if(kept.id===id)all('.ew-tool-card details',pane).forEach(function(d,i){if(kept.open[i])d.open=true;});
    if(now&&state.panes[side]){
      var heading=$('.ew-content-heading',pane),list=$('.ew-stage-list',pane),box=now.getBoundingClientRect();
      // only when the jobs would not all be in view, and only as far as that takes: on a tall window nothing moves
      if(align&&heading&&list){var over=list.getBoundingClientRect().bottom-(box.bottom-8);if(over>0)now.scrollTop+=Math.min(over,heading.getBoundingClientRect().top-box.top-12);}
      else if(!fresh&&kept.screen===state.screen)now.scrollTop=kept.top;   // a screen picked from the strip starts at its top
      else if(!fresh&&kept.screen==='job'&&state.screen==='proc'&&left[side])now.scrollTop=left[side];   // back from a job: the list is where one left it
    }
    // under 1440 the product folds the left menu to a rail: the same markup, marked compact, its groups closed
    var rail=$('.fu-side',pane);rail.setAttribute('data-compact',String(compact()));
    if(compact()){
      all('.ew-category-toggle,.ew-assets-toggle',rail).forEach(function(button){button.setAttribute('aria-expanded','false');});
      all('.ew-category-body',rail).forEach(function(body){body.setAttribute('aria-hidden','true');body.setAttribute('inert','');});
    }
    // a mock shows; it does not save or run
    all('form',pane).forEach(function(form){form.addEventListener('submit',function(event){event.preventDefault();});});
  }
  function render(){
    var id=where(),base=id.slice(0,2),data=SCENES[base],sides=shown();
    var stage=$('#mock-stage');stage.setAttribute('data-count',String(sides.length));stage.setAttribute('data-view',sides.join('+'));
    all('.mk-pane').forEach(function(pane){pane.setAttribute('data-shown',String(state.panes[pane.getAttribute('data-side')]));});
    $('#mock-badge').textContent='시안 3 · 저장·실행 안 됨 · '+id;
    document.title='도구 작업 줄 단순화 시안 3 · '+data.name+' · EES Workflow';
    all('[data-step]').forEach(function(button){button.setAttribute('aria-pressed',String(button.getAttribute('data-step')===base));});
    all('[data-pane-pick]').forEach(function(button){button.setAttribute('aria-pressed',String(state.panes[button.getAttribute('data-pane-pick')]));});
    all('[data-form-pick]').forEach(function(button){button.setAttribute('aria-pressed',String(button.getAttribute('data-form-pick')===state.form));});
    all('[data-card-pick]').forEach(function(button){button.setAttribute('aria-pressed',String(button.getAttribute('data-card-pick')===state.card));});
    // what the explanation says follows the switches: it never describes a variant that is not on the screen
    var change=[data.change,state.form==='now'?data.asNow:data.fold,state.card==='fold'?data.folded:data.open].filter(Boolean).join(' · ');
    var text=$('#mock-step-text');text.innerHTML='';
    [['언제',data.when],['바뀌는 것',change]].concat(state.ref?[['참고',NOTE]]:[]).forEach(function(pair){var span=document.createElement('span'),b=document.createElement('b');b.textContent=pair[0];span.appendChild(b);span.appendChild(document.createTextNode(pair[1]));text.appendChild(span);});
    // the sides are drawn after the explanation: its height decides how much of each side is in view
    all('.mk-pane').forEach(fill);align=false;fresh=false;
  }
  // a numbered screen from the strip: the stage list is brought to the same height on every side, so what is compared is in view
  function scene(name){var set=SCENES[name].set;Object.keys(set).forEach(function(k){state[k]=set[k];});align=set.screen==='proc'&&set.open;fresh=true;}
  function panes(list){SIDES.forEach(function(side){state.panes[side]=list.indexOf(side)>=0;});}
  // what a press inside a side does: the sides share one place (which screen, which stage, which job).
  // returns what to put the keyboard focus on afterwards, or false when nothing moved
  function act(target){
    var action=target.getAttribute('data-author-action'),id=target.getAttribute('data-id');
    if(action==='list'){state.screen='list';return '[data-author-action=open]';}
    if(action==='open'){
      state.mixed=target.textContent.indexOf('Confluence')<0;if(state.mixed)state.board=false;
      state.screen='proc';state.open=false;state.nowEdit=state.mixed;state.info=false;return '[data-author-action=stage_toggle]';
    }
    if(action==='stage_toggle'){
      if(state.mixed&&id!=='stage'){note('이 시안은 첫 단계만 펼칩니다');return false;}
      state.open=!state.open;return '[data-author-action=stage_toggle]';
    }
    if(action==='info_toggle'){
      // the mock does not keep what is typed; in the product the fields write to the draft as they do today
      if(state.info&&all('#ew-procedure-info :is(input,textarea,select)',target.closest('.mk-pane')).some(function(f){return f.value!==f.defaultValue&&f.tagName!=='SELECT'||f.tagName==='SELECT'&&!f.options[f.selectedIndex].defaultSelected;}))note('적은 내용은 초안에 남고 접힌 줄에 반영됩니다(지금 칸과 같은 방식) · 시안은 저장하지 않습니다');
      state.info=!state.info;return state.info?'#ew-procedure-info input':'.ew-procedure-brief [data-author-action=info_toggle]';
    }
    if(action==='api_structure_edit'){
      // on a job page the product only leaves the edit mode; on the procedure it flips between the two views
      if(state.screen==='job'){state.nowEdit=false;return '.ew-procedure-menu>summary';}
      state.nowEdit=!state.nowEdit;return '.ew-procedure-menu>summary';
    }
    if(action==='node'){
      // back from a job: each side returns to the view one came from
      if(!id){state.screen='proc';state.open=true;return '[data-author-action=node][data-id="'+state.job+'"]';}
      if(JOBS[id]){state.screen='job';state.job=id;return '.ew-job-detail-header [data-author-action=node]';}
      note('사람이 하는 작업의 화면은 바뀌지 않습니다 · 시안에서는 열지 않습니다');return false;
    }
    if(action==='job_api_setup'){note('도구를 고르는 창이 열립니다 · 지금 제품과 같은 창이고 시안에서는 열리지 않습니다');return false;}
    if(action==='job_api_example'){note('조회 결과 예시 창이 열립니다 · 지금 제품과 같은 창이고 시안에서는 열리지 않습니다');return false;}
    note(SAME);return false;
  }
  function option(kind,value){
    state[kind]=value;if(kind==='form'&&value==='now')state.info=false;render();
    var card=kind==='card',there=all('.mk-pane[data-side="after"] '+(card?'.ew-tool-card-io':'.ew-content-overview')).length;
    if(!there)note(card?'이 화면에는 연결된 도구의 입력·결과가 없습니다 · T3과 도구가 연결된 작업의 화면에서 보입니다':'이 화면에는 이름·분류·목적 칸이 없습니다 · T1, T2, T4, T5에서 보입니다');
    else if(!state.panes.after)note('‘바꾼 뒤’ 쪽에만 해당합니다 · 위에서 ‘바꾼 뒤’를 켜면 보입니다');
  }
  document.addEventListener('click',function(event){
    var target=event.target.closest?event.target.closest('button,a,summary'):null;if(!target)return;
    if(target.hasAttribute('data-step')){scene(target.getAttribute('data-step'));render();return;}
    if(target.hasAttribute('data-pane-pick')){
      var side=target.getAttribute('data-pane-pick');
      if(narrow()){panes([side]);render();return;}             // no room for two: the button picks the side
      if(state.panes[side]&&shown().length===1){note('하나는 켜 두어야 합니다');return;}
      state.panes[side]=!state.panes[side];render();return;
    }
    if(target.hasAttribute('data-form-pick')){option('form',target.getAttribute('data-form-pick'));return;}
    if(target.hasAttribute('data-card-pick')){option('card',target.getAttribute('data-card-pick'));return;}
    if(target.id==='mock-ref-toggle'){state.ref=!state.ref;target.setAttribute('aria-expanded',String(state.ref));target.setAttribute('aria-pressed',String(state.ref));render();return;}
    if(target.id==='mock-fold'){fold($('#mock-guide').getAttribute('data-collapsed')!=='true');return;}
    var pane=target.closest('.mk-pane');if(!pane)return;
    if(target.tagName==='SUMMARY')return;                       // a menu and '상세 보기' open as they do in the product
    event.preventDefault();
    if(target.hasAttribute('data-author-action')){
      var focus=act(target);
      if(focus){render();var next=$(focus,pane);if(next){next.focus({preventScroll:true});reveal(next,pane);}}
      return;
    }
    note(SAME);
  });
  function fold(folded){var guide=$('#mock-guide'),button=$('#mock-fold');guide.setAttribute('data-collapsed',String(folded));button.setAttribute('aria-expanded',String(!folded));button.textContent=folded?'안내 펴기':'안내 접기';}
  // a mock shows: a radio does not change what is saved
  document.addEventListener('click',function(event){
    var held=event.target.closest?event.target.closest('.mk-pane :is(input[type=radio],input[type=checkbox],label:has(input[type=radio]))'):null;if(held){event.preventDefault();note(SAME);}
  },true);
  // 1 2 3 4 5: screens. ← →: the side before or after, when one is shown. Keys pressed inside a side belong to that side.
  document.addEventListener('keydown',function(event){
    if(event.target.closest&&event.target.closest('input,textarea,select'))return;
    if(['1','2','3','4','5'].indexOf(event.key)>=0){scene('T'+event.key);render();}
    else if(event.key==='ArrowLeft'||event.key==='ArrowRight'){
      var sides=shown();
      if(sides.length!==1||(event.target.closest&&event.target.closest('.mk-pane')))return;
      var next=SIDES.indexOf(sides[0])+(event.key==='ArrowLeft'?-1:1);
      if(next<0||next>=SIDES.length)return;
      panes([SIDES[next]]);render();
    }
  });
  var whereTo=location.search+location.hash,query=/[?&#]screen=(T[12345])/.exec(whereTo),view=/[?&#]view=(side|now|after)/.exec(whereTo),form=/[?&#]form=(fold|now)/.exec(whereTo),card=/[?&#]card=(open|fold)/.exec(whereTo);
  if(narrow())panes(['after']);
  if(query)scene(query[1]);if(view&&!(narrow()&&view[1]==='side'))panes(VIEWS[view[1]]);if(form)state.form=form[1];if(card)state.card=card[1];
  // on a short window the explanation would push what is compared out of view: it starts folded there
  if(window.innerHeight<900||narrow())fold(true);
  var wasCompact=compact(),wasNarrow=narrow();window.addEventListener('resize',function(){
    var redraw=compact()!==wasCompact;wasCompact=compact();
    if(narrow()!==wasNarrow){wasNarrow=narrow();redraw=true;if(wasNarrow&&shown().length>1)panes(['after']);}
    if(redraw)render();
  });
  window.mockShow=function(name,viewName,formName,cardName){if(SCENES[name]&&SCENES[name].set)scene(name);if(VIEWS[viewName])panes(narrow()&&viewName==='side'?['after']:VIEWS[viewName]);if(formName){state.form=formName;state.info=false;}state.card=cardName||'open';render();};
  window.mockState=function(){var copy=JSON.parse(JSON.stringify(state));copy.where=where();copy.view=shown().join('+');return copy;};
  render();
})();
</script>
</body>
