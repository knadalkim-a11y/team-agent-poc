function ancestry(nodes,id){const result=[];for(let n=nodes[id];n;n=nodes[n.parent])result.unshift(n);return result}function leaves(nodes,id){return nodes[id].type==='j'?[id]:nodes[id].children.flatMap(x=>leaves(nodes,x))}function c(){return cases[caseId]}function snap(){return c().snapshot}function jobState(cs,id){return cs.states[id]||(cs.states[id]={status:'pending',checks:[],attempt:0})}function applicable(cs,id){return ancestry(cs.snapshot.nodes,id).every(n=>n.enabled!==false&&(n.condition!=='interface'||cs.site.interface)&&(!n.condition.startsWith('country:')||n.condition.slice(8)===cs.site.country))}function finished(cs,id){if(!applicable(cs,id))return true;return jobState(cs,id).status==='passed'}function count(cs,id){const a=leaves(cs.snapshot.nodes,id).filter(x=>applicable(cs,x));return[a.filter(x=>finished(cs,x)).length,a.length]}function missing(cs,id){return cs.snapshot.nodes[id].deps.filter(x=>!finished(cs,x))}function state(cs,id){const n=cs.snapshot.nodes[id];if(n.type==='j'){if(!applicable(cs,id))return'skipped';const s=jobState(cs,id).status;if(s==='pending'&&missing(cs,id).length)return'blocked';return s}const a=leaves(cs.snapshot.nodes,id).filter(x=>applicable(cs,x));if(!a.length)return'skipped';if(a.every(x=>finished(cs,x)))return'passed';if(a.some(x=>jobState(cs,x).status==='running'))return'running';if(a.some(x=>jobState(cs,x).status==='failed'))return'failed';return'pending'}

function runHistory(st,cs){return(st.history||[]).length?'<details class="m-run-contract"><summary>이전 실행 결과 · '+st.history.length+'회</summary><div class="m-contract-body">'+st.history.map(h=>'<div><strong>'+h.attempt+'회차 · '+(h.status==='failed'?'실패':h.status==='passed'?'완료':'중단')+'</strong>'+h.checks.map(r=>'<small style="display:block">'+esc(cs.snapshot.tools[r.id]?.name||r.id)+' · '+(r.status==='skipped'?'미수행':statusNames[r.status])+' · '+esc(r.detail)+'</small>').join('')+'</div>').join('')+'</div></details>':''}
function invalidate(cs,id){const affected=new Set([id]);let changed=true;while(changed){changed=false;Object.values(cs.snapshot.nodes).filter(n=>n.type==='j').forEach(n=>{if(!affected.has(n.id)&&n.deps.some(p=>affected.has(p))){affected.add(n.id);changed=true}})}for(const key of affected){const before=jobState(cs,key),history=clone(before.history||[]);if(before.checks.length)history.push({attempt:before.attempt,status:before.status,checks:clone(before.checks)});cs.states[key]={status:'pending',checks:[],attempt:before.attempt,history}}}
async function runJob(id=selected){const cs=c(),n=cs.snapshot.nodes[id],token=epoch;if(n.type!=='j'){const next=nextJob(cs,id);if(next)choose(next);return}if(!applicable(cs,id)||missing(cs,id).length||jobState(cs,id).status==='running')return;if(n.mode==='draft'){generateDraft(id);return}if(n.mode!=='tool'){manual(id);return}invalidate(cs,id);const st=jobState(cs,id);st.attempt++;st.status='running';st.checks=n.tools.map(t=>({id:t,status:'pending',detail:'실행 대기'}));const shouldFail=n.failOnce&&st.attempt===1;function refresh(){if(epoch===token&&caseId===cs.id){renderNav();if(mode==='run')renderWork()}}
let failed=false;refresh();for(let i=0;i<n.tools.length;i++){if(epoch!==token||cs.states[id]!==st)return;const tool=cs.snapshot.tools[n.tools[i]],item=st.checks[i];if(failed){item.status='skipped';item.detail='앞선 필수 점검 실패로 미수행';refresh();continue}item.status='running';item.detail='예시 응답 확인 중';refresh();await new Promise(resolve=>setTimeout(resolve,260));if(epoch!==token||cs.states[id]!==st)return;if(!tool?.enabled){item.status='failed';item.detail='연결된 실행 어댑터 없음';failed=true}else if((n.bindings[n.tools[i]]||tool.input)!==tool.input){item.status='failed';item.detail='도구가 요구하는 입력값 종류와 연결된 입력이 다름';failed=true}else if(shouldFail&&n.tools[i]==='health'){item.status='failed';item.detail='응답 시간 초과 · 시연용 실패 결과';failed=true}else{item.status='passed';item.detail=n.tools[i]==='db-target'?'요청한 현장과 DB 식별 일치 · 예시':n.tools[i]==='db-read'?'승인된 읽기 진단 정상 · 예시':n.tools[i]==='logs'?'승인된 진단 로그 요약 확보 · 예시':'기대 응답과 일치 · 예시'}refresh()}if(epoch!==token||cs.states[id]!==st)return;st.status=failed?'failed':'passed';refresh();append('assistant',failed?n.name+'에서 필수 점검이 실패한 예시입니다. 후속 의존 점검은 미수행으로 남겼어요. 실패 근거를 확인한 뒤 재시도할 수 있습니다.':n.name+'의 필수 점검이 모두 통과한 예시입니다. 상위 진행 상황에도 반영했어요.',cs,id)}
function manual(id=selected){const cs=c(),n=cs.snapshot.nodes[id],st=jobState(cs,id);if(n.type!=='j'||missing(cs,id).length||!applicable(cs,id)||n.mode==='draft'&&!st.document)return;st.status='passed';renderWork();renderNav();append('assistant',n.name+'의 담당자 확인을 기록한 예시입니다.',cs,id)}
function generateDraft(id=selected){const cs=c(),n=cs.snapshot.nodes[id];if(n.type!=='j'||n.mode!=='draft'||missing(cs,id).length||!applicable(cs,id))return;invalidate(cs,id);const st=jobState(cs,id);st.attempt++;st.document=cs.site.country+' '+cs.site.name+' · '+cs.system+'\n\n작업: '+n.name+'\n목표: '+(n.description||n.rule)+'\n\n검토할 기준\n'+n.rule+'\n\n적용 스킬·지침\n'+effectiveSkills(cs,id).map(s=>s.name).join(' · ')+'\n\n담당자가 검토한 뒤 완료를 기록합니다.';st.status='review';renderWork();renderNav();append('assistant',n.name+'의 문서 초안을 만든 예시입니다. 오른쪽에서 내용을 검토해 주세요.',cs,id)}
function renderNewCase(){const opts=Object.values(published.sites).map(s=>'<option value="'+s.id+'">'+esc(s.country+' · '+s.name)+'</option>').join('');q('#m-work-content').innerHTML='<div class="m-newcase"><div class="panel-meta">새 셋업 준비</div><h2>현장에 맞는 절차 구성</h2><label class="m-field">시스템<select id="m-start-system"><option>EMS</option><option>APC</option><option>FDC</option><option>EGIS</option><option>EPT</option></select></label><label class="m-field">대상 현장<select id="m-start-site">'+opts+'</select></label><div id="m-site-plan"></div><button class="primary" data-action="create-case">이 조건으로 시작 · 예시</button><button data-action="cancel-case">진행 중인 작업으로 돌아가기</button></div>';updateSitePlan()}

function switchCategory(cat){category=cat;navOpen=true;navCollapsed=false;let cs=Object.values(cases).find(x=>x.category===cat);if(!cs){const id=makeCase(cat,'us-a',false);cs=cases[id]}caseId=cs.id;selected=cs.selected;newCase=false;ancestry(snap().nodes,selected).forEach(n=>expanded.add(n.id));renderAll()}

function field(label,prop,value,kind='node',multiline=false,locked=false){return'<label class="m-field">'+label+(multiline?'<textarea data-kind="'+kind+'" data-field="'+prop+'" '+(locked?'readonly':'')+'>'+esc(value)+'</textarea>':'<input type="text" data-kind="'+kind+'" data-field="'+prop+'" value="'+esc(value)+'" '+(locked?'readonly':'')+'>')+'</label>'}function options(values,value){return values.map(([v,label])=>'<option value="'+esc(v)+'" '+(v===value?'selected':'')+'>'+esc(label)+'</option>').join('')}function skillBindings(n){return'<fieldset class="m-fieldset"><legend>적용 스킬·지침</legend><label class="m-option"><input type="checkbox" checked disabled><span>공통 실행 지침<small style="display:block">모든 업무에 항상 적용</small></span></label>'+Object.values(draft.skills).filter(s=>!s.locked).map(s=>'<label class="m-option"><input type="checkbox" data-bind-skill="'+s.id+'" '+(n.skills.includes(s.id)?'checked':'')+'><span>'+esc(s.name)+'<small style="display:block">'+(s.type==='skill'?'스킬':'지침')+'</small></span></label>').join('')+'</fieldset>'}
function toolBindings(n){return'<fieldset class="m-fieldset"><legend>'+(n.type==='j'?'실행할 도구 · 위에서부터 순서대로':'사용 가능한 도구 · 미지정 시 공통 범위')+'</legend>'+n.tools.map((id,i)=>'<div class="m-binding"><div class="m-binding-head"><strong style="font-size:12px">'+(i+1)+'. '+esc(draft.tools[id]?.name||'미등록 도구')+'</strong><div><button data-tool-up="'+i+'" '+(i===0?'disabled':'')+' aria-label="도구 순서 위로">↑</button><button data-tool-remove="'+i+'">해제</button></div></div><label class="m-field">입력 연결<select data-map-input="'+id+'">'+options(Object.entries(mappingNames),n.bindings[id]||draft.tools[id]?.input||'site')+'</select></label></div>').join('')+'<label class="m-field">도구 추가<select id="m-tool-to-add"><option value="">등록된 도구 선택</option>'+Object.values(draft.tools).filter(t=>!n.tools.includes(t.id)).map(t=>'<option value="'+t.id+'">'+esc(t.name)+'</option>').join('')+'</select></label><button class="m-test-button" data-action="add-tool-binding">선택한 도구 연결</button></fieldset>'}
function nodeForm(){const n=draft.nodes[editId];const rootId=ancestry(draft.nodes,editId)[0].id;const otherJobs=leaves(draft.nodes,rootId).filter(id=>id!==editId);return'<div class="m-node-actions"><button data-action="new-process">프로세스 추가</button><button data-action="add-child" '+(n.type==='j'?'disabled':'')+'>'+(n.type==='p'?'태스크 추가':'잡 추가')+'</button><button data-action="move-up" '+(!n.parent?'disabled':'')+'>위로 이동</button><button data-action="move-down" '+(!n.parent?'disabled':'')+'>아래로 이동</button></div><div class="panel-meta">'+levelNames[n.type]+'</div><div class="m-form">'+field('이름','name',n.name)+field('목표·작업 설명','description',n.description,'node',true)+'<label class="m-field">적용 조건<select data-kind="node" data-field="condition">'+options([['all','모든 현장'],['interface','시스템 간 연계를 사용하는 현장'],['country:미국','미국 현장'],['country:한국','한국 현장'],['country:헝가리','헝가리 현장']],n.condition)+'</select></label><label class="m-option"><input type="checkbox" data-kind="node" data-field="enabled" '+(n.enabled!==false?'checked':'')+'>이 업무 사용</label>'+(n.type==='j'?'<label class="m-field">수행 방식<select data-kind="node" data-field="mode">'+options([['manual','사람 확인'],['tool','도구·스크립트 실행'],['draft','AI 초안 작성']],n.mode)+'</select></label><details class="m-fieldset"><summary>선행 작업 · '+n.deps.length+'개</summary>'+otherJobs.map(id=>'<label class="m-option"><input type="checkbox" data-bind-dep="'+id+'" '+(n.deps.includes(id)?'checked':'')+'>'+esc(draft.nodes[id].name)+'</label>').join('')+'</details>':'')+toolBindings(n)+skillBindings(n)+field('완료 기준','rule',n.rule,'node',true)+'</div>'}

function renderPreview(){let title='사용자 화면 미리보기',html='';if(previewMode==='test'){title='시험 결과 · 시뮬레이션';html=testResults.map(t=>'<div class="m-test-result"><div><strong>'+esc(t.name)+'</strong><small>'+esc(t.detail)+'</small></div>'+badge(t.pass?'passed':'failed',t.pass?'통과':'수정 필요')+'</div>').join('')+'<p class="m-quiet-note">구조·참조와 예시 응답을 확인합니다. 사내 실행 검증이 아닙니다.</p>'}else if(previewMode==='publish'){title='게시 전 변경 확인';const changed=changes();html='<div class="m-preview-card"><h2>v1.'+(version+1)+' 게시</h2><p>이번 초안의 변경을 새 셋업부터 적용합니다.</p>'+changed.map(x=>'<div class="m-preview-row">'+esc(x)+'</div>').join('')+'<small>진행 중인 '+c().site.country+' '+c().site.name+' 셋업은 v1.'+c().version+'을 유지합니다.</small><button class="primary" data-action="confirm-publish">이 변경 게시 · 시뮬레이션</button><button data-action="preview-live">미리보기로 돌아가기</button></div>'}else if(previewMode==='published'){title='게시 완료 · 예시';html='<div class="m-preview-card"><h2>v1.'+version+' 게시됨</h2><p>새 셋업은 이 버전을 사용합니다. 진행 중인 작업은 기존 버전을 유지합니다.</p><button class="primary" data-action="new-case-after-publish">새 버전으로 셋업 준비</button><button data-action="preview-live">계속 설계하기</button></div>'}else if(section==='workflow')html=previewWorkflow();else if(section==='skills'){const a=draft.skills[assetId];title='적용될 내용';html='<div class="m-preview-card"><small>'+(a.type==='skill'?'스킬':'지침')+'</small><h2>'+esc(a.name)+'</h2><p>'+esc(a.body||'아직 내용이 없습니다.')+'</p><small>연결한 업무를 수행할 때 필요한 내용을 제공합니다.</small></div>'}else if(section==='tools'){const t=draft.tools[toolId];title='도구 등록 미리보기';html='<div class="m-preview-card"><h2>'+esc(t.name)+'</h2>'+badge(t.enabled?'passed':'failed',t.enabled?'시연 연결됨':'미연결')+'<p>'+esc(t.purpose)+'</p><strong>입력</strong><p>'+esc(mappingNames[t.input])+'</p><strong>성공 기준</strong><p>'+esc(t.success)+'</p><small>등록한 도구는 프로세스·태스크·잡에서 연결할 수 있습니다.</small></div>'}else{const s=draft.sites[siteId];title='현장별 절차 적용';html='<div class="m-preview-card"><h2>'+esc(s.country+' · '+s.name)+'</h2><div class="m-site-summary"><div class="m-site-line"><span>인프라</span><strong>'+(s.reuse?'재사용 상태 확인':'신규 준비 상태 확인')+'</strong></div><div class="m-site-line"><span>인터페이스 검증</span><strong>'+(s.interface?'포함':'연계 미사용으로 제외')+'</strong></div><div class="m-site-line"><span>시간대</span><strong>'+esc(s.zone)+'</strong></div></div><p>이 조건은 게시 후 새 셋업에 반영됩니다.</p></div>'}setText('m-preview-title',title);q('#m-preview-content').innerHTML=html;icons()}

function designStatus(text,failed=false){q('#m-design-status').hidden=false;q('#m-design-status').textContent=text;q('#m-design-status').classList.toggle('failure',failed)}
function changes(){const out=[];for(const[k,label]of[['nodes','업무'],['skills','스킬·지침'],['tools','도구'],['sites','현장']]){let count=0;for(const[id,obj]of Object.entries(draft[k]))if(JSON.stringify(obj)!==JSON.stringify(published[k][id]))count++;if(count)out.push(label+' '+count+'개 추가·변경')}return out.length?out:['변경 없음']}
function dryChecks(ids,failIndex=-1){let stopped=false;return ids.map((id,i)=>{if(stopped)return'skipped';if(!draft.tools[id]?.enabled||i===failIndex){stopped=true;return'failed'}return'passed'})}
function validate(){const structure=[],binding=[],skillErrors=[];for(const n of Object.values(draft.nodes)){if(ancestry(draft.nodes,n.id).some(p=>p.enabled===false))continue;if(!n.name.trim())structure.push('이름이 없는 업무');if(n.type!=='j'&&!n.children.length)structure.push(n.name+': 하위 작업 필요');if(n.type==='j'){if(n.deps.some(id=>!draft.nodes[id]||draft.nodes[id].type!=='j'))structure.push(n.name+': 선행 참조 오류');if(n.mode==='tool'&&!n.tools.length)binding.push(n.name+': 실행 도구 필요');for(const id of n.tools){if(!draft.tools[id]?.enabled)binding.push(n.name+': '+(draft.tools[id]?.name||id)+' 미연결');if(!mappingNames[n.bindings[id]||draft.tools[id]?.input])binding.push(n.name+': 입력 연결 필요');else if((n.bindings[id]||draft.tools[id]?.input)!==draft.tools[id]?.input)binding.push(n.name+': 도구에 맞는 입력값 종류 확인 필요');for(const parent of ancestry(draft.nodes,n.id).slice(0,-1))if(parent.tools.length&&!parent.tools.includes(id))binding.push(n.name+': 상위 허용 도구 확인 필요')}}for(const id of n.skills)if(!draft.skills[id]?.body.trim())skillErrors.push(n.name+': 스킬 내용 필요')}
const visiting=new Set(),visited=new Set();function walk(id){if(visiting.has(id)){structure.push('선행 작업 순환 참조');return}if(visited.has(id)||!draft.nodes[id])return;visiting.add(id);draft.nodes[id].deps.forEach(walk);visiting.delete(id);visited.add(id)}Object.values(draft.nodes).filter(n=>n.type==='j').forEach(n=>walk(n.id));const jobs=Object.values(draft.nodes).filter(n=>n.type==='j'&&n.mode==='tool'&&ancestry(draft.nodes,n.id).every(p=>p.enabled!==false));const normal=jobs.every(n=>dryChecks(n.tools).every(x=>x==='passed'));const multiple=jobs.find(n=>n.tools.length>1);const fail=multiple?dryChecks(multiple.tools,0):['failed','skipped'];testResults=[{name:'프로세스·태스크·잡 구조',pass:!structure.length,detail:structure[0]||'하위 작업과 선행 참조 확인'},{name:'도구·입력 연결',pass:!binding.length,detail:binding[0]||'등록된 도구와 현장 입력 연결 확인'},{name:'스킬·공통 지침',pass:!skillErrors.length,detail:skillErrors[0]||'공통 지침 유지 및 연결 자산 확인'},{name:'정상 응답 시뮬레이션',pass:normal,detail:'연결된 점검의 예시 응답으로 성공 조건 확인'},{name:'실패 전파 시뮬레이션',pass:fail[0]==='failed'&&fail.slice(1).every(x=>x==='skipped'),detail:'필수 점검 실패 후 의존 점검은 미수행'}];testedRevision=testResults.every(x=>x.pass)?revision:-1;previewMode='test';renderPreview();designStatus(testedRevision===revision?'시험을 통과한 예시입니다. 변경 내용을 확인하고 게시할 수 있어요.':'수정이 필요한 항목을 확인해 주세요.',testedRevision!==revision)}
function publish(){if(testedRevision!==revision||!testResults.every(x=>x.pass)){designStatus('현재 변경 내용으로 시험 실행을 먼저 진행해 주세요.',true);return}if(changes()[0]==='변경 없음'){designStatus('게시할 변경 내용이 없습니다.');return}published=clone(draft);version++;draft=clone(published);revision=0;savedRevision=0;testedRevision=-1;previewMode='published';setText('m-draft-version','v1.'+(version+1)+' 초안');renderPreview();designStatus('v1.'+version+'을 게시한 시뮬레이션입니다. 실제 서버·공용 설정은 변경하지 않았습니다.')}
function addNode(type,parent){const id='new-'+(++newCounter);draft.nodes[id]={id,type,name:type==='p'?'새 프로세스':type==='t'?'새 태스크':'새 잡',parent,children:[],description:'',condition:'all',mode:'manual',tools:[],skills:[],bindings:{},deps:[],rule:'필수 확인 완료',enabled:true};if(parent){draft.nodes[parent].children.push(id);expanded.add(parent)}else{const cat=ancestry(draft.nodes,editId)[0]?.category||'setup';draft.nodes[id].category=cat;draft.roots[cat].push(id)}editId=id;touch();renderDesigner()}
function moveNode(delta){const n=draft.nodes[editId];if(!n.parent)return;const a=draft.nodes[n.parent].children,i=a.indexOf(editId),j=i+delta;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];touch();renderDesigner()}
function addAsset(kind){const id='asset-'+(++newCounter);if(kind==='skill'){draft.skills[id]={id,name:'새 스킬',type:'skill',body:'',locked:false};assetId=id}else if(kind==='tool'){draft.tools[id]={id,name:'새 점검 도구',purpose:'',type:'진단 API',input:'site',success:'기대 응답 일치',enabled:false};toolId=id}else{draft.sites[id]={id,country:'미국',name:'새 공장',line:'대상 라인',zone:'확인 필요',reuse:false,interface:false,db:'진단 경로 확인 필요',ap:'진단 경로 확인 필요'};siteId=id}touch();renderDesigner()}
function showSummary(){const cs=c(),r=ancestry(cs.snapshot.nodes,selected)[0].id,[d,t]=count(cs,r);q('#m-work-content').innerHTML='<div class="m-document"><small>검증 결과 요약 · 예시</small><h2>'+esc(cs.snapshot.nodes[r].name)+'</h2><p>'+esc(cs.system+' · '+cs.site.country+' '+cs.site.name+' · '+cs.site.line)+'</p><strong>필수 잡 '+d+' / '+t+' 완료</strong>'+leaves(cs.snapshot.nodes,r).map(id=>'<div class="summary-line"><button class="material-button" data-node="'+id+'">'+esc(cs.snapshot.nodes[id].name)+'</button>'+badge(state(cs,id))+'</div>').join('')+'<small>절차 v1.'+cs.version+' · 현장 조건과 실행 결과를 함께 기록한 예시입니다.</small><button data-node="'+r+'">전체 업무로 돌아가기</button></div>';icons()}
async function send(text){if(!text.trim())return;const cs=c();append('user',text);const n=Object.values(cs.snapshot.nodes).filter(x=>ancestry(cs.snapshot.nodes,x.id)[0].category===category).find(x=>text.includes(x.name));if(/설계.*워크스페이스|설계.*열|편집/.test(text)){if(n)selected=n.id;changeMode('design');return}if(/전체.*진행|전체.*업무/.test(text)){choose(ancestry(cs.snapshot.nodes,selected)[0].id);const[d,t]=count(cs,selected);append('assistant','현재 필수 잡 '+t+'개 중 '+d+'개가 완료된 예시입니다. 실패·미수행 항목과 다음 행동을 오른쪽에서 확인할 수 있어요.');return}if(/다음.*작업|다음.*할 일/.test(text)){const next=nextJob(cs,selected);if(next){choose(next);append('assistant',cs.snapshot.nodes[next].name+'를 열었어요.')}else append('assistant','선택한 범위의 필수 작업이 모두 완료됐어요.');return}if(n)choose(n.id);if(/실행|재시도/.test(text)){await runJob();return}if(/요약|보고서/.test(text)){showSummary();append('assistant','확인된 실행 결과로 요약을 만든 예시입니다.');return}if(/왜|원인/.test(text)){const st=jobState(cs,selected);const fail=st.checks.find(x=>x.status==='failed');append('assistant',fail?'확인된 실패는 '+fail.detail+'입니다. 이 결과만으로 근본 원인을 확정하지 않고 진단 자료와 함께 확인하도록 설계했어요.':'현재 선택한 업무의 확인 결과를 오른쪽에서 볼 수 있어요. 원인 설명은 실제 진단 근거가 있을 때 제공합니다.');return}if(n)append('assistant',n.name+'를 오른쪽에 열었어요.');else append('assistant','시안에서는 업무 이름으로 탐색하고, “DB 연결 확인 실행해줘”, “AP 연결 확인 재시도해줘”, “설계 워크스페이스 열어줘”를 체험할 수 있어요.')}
async function action(name){if(name==='generate-draft')return generateDraft();if(name==='run')return runJob();if(name==='manual')return manual();if(name==='summary')return showSummary();if(name==='cancel-case'){newCase=false;return renderWork()}if(name==='create-case'){const target=q('#m-start-site').value||Object.keys(published.sites)[0],sys=q('#m-start-system').value||'EMS';caseId=makeCase('setup',target,false,sys);category='setup';selected=c().selected;newCase=false;expanded.add(selected);renderAll();append('assistant','새 셋업을 v1.'+version+'과 선택한 현장 조건으로 시작한 예시입니다. 기존 셋업의 상태는 따로 유지됩니다.');return}if(name==='new-case-after-publish'){mode='run';newCase=true;renderAll();return}if(name==='preview-live'){previewMode='live';renderPreview();return}if(name==='confirm-publish')return publish();if(name==='new-process')return addNode('p',null);if(name==='add-child'){const n=draft.nodes[editId];if(n.type!=='j')addNode(n.type==='p'?'t':'j',editId);return}if(name==='move-up')return moveNode(-1);if(name==='move-down')return moveNode(1);if(name==='new-skill')return addAsset('skill');if(name==='new-tool')return addAsset('tool');if(name==='new-site')return addAsset('site');if(name==='skill-draft'){const a=draft.skills[assetId];if(a.locked)return;a.body='목표: '+a.name+'\n1. 현재 업무 대상과 입력 자료를 확인합니다.\n2. 연결된 점검을 선행 조건에 따라 수행합니다.\n3. 성공·실패·미수행 결과와 근거를 구분합니다.\n4. 필요한 담당자 확인 후 완료를 기록합니다.';touch();renderDesigner();designStatus('작성 예시입니다. 내용을 검토한 뒤 업무에 연결해 주세요.');return}if(name==='test-tool'){const t=draft.tools[toolId];designStatus(t.enabled?'예시 응답 시험 통과: '+t.name+' · '+t.success:'실행하지 못했습니다. 시연 어댑터가 연결되지 않았습니다.',!t.enabled);return}if(name==='add-tool-binding'){const id=q('#m-tool-to-add').value;if(!id){designStatus('연결할 도구를 선택해 주세요.',true);return}const n=draft.nodes[editId];if(!n.tools.includes(id)){n.tools.push(id);n.bindings[id]=draft.tools[id].input;touch();renderDesigner()}return}}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.mode)return changeMode(b.dataset.mode);if(b.dataset.category){mode='run';return switchCategory(b.dataset.category)}if(b.dataset.section){section=b.dataset.section;previewMode='live';renderAll();return}if(b.dataset.node)return choose(b.dataset.node);if(b.dataset.editNode){editId=b.dataset.editNode;previewMode='live';renderNav();renderDesigner();return}if(b.dataset.expand){const id=b.dataset.expand;expanded.has(id)?expanded.delete(id):expanded.add(id);renderNav();return}if(b.dataset.showNav){navCollapsed=false;navOpen=true;renderNav();return}if(b.dataset.prompt)return send(b.dataset.prompt);if(b.dataset.action)return action(b.dataset.action);if(b.dataset.toolRemove!==undefined){const n=draft.nodes[editId],id=n.tools.splice(+b.dataset.toolRemove,1)[0];delete n.bindings[id];touch();renderDesigner();return}if(b.dataset.toolUp!==undefined){const i=+b.dataset.toolUp,a=draft.nodes[editId].tools;if(i>0){[a[i],a[i-1]]=[a[i-1],a[i]];touch();renderDesigner()}return}});
function updateField(el){const kind=el.dataset.kind,key=el.dataset.field;const obj=kind==='node'?draft.nodes[editId]:kind==='skill'?draft.skills[assetId]:kind==='tool'?draft.tools[toolId]:kind==='site'?draft.sites[siteId]:null;if(!obj||obj.locked||!Object.hasOwn(obj,key)&&key!=='enabled')return;obj[key]=el.type==='checkbox'?el.checked:el.value;touch()}
root.addEventListener('input',e=>{if(e.target.dataset.field&&e.target.tagName!=='SELECT'&&e.target.type!=='checkbox')updateField(e.target)});
root.addEventListener('change',e=>{const el=e.target;if(el.id==='m-start-site'){updateSitePlan();return}if(el.dataset.selectAsset){assetId=el.value;previewMode='live';renderDesigner();return}if(el.dataset.selectTool){toolId=el.value;previewMode='live';renderDesigner();return}if(el.dataset.selectSite){siteId=el.value;previewMode='live';renderDesigner();return}if(el.dataset.field){updateField(el);if(el.dataset.field==='mode')renderDesigner();return}const n=draft.nodes[editId];if(el.dataset.bindSkill){const id=el.dataset.bindSkill;n.skills=el.checked?[...new Set([...n.skills,id])]:n.skills.filter(x=>x!==id);touch();return}if(el.dataset.bindDep){const id=el.dataset.bindDep;n.deps=el.checked?[...new Set([...n.deps,id])]:n.deps.filter(x=>x!==id);touch();return}if(el.dataset.mapInput){n.bindings[el.dataset.mapInput]=el.value;touch();return}});
q('#m-case').onchange=()=>{caseId=q('#m-case').value;category=c().category;selected=c().selected;newCase=false;renderAll()};q('#m-pin').onclick=()=>{pinned=!pinned;navOpen=true;renderNav()};q('#m-toggle-nav').onclick=()=>{navCollapsed=!navCollapsed;renderNav()};q('#m-edit-from-run').onclick=()=>changeMode('design');q('#m-new-case').onclick=()=>{newCase=true;renderWork()};q('#m-reset').onclick=init;q('#m-chat').onsubmit=e=>{e.preventDefault();const text=q('#m-input').value.trim();if(!text)return;q('#m-input').value='';return send(text)};q('#m-save-draft').onclick=()=>{savedRevision=revision;setText('m-draft-version','v1.'+(version+1)+' 초안 · 저장됨');designStatus('이 목업 안에 초안을 저장했습니다.')};q('#m-test-draft').onclick=validate;q('#m-review-publish').onclick=()=>{if(testedRevision!==revision){designStatus('마지막 변경 내용으로 시험 실행을 먼저 진행해 주세요.',true);return}if(changes()[0]==='변경 없음'){designStatus('게시할 변경 내용이 없습니다.');return}previewMode='publish';renderPreview()};root.addEventListener('keydown',e=>{if(e.key==='Escape'&&!pinned&&mode==='run'){navOpen=false;renderNav()}});init();
})();

</script>
