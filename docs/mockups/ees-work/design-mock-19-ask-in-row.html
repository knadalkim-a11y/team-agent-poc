 const done=S.pump==='적합',stale=S.pump==='다시',noteDone=Boolean(S.note);
 const field=(id,label,unit,value,example)=>`<label class="ew-vd-ask" data-kind="number" for="sq-${id}"><span>${label}</span><input id="sq-${id}" type="text" inputmode="decimal" autocomplete="off" placeholder="예: ${example}" value="${esc(value)}" aria-required="true"${S.valueError&&!value.trim()?' aria-invalid="true"':''}${S.started?'':' disabled'}><small>${unit}</small></label>`;
 const answer=(key,value)=>!S.started?state('확인 필요'):value&&value!=='다시'?`<div class="ew-vd-decision"><span class="ew-vd-final" data-decision-status><i class="ew-vd-dot" data-verdict="ok"></i><span>${esc(value)}</span></span></div>`:`<div class="ew-vd-decision">${value==='다시'?'<span class="ew-vd-state" data-decision-status><span>다시 검토 필요</span></span>':''}<span class="ew-vd-confirm"><button type="button" class="ew-vd-confirm-main" data-confirm="${key}">적합</button><button type="button" class="ew-vd-confirm-more" aria-haspopup="menu" aria-label="다른 판정" data-none>${I('f17e6')}</button></span></div>`;
 const error=S.valueError?`<small class="ew-vd-ask-error" role="alert">값을 넣어 주세요</small>`:'';
 const meta1=field('pressure','압력','bar',S.pressure,'3.2')+field('temp','온도','℃',S.temp,'45')+error+answer('pump',S.pump);
 const completed=(done?1:0)+(noteDone?1:0),left=2-completed;
 const counts=[left?count('none',`확인 필요 ${left}`):'',completed?count('ok',`적합 ${completed}`):''].join('');
 const head=!S.started?`<button type="button" class="ew-secondary ew-stage-run-button" data-run="start" aria-label="점검 단계 시작">${PLAY}<span>시작</span></button>`:completed===2?`<button type="button" class="ew-secondary ew-stage-run-button" data-run="finish"><span>끝내기</span></button>`:'';
 const rows=row(1,'펌프 상태 기록','직접 판정','압력계와 온도계의 값을 적고, 기준 범위 안이면 적합으로 확인합니다.',meta1)
  +row(2,'이상 내용 기록','직접 판정','이상이 있으면 내용을 적습니다.',answer('note',S.note));
 return shell(head,counts,completed,rows);
}

function render(){
 entry.innerHTML=entryHTML();
 panel.innerHTML=S.view==='overview'?overviewHTML():S.proc==='guide'?guideStageHTML():checkStageHTML();
 const id=S.proc==='check'?'SQ6':S.view==='overview'?'SQ1':S.idError?'SQ3':S.page==='done'&&S.verdict==='적합'?'SQ5':S.page==='done'?'SQ4':'SQ2';
 S.screen=id;
 $('#mock-badge').textContent='시안 1 · 저장·실행 안 됨 · '+id;
 for(const button of guide.querySelectorAll('[data-step]'))button.setAttribute('aria-pressed',String(button.dataset.step===id));
 const info=SCREENS[id];$('#mock-step-text').innerHTML=`<span><b>언제</b>${esc(info.when)}</span><span><b>바뀐 점</b>${esc(info.change)}</span>`;
 const menu=$('#sq-menu'),opener=panel.querySelector('[data-verdict-menu]');
 if(menu&&opener){const box=opener.getBoundingClientRect(),host=panel.getBoundingClientRect();menu.style.left=Math.max(8,box.right-host.left-180)+'px';menu.style.top=(box.bottom-host.top+4+panel.scrollTop)+'px';}
}
function focusField(selector){const field=panel.querySelector(selector);if(field&&!field.disabled){field.focus();const end=field.value.length;try{field.setSelectionRange(end,end);}catch(_){} }}
// One press of 실행: check the value where it is typed, start the round if it has not started, then run.
function runPage(){
 const value=(panel.querySelector('#sq-page-id')?.value ?? S.id).trim();S.id=value;
 if(!value){S.idError='페이지 ID를 넣어 주세요';S.started=S.started;render();focusField('#sq-page-id');return;}
 if(!/^[0-9]+$/.test(value)){S.idError='숫자만 넣어 주세요';render();focusField('#sq-page-id');return;}
 S.idError='';S.started=true;S.page='running';S.verdict='';S.evidence=false;S.child='idle';S.menu=false;render();
 setTimeout(()=>{if(S.page!=='running')return;S.page='done';S.ranAt=now();render();},700);
}
function runChild(){
 if(!(S.page==='done'&&S.verdict==='적합'))return;
 S.child='running';render();
 setTimeout(()=>{if(S.child!=='running')return;S.child='done';render();toast('하위 문서 목록의 확정은 지금처럼 작업 화면에서 합니다. 이 시안은 여기까지입니다.');},700);
}

guide.addEventListener('click',event=>{
 const step=event.target.closest('[data-step]');
 if(step){S=PRESET[step.dataset.step](fresh());render();if(step.dataset.step==='SQ2')focusField('#sq-page-id');return;}
 if(event.target.closest('#mock-fold')){const collapsed=guide.dataset.collapsed!=='true';guide.dataset.collapsed=String(collapsed);const button=event.target.closest('#mock-fold');button.textContent=collapsed?'안내 펴기':'안내 접기';button.setAttribute('aria-expanded',String(!collapsed));}
});
document.addEventListener('click',event=>{
 const target=event.target;
 if(target.closest('#mock-guide'))return;
 if(S.menu&&!target.closest('#sq-menu')&&!target.closest('[data-verdict-menu]')){S.menu=false;render();}
 const open=target.closest('[data-open]');
 if(open){const last=S.last;S=fresh();S.last=last;S.proc=open.dataset.open;render();return;}
 const dest=target.closest('[data-go]');
 if(dest){S.view=dest.dataset.go;S.menu=false;render();if(S.view==='stage'&&S.proc==='guide'&&S.page==='idle')focusField('#sq-page-id');return;}
 const run=target.closest('[data-run]');
 if(run){const what=run.dataset.run;
  if(what==='start'){S.started=true;S.view='stage';render();focusField(S.proc==='guide'?'#sq-page-id':'#sq-pressure');}
  else if(what==='page')runPage();
  else if(what==='child')runChild();
  else if(what==='finish'){const last=now();S=fresh();S.proc='check';S.last=last;render();}
  return;}
 if(target.closest('[data-verdict-menu]')){S.menu=!S.menu;render();return;}
 const verdict=target.closest('[data-verdict]');
 if(verdict){S.verdict=verdict.dataset.verdict;S.menu=false;render();return;}
 if(target.closest('[data-evidence]')){S.evidence=!S.evidence;render();return;}
 const confirm=target.closest('[data-confirm]');
 if(confirm){
  if(confirm.dataset.confirm==='pump'){S.pressure=panel.querySelector('#sq-pressure').value;S.temp=panel.querySelector('#sq-temp').value;
   if(!S.pressure.trim()||!S.temp.trim()){S.valueError=true;render();focusField(!S.pressure.trim()?'#sq-pressure':'#sq-temp');return;}
   S.valueError=false;S.pump='적합';}
  else S.note='적합';
  render();return;}
 if(target.closest('[data-none]')){event.preventDefault();toast(NOT_HERE);}
});
document.addEventListener('input',event=>{
 const target=event.target;
 if(target.id==='sq-page-id'){S.id=target.value;if(S.idError){S.idError='';render();focusField('#sq-page-id');}return;}
 if(target.id==='sq-pressure'||target.id==='sq-temp'){const key=target.id==='sq-pressure'?'pressure':'temp';S[key]=target.value;
  // A value changed after the answer asks for the answer again, as a changed input does in the product.
  if(S.pump==='적합'||S.valueError){if(S.pump==='적합')S.pump='다시';S.valueError=false;render();focusField('#'+target.id);}}
});
document.addEventListener('keydown',event=>{
 if(event.key==='Escape'&&S.menu){S.menu=false;render();return;}
 if(event.key!=='Enter'||event.isComposing)return;const target=event.target;
 if(target.id==='sq-page-id'){event.preventDefault();runPage();}
 else if(target.id==='sq-pressure'){event.preventDefault();focusField('#sq-temp');}
 else if(target.id==='sq-temp'){event.preventDefault();panel.querySelector('[data-confirm=pump]')?.click();}
});
render();
})();
</script>
