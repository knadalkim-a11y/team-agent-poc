<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="description" content="EES Work 시연용 목업. 실제 시스템은 연결하지 않으며 새로고침 시 초기화됩니다.">
<title>EES Work · 시연용 목업</title>
<link rel="stylesheet" href="ees-work.css">
<script src="ees-work.js" defer></script>
</head>
<body>
<div id="ees-demo-workspace">

<div class="app" id="m-app"><aside class="rail"><div class="brand"><i data-icon="layers" aria-hidden="true"></i><span class="brand-name">EES Work</span></div><div class="m-mode"><button data-mode="run" class="active" id="m-run-mode"><i data-icon="messages-square" aria-hidden="true"></i>업무 실행</button><button data-mode="design" id="m-design-mode"><i data-icon="sliders-horizontal" aria-hidden="true"></i>설계 워크스페이스</button></div><section id="m-run-nav"><nav class="categories" aria-label="업무 분류"><button class="category active" data-category="setup"><i data-icon="blocks" aria-hidden="true"></i>셋업</button><button class="category" data-category="ops"><i data-icon="activity" aria-hidden="true"></i>운영</button><button class="category" data-category="incident"><i data-icon="life-buoy" aria-hidden="true"></i>장애대응</button></nav><div class="navigator" id="m-navigator"><div class="nav-head"><small>업무 네비게이션</small><button id="m-pin" aria-pressed="true"><i data-icon="pin" aria-hidden="true"></i><span id="m-pin-text">고정됨</span></button></div><label class="system-select"><small>진행 중인 작업</small><select id="m-case"></select></label><div id="m-run-tree"></div><div class="nav-legend">P 프로세스 · T 태스크 · J 잡</div></div></section><section id="m-design-nav" hidden><nav class="categories" aria-label="설계 메뉴"><button class="category active" data-section="workflow"><i data-icon="workflow" aria-hidden="true"></i>업무 절차</button><button class="category" data-section="skills"><i data-icon="book-open" aria-hidden="true"></i>스킬·지침</button><button class="category" data-section="tools"><i data-icon="wrench" aria-hidden="true"></i>도구</button><button class="category" data-section="sites"><i data-icon="factory" aria-hidden="true"></i>현장 정보</button></nav><div id="m-design-tree" class="m-margin-top"></div></section><div class="profile">시스템 전문가<small>설계 역할 시연 · 실제 권한 아님</small></div></aside>
<main class="workspace"><div class="topbar"><div class="top-left"><button class="ghost" id="m-toggle-nav" aria-label="네비게이션 접기 또는 열기"><i data-icon="panel-left" aria-hidden="true"></i></button><strong id="m-screen-title">셋업 협업</strong><small class="sample">시연용 목업 · 실제 시스템 미연결</small></div><div class="top-right"><a class="m-return" href="/">EES Portal로 돌아가기</a><button id="m-new-case"><i data-icon="plus" aria-hidden="true"></i>새 셋업</button><button id="m-reset">시연 초기화</button></div></div><nav class="breadcrumb" id="m-breadcrumb" aria-label="현재 업무 경로"></nav>
<div class="panes" id="m-run-panes"><section class="chat-pane" aria-label="메인 대화창"><div class="pane-heading"><div class="pane-title"><i data-icon="messages-square" aria-hidden="true"></i>대화</div><small>업무 Assistant</small></div><div class="messages" id="m-messages" role="log" aria-live="polite"></div><div class="chat-suggestions"><button data-prompt="다음 할 일 보여줘">다음 할 일</button><button data-prompt="전체 진행 상황 보여줘">전체 진행 상황</button></div><form class="composer" id="m-chat"><div class="context-chip"><i data-icon="corner-down-right" aria-hidden="true"></i><span>현재 질문 대상</span><strong id="m-chat-context"></strong></div><div class="compose-box"><label for="m-input" class="muted m-small-text">이 업무에 대해 요청하세요</label><textarea id="m-input" placeholder="예: DB 연결 확인 실행해줘"></textarea><div class="compose-bottom"><small>지원 예시만 응답 · 새로고침 시 초기화</small><button class="primary" type="submit" aria-label="메시지 보내기"><i data-icon="arrow-up" aria-hidden="true"></i></button></div></div></form></section><section class="work-pane" aria-label="업무 작업 패널"><div class="panel-head"><div class="pane-title"><i data-icon="layout-panel-top" aria-hidden="true"></i>작업 패널</div><button class="ghost" id="m-edit-from-run"><i data-icon="pencil" aria-hidden="true"></i>설계에서 편집</button></div><div id="m-work-content"></div></section></div>
<div class="m-design-panes" id="m-design-panes" hidden><section class="m-designer"><div class="m-design-heading"><div><small id="m-draft-version">v1.4 초안</small><h2 id="m-design-title">업무 절차</h2></div><button id="m-save-draft">초안 저장</button></div><div class="m-publish-toolbar"><button id="m-test-draft"><i data-icon="flask-conical" aria-hidden="true"></i>시험 실행</button><button class="primary" id="m-review-publish">게시 검토</button></div><div id="m-design-status" class="m-status" role="status" hidden></div><div id="m-designer-content"></div></section><section class="m-preview"><div class="pane-title"><i data-icon="panel-right" aria-hidden="true"></i><span id="m-preview-title">사용자 화면 미리보기</span></div><div id="m-preview-content"></div></section></div>
</main></div>


</div>
</body>
</html>
