<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EES Workflow 화면 비교</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f5f7;color:#1d2833;font:15px/1.55 "Malgun Gothic",system-ui,sans-serif}
header,main{max-width:1760px;margin:auto;padding:18px 28px}h1{font-size:26px;margin:.2em 0}p{margin:.3em 0 1em}label{display:block;font-weight:600}select,input{font:inherit;max-width:100%}select{padding:5px 10px}
.controls,.panes{display:flex;gap:24px;flex-wrap:wrap}.controls{align-items:end}article{min-width:280px;flex:1;margin:0}h2{font-size:16px;margin:8px 0}
img{display:block;width:100%;height:auto}.image-frame{overflow:hidden;background:#fff;border:1px solid #ced5df}.image-frame.crop img{width:173.913043%;max-width:none;margin-left:-23.188406%}
.missing,.meta{color:#536270}a{color:#215d91}.missing{padding:20px}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #0d65b1}
[hidden]{display:none!important}
</style>
<header><h1>EES Workflow 화면 비교</h1><p>피그마 원본의 가운데 업무 영역과 같은 빌드의 브라우저 캡처를 비교합니다. 1920×1080 캡처에서는 x=256부터 1104px를 표시합니다.</p>
<div class="controls"><label>화면<br><select id="scene"></select></label><label>이전 빌드 캡처 폴더 (선택)<br><input id="before" type="file" webkitdirectory multiple></label></div></header>
<main><p id="note"></p><div class="panes" id="panes"></div><p class="meta" id="status" role="status"></p></main>
<script>
const scenes=[["stage","운영 단계","2208:8368","operations-stage-default-1920","작업 건수는 자료에 따라 달라집니다. 제목·실행 버튼·탭·판정 영역을 비교합니다."],["history","실행 기록","2208:28831","parity-records-selected-1920","회차를 고른 뒤 목록과 읽기 전용 상세가 함께 표시되는 상태입니다."],["procedure","업무 절차 개요","836:505","parity-b2-ems-procedure-1920","배포 산출물 점검의 제목·게시 상태·단계와 하단 저장을 비교합니다."],["tool-list","도구 목록","2017:248","tools-phase1-list-1920","공장과 시스템의 실제 등록 도구 수는 다를 수 있습니다."],["model-list","AI 도우미 목록","1068:6486","parity-b6-models-list-1920","동일 권한 상태의 목록 배치와 제목·행·탐색을 비교합니다."],["model-editor","AI 도우미 편집","1068:6650","parity-b6-model-editor-1920","도우미를 선택한 후 기본 모델, 설명과 편집 항목을 확인합니다."],["knowledge","참고 문서","1068:6889","parity-b7-knowledge-detail-1920","자료 처리 상태·사용처·접근 정보는 검수 데이터의 실제 응답을 기준으로 합니다."],["skill","작업 지침","1068:7092","parity-b8-skill-editor-1920","작업 지침·사용처·접근·저장 영역을 확인합니다."]];
const baselineNames={procedure:"procedure-initial-editable",history:"figma-s2-filtered-records","model-list":"source-shell-ai-assistant-work-settings-entry"};
const prior=new Map();let priorURL=null;
const pick=document.getElementById('scene'),panes=document.getElementById('panes'),source=document.getElementById('before');
for(const [key,title] of scenes){pick.add(new Option(title,key))}
function pane(label,src,kind,link){
 const p=document.createElement('article'),h=document.createElement('h2');h.textContent=label;p.append(h);
 const box=document.createElement('div');box.className='image-frame';p.append(box);
 const msg=document.createElement('div');msg.className='missing';box.append(msg);
 if(src){
  const img=new Image();img.alt=label;img.hidden=true;box.append(img);
  img.onload=()=>{if(kind==='product'&&img.naturalWidth===1920&&img.naturalHeight===1080)box.classList.add('crop');img.hidden=false;msg.hidden=true};
  img.onerror=()=>{msg.textContent='이 상태의 실제 캡처가 없습니다. 검수 미확인입니다.'};img.src=src;
 }else{msg.textContent='선택한 폴더에 이 상태의 이전 캡처가 없습니다.'}
 if(link){const a=document.createElement('a');a.href=link;a.textContent=kind==='figma'?'피그마 프레임 열기':'전체 캡처 열기';p.append(a)}panes.append(p);
}
function render(){
 const [key,title,node,shot,note]=scenes.find(s=>s[0]===pick.value);panes.replaceChildren();if(priorURL){URL.revokeObjectURL(priorURL);priorURL=null}
 document.getElementById('note').textContent=note;
 pane('피그마','./'+key+'.png','figma','https://www.figma.com/design/XK2wTos6sEuxSHhIj7cqg6?node-id='+node.replace(':','-'));
 if(prior.size){const exact=prior.get(shot+'.png');const old=exact||prior.get((baselineNames[key]||shot)+'.png');if(old)priorURL=URL.createObjectURL(old);pane(exact?'변경 전 제품':'변경 전 제품 · 대응 장면',priorURL,'product',priorURL)}
 const after='../../ees-work-screenshots/'+shot+'.png';pane('현재 제품',after,'product',after);
 document.getElementById('status').textContent='전체 캡처에는 왼쪽 탐색과 오른쪽 채팅이 포함됩니다. 예시 데이터가 다른 화면은 영역 배치와 동작별 상태를 비교하세요.';
}
source.onchange=()=>{prior.clear();for(const file of source.files){if(file.name.endsWith('.png')&&!prior.has(file.name))prior.set(file.name,file)}render()};pick.onchange=render;render();
</script></html>
